    // Bias towards center but avoid exact center.
    const r01 = this._rand01(i, 1.3, 9.1, this.data.seed);
    const a01 = this._rand01(i, 7.7, 2.2, this.data.seed);
    const rr  = Math.sqrt(Math.max(0.06, r01)) * (this._R * 0.78);
    const ang = a01 * Math.PI * 2;

    const life = this.data.lifeMin + this._rand01(i, 3.2, 6.8, this.data.seed + nowS) * (this.data.lifeMax - this.data.lifeMin);

    const sigma = (0.55 + this._rand01(i, 6.9, 4.2, this.data.seed) * 0.85) * (this._R * 0.22); // cell size

    const driftAng = this._rand01(i, 1.1, 5.4, this.data.seed) * Math.PI * 2;
    const driftMag = (0.35 + this._rand01(i, 8.8, 0.4, this.data.seed) * 0.65) * this.data.drift;

    const arms = 3 + Math.floor(this._rand01(i, 2.9, 8.1, this.data.seed) * 4); // 3..6
    const spin = (this._rand01(i, 9.4, 3.3, this.data.seed) * 2 - 1) * (0.55 + this._rand01(i, 4.4, 6.6, this.data.seed) * 0.75);

    return {
      x: rr * Math.cos(ang),
      y: rr * Math.sin(ang),
      born: nowS,
      life: life,
      sigma: sigma,
      arms: arms,
      spin: spin,
      phase: this._rand01(i, 4.4, 8.8, this.data.seed) * Math.PI * 2,
      driftX: Math.cos(driftAng) * driftMag,
      driftY: Math.sin(driftAng) * driftMag,
      lift: 0.65 + this._rand01(i, 5.2, 1.7, this.data.seed) * 0.55,  // bulge strength
      roll: 0.55 + this._rand01(i, 2.1, 7.9, this.data.seed) * 0.70   // spiral ridge strength
    };
  },

  tick: function (t, dt) {
    const nowS = (t || 0) * 0.001;
    const dtS  = (dt || 0) * 0.001;

    // If geometry wasn't ready at init time, keep retrying (some A-Frame setups attach mesh later).
    if (!this._geom || !this._base) {
      if (!this._lastRetryS || (nowS - this._lastRetryS) > 0.5) {
        this._lastRetryS = nowS;
        const root = this.el.getObject3D('mesh');
        if (root) {
          let mesh = null;
          if (root.isMesh && root.geometry && root.geometry.attributes && root.geometry.attributes.position) mesh = root;
          else if (root.traverse) {
            root.traverse((o)=>{ if(mesh) return; if(o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) mesh = o; });
          }
          if (mesh) {
            this._mesh = mesh;
            this._geom = mesh.geometry;
            const pos = this._geom.attributes.position;
            this._base = new Float32Array(pos.array);

            // Recompute radius estimate.
            let rMax = 0;
            for (let i = 0; i < pos.count; i++) {
              const x = this._base[i*3+0];
              const y = this._base[i*3+1];
              const r = Math.sqrt(x*x + y*y);
              if (r > rMax) rMax = r;
            }
            if (rMax > 0.001) this._R = rMax;
      if (this.data.radius && this.data.radius > 0) this._R = this.data.radius;
          }
        }
      }
      return;
    }

    const pos = this._geom.attributes.position;

    // Spawn staggered convection cells (one-by-one).
    if (this._cells.length < Math.max(1, this.data.whirlCount)) {
      if (nowS >= this._nextSpawnS) {
        this._cells.push(this._spawnCell(nowS));

        const u = Math.sin((this._cells.length + 1) * 12.9898 + this.data.seed * 78.233) * 43758.5453123;
        const r01 = u - Math.floor(u);
        const gap = this.data.spawnMin + r01 * Math.max(0.001, (this.data.spawnMax - this.data.spawnMin));
        this._nextSpawnS = nowS + gap;
      }
    } else {
      // keep cycling: when one dies, spawn a new one after a short gap
      let anyDead = false;
      for (let i = this._cells.length - 1; i >= 0; i--) {
        const c = this._cells[i];
        if ((nowS - c.born) > c.life) {
          this._cells.splice(i, 1);
          anyDead = true;
        }
      }
      if (anyDead) this._nextSpawnS = Math.max(this._nextSpawnS, nowS + 0.35);
    }

    // Update drift, softly bounce off the rim.
    for (let i = this._cells.length - 1; i >= 0; i--) {
      const c = this._cells[i];
      c.x += c.driftX * dtS;
      c.y += c.driftY * dtS;

      const r = Math.sqrt(c.x*c.x + c.y*c.y);
      const lim = this._R * 0.82;
      if (r > lim) {
        // reflect drift
        c.driftX *= -0.85;
        c.driftY *= -0.85;
        const k = lim / Math.max(1e-6, r);
        c.x *= k;
        c.y *= k;
      }
    }

    const smoothstep = (e0, e1, x) => {
      const k = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
      return k * k * (3 - 2 * k);
    };

    const a = this.data.amp;
    const time = nowS * this.data.speed;

    // Update vertices.
    for (let i = 0; i < pos.count; i++) {
      const x0 = this._base[i*3 + 0];
      const y0 = this._base[i*3 + 1];
      const r  = Math.sqrt(x0*x0 + y0*y0);

      // Rim fade: keep edge stable and prevent "outline" artifacts.
      const rimFade = smoothstep(this._R * 1.00, this._R * 0.86, r);

      // Base: slow, always-on travelling waves (never fully still).
      let z = 0.0;
      z += a * 0.32 * Math.sin(x0 * 0.62 + time * 0.70);
      z += a * 0.28 * Math.sin(y0 * 0.58 - time * 0.57);
      z += a * 0.20 * Math.sin((x0 + y0) * 0.36 + time * 0.41);

      // Slight radial bias so it feels "contained in a pool".
      z += a * 0.16 * Math.sin(r * this.data.rippleFreq - time * 0.98);

      // Convection cells: true whirlpools (funnel + rotating spiral shear + lip ring).
      for (let j = 0; j < this._cells.length; j++) {
        const c = this._cells[j];
        const age = nowS - c.born;
        if (age < 0 || age > c.life) continue;

        const riseDur = Math.min(2.0, c.life * 0.25);
        const fallDur = Math.min(3.5, c.life * 0.30);
        const form = smoothstep(0.0, riseDur, age);
        const fade = 1.0 - smoothstep(c.life - fallDur, c.life, age);
        const env  = form * fade;
        if (env <= 0.0001) continue;

        const dx = x0 - c.x;
        const dy = y0 - c.y;
        const rr = Math.sqrt(dx*dx + dy*dy);

        const g = Math.exp(-(rr*rr) / (2.0 * c.sigma * c.sigma)); // broad gaussian falloff
        const ang = Math.atan2(dy, dx);

        const spinT = time * (0.85 + 0.65 * Math.abs(c.spin));

        // Funnel core: sharp depression (the actual "whirlpool throat")
        const coreSigma = Math.max(0.08, c.sigma * 0.32);
        const gCore = Math.exp(-(rr*rr) / (2.0 * coreSigma * coreSigma));
        const funnel = (-a * (1.15 * c.lift) * env * gCore * (0.70 + 0.30 * Math.sin(spinT * 0.35 + c.phase))) * 0.55;

        // Lip ring around the funnel: slightly raised rim.
        const lipR = c.sigma * (0.55 + 0.08 * Math.sin(c.phase));
        const lipW = Math.max(0.06, c.sigma * 0.18);
        const dLip = (rr - lipR);
        const lipG = Math.exp(-(dLip*dLip) / (2.0 * lipW * lipW));
        const lip  =  a * 0.55 * env * lipG * (0.55 + 0.45 * g);

        // Spiral shear: rotating wrinkles that sell angular momentum.
        const tighten = 2.8 + 2.1 / Math.max(0.35, c.sigma);
        const spiral = Math.sin(ang * c.arms + rr * tighten - spinT * (1.35 * c.spin) + c.phase);
        const shear  = a * (0.80 * c.roll) * env * g * spiral;

        // Inward-travelling suction waves (subtle concentric modulation).
        const inward = Math.sin(rr * (7.2 + 0.9 * c.arms) - spinT * 0.95 + c.phase * 0.7);
        const suctionMask = (1.0 - smoothstep(c.sigma * 0.15, c.sigma * 1.35, rr));
        const suction = a * 0.25 * env * g * inward * suctionMask;

        // Very low-amplitude breath so the surface never looks static between events.
        const breathe = Math.sin(time * 0.55 + c.phase + rr * 1.4);
        const bulge   = a * 0.18 * env * g * breathe;

        z += (funnel + lip + shear + suction + bulge);
      }

      // Keep it contained.
      z *= rimFade;


      // Shallow mode clamp: never let the surface depress too far (avoids revealing basin).
      if (this.data.maxDown > 0) z = Math.max(z, -this.data.maxDown);
      pos.array[i*3 + 0] = x0;
      pos.array[i*3 + 1] = y0;
      pos.array[i*3 + 2] = z;
    }

    pos.needsUpdate = true;

    this._frame++;
    // Update normals frequently so specular highlights "dance".
    if (this._frame % 2 === 0) {
      this._geom.computeVertexNormals();
      if (this._geom.attributes.normal) this._geom.attributes.normal.needsUpdate = true;
    }
  }
});


// ===== Mercury surface (GPU, PBR-preserving) =====
// Drops ALL per-frame CPU vertex deformation + normal recompute.
// Instead, injects the original heightfield logic into MeshStandardMaterial's vertex shader
// and derives normals from the heightfield (finite differences) so highlights stay "alive".
AFRAME.registerComponent('mercury-surface-gpu', {
  schema: {
    amp:        { type: 'number', default: 0.018 },
    maxDown:    { type: 'number', default: 0.030 },
    speed:      { type: 'number', default: 0.55  },
    rippleFreq: { type: 'number', default: 2.8   },
    whirlCount: { type: 'int',    default: 6     },
    radius:     { type: 'number', default: 0.0   },
    lifeMin:    { type: 'number', default: 6.0   },
    lifeMax:    { type: 'number', default: 16.0  },
    drift:      { type: 'number', default: 0.10  },
    seed:       { type: 'number', default: 17    }
  },

  init: function () {
    this._mesh = null;
    this._shader = null;

    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    this.el.addEventListener('loaded', this._apply);
    setTimeout(this._apply, 0);
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._apply);
    this.el.removeEventListener('loaded', this._apply);
    if (this._mesh && this._mesh.material && this._mesh.material.onBeforeCompile) {
      // Leave material intact; do not hard-reset (avoids side effects).
    }
  },

  _findMesh: function () {
    const root = this.el.getObject3D('mesh');
    if (!root) return null;
    let mesh = null;
    if (root.isMesh) mesh = root;
    else if (root.traverse) {
      root.traverse((o)=>{ if(mesh) return; if(o && o.isMesh) mesh = o; });
    }
    return mesh;
  },

  _apply: function () {
    const mesh = this._findMesh();
    if (!mesh || !mesh.material) return;

    // Only target Standard/PBR materials.
    const mat = mesh.material;
    if (!mat.isMeshStandardMaterial) return;

    // Avoid re-patching the same material.
    if (mat.userData && mat.userData.__mercurySurfaceGPU) {
      this._mesh = mesh;
      this._shader = mat.userData.__mercurySurfaceGPU;
      return;
    }

    this._mesh = mesh;

    const self = this;
    mat.onBeforeCompile = function (shader) {
      shader.uniforms.uTime = { value: 0.0 };
      shader.uniforms.uAmp = { value: self.data.amp };
      shader.uniforms.uMaxDown = { value: self.data.maxDown };
      shader.uniforms.uSpeed = { value: self.data.speed };
      shader.uniforms.uRippleFreq = { value: self.data.rippleFreq };
      shader.uniforms.uWhirlCount = { value: Math.max(1, Math.min(6, self.data.whirlCount|0)) };
      shader.uniforms.uR = { value: (self.data.radius && self.data.radius > 0) ? self.data.radius : 4.05 };
      shader.uniforms.uLifeMin = { value: self.data.lifeMin };
      shader.uniforms.uLifeMax = { value: self.data.lifeMax };
      shader.uniforms.uDrift = { value: self.data.drift };
      shader.uniforms.uSeed = { value: self.data.seed };

      const header = `
        uniform float uTime;
        uniform float uAmp;
        uniform float uMaxDown;
        uniform float uSpeed;
        uniform float uRippleFreq;
        uniform int   uWhirlCount;
        uniform float uR;
        uniform float uLifeMin;
        uniform float uLifeMax;
        uniform float uDrift;
        uniform float uSeed;

        float ms_smoothstep(float e0, float e1, float x){
          float t = clamp((x - e0) / (e1 - e0), 0.0, 1.0);
          return t*t*(3.0 - 2.0*t);
        }

        float ms_hash(float n){ return fract(sin(n) * 43758.5453123); }

        // Original heightfield logic, ported from mercury-surface (CPU) to GLSL.
        float mercuryHeight(vec2 p){
          float time = uTime * uSpeed;
          float x0 = p.x;
          float y0 = p.y;
          float r  = length(p);

          float rimFade = ms_smoothstep(uR * 1.00, uR * 0.86, r);

          float a = uAmp;
          float z = 0.0;
          z += a * 0.32 * sin(x0 * 0.62 + time * 0.70);
          z += a * 0.28 * sin(y0 * 0.58 - time * 0.57);
          z += a * 0.20 * sin((x0 + y0) * 0.36 + time * 0.41);
          z += a * 0.16 * sin(r * uRippleFreq - time * 0.98);

          // Fixed set of procedural "cells" (no CPU-side spawning).
          // Each cell cycles with a pseudo-random lifetime and envelope to mimic appearing/disappearing vortices.
          for (int j = 0; j < 6; j++) {
            if (j >= uWhirlCount) break;

            float fj = float(j);
            float n1 = ms_hash(uSeed * 78.233 + (fj + 1.0) * 12.9898);
            float n2 = ms_hash(uSeed * 45.117 + (fj + 1.0) * 39.3467);
            float n3 = ms_hash(uSeed * 11.731 + (fj + 1.0) * 91.1329);
            float n4 = ms_hash(uSeed * 63.917 + (fj + 1.0) * 17.8193);
            float n5 = ms_hash(uSeed * 22.419 + (fj + 1.0) * 53.1211);
            float n6 = ms_hash(uSeed * 93.007 + (fj + 1.0) * 27.1137);
            float n7 = ms_hash(uSeed * 14.271 + (fj + 1.0) * 71.7777);
            float n8 = ms_hash(uSeed * 58.911 + (fj + 1.0) * 19.3333);

            // Position bias similar to CPU version
            float rr0  = sqrt(max(0.06, n1)) * (uR * 0.78);
            float ang0 = n2 * 6.28318530718;
            vec2 baseC = vec2(cos(ang0), sin(ang0)) * rr0;

            // Cell size / dynamics
            float sigma = (0.55 + n3 * 0.85) * (uR * 0.22);
            float life  = mix(max(0.1, uLifeMin), max(uLifeMin + 0.1, uLifeMax), n4);
            float phase = n5 * 6.28318530718;

            float arms = floor(3.0 + n6 * 4.0); // 3..6
            float spin = (n7 * 2.0 - 1.0) * (0.55 + n8 * 0.75);

            float lift = 0.65 + ms_hash(uSeed * 5.2 + (fj + 1.0) * 1.7) * 0.55;
            float roll = 0.55 + ms_hash(uSeed * 2.1 + (fj + 1.0) * 7.9) * 0.70;

            // Drift (bounded, sinusoidal — avoids CPU bounce logic but preserves slow travel)
            float driftMag = (0.35 + ms_hash(uSeed * 8.8 + (fj + 1.0) * 0.4) * 0.65) * uDrift;
            float driftAng = ms_hash(uSeed * 1.1 + (fj + 1.0) * 5.4) * 6.28318530718;
            vec2 driftDir  = vec2(cos(driftAng), sin(driftAng));
            vec2 driftPerp = vec2(-driftDir.y, driftDir.x);
            vec2 c = baseC
                   + driftDir  * (driftMag * sin(uTime * 0.17 + phase))
                   + driftPerp * (driftMag * 0.55 * cos(uTime * 0.13 + phase * 1.7));

            // Envelope (appear/disappear)
            float age = mod(uTime + phase * 0.37, life);
            float riseDur = min(2.0, life * 0.25);
            float fallDur = min(3.5, life * 0.30);
            float form = ms_smoothstep(0.0, riseDur, age);
            float fade = 1.0 - ms_smoothstep(life - fallDur, life, age);
            float env  = form * fade;
            if (env <= 0.0001) continue;

            vec2 d = p - c;
            float rr = length(d);
            float g  = exp(-(rr*rr) / (2.0 * sigma * sigma));
            float ang = atan(d.y, d.x);

            float spinT = time * (0.85 + 0.65 * abs(spin));

            float coreSigma = max(0.08, sigma * 0.32);
            float gCore = exp(-(rr*rr) / (2.0 * coreSigma * coreSigma));
            float funnel = (-a * (1.15 * lift) * env * gCore * (0.70 + 0.30 * sin(spinT * 0.35 + phase))) * 0.55;

            float lipR = sigma * (0.55 + 0.08 * sin(phase));
            float lipW = max(0.06, sigma * 0.18);
            float dLip = (rr - lipR);
            float lipG = exp(-(dLip*dLip) / (2.0 * lipW * lipW));
            float lip  =  a * 0.55 * env * lipG * (0.55 + 0.45 * g);

            float tighten = 2.8 + 2.1 / max(0.35, sigma);
            float spiral = sin(ang * arms + rr * tighten - spinT * (1.35 * spin) + phase);
            float shear  = a * (0.80 * roll) * env * g * spiral;

            float inward = sin(rr * (7.2 + 0.9 * arms) - spinT * 0.95 + phase * 0.7);
            float suctionMask = (1.0 - ms_smoothstep(sigma * 0.15, sigma * 1.35, rr));
            float suction = a * 0.25 * env * g * inward * suctionMask;

            float breathe = sin(time * 0.55 + phase + rr * 1.4);
            float bulge   = a * 0.18 * env * g * breathe;

            z += (funnel + lip + shear + suction + bulge);
          }

          z *= rimFade;
          if (uMaxDown > 0.0) z = max(z, -uMaxDown);
          return z;
        }
      `;

      // Inject helpers + height function near the top of the vertex shader.
      shader.vertexShader = shader.vertexShader.replace(
        'void main() {',
        header + '\n\nvoid main() {'
      );

      // Ensure local XY is available for fragment disc clipping.
      shader.vertexShader = shader.vertexShader.replace(
        '#include <common>',
        '#include <common>\nvarying vec2 vDiscLocalXY;'
      );

      // Displace vertices (object space): plane uses XY, displace along +Z (matches CPU version).
      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `
          vec3 transformed = vec3( position );
          vDiscLocalXY = position.xy;
          float mh = mercuryHeight(position.xy);
          transformed.z += mh;
        `
      );

      // Override objectNormal to match heightfield (finite differences).
      shader.vertexShader = shader.vertexShader.replace(
        '#include <beginnormal_vertex>',
        `
          #include <beginnormal_vertex>
          // Heightfield-derived normal in object space
          float eps = 0.02;
          float hx1 = mercuryHeight(position.xy + vec2(eps, 0.0));
          float hx0 = mercuryHeight(position.xy - vec2(eps, 0.0));
          float hy1 = mercuryHeight(position.xy + vec2(0.0, eps));
          float hy0 = mercuryHeight(position.xy - vec2(0.0, eps));
          float dzdx = (hx1 - hx0) / (2.0 * eps);
          float dzdy = (hy1 - hy0) / (2.0 * eps);
          objectNormal = normalize(vec3(-dzdx, -dzdy, 1.0));
        `
      );

      // Disc clip in fragment shader (keeps pool inside ring even if other components overwrite onBeforeCompile).
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nvarying vec2 vDiscLocalXY;\nuniform float uR;')
        .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\nif (length(vDiscLocalXY) > uR) discard;');

      self._shader = shader;
      mat.userData.__mercurySurfaceGPU = shader;
    };

    mat.needsUpdate = true;
  },

  tick: function (t) {
    if (!this._shader) return;
    const s = (t || 0) * 0.001;
    this._shader.uniforms.uTime.value = s;
    this._shader.uniforms.uAmp.value = this.data.amp;
    this._shader.uniforms.uMaxDown.value = this.data.maxDown;
    this._shader.uniforms.uSpeed.value = this.data.speed;
    this._shader.uniforms.uRippleFreq.value = this.data.rippleFreq;
    this._shader.uniforms.uWhirlCount.value = Math.max(1, Math.min(6, this.data.whirlCount|0));
    this._shader.uniforms.uR.value = (this.data.radius && this.data.radius > 0) ? this.data.radius : this._shader.uniforms.uR.value;
    this._shader.uniforms.uLifeMin.value = this.data.lifeMin;
    this._shader.uniforms.uLifeMax.value = this.data.lifeMax;
    this._shader.uniforms.uDrift.value = this.data.drift;
    this._shader.uniforms.uSeed.value = this.data.seed;
  }
});

// ===== Dome-style floor sculpt + rubble clusters (ported from 01_dome_safe_01) =====
AFRAME.registerComponent('floor-seam-sculpt', {
  schema: {
    // Back wall seam Z in WORLD space
    wallZ: {type: 'number', default: 0.49},

    // Elliptical footprint of the dome on the floor in WORLD space:
    // (x - cx)^2 / a^2 + (z - cz)^2 / b^2 = 1
    domeCenter: {type: 'vec3', default: {x: 0, y: 1.92, z: 0.49}},
    domeA: {type: 'number', default: 3.34},
    domeB: {type: 'number', default: 4.58},

    // Blend band widths in METERS (how far from the seam we start ramping up)
    domeBand: {type: 'number', default: 0.85},
    wallBand: {type: 'number', default: 0.95},

    // Max vertical rise (meters)
    maxRise: {type: 'number', default: 0.12},

    // Noise controls
    noiseScale: {type: 'number', default: 0.70},   // meters per noise feature (bigger = smoother)
    noiseAmp:   {type: 'number', default: 0.85},   // 0..1-ish
    edgeJitter: {type: 'number', default: 0.14},   // meters of seam wobble
    seed: {type: 'int', default: 11},

    // Keep the elevator cab + doorway area flat (meters)
    elevatorClearX: {type: 'number', default: 1.45},
    elevatorClearZ: {type: 'number', default: 1.10},

    // Whether to recompute normals (slightly costlier once, but improves realism)
    recomputeNormals: {type: 'boolean', default: true}
  },

  init: function () {
    this._applied = false;
    this._inv = new THREE.Matrix4();
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._apply);
  },

  _smoothstep: function (e0, e1, x) {
    const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  },

  _hash2: function (x, y, seed) {
    // integer hash -> [0,1)
    let n = (x * 374761393 + y * 668265263 + seed * 1442695041) | 0;
    n = (n ^ (n >> 13)) | 0;
    n = (n * 1274126177) | 0;
    return ((n ^ (n >> 16)) >>> 0) / 4294967296;
  },

  _noise2: function (x, y, seed) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;

    const a = this._hash2(xi, yi, seed);
    const b = this._hash2(xi + 1, yi, seed);
    const c = this._hash2(xi, yi + 1, seed);
    const d = this._hash2(xi + 1, yi + 1, seed);

    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const ab = a + (b - a) * u;
    const cd = c + (d - c) * u;
    return ab + (cd - ab) * v; // ~[0,1]
  },

  _fbm: function (x, y, seed) {
    let amp = 0.58;
    let sum = 0.0;
    let freq = 1.0;
    for (let i = 0; i < 4; i++) {
      sum += amp * this._noise2(x * freq, y * freq, seed + i * 13);
      freq *= 2.03;
      amp *= 0.52;
    }
    return sum; // ~[0,1]
  },

  _apply: function () {
    if (this._applied) return;

    const mesh = this.el.getObject3D('mesh');
    if (!mesh || !mesh.geometry || !mesh.geometry.attributes || !mesh.geometry.attributes.position) return;

    // Clone once so we don't mutate shared geometry.
    const geom = mesh.geometry.clone();
    mesh.geometry = geom;

    const pos = geom.attributes.position;

    // Compute LOCAL up (for displacing along the floor normal even if the plane rotates).
    const qWorld = new THREE.Quaternion();
    mesh.getWorldQuaternion(qWorld);
    const invQ = qWorld.clone().invert();
    const upLocal = new THREE.Vector3(0, 1, 0).applyQuaternion(invQ).normalize();

    const tmpLocal = new THREE.Vector3();
    const tmpWorld = new THREE.Vector3();

    const d = this.data;
    const cx = d.domeCenter.x, cz = d.domeCenter.z;
    const a = Math.max(1e-6, d.domeA), b = Math.max(1e-6, d.domeB);

    const wallBand = Math.max(0.05, d.wallBand);
    const domeBand = Math.max(0.05, d.domeBand);
    const noiseScale = Math.max(0.05, d.noiseScale);

    // Convert ellipse seam distance to meters (approx, good enough visually)
    const avgR = 0.5 * (a + b);

    for (let i = 0; i < pos.count; i++) {
      tmpLocal.fromBufferAttribute(pos, i);
      tmpWorld.copy(tmpLocal);
      mesh.localToWorld(tmpWorld);

      // Keep elevator interior / doorway region flat.
      const inElevatorClear =
        (Math.abs(tmpWorld.x) <= d.elevatorClearX) &&
        (tmpWorld.z <= (d.wallZ + d.elevatorClearZ));

      if (inElevatorClear) continue;

      // Seam wobble (breaks the "perfect line" read)
      const seamJ = (this._noise2(tmpWorld.x * 0.55, 0.0, d.seed + 31) * 2.0 - 1.0);
      const wallZJ = d.wallZ + d.edgeJitter * 0.55 * seamJ;

      let wWall = 1.0 - this._smoothstep(0.0, wallBand, dWall);
      wWall = Math.pow(Math.max(0, wWall), 0.65);

      wDome = Math.pow(Math.max(0, wDome), 0.65);

      // Tri-junction boost: where both seam influences exist (use min)
      let wTri = Math.min(wWall, wDome);
      wTri = Math.pow(wTri, 0.55);

      tmpLocal.addScaledVector(upLocal, rise);
      pos.setXYZ(i, tmpLocal.x, tmpLocal.y, tmpLocal.z);
    }

    pos.needsUpdate = true;
    if (d.recomputeNormals) geom.computeVertexNormals();

    this._applied = true;
  }
});

AFRAME.registerComponent('seam-rubble-skirt', {
  schema: {

    domeA: {type: 'number', default: 3.34},
    domeB: {type: 'number', default: 4.58},

    heroCount: {type: 'int', default: 7},

    // How far inward from the seam we place rubble (meters)

    // Randomness

    tangentJitter: {type: 'number', default: 0.10},
    yJitter: {type: 'number', default: 0.03},

    // Scale in meters (rock radius-ish)
    scaleMin: {type: 'number', default: 0.05},
    scaleMax: {type: 'number', default: 0.14},
    heroScaleMin: {type: 'number', default: 0.22},
    heroScaleMax: {type: 'number', default: 0.38},

    // Look
    color1: {type: 'color', default: '#1a1a1a'},
    color2: {type: 'color', default: '#2a2a2a'},
    roughness: {type: 'number', default: 0.98},
    metalness: {type: 'number', default: 0.02}
  },

  init: function () {
    const THREE = AFRAME.THREE;
    const d = this.data;


    // Procedural micro normal map to give the black rocks readable surface under light (no external textures).
    function makeRockNormalTexture(seed, size) {
      size = size || 128;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const img = ctx.createImageData(size, size);
      const data = img.data;

      function hash(x, y) {
        let n = (x * 374761393 + y * 668265263 + (seed | 0) * 1447) | 0;
        n = (n ^ (n >> 13)) | 0;
        n = (n * 1274126177) | 0;
        return ((n ^ (n >> 16)) >>> 0) / 4294967296;
      }

      function smoothstep(t) { return t * t * (3 - 2 * t); }

      function noise(x, y) {
        const xi = Math.floor(x), yi = Math.floor(y);
        const xf = x - xi, yf = y - yi;
        const a = hash(xi, yi);
        const b = hash(xi + 1, yi);
        const c = hash(xi, yi + 1);
        const d0 = hash(xi + 1, yi + 1);
        const u = smoothstep(xf);
        const v = smoothstep(yf);
        const ab = a + (b - a) * u;
        const cd = c + (d0 - c) * u;
        return ab + (cd - ab) * v; // 0..1
      }

      function fbm(x, y) {
        let f = 0.0;
        let amp = 0.55;
        let freq = 1.0;
        for (let i = 0; i < 4; i++) {
          f += amp * noise(x * freq, y * freq);
          freq *= 2.03;
          amp *= 0.52;
        }
        return f; // ~0..1
      }

      const H = new Float32Array(size * size);
      for (let j = 0; j < size; j++) {
        for (let i = 0; i < size; i++) {
          const u = i / size;
          const v = j / size;
          // Clumpy field (bias toward pockets / pits)
          let h = fbm(u * 6.0, v * 6.0);
          h = Math.pow(Math.max(0.0, h), 1.45);
          H[j * size + i] = h;
        }
      }

      const getH = (i, j) => H[((j + size) % size) * size + ((i + size) % size)];
      const strength = 2.2; // normal intensity

      for (let j = 0; j < size; j++) {
        for (let i = 0; i < size; i++) {
          const hx = getH(i + 1, j) - getH(i - 1, j);
          const hy = getH(i, j + 1) - getH(i, j - 1);

          let ny = -hy * strength;
          let nz = 1.0;

          data[idx + 1] = Math.floor((ny * 0.5 + 0.5) * 255);

    const cx = d.domeCenter.x, cz = d.domeCenter.z;
    const a = Math.max(0.001, d.domeA), b = Math.max(0.001, d.domeB);

    // Low-poly but shaded rocks

    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(d.color1),
      // Restore a touch of highlight response without going back to "wet" shine.
      // Keep mostly matte, but allow slightly less roughness + a tiny env contribution.
      // Slightly less rough to bring back a subtle reflective read under lights.
      roughness: Math.max(0.84, d.roughness),
      metalness: Math.min(0.02, d.metalness),
      envMapIntensity: 0.12,
      vertexColors: true,
      flatShading: true,
      normalMap: makeRockNormalTexture(d.seed, 128),
      normalScale: new THREE.Vector2(0.55, 0.55)
    });

    const count = Math.max(0, d.count | 0);
    const inst = new THREE.InstancedMesh(geo, mat, count);
    inst.castShadow = true;
    inst.receiveShadow = true;

    // Instance colors supported in modern Three.
    if (inst.instanceColor === null) inst.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(count * 3), 3);

    const colA = new THREE.Color(d.color1);
    const colB = new THREE.Color(d.color2);

    const m = new THREE.Matrix4();
    const p = new THREE.Vector3();
    const q = new THREE.Quaternion();
    const s = new THREE.Vector3();

    const up = new THREE.Vector3(0, 1, 0);
    const dir = new THREE.Vector3();
    const tan = new THREE.Vector3();

    function rand01(i) {
      // deterministic-ish [0,1)
      const t = Math.sin((i + 1) * 133.7 + d.seed * 17.3) * 43758.5453123;
      return t - Math.floor(t);
    }

    for (let i = 0; i < count; i++) {
      const r0 = rand01(i);
      const r1 = rand01(i + 19);
      const r2 = rand01(i + 41);

      // Spread around the ellipse seam with slight jitter
      const theta = (i / count) * Math.PI * 2.0 + (r0 - 0.5) * 0.35;

      const ex = cx + a * Math.cos(theta);
      const ez = cz + b * Math.sin(theta);

      // Ellipse outward normal (gradient of implicit ellipse)
      dir.set((ex - cx) / (a * a), (ez - cz) / (b * b), 0); // temp in x,z
      // remap into x,z
      const nx = dir.x, nz = dir.y;
      dir.set(nx, 0, nz).normalize();

      tan.set(-dir.z, 0, dir.x).normalize();

      // Inward offset + a little tangential jitter to avoid "perfect ring"
      const inward = -d.bandWidth * (0.35 + 0.65 * r1);
      const tJ = d.bandWidth * d.tangentJitter * (r2 - 0.5);

      p.set(ex, d.y + (r2 - 0.5) * d.yJitter, ez);
      p.addScaledVector(dir, inward);
      p.addScaledVector(tan, tJ);

      // Slight random orientation (mostly upright)
      q.setFromAxisAngle(up, r0 * Math.PI * 2.0);
      const tiltX = (r1 - 0.5) * 0.35;
      const tiltZ = (r2 - 0.5) * 0.35;
      q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), tiltX));
      q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), tiltZ));

      // Scale
      const sc = d.scaleMin + (d.scaleMax - d.scaleMin) * Math.pow(r0, 1.6);
      s.set(sc, sc * (0.65 + 0.70 * r1), sc);

      m.compose(p, q, s);
      inst.setMatrixAt(i, m);

      // Color lerp
      const c = colA.clone().lerp(colB, r2);
      inst.setColorAt(i, c);
    }

    inst.instanceMatrix.needsUpdate = true;
    if (inst.instanceColor) inst.instanceColor.needsUpdate = true;

    // A few larger "hero" rocks to break silhouette (non-instanced, still cheap)
    const heroes = new THREE.Group();
    const heroCount = Math.max(0, d.heroCount | 0);

    for (let i = 0; i < heroCount; i++) {
      const r0 = rand01(900 + i);
      const r1 = rand01(930 + i);
      const r2 = rand01(960 + i);

      const theta = r0 * Math.PI * 2.0;

      const ex = cx + a * Math.cos(theta);
      const ez = cz + b * Math.sin(theta);

      dir.set((ex - cx) / (a * a), (ez - cz) / (b * b), 0);
      const nx = dir.x, nz = dir.y;
      dir.set(nx, 0, nz).normalize();
      tan.set(-dir.z, 0, dir.x).normalize();

      const inward = -d.bandWidth * (0.20 + 0.55 * r1);
      const tJ = d.bandWidth * 0.20 * (r2 - 0.5);

      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      mesh.position.set(ex, d.y + (r1 - 0.5) * d.yJitter, ez);
      mesh.position.addScaledVector(dir, inward);
      mesh.position.addScaledVector(tan, tJ);

      mesh.rotation.set((r1 - 0.5) * 0.45, r0 * Math.PI * 2.0, (r2 - 0.5) * 0.45);

      const sc = d.heroScaleMin + (d.heroScaleMax - d.heroScaleMin) * Math.pow(r2, 1.3);
      mesh.scale.set(sc, sc * (0.70 + 0.55 * r1), sc);

      // Tint a bit
      mesh.material = mat.clone();
      mesh.material.color = colA.clone().lerp(colB, r0);
      heroes.add(mesh);
    }

    this.el.object3D.add(inst);
    this.el.object3D.add(heroes);
  }
});

    };
  },

  _lerp: function (a, b, t) { return a + (b - a) * t; },

  _build: function () {
    const d = this.data;

    // Clear existing children.
    while (this.el.firstChild) this.el.removeChild(this.el.firstChild);

    const rand = this._rng(d.seed);
    const cx = d.center.x, cy = d.center.y, cz = d.center.z;

    // Precompute cluster centers across the region.
    const clusters = [];
    for (let i = 0; i < Math.max(1, d.clusterCount); i++) {
      const a = rand() * Math.PI * 2;
      const rr = this._lerp(d.rMin, d.rMax, Math.sqrt(rand()));
      clusters.push({
        x: cx + rr * Math.cos(a),
        z: cz + rr * Math.sin(a)
      });
    }

    // Helper: random point in annulus (biased slightly outward for realism).
    const sampleBase = () => {
      const a = rand() * Math.PI * 2;
      const u = rand();
      // bias outward: u^0.65
      const rr = this._lerp(d.rMin, d.rMax, Math.pow(u, 0.65));
      return { x: cx + rr * Math.cos(a), z: cz + rr * Math.sin(a) };
    };

    const makeRock = (isHero) => {
      const rock = document.createElement('a-entity');

      // Geometry: lumpy but simple; detail 0 is cheapest and reads as a "stone" when scaled.
      rock.setAttribute('geometry', 'primitive: icosahedron; radius: 1; detail: 0');

      // Mix between base scatter + clusters (prevents ring look).
      const useCluster = rand() < 0.58;
      let x, z;

      if (useCluster) {
        const c = clusters[Math.floor(rand() * clusters.length)];
        // sample within a soft disk around cluster center
        const aa = rand() * Math.PI * 2;
        const rr = d.clusterRadius * Math.sqrt(rand());
        const tight = this._lerp(1.0, d.clusterTightness, rand());
        x = c.x + rr * Math.cos(aa) * tight;
        z = c.z + rr * Math.sin(aa) * tight;
      } else {
        const p = sampleBase();
        x = p.x; z = p.z;
      }

      // Add planar jitter (breaks any latent circularity).
      x += (rand() - 0.5) * d.planarJitter;
      z += (rand() - 0.5) * d.planarJitter;

      const y = d.y + (rand() - 0.5) * d.yJitter;

      rock.object3D.position.set(x, y, z);
      rock.object3D.rotation.set(
        (rand() - 0.5) * 0.35,
        rand() * Math.PI * 2,
        (rand() - 0.5) * 0.35
      );

      const s = isHero
        ? this._lerp(d.heroScaleMin, d.heroScaleMax, rand())
        : this._lerp(d.scaleMin, d.scaleMax, rand());
      const sx = s * this._lerp(0.85, 1.25, rand());
      const sy = s * this._lerp(0.70, 1.15, rand());
      const sz = s * this._lerp(0.85, 1.25, rand());
      rock.object3D.scale.set(sx, sy, sz);

      // Material: subtle variance (still in the same family).
      const t = rand();
      const c = new THREE.Color(d.color1).lerp(new THREE.Color(d.color2), t);
      rock.setAttribute('material',
        `shader: standard; color: #${c.getHexString()}; roughness: ${d.roughness}; metalness: ${d.metalness}`
      );

      rock.setAttribute('shadow', 'cast:false; receive:true');

      return rock;
    };

    // Add rocks.
    const total = Math.max(0, d.count | 0);
    const heroN = Math.min(total, Math.max(0, d.heroCount | 0));

    for (let i = 0; i < total; i++) {
      const isHero = (i < heroN);
      this.el.appendChild(makeRock(isHero));
    }
  }
});

/**
 * Clips a mesh in fragment shader to a spherical segment (phi/theta ranges),
 * avoiding UV-pole pinching artifacts by allowing us to use an icosahedron dome.
 *
 * Angles are in DEGREES to match A-Frame sphere geometry params.
 */
AFRAME.registerComponent('sphere-segment', {
  schema: {
    phiStart:   {type: 'number', default: 0},   // degrees
    phiLength:  {type: 'number', default: 360}, // degrees
    thetaStart: {type: 'number', default: 0},   // degrees
    thetaLength:{type: 'number', default: 180}  // degrees
  },

  init: function () {
    this._onSet = (e) => { if (e.detail && e.detail.type === 'mesh') this.apply(); };
    this.el.addEventListener('object3dset', this._onSet);
    this.apply();
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._onSet);
  },

  update: function () { this.apply(true); },

  apply: function (force) {
    const THREE = AFRAME.THREE;
    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;

    // Read radius/segments from A-Frame geometry component when available.
    const g = this.el.getAttribute('geometry') || {};
    const radius = (g.radius != null) ? g.radius : 1;
    const wSeg = (g.segmentsWidth != null) ? g.segmentsWidth : (g.segments != null ? g.segments : 64);
    const hSeg = (g.segmentsHeight != null) ? g.segmentsHeight : 48;

    const phiStart = THREE.MathUtils.degToRad(this.data.phiStart);
    const phiLength = THREE.MathUtils.degToRad(this.data.phiLength);
    const thetaStart = THREE.MathUtils.degToRad(this.data.thetaStart);
    const thetaLength = THREE.MathUtils.degToRad(this.data.thetaLength);

    const build = (m) => {
      if (!m.isMesh) return;
      if (!force && m.geometry && m.geometry.userData && m.geometry.userData.__sphereSegApplied) return;

      const geom = new THREE.SphereGeometry(radius, wSeg, hSeg, phiStart, phiLength, thetaStart, thetaLength);
      geom.userData.__sphereSegApplied = true;
      m.geometry.dispose && m.geometry.dispose();
      m.geometry = geom;
    };

    if (mesh.isMesh) build(mesh);
    else mesh.traverse(build);
  }
});

AFRAME.registerComponent('spherical-segment-clip', {
  schema: {
    phiStart:   {type: 'number', default: 0},
    phiLength:  {type: 'number', default: 360},
    thetaStart: {type: 'number', default: 0},
    thetaLength:{type: 'number', default: 180}
  },
  init: function () {
    this._applied = false;
    this._inv = new THREE.Matrix4();
    this._onSet = (e) => {
      if (e.detail && e.detail.type === 'mesh') this.apply();
    };
    this.el.addEventListener('object3dset', this._onSet);
    // In case mesh already exists.
    this.apply();
  },
  remove: function () {
    this.el.removeEventListener('object3dset', this._onSet);
  },
  update: function () {
    // Re-apply uniforms if already applied.
    const mesh = this.el.getObject3D('mesh');
    if (mesh && mesh.material && mesh.material.userData && mesh.material.userData.__segClip) {
      this._setUniforms(mesh.material);
    }
  },
  apply: function () {
    if (this._applied) return;
    const mesh = this.el.getObject3D('mesh');
    if (!mesh || !mesh.material) return;

    const material = mesh.material;
    // Some entities can have an array of materials; handle both.
    const mats = Array.isArray(material) ? material : [material];

    mats.forEach((mat) => {
      if (!mat || mat.userData.__segClip) return;

      mat.userData.__segClip = true;

      mat.onBeforeCompile = (shader) => {
        // Declare varyings + uniforms
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            '#include <common>\nvarying vec3 vSegClipWorldPos;'
          )
          .replace(
            '#include <worldpos_vertex>',
            '#include <worldpos_vertex>\nvSegClipWorldPos = worldPosition.xyz;'
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            '#include <common>\n' +
            'varying vec3 vSegClipWorldPos;\n' +
            'uniform mat4 uSegClipInvModel;\n' +
            'uniform vec4 uSegClipAngles; // phiStart, phiEnd, thetaStart, thetaEnd (radians)\n' +
            'const float SEGCLIP_PI = 3.141592653589793;\n'
          )
          .replace(
            '#include <clipping_planes_fragment>',
            '#include <clipping_planes_fragment>\n' +
            'vec3 lp = (uSegClipInvModel * vec4(vSegClipWorldPos, 1.0)).xyz;\n' +
            'vec3 pn = normalize(lp);\n' +
            'float theta = acos(clamp(pn.y, -1.0, 1.0));\n' +
            'float phi = atan(pn.z, pn.x);\n' +
            'if (phi < 0.0) phi += 2.0 * SEGCLIP_PI;\n' +
            'if (phi < uSegClipAngles.x || phi > uSegClipAngles.y || theta < uSegClipAngles.z || theta > uSegClipAngles.w) discard;\n'
          );

        // Uniforms
        shader.uniforms.uSegClipInvModel = { value: new THREE.Matrix4() };
        shader.uniforms.uSegClipAngles   = { value: new THREE.Vector4() };

        // Store for updates (e.g., if renderer recompiles)
        mat.userData.__segClipShader = shader;

        // Set initial values
        this._setUniforms(mat);
      };

      // Force recompile
      mat.needsUpdate = true;
    });

    this._applied = true;
  },
  _setUniforms: function (mat) {
    const shader = mat.userData.__segClipShader;
    if (!shader) return;

    // Inverse model matrix (local from world)
    const mesh = this.el.getObject3D('mesh');
    mesh.updateMatrixWorld(true);
    const invModel = new THREE.Matrix4().copy(mesh.matrixWorld).invert();
    shader.uniforms.uSegClipInvModel.value.copy(invModel);

    // Angles (degrees -> radians)
    const d = this.data;
    const toRad = THREE.MathUtils.degToRad;
    const phiStart  = toRad(d.phiStart);
    const phiEnd    = toRad(d.phiStart + d.phiLength);
    const thetaStart= toRad(d.thetaStart);
    const thetaEnd  = toRad(d.thetaStart + d.thetaLength);
    shader.uniforms.uSegClipAngles.value.set(phiStart, phiEnd, thetaStart, thetaEnd);
  }
});

   Sphere core light flicker + irregular "crack" glow
   (kept self-contained, no external deps)
   ============================================================ */

AFRAME.registerComponent('flicker-light', {
  schema: {
    base: {type: 'number', default: 6.0},
    amp: {type: 'number', default: 1.0},
    speed: {type: 'number', default: 3.0}
  },
  init: function () {
    const light = this.el.getObject3D('light');
    this._light = light || null;
    this._lastJitterT = 0;
    this._jitter = 0;
    // If light not yet ready, wait.
    this.el.addEventListener('object3dset', (e) => {
      if (e.detail.type === 'light') this._light = this.el.getObject3D('light');
    });
  },
  tick: function (t) {
    if (!this._light) return;
    const time = t * 0.001;
    // Low-frequency flicker + micro jitter (flame-like)
    const lf = 0.55 + 0.45 * Math.sin(time * this.data.speed);
    if (t - this._lastJitterT > 90) {
      this._lastJitterT = t;
      this._jitter = (Math.random() * 2 - 1) * 0.22;
    }
    const intensity = this.data.base + this.data.amp * (lf + this._jitter);
    this._light.intensity = Math.max(0.0, intensity);
  }
});

AFRAME.registerComponent('broken-ring-glow', {
  schema: {
    radius: {type: 'number', default: 1.0},
    thickness: {type: 'number', default: 0.06},   // wider = more "structural seam"
    jitter: {type: 'number', default: 0.02},      // radial / vertical irregularity
    color: {type: 'color', default: '#d9f1ff'},
    intensity: {type: 'number', default: 1.2},
    softness: {type: 'number', default: 0.30},    // 0..1 (higher = softer edge)
    segments: {type: 'int', default: 52}          // used as a hint; we purposely facet it
  },
  init: function () {
    const THREE = AFRAME.THREE;

    // --- Deterministic-ish seed from entity id (stable across reloads) ---
    const seedStr = (this.el.id || 'ring') + '_seed';
    let seed = 0;
    for (let i = 0; i < seedStr.length; i++) seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
    const rand = () => {
      // xorshift32
      seed ^= seed << 13; seed >>>= 0;
      seed ^= seed >> 17; seed >>>= 0;
      seed ^= seed << 5;  seed >>>= 0;
      return (seed >>> 0) / 4294967296;
    };

    // --- Build a faceted, not-perfectly-planar closed polyline ---
    const segHint = Math.max(18, this.data.segments | 0);
    const facets = Math.max(14, Math.floor(segHint * 0.55)); // fewer facets => more geometric
    const pts = [];

    for (let i = 0; i < facets; i++) {
      const a0 = (i / facets) * Math.PI * 2;
      const step = (Math.PI * 2) / facets;

      // Keep it geometric but imperfect: snap to facet steps, then nudge slightly.
      const a = a0 + (rand() - 0.5) * step * 0.22;

      const r = this.data.radius + (rand() - 0.5) * this.data.jitter;
      const y = (rand() - 0.5) * this.data.jitter * 0.45;

      pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
    }

    // --- Ribbon geometry around the polyline (flat seam, not a tube/cone) ---
    const positions = [];
    const uvs = [];
    const indices = [];
    const M = pts.length;

    for (let i = 0; i < M; i++) {
      const pPrev = pts[(i - 1 + M) % M];
      const p = pts[i];
      const pNext = pts[(i + 1) % M];

      const tangent = new THREE.Vector3().subVectors(pNext, pPrev).normalize();
      const radial = p.clone().normalize();

      // Bitangent gives "across seam" direction on the surface.
      let bitan = new THREE.Vector3().crossVectors(tangent, radial);
      if (bitan.lengthSq() < 1e-6) bitan.set(0, 1, 0);
      bitan.normalize();

      const off = bitan.multiplyScalar(this.data.thickness);

      const v0 = p.clone().add(off); // outer
      const v1 = p.clone().sub(off); // inner

      positions.push(v0.x, v0.y, v0.z,  v1.x, v1.y, v1.z);

      const u = i / M;
      uvs.push(u, 0,  u, 1);
    }

    for (let i = 0; i < M; i++) {
      const a0 = i * 2;
      const a1 = a0 + 1;
      const b0 = ((i + 1) % M) * 2;
      const b1 = b0 + 1;

      // Two triangles for the quad strip.
      indices.push(a0, a1, b1);
      indices.push(a0, b1, b0);
    }

    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geom.setIndex(indices);
    geom.computeVertexNormals();

    const col = new THREE.Color(this.data.color);

    const makeMat = (mulIntensity, addSoftness) => new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      depthTest: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime: {value: 0},
        uColor: {value: col.clone()},
        uIntensity: {value: this.data.intensity * mulIntensity},
        uSoftness: {value: Math.min(0.96, this.data.softness + addSoftness)}
      },
      vertexShader: `
        varying vec2 vUv;
        varying float vW;
        void main() {
          vUv = uv;
          vW = length(position) * 0.25;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        varying vec2 vUv;
        varying float vW;
        uniform float uTime;
        uniform vec3 uColor;
        uniform float uIntensity;
        uniform float uSoftness;

        float hash(float n) { return fract(sin(n) * 43758.5453123); }
        float noise(float x) {
          float i = floor(x);
          float f = fract(x);
          float u = f*f*(3.0-2.0*f);
          return mix(hash(i), hash(i+1.0), u);
        }

        void main() {
          float x = vUv.x;

          // Breakup along the seam: big gaps + some fine variation
          float n1 = noise(x * 10.0 + uTime * 0.20 + vW);
          float n2 = noise(x * 31.0 - uTime * 0.14);
          float n = (n1 * 0.65 + n2 * 0.35);

          // Make it feel "cracked": more binary on/off with softened transitions
          float mask = smoothstep(0.38, 0.70, n);

          // Edge softness across ribbon thickness (2D seam feel)
          float d = abs(vUv.y - 0.5) * 2.0;   // 0 center -> 1 edge
          float edge = smoothstep(1.0 - uSoftness, 1.0, 1.0 - d);

          // Low-key flicker like a living core
          float flick = 0.80 + 0.20 * sin(uTime * 4.4 + x * 10.5);

          float alpha = mask * edge * flick;
          alpha *= (0.70 + 0.30 * n);

          if (alpha < 0.02) discard;

          vec3 col = uColor * (uIntensity * (0.65 + 0.35 * n));
          gl_FragColor = vec4(col, alpha);
        }
      `
    });

    const matCore = makeMat(1.00, 0.00);
    const matHalo = makeMat(0.55, 0.28);

    // Halo geometry: slightly expanded (keeps it soft without looking like a tube)
    const geom2 = geom.clone();
    const pos2 = geom2.getAttribute('position');
    for (let i = 0; i < pos2.count; i++) {
      pos2.setX(i, pos2.getX(i) * 1.012);
      pos2.setY(i, pos2.getY(i) * 1.012);
      pos2.setZ(i, pos2.getZ(i) * 1.012);
    }
    pos2.needsUpdate = true;

    this._meshHalo = new THREE.Mesh(geom2, matHalo);
    this._meshCore = new THREE.Mesh(geom, matCore);

    this._group = new THREE.Group();
    this._group.add(this._meshHalo);
    this._group.add(this._meshCore);

    this.el.setObject3D('brokenRingGlow', this._group);
  },
  tick: function (t) {
    const time = t * 0.001;
    if (this._meshCore && this._meshCore.material && this._meshCore.material.uniforms) {
      this._meshCore.material.uniforms.uTime.value = time;
    }
    if (this._meshHalo && this._meshHalo.material && this._meshHalo.material.uniforms) {
      this._meshHalo.material.uniforms.uTime.value = time;
    }
  },
  remove: function () {
    const obj = this.el.getObject3D('brokenRingGlow');
    if (obj) this.el.removeObject3D('brokenRingGlow');
  }
});
