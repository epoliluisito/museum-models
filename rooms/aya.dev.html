<script>

// Disable Three.js fog for a specific entity (and its children).
AFRAME.registerComponent('no-fog', {
  init() {
    const apply = (obj) => {
      if (!obj || !obj.traverse) return;
      obj.traverse((n) => {
        if (!n.material) return;
        const mats = Array.isArray(n.material) ? n.material : [n.material];
        mats.forEach((m) => {
          if (m && Object.prototype.hasOwnProperty.call(m, 'fog')) {
            m.fog = false;
            m.needsUpdate = true;
          }
        });
      });
    };

    apply(this.el.object3D);
    this.el.addEventListener('object3dset', () => apply(this.el.object3D));
  }
});


// Improve Earth texture sampling only on the Earth mesh (anisotropy + filtering).

// Autoplay the first animation clip embedded in a glTF/GLB (e.g., seated Mixamo exports).
AFRAME.registerComponent('autoplay-gltf-anim', {
  init: function () {
    this.mixer = null;
    this.action = null;

    this.el.addEventListener('model-loaded', (e) => {
      const model = e.detail && e.detail.model;
      const clips = (model && model.animations) ? model.animations : [];
      if (!clips || !clips.length) return;

      this.mixer = new THREE.AnimationMixer(model);
      this.action = this.mixer.clipAction(clips[0]);
      this.action.setLoop(THREE.LoopRepeat);
      this.action.play();
    });
  },

  tick: function (time, timeDelta) {
    if (!this.mixer) return;
    this.mixer.update(timeDelta / 1000);
  }
});

// Mixamo / NPC material matte fix (ported from index.html).
AFRAME.registerComponent('mixamo-mat-fix', {
  schema: {
    desat: { type: 'number', default: 0.18 },   // 0..1
    darken: { type: 'number', default: 0.06 },  // 0..1
    matte: { type: 'number', default: 1.0 }     // 0..1 (higher = less specular)
  },
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const obj = this.el.getObject3D('mesh');
      

// Snap NPC meshes so their lowest point sits on the entity's local Y=0 (helps Mixamo-origin models stand on floors)
AFRAME.registerComponent('npc-ground', {
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const obj = this.el.getObject3D('mesh');
      if (!obj || !THREE || !THREE.Box3) return;
      const box = new THREE.Box3().setFromObject(obj);
      if (!isFinite(box.min.y)) return;
      obj.position.y -= box.min.y;
    });
  }
});
if (!obj) return;

      obj.traverse((o) => {
        if (!o.isMesh || !o.material) return;

        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach((m) => {
          if (!m) return;

          // Always render front faces for character meshes (helps with "inside head" artifacts).
          m.side = THREE.FrontSide;

          // Prefer alphaTest cutouts over blending (hair cards / lashes).
          const name = (m.name || '').toLowerCase();
          const hasAlphaMap = !!m.alphaMap;
          const isCutout = hasAlphaMap || name.includes('hair') || name.includes('lash') || name.includes('brow');
          if (isCutout) {
            m.transparent = false;
            m.alphaTest = Math.max(0.35, m.alphaTest || 0.0);
            m.depthWrite = true;
            m.opacity = 1.0;
          } else {
            m.transparent = false;
            m.opacity = 1.0;
            m.alphaTest = 0.0;
            m.depthWrite = true;
          }

          // --- Kill "plastic" look -------------------------------------------------
          const matte = Math.min(1, Math.max(0, this.data.matte));

          // Standard/Physical materials
          if ('roughness' in m) m.roughness = 1.0;                // fully rough
          if ('metalness' in m) m.metalness = 0.0;                // no metal
          if ('envMapIntensity' in m) m.envMapIntensity = 0.0;     // no reflections

          // Remove glossy maps that can re-introduce shine even when roughness is high.
          if (m.roughnessMap) m.roughnessMap = null;
          if (m.metalnessMap) m.metalnessMap = null;
          if (m.specularMap) m.specularMap = null;
          if (m.glossinessMap) m.glossinessMap = null;
          if (m.envMap) m.envMap = null;
          // Tone down normal micro-facets a bit (helps 'plasticky' cloth close-up).
          if (m.normalScale && m.normalScale.set) {
            const nsx = (m.normalScale.x != null) ? m.normalScale.x : 1;
            const nsy = (m.normalScale.y != null) ? m.normalScale.y : 1;
            m.normalScale.set(nsx * 0.35, nsy * 0.35);
          }

          // Physical extras
          if ('clearcoat' in m) m.clearcoat = 0.0;
          if ('clearcoatRoughness' in m) m.clearcoatRoughness = 1.0;
          if ('sheen' in m) m.sheen = 0.0;
          if ('sheenRoughness' in m) m.sheenRoughness = 1.0;
          if ('transmission' in m) m.transmission = 0.0;
          if ('ior' in m) m.ior = 1.0;
          if ('iridescence' in m) m.iridescence = 0.0;
          if ('specularIntensity' in m) m.specularIntensity = 0.0;

          // Phong/Lambert legacy
          if ('shininess' in m) m.shininess = Math.min(m.shininess || 0, 2);
          if (m.specular && m.specular.setRGB) m.specular.setRGB(0.02, 0.02, 0.02);
          if ('reflectivity' in m) m.reflectivity = 0.0;

          // Slight desaturation/darken of material tint (helps even when textures dominate).
          if (m.color) {
            const c = m.color.clone();
            const hsl = {};
            c.getHSL(hsl);
            hsl.s = Math.max(0.0, hsl.s * (1.0 - this.data.desat));
            hsl.l = Math.max(0.0, hsl.l * (1.0 - this.data.darken));
            m.color.setHSL(hsl.h, hsl.s, hsl.l);
          }

          if (m.emissive) m.emissive.multiplyScalar(0.35);

          // Extra safety: ensure "matte" intent wins even if the loader sets odd values.
          if ('roughness' in m) m.roughness = Math.max(m.roughness || 0, 0.9);
          if ('metalness' in m) m.metalness = Math.min(m.metalness || 0, 0.05);
          if ('envMapIntensity' in m) m.envMapIntensity = 0.0;

          // Optional scalar hook (kept for parity; currently matte=1 means max flattening).
          void(matte);

          m.needsUpdate = true;
        });

      });
    });
  }
});

// Automatically apply mixamo-mat-fix to all NPCs now and later (future-proof).
AFRAME.registerComponent('npc-matte-auto', {
  schema: {
    selector: { type: 'string', default: '.npc[gltf-model]' },
    params: { type: 'string', default: 'desat: 0.18; darken: 0.06; matte: 1.0' }
  },
  init: function () {
    const applyOne = (el) => {
      if (!el || !el.setAttribute) return;
      if (el.hasAttribute('mixamo-mat-fix')) return;
      el.setAttribute('mixamo-mat-fix', this.data.params);
    };

    const scan = () => {
      try {
        this.el.querySelectorAll(this.data.selector).forEach(applyOne);
      } catch (e) {}
    };

    // Run once scene is ready.
    if (this.el.hasLoaded) scan();
    else this.el.addEventListener('loaded', scan);

    // Watch for NPCs added later.
    const obs = new MutationObserver((mutations) => {
      for (const mu of mutations) {
        for (const node of mu.addedNodes || []) {
          if (!node || node.nodeType !== 1) continue;
          const el = node;
          try {
            if (el.matches && el.matches(this.data.selector)) applyOne(el);
            if (el.querySelectorAll) el.querySelectorAll(this.data.selector).forEach(applyOne);
          } catch (e) {}
        }
      }
    });
    obs.observe(this.el, { childList: true, subtree: true });
    this._npcMatObs = obs;
  },
  remove: function () {
    if (this._npcMatObs) {
      try { this._npcMatObs.disconnect(); } catch (e) {}
      this._npcMatObs = null;
    }
  }
});



AFRAME.registerComponent('earth-texture-quality', {
  init: function () {
    const el = this.el;

    const applyToMesh = (root) => {
      if (!root) return;

      const renderer = el.sceneEl && el.sceneEl.renderer;
      const maxAniso = (renderer && renderer.capabilities && renderer.capabilities.getMaxAnisotropy)
        ? renderer.capabilities.getMaxAnisotropy()
        : 1;

      root.traverse((obj) => {
        const mat = obj.material;
        if (!mat) return;

        const map = mat.map;
        if (map) {
          try {
            map.anisotropy = Math.max(1, maxAniso);
            map.minFilter = THREE.LinearMipmapLinearFilter;
            map.magFilter = THREE.LinearFilter;
            map.generateMipmaps = true;
            map.needsUpdate = true;
          } catch (e) {}
        }

        mat.needsUpdate = true;
      });
    };

    const run = () => applyToMesh(el.getObject3D('mesh'));

    // Mesh may arrive after init.
    el.addEventListener('object3dset', run);

    // Also run once when scene is ready.
    if (el.sceneEl && el.sceneEl.hasLoaded) {
      setTimeout(run, 0);
    } else if (el.sceneEl) {
      el.sceneEl.addEventListener('loaded', () => setTimeout(run, 0));
    }
  }
});



// Earth 'earthrise' shader: unlit texture + subtle terminator + feathered horizon occlusion mask (bottom cut).
// Keeps Earth readable in a dark scene without relying on scene lights.
AFRAME.registerShader('earth-phase', {
  schema: {
    src:      { type: 'map',    is: 'uniform' },
    fade:     { type: 'number', is: 'uniform', default: 0.82 },   // overall desaturation/brightness lift down
    dark:     { type: 'number', is: 'uniform', default: 0.28 },   // dark-side multiplier
    feather:  { type: 'number', is: 'uniform', default: 0.16 },   // width of the soft edge
    noise:    { type: 'number', is: 'uniform', default: 0.09 },   // edge irregularity
    opacity:  { type: 'number', is: 'uniform', default: 0.88 },   // global alpha

    // Phase direction in view-space-ish (uses normalMatrix*normal). Adjust to rotate the terminator.
    phaseX:   { type: 'number', is: 'uniform', default: -0.12 },
    phaseY:   { type: 'number', is: 'uniform', default:  0.28 },
    phaseZ:   { type: 'number', is: 'uniform', default:  0.95 }
  },

  vertexShader: `
    varying vec2 vUV;
    varying vec3 vN;
    void main() {
      vUV = uv;
      vN  = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,

  fragmentShader: `
    uniform sampler2D src;
    uniform float fade;
    uniform float dark;
    uniform float feather;
    uniform float noise;
    uniform float opacity;
    uniform float phaseX;
    uniform float phaseY;
    uniform float phaseZ;

    varying vec2 vUV;
    varying vec3 vN;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }
    float n2(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
    }

    void main() {
      vec4 tex = texture2D(src, vUV);

      // --- Day/Night shading (subtle), unlit base ---
      vec3 dir = normalize(vec3(phaseX, phaseY, phaseZ));
      float dp = dot(normalize(vN), dir);

      // Add mild irregularity to the terminator (kept subtle; not the "horizon" cut).
      float termNoise = (n2(vUV * 140.0) - 0.5) * (noise * 0.35);
      dp += termNoise;

      float term = smoothstep(-0.20, 0.45, dp);
      float shade = mix(dark, 1.0, term);

      // --- Horizon occlusion mask (Earthrise): UV-space matte ---
// Keeps the cut shape stable regardless of camera viewpoint.
// vUV.y: 0.0 bottom, 1.0 top. We keep only the part above a curved threshold.
// "Smile" curve: threshold is lower at the center and higher toward the edges.

float xU = vUV.x - 0.5;
float arcU = (xU * xU) / 0.25;         // 0 at center, 1 at edges
float baseCutU = 0.34;                 // overall amount of occlusion (higher = less visible Earth)
float arcAmpU  = 0.22;                 // curvature strength ("smile")
float cutU = baseCutU + arcAmpU * arcU;

// Feather in UV units (~10px-ish feel on the disk; scaled from the shader param).
float featherU = max(0.001, feather * 0.06);

// alphaH = 0 below horizon, 1 above horizon, with feathered transition.
float alphaH = smoothstep(cutU - featherU, cutU + featherU, vUV.y);

      vec3 col = tex.rgb * shade * fade;

      // Final alpha: true occlusion by the lunar horizon.
      float a = tex.a * opacity * alphaH;

      gl_FragColor = vec4(col, a);
}
  `
});

/* Boost Earth texture brightness (works even for embedded/base64 textures). */
</script>

<script>
/* Hide pointer during Mercury pool experience video playback.
   IMPORTANT: the experience plays in the fullscreen overlay video (#ayaFullscreenVideo).
   We also bind to the asset video (#ayaExperienceVideo) in case it is used directly.
*/
(function () {
  function bindOne(id) {
    var v = document.getElementById(id);
    if (!v) return;
    function hide() { document.body.classList.add("hide-pointer"); }
    function show() { document.body.classList.remove("hide-pointer"); }
    v.addEventListener("play", hide);
    v.addEventListener("pause", show);
    v.addEventListener("ended", show);
    v.addEventListener("emptied", show);
  }

  function bind() {
    bindOne("ayaFullscreenVideo");
    bindOne("ayaExperienceVideo");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind, { once: true });
  } else {
    bind();
  }
})();
</script>

<script>
/* -------------------------------------------------------------------------
   Preload guard
   If aya.dev.html is loaded as ?preload=1 inside index.html's hidden iframe:
   - keep all media muted/paused (no audio leakage)
   - expose a flag used later to pause rendering after warmup
--------------------------------------------------------------------------- */
(function () {
  try {
    const isPreload = (new URLSearchParams(window.location.search)).get('preload') === '1';
    window.__AYA_PRELOAD_MODE = !!isPreload;
    if (!isPreload) return;

    const silence = () => {
      document.querySelectorAll('audio,video').forEach((m) => {
        try { m.muted = true; m.volume = 0.0; m.pause(); } catch (e) {}
      });
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', silence, { once: true });
    } else {
      silence();
    }

    // Defensive: if anything tries to play, immediately stop it.
    document.addEventListener('play', (e) => {
      const t = e.target;
      if (!t) return;
      if (t.tagName === 'AUDIO' || t.tagName === 'VIDEO') {
        try { t.muted = true; t.volume = 0.0; t.pause(); } catch (err) {}
      }
    }, true);
  } catch (e) {}
})();
</script>

  <!-- === SOUL ORB (sphere_dome) — animated milky volumetric shader (GLSL1, Three.js/A-Frame compatible) === -->
  <script>
  (function () {
    if (!window.AFRAME) return;

    // Simple value noise / fbm helpers (fast enough for a single orb).
    // GLSL 1.0 compatible (no #version 300 es).
    AFRAME.registerShader('soulorb', {
      schema: {
        time:    {type: 'time', is: 'uniform'},
        seed:    {type: 'number', is: 'uniform', default: Math.random() * 1000.0},
        opacity: {type: 'number', is: 'uniform', default: 0.92},
        scale:   {type: 'number', is: 'uniform', default: 1.55},
        swirl:   {type: 'number', is: 'uniform', default: 0.85}
      },

      vertexShader: [
        'varying vec3 vPos;',
        'varying vec3 vN;',
        'varying vec2 vUv;',
        'void main(){',
        '  vUv = uv;',
        '  vN = normalize(normalMatrix * normal);',
        '  vec4 wp = modelMatrix * vec4(position, 1.0);',
        '  vPos = wp.xyz;',
        '  gl_Position = projectionMatrix * viewMatrix * wp;',
        '}'
      ].join('\n'),

      fragmentShader: [
        'precision highp float;',
        'uniform float time;',
        'uniform float seed;',
        'uniform float opacity;',
        'uniform float scale;',
        'uniform float swirl;',
        'varying vec3 vPos;',
        'varying vec3 vN;',
        'varying vec2 vUv;',

        'float hash(vec3 p){',
        '  p = fract(p * 0.3183099 + vec3(0.1,0.2,0.3));',
        '  p *= 17.0;',
        '  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));',
        '}',

        'float noise(vec3 p){',
        '  vec3 i = floor(p);',
        '  vec3 f = fract(p);',
        '  f = f*f*(3.0-2.0*f);',
        '  float n000 = hash(i + vec3(0.0,0.0,0.0));',
        '  float n100 = hash(i + vec3(1.0,0.0,0.0));',
        '  float n010 = hash(i + vec3(0.0,1.0,0.0));',
        '  float n110 = hash(i + vec3(1.0,1.0,0.0));',
        '  float n001 = hash(i + vec3(0.0,0.0,1.0));',
        '  float n101 = hash(i + vec3(1.0,0.0,1.0));',
        '  float n011 = hash(i + vec3(0.0,1.0,1.0));',
        '  float n111 = hash(i + vec3(1.0,1.0,1.0));',
        '  float nx00 = mix(n000, n100, f.x);',
        '  float nx10 = mix(n010, n110, f.x);',
        '  float nx01 = mix(n001, n101, f.x);',
        '  float nx11 = mix(n011, n111, f.x);',
        '  float nxy0 = mix(nx00, nx10, f.y);',
        '  float nxy1 = mix(nx01, nx11, f.y);',
        '  return mix(nxy0, nxy1, f.z);',
        '}',

        'float fbm(vec3 p){',
        '  float a = 0.5;',
        '  float f = 0.0;',
        '  for(int k=0;k<5;k++){',
        '    f += a * noise(p);',
        '    p *= 2.02;',
        '    a *= 0.5;',
        '  }',
        '  return f;',
        '}',

        'void main(){',
        '  // View direction (world).',
        '  vec3 V = normalize(cameraPosition - vPos);',
        '  float fres = pow(1.0 - max(dot(normalize(vN), V), 0.0), 2.4);',

        '  // Swirly domain warp in world space (keeps it "in the room", not UV-locked).',
        '  float t = time * 0.00022;',
        '  vec3 p = vPos * scale;',
        '  p += vec3(seed * 0.07, seed * 0.11, seed * 0.13);',
        '  vec3 w = vec3(',
        '    fbm(p + vec3(0.0, 0.0, t*3.0)),',
        '    fbm(p + vec3(t*2.2, 0.0, 0.0)),',
        '    fbm(p + vec3(0.0, t*1.7, 0.0))',
        '  );',
        '  p += (w - 0.5) * (1.35 * swirl);',

        '  // Milky volume impression: layered density + soft internal glow.',
        '  float d1 = fbm(p * 0.55 + vec3(0.0, t*2.5, 0.0));',
        '  float d2 = fbm(p * 1.10 + vec3(t*1.4, 0.0, t*1.9));',
        '  float d3 = fbm(p * 2.25 + vec3(0.0, t*3.2, t*0.8));',
        '  float density = (d1*0.55 + d2*0.35 + d3*0.20);',

        '  // Center softness: make core milky, edges slightly brighter.',
        '  float core = smoothstep(0.15, 0.85, density);',
        '  float rim = smoothstep(0.35, 0.95, density) * fres;',

        '  // Subtle "dance" pulses.',
        '  float pulse = 0.75 + 0.25 * sin((density*6.2831) + t*5.0);',

        '  vec3 base = vec3(0.78, 0.82, 0.88);',
        '  vec3 glow = vec3(0.92, 0.97, 1.00);',
        '  vec3 col = mix(base, glow, 0.55*core + 0.85*rim);',
        '  col *= (0.85 + 0.25 * core) * pulse;',

        '  // Opaque/milky: mostly solid with internal variance. Keep alpha high but not 1.0.',
        '  float a = opacity;',
        '  a *= (0.82 + 0.18 * core);',

        '  gl_FragColor = vec4(col, a);',
        '}'
      ].join('\n')
    });

    // Ensure we randomize seed per load for the orb(s).
    AFRAME.registerComponent('soulorb-seed', {
      schema: {min: {default: 0.0}, max: {default: 1000.0}},
      init: function () {
        const mat = this.el.getAttribute('material') || {};
        mat.shader = 'soulorb';
        // random seed each load
        mat.seed = this.data.min + Math.random() * (this.data.max - this.data.min);
        // set defaults for a milky volumetric read
        if (mat.opacity == null) mat.opacity = 1.0;
        if (mat.transparent == null) mat.transparent = false;
        if (mat.side == null) mat.side = 'double';
        this.el.setAttribute('material', mat);
      }
    });
  })();

<script>
(function(){
  if (!window.AFRAME || !window.THREE) return;

  // Sphere-dome-only: make the dome interior react properly and add animated caustic-like emissive bands.
  AFRAME.registerComponent('sphere-dome-caustics', {
    schema: {
      orb: {type: 'selector'},
      strength: {type: 'number', default: 0.45},
      scale: {type: 'number', default: 0.22},
      speed: {type: 'number', default: 0.12},
      maxDistance: {type: 'number', default: 14.0}
    },
    init: function () {
      this._mesh = null;
      this._compiled = false;
      this._shader = null;
      this._orbPos = new THREE.Vector3();
      this._domeParams = null;
      this._ensureMesh();
    },
    _ensureMesh: function () {
      const el = this.el;
      const tryGet = () => {
        const mesh = el.getObject3D('mesh');
        if (!mesh) { setTimeout(tryGet, 50); return; }
        this._mesh = mesh;
        this._apply();
      };
      tryGet();
    },
    _apply: function () {
      if (!this._mesh || this._compiled) return;

      const mesh = this._mesh;
      const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
      const cloned = mats.map(m => (m && m.isMaterial) ? m.clone() : m);

      // IMPORTANT: keep OUTER as normal front-facing; make INNER visible from inside; wall double.
      if (cloned[0] && cloned[0].isMaterial) cloned[0].side = THREE.FrontSide;
      if (cloned[1] && cloned[1].isMaterial) cloned[1].side = THREE.DoubleSide;
      if (cloned[2] && cloned[2].isMaterial) cloned[2].side = THREE.DoubleSide;

      // Ensure shell is a solid depth occluder (prevents "seeing the shell through the tunnel").
      for (let i = 0; i < cloned.length; i++) {
        const m = cloned[i];
        if (!m || !m.isMaterial) continue;
        m.transparent = false;
        m.opacity = 1.0;
        m.depthWrite = true;
        m.depthTest = true;
      }

      // Inject caustics only on the INNER material (fallback to first).
      const targetIndex = (cloned[1] && cloned[1].isMaterial) ? 1 : 0;
      const mat = cloned[targetIndex];

      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = { value: 0.0 };
        shader.uniforms.uOrbPos = { value: new THREE.Vector3(0,0,0) };
        shader.uniforms.uStrength = { value: this.data.strength };
        shader.uniforms.uScale = { value: this.data.scale };
        shader.uniforms.uSpeed = { value: this.data.speed };
        shader.uniforms.uMaxD = { value: this.data.maxDistance };
        shader.uniforms.uInside = { value: 0.0 };

        // world position varying
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vWorldPos;')
          .replace('#include <begin_vertex>',
                   '#include <begin_vertex>\nvec4 worldPosition = modelMatrix * vec4(position, 1.0);\nvWorldPos = worldPosition.xyz;');

        const inject = `
uniform float uTime;
uniform vec3  uOrbPos;
uniform float uStrength;
uniform float uScale;
uniform float uSpeed;
uniform float uMaxD;
uniform float uInside;
varying vec3 vWorldPos;

float hash21(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float noise2(vec2 p){
  vec2 i = floor(p);
  vec2 f = fract(p);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  vec2 u = f*f*(3.0-2.0*f);
  return mix(a, b, u.x) + (c - a)*u.y*(1.0 - u.x) + (d - b)*u.x*u.y;
}
float fbm(vec2 p){
  float v = 0.0;
  float a = 0.55;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for(int i=0;i<4;i++){
    v += a * noise2(p);
    p = m * p;
    a *= 0.55;
  }
  return v;
}
float causticField(vec2 p){
  float t = uTime * uSpeed;
  vec2 q = p + vec2(t*0.55, t*0.37);
  float w = fbm(q*1.2);
  q += 0.65 * vec2(cos(6.2831*w + t), sin(6.2831*w - t));
  float f = fbm(q*2.6);
  f = 1.0 - abs(2.0*f - 1.0);
  f = pow(max(f, 0.0), 3.2);
  float g = sin((p.x + p.y)*2.2 + t*1.1) * 0.5 + 0.5;
  g = pow(g, 2.5);
  return clamp(f * (0.65 + 0.55*g), 0.0, 1.0);
}
`;

        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\n' + inject)
          .replace('vec3 totalEmissiveRadiance = emissive;',
`vec3 totalEmissiveRadiance = emissive;
  // Caustics projected onto the dome interior (world xz relative to orb).
  float d = distance(vWorldPos, uOrbPos);
  float atten = smoothstep(uMaxD, 2.0, d);
  vec2 p = (vWorldPos.xz - uOrbPos.xz) * uScale;

  float c = causticField(p);

  vec3 warm = vec3(1.00, 0.92, 0.86);
  vec3 cool = vec3(0.30, 0.55, 1.00);
  float fringe = fbm(p*3.6 + uTime*0.03);
  vec3 caustCol = mix(warm, cool, fringe*0.35);

  totalEmissiveRadiance += caustCol * c * atten * uStrength * uInside;`
          );

        this._shader = shader;
      };

      mat.needsUpdate = true;
      mesh.material = cloned;
      this._materials = cloned;
      this._compiled = true;
    },
    tick: function (t) {
      if (!this._compiled) return;

      // Orb position
      const orbEl = this.data.orb;
      if (orbEl && orbEl.object3D) {
        orbEl.object3D.getWorldPosition(this._orbPos);
      }

      // Gate emissive to only when camera is inside this dome volume.
      let inside = 0.0;
      const sceneCam = this.el.sceneEl && this.el.sceneEl.camera;
      if (sceneCam) {
        const camPos = new THREE.Vector3();
        (sceneCam.el ? sceneCam.el.object3D : sceneCam).getWorldPosition(camPos);

        if (!this._domeParams) {
          const td = this.el.getAttribute('thick-dome-shell') || {};
          const r = Number(td.radius || 11.1);
          const s = td.innerScale || {x:1, y:1, z:1};
          this._domeParams = { r, sx: Number(s.x||s[0]||1), sy: Number(s.y||s[1]||1), sz: Number(s.z||s[2]||1) };
        }
        const lp = this.el.object3D.worldToLocal(camPos.clone());
        const p = this._domeParams;
        const nx = lp.x / (p.r * p.sx);
        const ny = lp.y / (p.r * p.sy);
        const nz = lp.z / (p.r * p.sz);
        const nlen = Math.sqrt(nx*nx + ny*ny + nz*nz);
        inside = (nlen < 0.98) ? 1.0 : 0.0;
      }

      if (this._shader && this._shader.uniforms) {
        this._shader.uniforms.uTime.value = t / 1000;
        this._shader.uniforms.uOrbPos.value.copy(this._orbPos);
        this._shader.uniforms.uStrength.value = this.data.strength;
        this._shader.uniforms.uScale.value = this.data.scale;
        this._shader.uniforms.uSpeed.value = this.data.speed;
        this._shader.uniforms.uMaxD.value = this.data.maxDistance;
        this._shader.uniforms.uInside.value = inside;
      }
    }
  });

  // Orb-local moving point lights (finite distance + decay to avoid affecting outside areas).
  AFRAME.registerComponent('orbital-pointlights', {
    schema: {
      radius: {type: 'number', default: 2.4},
      height: {type: 'number', default: 0.35},
      speed:  {type: 'number', default: 0.22},
      distance: {type: 'number', default: 12.5},
      decay: {type: 'number', default: 2.0},
      intensity: {type: 'number', default: 1.15},
      count: {type: 'int', default: 3}
    },
    init: function () {
      this.lights = [];
      const n = Math.max(2, Math.min(4, this.data.count));
      for (let i = 0; i < n; i++) {
        const e = document.createElement('a-entity');
        e.setAttribute('light', {
          type: 'point',
          color: '#ffffff',
          intensity: this.data.intensity,
          distance: this.data.distance,
          decay: this.data.decay
        });
        e.setAttribute('position', '0 0 0');
        this.el.appendChild(e);
        this.lights.push(e);
      }
    },
    tick: function (t) {
      const time = t / 1000;
      const n = this.lights.length;
      if (!n) return;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2.0 + time * this.data.speed;
        const wob = 0.25 * Math.sin(time * 0.9 + i * 1.7);
        const x = Math.cos(a) * (this.data.radius + wob);
        const z = Math.sin(a) * (this.data.radius + wob * 0.6);
        const y = this.data.height + 0.20 * Math.sin(time * 1.3 + i * 2.1);
        this.lights[i].object3D.position.set(x, y, z);
      }
    }
  });
})();
</script>

<script>
/* === Aya Dome spatial ambience (progressive fade to 0 at 40m) === */
AFRAME.registerComponent('aya-dome-audio', {
  schema: { maxDistance: { type: 'number', default: 40 } },
  init: function () {
    this._camEl = null;
    this._vCam = new THREE.Vector3();
    this._vSrc = new THREE.Vector3();

    const scene = this.el.sceneEl;

    const grabCam = () => {
      try { this._camEl = scene && scene.camera && scene.camera.el; } catch (e) {}
    };

    const resumeAudio = async () => {
      try {
        const ctx = (scene && scene.audioListener && scene.audioListener.context) ||
                    (AFRAME.audioContext ? AFRAME.audioContext : null);
        if (ctx && ctx.state === 'suspended') await ctx.resume();
      } catch (e) {}
    };

    this._tryPlay = async () => {
      if (window.__AYA_PRELOAD_MODE) return;
      await resumeAudio();
      const s = this.el.components && this.el.components.sound;
      if (!s) return;
      try {
        if (!s.isPlaying) s.playSound();
      } catch (e) {}
    };

    if (scene && scene.hasLoaded) grabCam();
    else if (scene) scene.addEventListener('loaded', grabCam, { once: true });

    // Try as soon as the sound is loaded, then fall back to user gesture (autoplay policies).
    this.el.addEventListener('sound-loaded', this._tryPlay);
    window.addEventListener('click', this._tryPlay, { passive: true });
    window.addEventListener('touchstart', this._tryPlay, { passive: true });
    window.addEventListener('keydown', this._tryPlay, { passive: true });
  },

  tick: function () {
    const s = this.el.components && this.el.components.sound;
    if (!s) return;

    const camEl = this._camEl || (this.el.sceneEl && this.el.sceneEl.camera && this.el.sceneEl.camera.el);
    if (!camEl || !camEl.object3D) return;

    camEl.object3D.getWorldPosition(this._vCam);
    this.el.object3D.getWorldPosition(this._vSrc);

    const d = this._vCam.distanceTo(this._vSrc);
    const md = Math.max(0.001, this.data.maxDistance);

    // Linear fade: 1.0 at 0m -> 0.0 at md (hard silent beyond).
    let v = 1.0 - (d / md);
    if (v < 0) v = 0;
    if (v > 1) v = 1;

    try { s.setVolume(v); } catch (e) {
      try { this.el.setAttribute('sound', 'volume', v); } catch (err) {}
    }
  },

  remove: function () {
    if (this._tryPlay) {
      this.el.removeEventListener('sound-loaded', this._tryPlay);
      window.removeEventListener('click', this._tryPlay);
      window.removeEventListener('touchstart', this._tryPlay);
      window.removeEventListener('keydown', this._tryPlay);
    }
  }
});
</script>

// ===== Mercurial torch kit (ported from dome_safe_01) =====
// Futuristic flame core (procedural additive planes + inner hotspot)
// Procedural moving gobo / cookie for torch spotlights (patterned, not just intensity pulsing).
// Simple IBL so metallic materials read as "silvery" instead of black (no external HDR needed).
AFRAME.registerComponent('simple-ibl', {
  schema: { intensity: { type: 'number', default: 1.25 }, color: { type: 'color', default: '#dfe6ef' } },
  init: function () {
    const sceneObj = this.el.sceneEl.object3D;

    const mkCanvas = () => {
      const cv = document.createElement('canvas'); cv.width = cv.height = 2;
      const ctx = cv.getContext('2d');
      // Slight gradient so reflections aren't totally flat.
      const g = ctx.createLinearGradient(0,0,2,2);
      g.addColorStop(0, this.data.color);
      g.addColorStop(1, '#aeb7c3');
      ctx.fillStyle = g; ctx.fillRect(0,0,2,2);
      return cv;
    };

    const cube = new THREE.CubeTexture([mkCanvas(), mkCanvas(), mkCanvas(), mkCanvas(), mkCanvas(), mkCanvas()]);
    cube.needsUpdate = true;
    sceneObj.environment = cube;

    const applyIntensity = () => {
      sceneObj.traverse(o => {
        if (!o || !o.isMesh) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => {
          if (m && m.isMeshStandardMaterial) {
            m.envMapIntensity = this.data.intensity;
            m.needsUpdate = true;
          }
        });
      });
    };

    // Apply now and whenever A-Frame attaches new meshes/materials.
    applyIntensity();
    this.el.sceneEl.addEventListener('object3dset', applyIntensity);
  }
});

AFRAME.registerComponent('tunnel-archify', {
  schema: {
    radius: { type: 'number', default: 2.7 },
    floor:  { type: 'number', default: 0.58 }, // fraction of radius used as "flat" floor depth (local +Z)
    squash: { type: 'number', default: 0.80 }, // vertical squash (local Z)
    wobble: { type: 'number', default: 0.14 }, // lateral irregularity
    freq:   { type: 'number', default: 0.55 },
    seed:   { type: 'number', default: 19 }
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);

  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },
  _apply: function () {
    const mesh = this.el.getObject3D('mesh');

    const g = mesh.geometry;
    const pos = g.attributes.position;

    const floorZ = d.radius * d.floor;  // local +Z is "down" after entity rotation

      // Flatten the floor smoothly (z > 0 is "down")

    if (typeof smoothNormalsByPosition === 'function') smoothNormalsByPosition(g, 1e-4);

      const DEG2RAD = Math.PI / 180;
      const EPS = 0.001;


      // Smooth normals across duplicated vertices (common in non-indexed geometries),
      // to avoid faceted "cracked plates" look after deformation.
      function smoothNormalsByPosition(geometry, tol = 1e-4) {
        if (!geometry || !geometry.attributes || !geometry.attributes.position) return;
        if (!geometry.attributes.normal) geometry.computeVertexNormals();

        const pos = geometry.attributes.position;
        const nor = geometry.attributes.normal;

        const map = new Map();
        const sums = [];
        const idxs = new Array(pos.count);

        const q = (v) => Math.round(v / tol);

        // First pass: bucket by quantized position and accumulate normals.
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
          const key = q(x) + ',' + q(y) + ',' + q(z);
          let entry = map.get(key);
          if (!entry) {
            entry = { id: sums.length };
            map.set(key, entry);
            sums.push(new THREE.Vector3(0,0,0));
          }
          idxs[i] = entry.id;
          sums[entry.id].x += nor.getX(i);
          sums[entry.id].y += nor.getY(i);
          sums[entry.id].z += nor.getZ(i);
        }

        // Normalize buckets.
        for (let i = 0; i < sums.length; i++) sums[i].normalize();

        // Second pass: write back smoothed normals.
        for (let i = 0; i < pos.count; i++) {

// ===== Portal rim naturalization (irregular / organic) =====
// Deforms a torus frame so the tunnel/dome junction doesn't read as a perfect engineered ring.
// Deterministic (seeded) and applied once per geometry instance.
AFRAME.registerComponent('organic-rim', {
  schema: {
    amp:  { type: 'number', default: 0.10 }, // meters (radial jitter amplitude)
    freq: { type: 'number', default: 7.0  }, // angular frequency
    seed: { type: 'int',    default: 83   }, // deterministic seed
    zAmp: { type: 'number', default: 0.03 }  // meters (tube wobble)
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },
  _apply: function () {
    const root = this.el.getObject3D('mesh');
    if (!root) return;

    const d = this.data;

    root.traverse(o => {
      if (!o || !o.isMesh || !o.geometry || !o.geometry.attributes || !o.geometry.attributes.position) return;

      const geom = o.geometry;
      if (geom.userData && geom.userData._organicRim) return;

      const g = geom.clone();
      const pos = g.attributes.position;

      // Estimate tube radius from Z extent (torus axis is Z in Three's TorusGeometry).
      g.computeBoundingBox();
      const bb = g.boundingBox;
      const zSpan = bb ? Math.max(1e-6, (bb.max.z - bb.min.z)) : 0.12;
      const tube = 0.5 * zSpan;

      const v2 = new THREE.Vector2();

      const s = d.seed * 0.173;
      const f = Math.max(0.1, d.freq);

      // Deterministic "noise" in [-1,1] based on angle
      const n1 = (a) => Math.sin(a * f + s);
      const n2 = (a) => Math.sin(a * f * 2.17 + s * 3.1);
      const n3 = (a) => Math.sin(a * f * 3.73 + s * 5.7);

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const z = pos.getZ(i);

        const r = Math.sqrt(x*x + y*y);
        if (r < 1e-6) continue;

        const ang = Math.atan2(y, x);

        // Weighted multi-sine
        let n = (n1(ang) + 0.5 * n2(ang) + 0.25 * n3(ang)) / 1.75;

        // Radial perturbation (break the perfect circle)
        const dr = d.amp * n;
        const nx = x / r, ny = y / r;
        let xx = x + nx * dr;
        let yy = y + ny * dr;

        // Tube wobble (kept subtle; weighted towards tube outer band)
        const zw = (tube > 1e-6) ? (1.0 - Math.min(1.0, Math.abs(z) / tube)) : 1.0;
        const dz = d.zAmp * zw * Math.sin(ang * f * 1.31 + s * 7.9) * (0.55 + 0.45 * Math.abs(n));

        pos.setXYZ(i, xx, yy, z + dz);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      if (typeof smoothNormalsByPosition === 'function') smoothNormalsByPosition(g, 1e-4);

      g.userData = g.userData || {};
      g.userData._organicRim = true;
      o.geometry = g;
    });
  }
});

// Deforms only the OUTER edge band of a ring, keeping the inner radius essentially intact.
// Useful for seam-hiding rings that must remain circular at the actual portal hole.
AFRAME.registerComponent('organic-ring-edge', {
  schema: {
    inner: { type: 'number', default: 1.25 },
    outer: { type: 'number', default: 1.33 },
    amp:   { type: 'number', default: 0.035 }, // meters (outer edge jitter)
    freq:  { type: 'number', default: 11.0  },
    seed:  { type: 'int',    default: 91    }
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },
  _apply: function () {
    const root = this.el.getObject3D('mesh');
    if (!root) return;

    const d = this.data;

    root.traverse(o => {
      if (!o || !o.isMesh || !o.geometry || !o.geometry.attributes || !o.geometry.attributes.position) return;

      const geom = o.geometry;
      if (geom.userData && geom.userData._organicRingEdge) return;

      const g = geom.clone();
      const pos = g.attributes.position;

      const inner = Math.max(1e-6, d.inner);
      const outer = Math.max(inner + 1e-6, d.outer);
      const span = outer - inner;

      const s = d.seed * 0.219;
      const f = Math.max(0.1, d.freq);

      const n1 = (a) => Math.sin(a * f + s);
      const n2 = (a) => Math.sin(a * f * 2.03 + s * 2.7);

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const z = pos.getZ(i);

        const r = Math.sqrt(x*x + y*y);
        if (r < 1e-6) continue;

        const ang = Math.atan2(y, x);

        // 0 at inner edge, 1 at outer edge
        const t = Math.max(0.0, Math.min(1.0, (r - inner) / span));
        // bias strongly towards the outer band
        const w = t * t;

        let n = (n1(ang) + 0.5 * n2(ang)) / 1.5;
        const dr = d.amp * n * w;

        const nx = x / r, ny = y / r;
        pos.setXYZ(i, x + nx * dr, y + ny * dr, z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      if (typeof smoothNormalsByPosition === 'function') smoothNormalsByPosition(g, 1e-4);

      g.userData = g.userData || {};
      g.userData._organicRingEdge = true;
      o.geometry = g;
    });
  }
});

// ===== Aya Dome: bake watertight solid shell from the existing inner/outer sheets =====


AFRAME.registerComponent('thick-dome-shell', {
  schema: {
    // Base sphere radius before scaling
    radius: {type: 'number', default: 12.0},

    // Ellipsoid scaling for inner and outer surfaces
    innerScale: {type: 'vec3', default: {x: 1.15, y: 0.68, z: 1.05}},
    outerScale: {type: 'vec3', default: {x: 1.19, y: 0.71, z: 1.09}},

    // Dome segment in DEGREES from the "top" (thetaStart is fixed at 0)
    thetaLength: {type: 'number', default: 132},

    // Segments
    widthSegments: {type: 'int', default: 56},
    heightSegments: {type: 'int', default: 40},

    // Textures (use <img> assets)
    diffuse: {type: 'selector'},
    normal:  {type: 'selector'},
    rough:   {type: 'selector'},
    ao:      {type: 'selector'},

    // Tiling
    repeat: {type: 'vec2', default: {x: 14, y: 10}},

    // Normal intensity (outer). Inner gets Y flipped automatically.
    normalScale: {type: 'vec2', default: {x: 0.95, y: 0.95}},

    // Optional subtle displacement to keep the cave feel even without the old bake system
    displaceAmp:  {type: 'number', default: 0.55},
    displaceFreq: {type: 'number', default: 1.20},
    macroAmp:     {type: 'number', default: 0.85},
    macroFreq:    {type: 'number', default: 0.28},
    seed:         {type: 'int', default: 41},
    octaves:      {type: 'int', default: 4},
    lacunarity:   {type: 'number', default: 2.05},
    gain:         {type: 'number', default: 0.52}
  },

  init: function () {
    this._mesh = null;
    this._build();
  },

  update: function () {
    this._build();
  },

  remove: function () {
    if (this._mesh) {
      this.el.object3D.remove(this._mesh);
      this._mesh.geometry && this._mesh.geometry.dispose();
      const mats = Array.isArray(this._mesh.material) ? this._mesh.material : [this._mesh.material];
      mats.forEach(m => m && m.dispose && m.dispose());
      this._mesh = null;
    }
  },

  _texFromImg: function (imgEl, kind) {
    if (!imgEl) return null;

    // Use the same image element, but apply proper Three.js color-management so
    // the dome matches A-Frame material textures (no "self-lit" / gamma mismatch).
    const tex = new THREE.Texture(imgEl);
    tex.needsUpdate = true;

    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 8;

    // Color space:
    // - BaseColor/Diffuse must be SRGB
    // - Normal/Roughness/AO are data textures (no color space)
    try {
      if (kind === 'color') {
        if ('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
        else if ('encoding' in tex) tex.encoding = THREE.sRGBEncoding;
      } else {
        if ('colorSpace' in tex) tex.colorSpace = THREE.NoColorSpace;
        else if ('encoding' in tex) tex.encoding = THREE.LinearEncoding;
      }
    } catch (e) {}

    return tex;
  },

  _hash3: function (x, y, z, seed) {
    // integer hash -> [0,1)
    let h = (x * 374761393 + y * 668265263 + z * 2147483647 + seed * 374761393) | 0;
    h = (h ^ (h >> 13)) | 0;
    h = (h * 1274126177) | 0;
    h = (h ^ (h >> 16)) | 0;
    return (h >>> 0) / 4294967296;
  },

  _valueNoise3: function (x, y, z, seed) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = x - xi, yf = y - yi, zf = z - zi;

    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const w = zf * zf * (3 - 2 * zf);

    const n000 = this._hash3(xi,     yi,     zi,     seed);
    const n100 = this._hash3(xi + 1, yi,     zi,     seed);
    const n010 = this._hash3(xi,     yi + 1, zi,     seed);
    const n110 = this._hash3(xi + 1, yi + 1, zi,     seed);
    const n001 = this._hash3(xi,     yi,     zi + 1, seed);
    const n101 = this._hash3(xi + 1, yi,     zi + 1, seed);
    const n011 = this._hash3(xi,     yi + 1, zi + 1, seed);
    const n111 = this._hash3(xi + 1, yi + 1, zi + 1, seed);

    const x00 = n000 + (n100 - n000) * u;
    const x10 = n010 + (n110 - n010) * u;
    const x01 = n001 + (n101 - n001) * u;
    const x11 = n011 + (n111 - n011) * u;

    const y0 = x00 + (x10 - x00) * v;
    const y1 = x01 + (x11 - x01) * v;

    return y0 + (y1 - y0) * w; // [0,1]
  },

  _fbm3: function (x, y, z, seed, oct, lac, gain) {
    let amp = 0.58;
    let sum = 0.0;
    let freq = 1.0;
    for (let i = 0; i < oct; i++) {
      sum += amp * (this._valueNoise3(x * freq, y * freq, z * freq, seed + i * 101) * 2 - 1);
      amp *= gain;
      freq *= lac;
    }
    return sum; // roughly [-1,1]
  },

  _displaceInPlace: function (geom, amp, freq, macroAmp, macroFreq, seed, oct, lac, gain) {
    const pos = geom.attributes.position;
    const normal = geom.attributes.normal;
    const v = new THREE.Vector3();
    const n = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      n.fromBufferAttribute(normal, i).normalize();

      const micro = this._fbm3(v.x * freq, v.y * freq, v.z * freq, seed, oct, lac, gain);
      const macro = this._fbm3(v.x * macroFreq, v.y * macroFreq, v.z * macroFreq, seed + 999, Math.max(2, Math.floor(oct/2)), lac, gain);
      const d = amp * micro + macroAmp * 0.35 * macro;

      v.addScaledVector(n, d);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    pos.needsUpdate = true;
  },

  _reverseWinding: function (geom) {
    if (!geom.index) return;
    const idx = geom.index.array;
    for (let i = 0; i < idx.length; i += 3) {
      const b = idx[i + 1];
      idx[i + 1] = idx[i + 2];
      idx[i + 2] = b;
    }
    geom.index.needsUpdate = true;
  },

  _build: function () {
    // Clean previous
    if (this._mesh) {
      this.el.object3D.remove(this._mesh);
      this._mesh.geometry && this._mesh.geometry.dispose();
      const mats = Array.isArray(this._mesh.material) ? this._mesh.material : [this._mesh.material];
      mats.forEach(m => m && m.dispose && m.dispose());
      this._mesh = null;
    }

    const d = this.data;

    const thetaLen = THREE.MathUtils.degToRad(d.thetaLength);

    // Build base dome geometry (unit radius) as a segment
    const outer = new THREE.SphereGeometry(1, d.widthSegments, d.heightSegments, 0, Math.PI * 2, 0, thetaLen);
    const inner = new THREE.SphereGeometry(1, d.widthSegments, d.heightSegments, 0, Math.PI * 2, 0, thetaLen);

    // Scale to ellipsoids (radius * scale)
    const outerScale = new THREE.Vector3(d.radius * d.outerScale.x, d.radius * d.outerScale.y, d.radius * d.outerScale.z);
    const innerScale = new THREE.Vector3(d.radius * d.innerScale.x, d.radius * d.innerScale.y, d.radius * d.innerScale.z);

    outer.applyMatrix4(new THREE.Matrix4().makeScale(outerScale.x, outerScale.y, outerScale.z));
    inner.applyMatrix4(new THREE.Matrix4().makeScale(innerScale.x, innerScale.y, innerScale.z));

    // Add uv2 for AO
    outer.setAttribute('uv2', new THREE.BufferAttribute(outer.attributes.uv.array.slice(), 2));
    inner.setAttribute('uv2', new THREE.BufferAttribute(inner.attributes.uv.array.slice(), 2));

    // Compute normals before displacement
    outer.computeVertexNormals();
    inner.computeVertexNormals();

    // Optional displacement to preserve the cave feel
    if (d.displaceAmp > 0.0001 || d.macroAmp > 0.0001) {
      this._displaceInPlace(outer, d.displaceAmp, d.displaceFreq, d.macroAmp, d.macroFreq, d.seed, d.octaves, d.lacunarity, d.gain);
      this._displaceInPlace(inner, d.displaceAmp * 0.88, d.displaceFreq, d.macroAmp * 0.90, d.macroFreq, d.seed + 17, d.octaves, d.lacunarity, d.gain);
      outer.computeVertexNormals();
      inner.computeVertexNormals();
    }

    // Reverse inner winding so normals point inward (toward the cavity)
    this._reverseWinding(inner);
    inner.computeVertexNormals();

    const outerPos = outer.attributes.position;
    const innerPos = inner.attributes.position;
    const outerNor = outer.attributes.normal;
    const innerNor = inner.attributes.normal;
    const outerUv  = outer.attributes.uv;
    const innerUv  = inner.attributes.uv;
    const outerUv2 = outer.attributes.uv2;
    const innerUv2 = inner.attributes.uv2;

    const outerCount = outerPos.count;
    const innerCount = innerPos.count;

    // Combined attributes
    const positions = new Float32Array((outerCount + innerCount + (d.widthSegments + 1) * 2) * 3);
    const normals   = new Float32Array(positions.length);
    const uvs       = new Float32Array((outerCount + innerCount + (d.widthSegments + 1) * 2) * 2);
    const uv2s      = new Float32Array(uvs.length);

    // Copy outer
    positions.set(outerPos.array, 0);
    normals.set(outerNor.array, 0);
    uvs.set(outerUv.array, 0);
    uv2s.set(outerUv2.array, 0);

    // Copy inner
    const o3 = outerCount * 3;
    const o2 = outerCount * 2;
    positions.set(innerPos.array, o3);
    normals.set(innerNor.array, o3);
    uvs.set(innerUv.array, o2);
    uv2s.set(innerUv2.array, o2);

    // Add ring vertices (duplicated) for cleaner wall UVs
    const ringBaseOuter = d.heightSegments * (d.widthSegments + 1);
    const ringBaseInner = ringBaseOuter; // same indexing layout

    const wallVertStart = outerCount + innerCount;
    for (let i = 0; i <= d.widthSegments; i++) {
      const oi = ringBaseOuter + i;
      const ii = ringBaseInner + i;

      // outer ring vertex
      positions.set([outerPos.getX(oi), outerPos.getY(oi), outerPos.getZ(oi)], (wallVertStart + i) * 3);
      // inner ring vertex
      positions.set([innerPos.getX(ii), innerPos.getY(ii), innerPos.getZ(ii)], (wallVertStart + (d.widthSegments + 1) + i) * 3);

      // temporary normals; will recompute later
      normals.set([0, -1, 0], (wallVertStart + i) * 3);
      normals.set([0, -1, 0], (wallVertStart + (d.widthSegments + 1) + i) * 3);

      // UVs around the rim
      const u = i / d.widthSegments;
      uvs.set([u, 0], (wallVertStart + i) * 2);
      uvs.set([u, 1], (wallVertStart + (d.widthSegments + 1) + i) * 2);
      uv2s.set([u, 0], (wallVertStart + i) * 2);
      uv2s.set([u, 1], (wallVertStart + (d.widthSegments + 1) + i) * 2);
    }

    // Indices
    const outerIdx = outer.index.array;
    const innerIdx = inner.index.array;

    // Wall uses (widthSegments) quads -> 2 tris each
    const wallTris = d.widthSegments * 2;
    const wallIdxCount = wallTris * 3;

    const index = new Uint32Array(outerIdx.length + innerIdx.length + wallIdxCount);

    // Outer indices (material 0)
    index.set(outerIdx, 0);
    const outerIndexStart = 0;
    const outerIndexCount = outerIdx.length;

    // Inner indices (material 1) with vertex offset
    const innerIndexStart = outerIdx.length;
    for (let i = 0; i < innerIdx.length; i++) index[innerIndexStart + i] = innerIdx[i] + outerCount;
    const innerIndexCount = innerIdx.length;

    // Wall indices (material 2)
    const wallIndexStart = innerIndexStart + innerIdx.length;
    let wptr = wallIndexStart;

    const outerRingStart = wallVertStart; // duplicated outer ring
    const innerRingStart = wallVertStart + (d.widthSegments + 1); // duplicated inner ring

    for (let i = 0; i < d.widthSegments; i++) {
      const a = outerRingStart + i;
      const b = outerRingStart + i + 1;
      const c = innerRingStart + i + 1;
      const d0 = innerRingStart + i;

      // Two triangles forming the thickness wall (winding outward)
      index[wptr++] = a; index[wptr++] = b; index[wptr++] = c;
      index[wptr++] = a; index[wptr++] = c; index[wptr++] = d0;
    }

    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    geom.setAttribute('uv2', new THREE.BufferAttribute(uv2s, 2));
    geom.setIndex(new THREE.BufferAttribute(index, 1));

    // Groups for multi-material
    geom.clearGroups();
    geom.addGroup(outerIndexStart, outerIndexCount, 0);
    geom.addGroup(innerIndexStart, innerIndexCount, 1);
    geom.addGroup(wallIndexStart, wallIdxCount, 2);

    geom.computeBoundingSphere();
    geom.computeVertexNormals();

    // Build materials
    const map = this._texFromImg(d.diffuse, 'color');
    const normalMap = this._texFromImg(d.normal, 'data');
    const roughMap = this._texFromImg(d.rough, 'data');
    const aoMap = this._texFromImg(d.ao, 'data');

    if (map) map.repeat.set(d.repeat.x, d.repeat.y);
    if (normalMap) normalMap.repeat.set(d.repeat.x, d.repeat.y);
    if (roughMap) roughMap.repeat.set(d.repeat.x, d.repeat.y);
    if (aoMap) aoMap.repeat.set(d.repeat.x, d.repeat.y);

    const outerMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: map || null,
      normalMap: normalMap || null,
      roughnessMap: roughMap || null,
      aoMap: aoMap || null,
      aoMapIntensity: 1.0,
      metalness: 0.0,
      roughness: 1.0,
      side: THREE.FrontSide
    });
    if (outerMat.normalMap) outerMat.normalScale.set(d.normalScale.x, d.normalScale.y);

    const innerMat = outerMat.clone();
    if (innerMat.normalMap) innerMat.normalScale.set(d.normalScale.x, -Math.abs(d.normalScale.y)); // flip Y for inside

    const wallMat = outerMat.clone();

    const mesh = new THREE.Mesh(geom, [outerMat, innerMat, wallMat]);
    mesh.castShadow = false;
    mesh.receiveShadow = true;

    this.el.setObject3D('mesh', mesh);
    this._mesh = mesh;

    // Let other systems/components know geometry exists
    this.el.emit('dome-shell-built', {mesh: mesh});
  }
});

AFRAME.registerComponent('cave-displace', {
  schema: {
    amp:   { type: 'number', default: 0.22 },  // displacement amplitude (meters)
    maxDown:    { type: 'number', default: 0.030 }, // meters (clamp for shallow depressions; prevents showing bottom)
    freq:  { type: 'number', default: 1.15 },  // base noise frequency
    seed:  { type: 'number', default: 13 },    // per-mesh seed
    oct:   { type: 'number', default: 4 },     // octaves
    lac:   { type: 'number', default: 2.0 },   // lacunarity
    gain:  { type: 'number', default: 0.52 },  // amplitude falloff per octave
    // optional extra "macro" shaping so the cave reads as large, soft bulges + small chisel detail
    macroFreq: { type: 'number', default: 0.42 },
    macroAmp:  { type: 'number', default: 0.65 }
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },

  // ---- Smooth value noise (trilinear interpolation) ----
  _hash11: function (n) {
    // deterministic pseudo-random in [0,1)
    const s = Math.sin(n) * 43758.5453123;
    return s - Math.floor(s);
  },
  _randLattice: function (ix, iy, iz, seed) {
    // lattice random in [-1,1]
    const n = ix * 127.1 + iy * 311.7 + iz * 74.7 + seed * 19.19;
    return this._hash11(n) * 2.0 - 1.0;
  },
  _fade: function (t) { return t * t * (3.0 - 2.0 * t); },
  _lerp: function (a, b, t) { return a + (b - a) * t; },
  _noise3: function (x, y, z, seed) {
    // value noise in [-1,1]
    const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
    const fx = x - ix, fy = y - iy, fz = z - iz;

    const u = this._fade(fx), v = this._fade(fy), w = this._fade(fz);

    const n000 = this._randLattice(ix,     iy,     iz,     seed);
    const n100 = this._randLattice(ix + 1, iy,     iz,     seed);
    const n010 = this._randLattice(ix,     iy + 1, iz,     seed);
    const n110 = this._randLattice(ix + 1, iy + 1, iz,     seed);

    const n001 = this._randLattice(ix,     iy,     iz + 1, seed);
    const n101 = this._randLattice(ix + 1, iy,     iz + 1, seed);
    const n011 = this._randLattice(ix,     iy + 1, iz + 1, seed);
    const n111 = this._randLattice(ix + 1, iy + 1, iz + 1, seed);

    const nx00 = this._lerp(n000, n100, u);
    const nx10 = this._lerp(n010, n110, u);
    const nx01 = this._lerp(n001, n101, u);
    const nx11 = this._lerp(n011, n111, u);

    const nxy0 = this._lerp(nx00, nx10, v);
    const nxy1 = this._lerp(nx01, nx11, v);

    return this._lerp(nxy0, nxy1, w);
  },
  _fbm: function (x, y, z, seed, oct, freq, lac, gain) {
    let a = 1.0, f = freq, sum = 0.0, norm = 0.0;
    for (let i = 0; i < oct; i++) {
      sum += a * this._noise3(x * f, y * f, z * f, seed + i * 101.7);
      norm += a;
      a *= gain;
      f *= lac;
    }
    return (norm > 0) ? (sum / norm) : 0;
  },

  _apply: function () {
    const obj = this.el.getObject3D('mesh');
    if (!obj) return;

    const meshes = [];
    obj.traverse(o => { if (o && o.isMesh && o.geometry) meshes.push(o); });
    if (!meshes.length) return;

    const d = this.data;

    for (let m = 0; m < meshes.length; m++) {
      const mesh = meshes[m];
      const geom = mesh.geometry;
      if (!geom || !geom.attributes || !geom.attributes.position) continue;

      // Avoid double-applying.
      if (geom.userData && geom.userData._caveDisplaced) continue;

      const g = geom.clone();
      const pos = g.attributes.position;

      if (!g.attributes.normal) g.computeVertexNormals();
      const normals = g.attributes.normal;

      const v = new THREE.Vector3();
      const nrm = new THREE.Vector3();

      // Two-layer noise: broad bulges (macro) + surface chiseling (micro)
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        nrm.fromBufferAttribute(normals, i);

        const macro = this._fbm(v.x, v.y, v.z, d.seed + 17.0, d.oct, d.macroFreq, d.lac, d.gain);
        const micro = this._fbm(v.x, v.y, v.z, d.seed,        d.oct, d.freq,      d.lac, d.gain);

        const w = (macro * d.macroAmp) + (micro * (1.0 - d.macroAmp));

        v.addScaledVector(nrm, w * d.amp);
        pos.setXYZ(i, v.x, v.y, v.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      smoothNormalsByPosition(g, 1e-4);
      g.userData = g.userData || {};
      g.userData._caveDisplaced = true;

      mesh.geometry = g;
    }
  }
});


// Shape a single "rectangular-ish" rock seat (tapered + slightly skewed), keeping it watertight/solid.
// Intended for rock_seat_01. Runs BEFORE cave-displace (vertex push) and keeps a flat-ish base.
AFRAME.registerComponent('rock-seat-shape', {
  schema: {
    endShrink:   { type: 'number', default: 0.14 }, // fraction (0..0.4) : small end width shrink
    endDrop:     { type: 'number', default: 0.16 }, // fraction (0..0.4) : small end height drop
    longSideCut: { type: 'number', default: 0.12 }, // meters: shorten one long side near the small end
    cutSide:     { type: 'string', default: 'posz' } , // 'posz' or 'negz'
    edgeBevel:  { type: 'number', default: 0.0 } // meters: chamfer amount (0..0.12)
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },
  _apply: function () {
    const root = this.el.getObject3D('mesh');
    if (!root) return;

    const d = this.data;
    const meshes = [];
    root.traverse(o => { if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) meshes.push(o); });
    if (!meshes.length) return;

    for (let m = 0; m < meshes.length; m++) {
      const mesh = meshes[m];
      const geom = mesh.geometry;
      if (geom.userData && geom.userData._rockSeatShaped) continue;

      const g = geom.clone();
      g.computeBoundingBox();
      const bb = g.boundingBox;
      if (!bb) continue;

      const minX = bb.min.x, maxX = bb.max.x;
      const minY = bb.min.y;
      const centerZ = (bb.min.z + bb.max.z) * 0.5;

      const maxY = bb.max.y;
      const minZ = bb.min.z, maxZ = bb.max.z;
      const centerX = (minX + maxX) * 0.5;
      const spanY = Math.max(1e-6, (maxY - minY));
      const spanZ = Math.max(1e-6, (maxZ - minZ));

      const spanX = Math.max(1e-6, (maxX - minX));

      const bevelMax = 0.25 * Math.min(spanX, spanY, spanZ);
      const bevel = Math.max(0, Math.min((d.edgeBevel || 0), bevelMax));
      const pos = g.attributes.position;

      const clamp01 = (v) => Math.max(0, Math.min(1, v));
      const shrink = clamp01(d.endShrink);
      const drop   = clamp01(d.endDrop);

      const v = new THREE.Vector3();

      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);

        // xNorm: 0 at "small end" (minX), 1 at "big end" (maxX)
        const xNorm = clamp01((v.x - minX) / spanX);

        // Width taper (Z): smaller at xNorm=0, full at xNorm=1.
        const wFactor = (1.0 - shrink) + (shrink * xNorm); // 1-shrink .. 1
        v.z = centerZ + (v.z - centerZ) * wFactor;

        // Height taper anchored to the bottom: top lowers at xNorm=0, bottom stays put.
        const hFactor = (1.0 - drop) + (drop * xNorm); // 1-drop .. 1
        v.y = minY + (v.y - minY) * hFactor;

        // Shorten one of the long sides (plan-view trapezoid feel).
        const isCutSide = (d.cutSide === 'negz') ? (v.z < centerZ) : (v.z > centerZ);
        if (isCutSide) {
          const cut = d.longSideCut * (1.0 - xNorm);
          v.x += cut; // pulls the small-end corner inward on this side only
        }

        // Slight chamfer to avoid razor-sharp box edges (keeps it rock-like but still angular)
        if (bevel > 1e-6) {
          const sx = (v.x >= centerX) ? 1 : -1;
          const sz = (v.z >= centerZ) ? 1 : -1;

          let dx = (sx > 0) ? (maxX - v.x) : (v.x - minX);
          let dz = (sz > 0) ? (maxZ - v.z) : (v.z - minZ);
          dx = Math.max(0, dx);
          dz = Math.max(0, dz);

          // XZ edge chamfer (vertical edges)
          if (dx < bevel && dz < bevel) {
            const t = (bevel - (dx + dz)) * 0.5;
            dx = Math.max(0, Math.min(bevel, dx + t));
            dz = Math.max(0, Math.min(bevel, dz + t));
            v.x = (sx > 0) ? (maxX - dx) : (minX + dx);
            v.z = (sz > 0) ? (maxZ - dz) : (minZ + dz);
          }

          // Top-edge chamfers only (keep the base solid/flat)
          let dy = maxY - v.y;
          if (dy < bevel) {
            dy = Math.max(0, dy);

            // Top corner (XYZ) chamfer
            if (dx < bevel && dz < bevel) {
              const t3 = (bevel - (dx + dz + dy)) / 3.0;
              dx = Math.max(0, Math.min(bevel, dx + t3));
              dz = Math.max(0, Math.min(bevel, dz + t3));
              dy = Math.max(0, Math.min(bevel, dy + t3));
              v.x = (sx > 0) ? (maxX - dx) : (minX + dx);
              v.z = (sz > 0) ? (maxZ - dz) : (minZ + dz);
              v.y = maxY - dy;
            } else {
              // XY chamfer
              if (dx < bevel) {
                const t = (bevel - (dx + dy)) * 0.5;
                dx = Math.max(0, Math.min(bevel, dx + t));
                dy = Math.max(0, Math.min(bevel, dy + t));
                v.x = (sx > 0) ? (maxX - dx) : (minX + dx);
                v.y = maxY - dy;
              }

              // ZY chamfer
              dy = maxY - v.y;
              if (dz < bevel && dy < bevel) {
                const t = (bevel - (dz + dy)) * 0.5;
                dz = Math.max(0, Math.min(bevel, dz + t));
                dy = Math.max(0, Math.min(bevel, dy + t));
                v.z = (sz > 0) ? (maxZ - dz) : (minZ + dz);
                v.y = maxY - dy;
              }
            }
          }
        }

        pos.setXYZ(i, v.x, v.y, v.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      smoothNormalsByPosition(g, 1e-4);
      g.userData = g.userData || {};
      g.userData._rockSeatShaped = true;

      mesh.geometry = g;
    }
  }
});


// Adds low-frequency asymmetry and tangential warping so domes/tunnels feel less perfectly geometric.

AFRAME.registerComponent('cave-warp', {

    freq:     { type: 'number', default: 0.18 },  // low frequency
