/* --- Extruded ring geometry (for raised pool shore) --- */
AFRAME.registerGeometry('extruded-ring', {
  schema: {
    radiusInner: { type: 'number', default: 1 },
    radiusOuter: { type: 'number', default: 2 },
    height:      { type: 'number', default: 0.10 },
    segments:    { type: 'int',    default: 96 }
  },
  init: function (data) {
    const shape = new THREE.Shape();
    shape.absarc(0, 0, data.radiusOuter, 0, Math.PI * 2, false);

    const hole = new THREE.Path();
    hole.absarc(0, 0, data.radiusInner, 0, Math.PI * 2, true);
    shape.holes.push(hole);

    const geo = new THREE.ExtrudeGeometry(shape, {
      depth: data.height,
      bevelEnabled: false,
      steps: 1,
      curveSegments: Math.max(12, data.segments | 0)
    });

    // ExtrudeGeometry extrudes along +Z; rotate so thickness becomes +Y and ring lies on XZ plane.
    geo.rotateX(-Math.PI / 2);

    // Keep bottom at y=0 (after rotation, the old +Z becomes +Y).
    // No translate needed because extrusion starts at z=0.

    geo.computeVertexNormals();
    this.geometry = geo;
  }
});


/* ============================================================
   Aya — Seat-triggered USER GUIDE + Autopilot sit + Video start
   - Step 1: within ~2m of a rock seat => show guide (E)
   - Step 2: after autopilot 'sit' => show guide (F)
   - F starts the video overlay on the mercury pool surface.
   ============================================================ */
AFRAME.registerComponent('aya-seat-experience', {
  schema: {
    triggerDist: { type: 'number', default: 2.5 },           // meters
    triggerHysteresis: { type: 'number', default: 0.25 },    // meters
    sitCamHeight: { type: 'number', default: 1.40 },
    autopilotDurationMs: { type: 'number', default: 950 },
    facePoolDotThreshold: { type: 'number', default: 0.93 }, // ~21° cone
    standUpDurationMs: { type: 'number', default: 500 }
  },

  init: function () {
    this.rig = document.querySelector('#rig');
    this.cam = document.querySelector('#playerCam');

    // Pool target (surface entity exists in the scene).
    this.mercurySurface = document.querySelector('#mercury_surface');

    // Fullscreen video overlay
    this.overlay = document.getElementById('ayaFullscreenOverlay');
    this.overlayVideo = document.getElementById('ayaFullscreenVideo');

    this.guide = document.getElementById('userGuide');
    this.guideBody = document.getElementById('userGuideBody');

    this.seats = [
      document.querySelector('#rock_seat_01'),
      document.querySelector('#rock_seat_02'),
      document.querySelector('#rock_seat_03'),
      document.querySelector('#rock_seat_04')
    ].filter(Boolean);

    this._poolWorld = new THREE.Vector3();
    this._rigWorld = new THREE.Vector3();
    this._seatWorld = new THREE.Vector3();

    this.state = {
      activeSeat: null,        // seat that triggered the guide
      step: 0,                 // 0 none, 1 near seat, 2 seated-ready, 3 playing
      autopilot: false,
      apStart: 0,
      apFrom: new THREE.Vector3(),
      apTo: new THREE.Vector3(),
      apYawFromRad: null,
      apYawToRad: null,
      neutralRigPos: null,
      neutralRigYaw: null,
      neutralCamY: null,
      seatedRigPos: null,
      returningToNeutral: false,
      lastSeatedGuideKey: '',
      standAnim: false,
      standStart: 0,
      standFromY: 0,
      standToY: 0,
      videoRigYaw: null,
      videoLookYaw: null,
      videoLookPitch: null,
      apLookYawFrom: null,
      apLookYawTo: null,
      apLookPitchFrom: null,
      apLookPitchTo: null
    };

    // Used to prevent spurious pointer-lock events (some browsers can toggle
    // pointer lock when look-controls is temporarily disabled/enabled).
    this._suppressPointerLockUntil = 0;

    // Cache "neutral" pose at load (DO NOT alter spawn — we only read it).
    const initNeutral = () => {
      if (!this.rig || !this.cam) return;
      const rp = this.rig.getAttribute('position') || { x: 0, y: 0, z: 0 };
      const rr = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
      const cp = this.cam.getAttribute('position') || { x: 0, y: 1.6, z: 0 };
      this.state.neutralRigPos = new THREE.Vector3(rp.x, rp.y, rp.z);
      this.state.neutralRigYaw = rr.y || 0;
      this.state.neutralCamY = cp.y;
    };
    // Run once after scene is ready-ish.
    setTimeout(initNeutral, 0);

    // Track pointer-lock state (ESC can release pointer lock before keydown is delivered).
    this._wasPointerLocked = !!document.pointerLockElement;

    // Key handling (E / F / ESC)
    this._onKeyDown = (e) => {
      if (e.repeat) return;

      const isE = (e.code === 'KeyE' || e.key === 'e' || e.key === 'E');
      const isF = (e.code === 'KeyF' || e.key === 'f' || e.key === 'F');
      const isEsc = (e.code === 'Escape' || e.key === 'Escape');

      // ESC: exit video, or stand up from seated (return to neutral).
      if (isEsc) {
        if (this.state.step === 3) {
          e.preventDefault();
          this._stopExperience(/*byEsc=*/true);
          return;
        }
        if (this.state.step === 2 && !this.state.autopilot) {
          e.preventDefault();
          this._standUpInPlace();
          return;
        }
      }

      // Step 1: E to sit (autopilot to the seat that triggered the guide)
      if (isE && this.state.step === 1 && !this.state.autopilot) {
        e.preventDefault();
        this._startAutopilotToSeat(this.state.activeSeat);
        return;
      }

      if (isF && this.state.step === 2 && !this.state.autopilot && !this.state.standAnim) {
        e.preventDefault();

      }

    window.addEventListener('keydown', this._onKeyDown, { passive: false });


// Make ESC work reliably even when pointer-lock consumes the keypress.
// When ESC releases pointer lock during the video, treat that as "exit video".
// When seated-ready, treat pointer-lock release as "stand up" (ESC).
this._onPointerLockChange = () => {

  if (performance.now() < this._suppressPointerLockUntil) {
    this._wasPointerLocked = !!document.pointerLockElement;
    return;
  }

  const nowLocked = !!document.pointerLockElement;
  const released = (this._wasPointerLocked && !nowLocked);
  this._wasPointerLocked = nowLocked;

  if (!released) return;

  // If ESC released pointer lock during the video, treat as an exit.
  if (this.state.step === 3) {
    this._stopExperience(/*byEsc=*/true);

  if (this.state.step === 2 && this.state.seatedRigPos) {

document.addEventListener('pointerlockchange', this._onPointerLockChange);

    // Video end handler (fade back + restore room control)
    if (this.overlayVideo) {

    }

    this._hideGuide();
    this._hideOverlay(true);
  },

  remove: function () {

      this.overlayVideo.pause();
      this.overlayVideo.currentTime = 0;
    }
  },

  tick: function () {
    if (!this.rig || !this.cam || this.seats.length === 0) return;

    // Update pool world position.
    if (this.mercurySurface) {
      this.mercurySurface.object3D.getWorldPosition(this._poolWorld);
      this._poolWorld.y += 0.01; // tiny lift so lookAt hits the surface cleanly
    } else {
      this._poolWorld.set(0, 0.045, 38.7);

    if (this.state.standAnim) {
      const u = Math.min(1, (performance.now() - this.state.standStart) / this.data.standUpDurationMs);
      const s = u * u * (3 - 2 * u); // smoothstep
      const camPos = this.cam.getAttribute('position') || { x: 0, y: 1.6, z: 0 };
      const y = (this.state.standFromY + (this.state.standToY - this.state.standFromY) * s);
      this.cam.setAttribute('position', `${camPos.x} ${y.toFixed(3)} ${camPos.z}`);

      if (u >= 1) {
        this.state.standAnim = false;
        this._setWalkEnabled(true);
        // Re-enter proximity mode; guide will be shown if still in range.
        this.state.step = 0;
      }
      // Continue; proximity check below will decide guide visibility this frame.
    }

    // Autopilot movement (either to seat or back to neutral)
    if (this.state.autopilot) {
      const u = Math.min(1, (performance.now() - this.state.apStart) / this.data.autopilotDurationMs);
      const s = u * u * (3 - 2 * u); // smoothstep
      this.rig.object3D.position.lerpVectors(this.state.apFrom, this.state.apTo, s);

      // Autopilot yaw interpolation (rotate the RIG), preserving the user's current head/camera offset.
      if (this.state.apYawFromRad != null && this.state.apYawToRad != null) {
        const norm = (a) => {
          let x = a;
          while (x <= -Math.PI) x += Math.PI * 2;
          while (x > Math.PI) x -= Math.PI * 2;
          return x;
        };
        const lerpAngle = (a, b, t) => a + norm(b - a) * t;

        const yawRad = lerpAngle(this.state.apYawFromRad, this.state.apYawToRad, s);
        const yawDeg = yawRad * 180 / Math.PI;

        const r = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
        this.rig.setAttribute('rotation', `${r.x} ${yawDeg.toFixed(3)} ${r.z}`);
      }

      // Autopilot look-controls interpolation (rotate the VIEW smoothly).
      // During autopilot we continuously write the yaw/pitch objects so user input can't fight the motion,
      // but we keep look-controls enabled (disabling it can cause resets/pointer-lock churn).
      if (this.state.apLookYawFrom != null && this.state.apLookYawTo != null) {
        const norm = (a) => {
          let x = a;
          while (x <= -Math.PI) x += Math.PI * 2;
          while (x > Math.PI) x -= Math.PI * 2;
          return x;
        };
        const lerpAngle = (a, b, t) => a + norm(b - a) * t;

        const lc = this.cam.components && this.cam.components['look-controls'];
        if (lc) {
          try {
            const ly = lerpAngle(this.state.apLookYawFrom, this.state.apLookYawTo, s);
            const lp = (this.state.apLookPitchFrom != null && this.state.apLookPitchTo != null)
              ? (this.state.apLookPitchFrom + (this.state.apLookPitchTo - this.state.apLookPitchFrom) * s)
              : (lc.pitchObject.rotation.x || 0);

            lc.yawObject.rotation.y = norm(ly);
            lc.pitchObject.rotation.x = lp;
          } catch (err) {}
        }

      if (u >= 1) {
        this.state.autopilot = false;

        if (this.state.returningToNeutral) {
          this.state.returningToNeutral = false;
          this._finishReturnToNeutral();
        } else {
          this._finishSitPose();
        }
      }
      return;
    }

    // While video is playing, we don't update proximity/guide.
    if (this.state.step === 3) return;

    // While seated-ready, keep the user in the seated pose until they press ESC.
    // (No auto-stand due to tiny physics/controller drift.)
    if (this.state.step === 2) {
      this._updateSeatedGuide(false);
      return;
    }

    // Proximity check to seats (Step 0/1)
    this.rig.object3D.getWorldPosition(this._rigWorld);

    let bestSeat = null;
    let bestDist = Infinity;

    for (let i = 0; i < this.seats.length; i++) {
      const seat = this.seats[i];
      if (!seat) continue;
      seat.object3D.getWorldPosition(this._seatWorld);
      const d = this._seatWorld.distanceTo(this._rigWorld);
      if (d < bestDist) { bestDist = d; bestSeat = seat; }
    }

    const onDist = this.data.triggerDist;
    const offDist = this.data.triggerDist + this.data.triggerHysteresis;

    if (bestSeat && bestDist <= onDist) {
      if (this.state.step !== 1 || this.state.activeSeat !== bestSeat) {
        this.state.step = 1;
        this.state.activeSeat = bestSeat;
        this._showGuide(
          'You can sit down and try the mercury pool experience.<br>' +
          'Press <span class="kbd">E</span> to sit (autopilot).'
        );
      }
    } else if (this.state.step === 1 && bestDist > offDist) {
      this.state.step = 0;
      this.state.activeSeat = null;
      this._hideGuide();
    }
  },

  _setWalkEnabled: function (enabled) {
    if (!this.rig) return;
    const rigWalk = this.rig.components && this.rig.components['rig-walk'];
    if (!rigWalk) return;
    if (enabled) {
      if (rigWalk.play) rigWalk.play();
      if (rigWalk.resume) rigWalk.resume();
    } else {
      if (rigWalk.pause) rigWalk.pause();
      if (rigWalk.stop) rigWalk.stop();
    }
  },

    _isFacingPool: function () {
    if (!this.cam) return false;

    // Direction from camera position to pool (XZ only).
    const camWorld = new THREE.Vector3();
    this.cam.object3D.getWorldPosition(camWorld);
    const toPool = new THREE.Vector3().subVectors(this._poolWorld, camWorld);
    toPool.y = 0;
    if (toPool.length() < 1e-6) return true;
    toPool.normalize();

    // IMPORTANT:
    // In A-Frame, `this.cam.object3D` is typically the look-controls yawObject (not the Three.js Camera).
    // Object3D.getWorldDirection() returns +Z forward, which is opposite of the camera view direction.
    // So we use the actual Three.js Camera when available.
    const threeCam =
      (this.cam.getObject3D && this.cam.getObject3D('camera')) ||
      (this.el && this.el.sceneEl && this.el.sceneEl.camera) ||
      null;

    const fwd = new THREE.Vector3();
    if (threeCam && threeCam.getWorldDirection) {
      threeCam.getWorldDirection(fwd); // Camera override returns true view direction.
    } else {
      // Fallback: use -Z as "view forward" from the camera entity.
      fwd.set(0, 0, -1).applyQuaternion(this.cam.object3D.getWorldQuaternion(new THREE.Quaternion()));
    }

    fwd.y = 0;
    if (fwd.length() < 1e-6) return false;
    fwd.normalize();

    return fwd.dot(toPool) >= this.data.facePoolDotThreshold;
  },

  _updateSeatedGuide: function (force) {
    if (!this.guide || !this.guideBody) return;
    if (this.state.step !== 2) return;

    const facing = this._isFacingPool();
    const key = facing ? 'FACE_OK' : 'FACE_BAD';
    if (!force && this.state.lastSeatedGuideKey === key) return;
    this.state.lastSeatedGuideKey = key;

    if (facing) {
      this._showGuide(
        'Seated.<br>' +
        'Press <span class="kbd">F</span> to begin.<br>' +
        'Press <span class="kbd">ESC</span> to stand up.'
      );
    } else {
      this._showGuide(
        'Seated.<br>' +
        'Turn toward the mercury pool to enable <span class="kbd">F</span>.<br>' +
        'Press <span class="kbd">ESC</span> to stand up.'
      );
    }
  },

  _computeYawToPoolDeg: function () {
// Compute yaw so that the rig/camera faces the pool.
// Robust against 180° flips by evaluating both candidate yaws and choosing the one that
// actually points the camera forward vector (-Z) toward the pool direction.
this.rig.object3D.getWorldPosition(this._rigWorld);
const dx = this._poolWorld.x - this._rigWorld.x;
const dz = this._poolWorld.z - this._rigWorld.z;

// If we're basically on top of the target, keep current yaw.
if (Math.abs(dx) < 1e-6 && Math.abs(dz) < 1e-6) {
  const rr = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
  return rr.y || 0;
}

const dir = new THREE.Vector3(dx, 0, dz);
const len = dir.length();
if (len > 1e-6) dir.multiplyScalar(1 / len);

// Base yaw candidate (common A-Frame convention: forward = -Z).
const base = Math.atan2(dx, -dz);
const alt  = base + Math.PI;

const fwd = new THREE.Vector3(0, 0, -1);
const yAxis = new THREE.Vector3(0, 1, 0);

const dotFor = (yawRad) => {
  const v = fwd.clone().applyAxisAngle(yAxis, yawRad);
  return v.dot(dir);
};

const chosen = (dotFor(alt) > dotFor(base)) ? alt : base;
return chosen * 180 / Math.PI;
  },

  _startAutopilotToSeat: function (seatEl) {
    if (!seatEl || !this.rig || !this.cam) return;

    this._setWalkEnabled(false);

    // Use world positions but apply to rig local (rig is root-level, so ok).
    this.rig.object3D.getWorldPosition(this._rigWorld);
    seatEl.object3D.getWorldPosition(this._seatWorld);

    // Target: seat position in XZ, keep rig's current Y.
    const to = new THREE.Vector3(this._seatWorld.x, this.rig.object3D.position.y, this._seatWorld.z);

    // Small bias toward the pool so you "sit" looking into the basin, not behind the seat.
    const dirToPool = new THREE.Vector3().subVectors(this._poolWorld, this._seatWorld);
    dirToPool.y = 0;
    const len = dirToPool.length();
    if (len > 0.0001) {
      dirToPool.multiplyScalar(1 / len);
      to.addScaledVector(dirToPool, 0.10);
    }


    // ---- Yaw planning ----
    // We want the seated *view* (camera world direction) to end up facing the pool,
    // and we want to get there smoothly (no snap) from the user's current pose.
    //
    // Key detail: "where I'm looking" is rig yaw + look-controls yaw. So during autopilot
    // we animate BOTH:
    //   - rig yaw -> yaw that faces the pool (forward = -Z)
    //   - look-controls yaw -> 0 (so head aligns with body at the end)
    //
    // While autopilot runs, we continuously write yawObject/pitchObject so user input can't
    // fight the animation, but without disabling look-controls (which can cause resets).
    if (this.mercurySurface) {
      this.mercurySurface.object3D.getWorldPosition(this._poolWorld);
      this._poolWorld.y += 0.01;
    } else {
      this._poolWorld.set(0, 0.045, 38.7);
    }

    const norm = (a) => {
      let x = a;
      while (x <= -Math.PI) x += Math.PI * 2;
      while (x > Math.PI) x -= Math.PI * 2;
      return x;
    };

    // Desired rig yaw at the FINAL seated position, so that the actual VIEW forward (-Z)
    // points toward the pool in world space.
    //
    // IMPORTANT: For a forward vector of (0,0,-1), the yaw that aims at a world-space
    // direction dir=(dx,0,dz) is atan2(-dx, -dz). A sign mistake here produces a clean
    // 180° opposite facing.
    let desiredRigYawRad = 0;
    {
      const dir = new THREE.Vector3().subVectors(this._poolWorld, to);
      dir.y = 0;
      if (dir.length() > 1e-6) {
        dir.normalize();

        const base = Math.atan2(-dir.x, -dir.z); // forward = -Z (true view direction)
        const alt  = base + Math.PI;

        // Choose the candidate that actually aligns the forward vector with the pool direction.
        const fwd = new THREE.Vector3(0, 0, -1);
        const yAxis = new THREE.Vector3(0, 1, 0);
        const dotFor = (yawRad) => fwd.clone().applyAxisAngle(yAxis, yawRad).dot(dir);
        desiredRigYawRad = (dotFor(alt) > dotFor(base)) ? alt : base;
      } else {
        const rr = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
        desiredRigYawRad = (rr.y || 0) * Math.PI / 180;
      }
    }

    const r0 = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
    const rigYawRad = (r0.y || 0) * Math.PI / 180;

    // Current look-controls yaw/pitch (head).
    const lc = this.cam.components && this.cam.components['look-controls'];
    let lookYawFrom = 0;
    let lookPitchFrom = 0;
    if (lc) {
      try {
        lookYawFrom = lc.yawObject.rotation.y;
        lookPitchFrom = lc.pitchObject.rotation.x;
      } catch (err) {}
    }

    // Target head orientation during seating: align yaw to the rig (yaw=0), keep pitch as-is.
    const lookYawTo = 0;
    const lookPitchTo = lookPitchFrom;

    this.state.apYawFromRad = rigYawRad;
    this.state.apYawToRad = norm(desiredRigYawRad);

    this.state.apLookYawFrom = norm(lookYawFrom);
    this.state.apLookYawTo = norm(lookYawTo);
    this.state.apLookPitchFrom = lookPitchFrom;
    this.state.apLookPitchTo = lookPitchTo;


    this.state.apFrom.copy(this.rig.object3D.position);
    this.state.apTo.copy(to);
    this.state.apStart = performance.now();
    this.state.autopilot = true;
    this.state.returningToNeutral = false;

    this._showGuide('Autopilot engaged…<br>Bringing you to the seat.');
  },

  _finishSitPose: function () {
    if (!this.cam || !this.rig) return;

    // Store seated rig position.
    this.state.seatedRigPos = this.rig.object3D.position.clone();

    // Lock seated POV height.
    const camPos = this.cam.getAttribute('position') || { x: 0, y: 1.6, z: 0 };
    this.cam.setAttribute('position', `${camPos.x} ${this.data.sitCamHeight.toFixed(3)} ${camPos.z}`);

    // Ensure autopilot lands on the planned rig yaw (so the VIEW is facing the pool).
    if (this.state.apYawToRad != null) {
      const r = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
      const yawDeg = (this.state.apYawToRad * 180 / Math.PI);
      this.rig.setAttribute('rotation', `${r.x} ${yawDeg.toFixed(3)} ${r.z}`);
    }
    this.state.apYawFromRad = null;
    this.state.apYawToRad = null;

    // Snap the final seated view precisely (should already be there, but we set it explicitly for determinism).
    const lc = this.cam.components && this.cam.components['look-controls'];
    if (lc) {
      try {
        if (this.state.apLookYawTo != null) lc.yawObject.rotation.y = this.state.apLookYawTo;
        if (this.state.apLookPitchTo != null) lc.pitchObject.rotation.x = this.state.apLookPitchTo;
      } catch (err) {}
    }
    this.state.apLookYawFrom = null;
    this.state.apLookYawTo = null;
    this.state.apLookPitchFrom = null;
    this.state.apLookPitchTo = null;

    // Keep movement disabled while seated.
    this._setWalkEnabled(false);

    this.state.step = 2;
    this.state.lastSeatedGuideKey = '';
    this._updateSeatedGuide(true);
  },

  _restoreNormalPOV: function () {
    if (!this.cam || !this.rig) return;

    // Restore camera height to the original "neutral" POV.
    const camPos = this.cam.getAttribute('position') || { x: 0, y: 1.6, z: 0 };
    const y = (this.state.neutralCamY != null) ? this.state.neutralCamY : 1.6;
    this.cam.setAttribute('position', `${camPos.x} ${y.toFixed(3)} ${camPos.z}`);

    // Clear seated marker
    this.state.seatedRigPos = null;
  },

    _standUpInPlace: function () {
    if (!this.rig || !this.cam) return;

    // If we're not seated, ignore.
    if (this.state.step !== 2) return;

    // Stop any overlay/video if somehow active (safety).
    if (this.state.step === 3) return;

    // Restore POV height smoothly, without moving the rig or resetting yaw.
    this._setWalkEnabled(false);

    const camPos = this.cam.getAttribute('position') || { x: 0, y: 1.6, z: 0 };
    const fromY = camPos.y;
    const toY = (this.state.neutralCamY != null) ? this.state.neutralCamY : 1.6;

    this.state.standAnim = true;
    this.state.standStart = performance.now();
    this.state.standFromY = fromY;
    this.state.standToY = toY;

    // Clear seated marker (we're standing up).
    this.state.seatedRigPos = null;

    // While standing, show a brief message; proximity guide will reappear immediately after.
    this._showGuide('Standing up…');
  },

  _finishReturnToNeutral: function () {
    // Restore neutral yaw + normal POV and unlock movement.
    this._restoreNormalPOV();

    if (this.state.neutralRigYaw != null) {
      const rr = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
      this.rig.setAttribute('rotation', `${rr.x} ${Number(this.state.neutralRigYaw).toFixed(3)} ${rr.z}`);
    }

    this._setWalkEnabled(true);

    // After returning, recompute guide state next tick (hide now, it'll reappear if still in range).
    this.state.step = 0;
    this.state.activeSeat = null;
    this._hideGuide();
  },

  _startExperience: function () {
    if (this.state.step !== 2) return;

    // Disable movement while video is playing.
    this._setWalkEnabled(false);

    // Snapshot current orientation so we can restore it exactly after playback/ESC.
    const rr = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
    this.state.videoRigYaw = rr.y || 0;
    const lc = this.cam.components && this.cam.components['look-controls'];
    if (lc) {
      try {
        this.state.videoLookYaw = lc.yawObject.rotation.y;
        this.state.videoLookPitch = lc.pitchObject.rotation.x;
      } catch (err) {}
      // Freeze look during video to guarantee yaw doesn't drift.
      this.cam.setAttribute('look-controls', 'enabled: false');
      this._suppressPointerLockUntil = performance.now() + 700;
    }

    this.state.step = 3;
    this._hideGuide();

    this._showOverlay();

    if (this.overlayVideo) {
      try {
        this.overlayVideo.currentTime = 0;
        const p = this.overlayVideo.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      } catch (err) {}
    }
  },

  _stopExperience: function (byEsc) {
    if (this.state.step !== 3) return;

    // Stop playback
    if (this.overlayVideo) {
      try { this.overlayVideo.pause(); } catch (err) {}
      // If exited by ESC, reset to start; if ended naturally, keep at end.
      if (byEsc) {
        try { this.overlayVideo.currentTime = 0; } catch (err) {}
      }
    }

    // Fade out, then restore room.
    this._hideOverlay(false, () => {
      // Keep movement disabled (we return to the seated-ready state).
      this._setWalkEnabled(false);
      // Ensure keyboard input routes back to the scene (ESC shouldn't require a second press).
      try { if (this.overlayVideo) this.overlayVideo.blur(); } catch (err) {}
      try {
        const canvas = (this.el && this.el.sceneEl && this.el.sceneEl.canvas) ? this.el.sceneEl.canvas : null;
        if (canvas && canvas.focus) canvas.focus();
        else if (document && document.body && document.body.focus) document.body.focus();
      } catch (err) {}

      // Restore orientation exactly as it was when the video started.
      if (this.rig) {
        const rr = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
        if (this.state.videoRigYaw != null) {
          this.rig.setAttribute('rotation', `${rr.x} ${Number(this.state.videoRigYaw).toFixed(3)} ${rr.z}`);
        }
      }
      const lc = this.cam && this.cam.components && this.cam.components['look-controls'];
      if (lc) {
        // Re-enable look controls, then restore yaw/pitch on the next tick to avoid re-init resets.
        this.cam.setAttribute('look-controls', 'enabled: true');
        this._suppressPointerLockUntil = performance.now() + 700;

        setTimeout(() => {
          const lc2 = this.cam && this.cam.components && this.cam.components['look-controls'];
          if (!lc2) return;
          try {
            if (this.state.videoLookYaw != null) lc2.yawObject.rotation.y = this.state.videoLookYaw;
            if (this.state.videoLookPitch != null) lc2.pitchObject.rotation.x = this.state.videoLookPitch;
          } catch (err) {}
        }, 0);
      }

      this.state.step = 2;
      this.state.lastSeatedGuideKey = '';
      this._updateSeatedGuide(true);
});
  },

  _showOverlay: function () {
    if (!this.overlay) return;
    this.overlay.classList.add('visible');
  },

  _hideOverlay: function (immediate, cb) {
    if (!this.overlay) { if (cb) cb(); return; }
    if (immediate) {
      this.overlay.classList.remove('visible');
      if (cb) cb();
      return;
    }
    this.overlay.classList.remove('visible');
    // Match CSS transition duration (keep in sync with CSS).
    setTimeout(() => { if (cb) cb(); }, 260);
  },

  _showGuide: function (html) {
    if (!this.guide || !this.guideBody) return;
    this.guideBody.innerHTML = html;
    this.guide.classList.add('visible');
  },

  _hideGuide: function () {
    if (!this.guide) return;
    this.guide.classList.remove('visible');
  }
});

<script>
/* ==== Imported glue + components (perfect merge) ==== */
(function () {

    schema: {
      from: { type: 'selector' },
      to: { type: 'selector' },
      positionOnly: { type: 'boolean', default: true },
      epsilon: { type: 'number', default: 0.002 }
    },

    (function () {

      function hash2(x, y, seed){

AFRAME.registerComponent('realism-postfx', {
  init: function () {
    const sceneEl = this.el;
    this._ready = false;

    const setup = () => {
      if (this._ready) return;
      const renderer = sceneEl.renderer;
      const scene = sceneEl.object3D;
      const camera = sceneEl.camera;
      if (!renderer || !scene || !camera || !THREE.EffectComposer) return;

      // Tone mapping for more filmic response.
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = renderer.toneMappingExposure || 0.90;

      const size = renderer.getSize(new THREE.Vector2());
      const w = size.x, h = size.y;

      const composer = new THREE.EffectComposer(renderer);
      composer.setSize(w, h);

      const renderPass = new THREE.RenderPass(scene, camera);
      composer.addPass(renderPass);

      // SSAO (subtle)
      const ssao = new THREE.SSAOPass(scene, camera, Math.floor(w * 0.5), Math.floor(h * 0.5));
      ssao.kernelRadius = 8;
      ssao.minDistance = 0.005;
      ssao.maxDistance = 0.12;
      ssao.enabled = true;
      composer.addPass(ssao);

      // Bloom: high threshold so it mostly affects torch/emissives.
      const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(w, h), 0.55, 0.25, 1.05);
      bloom.threshold = 1.05;
      bloom.strength = 0.55;
      bloom.radius = 0.22;
      composer.addPass(bloom);

      this.composer = composer;

      // Replace renderer system render with composer render (keeps A-Frame updates, but uses FX output).
      const rs = sceneEl.systems && sceneEl.systems.renderer;
      if (rs && rs.render) {
        this._origRender = rs.render.bind(rs);
        rs.render = () => {
          try { composer.render(); } catch (e) { this._origRender(); }
        };
      }

      window.addEventListener('resize', () => {
        if (!this.composer) return;
        const s = renderer.getSize(new THREE.Vector2());
        this.composer.setSize(s.x, s.y);
      });

      this._ready = true;
    };

    sceneEl.addEventListener('render-target-loaded', setup);
    sceneEl.addEventListener('loaded', setup);
    setTimeout(setup, 0);
  },
  remove: function () {
    const sceneEl = this.el;
    const rs = sceneEl.systems && sceneEl.systems.renderer;
    if (rs && this._origRender) rs.render = this._origRender;
    try { if (this.composer) this.composer.dispose(); } catch (e) {}
  }
});


AFRAME.registerComponent('env-hdri', {
      schema: { src: {type: 'string'}, background: {type: 'boolean', default: false} },
      init: function () {
        this._onLoaded = this._onLoaded.bind(this);
        if (this.el.hasLoaded) this._onLoaded();
        else this.el.addEventListener('loaded', this._onLoaded, {once: true});
      },
      _onLoaded: function () {
        const sceneEl = this.el;
        const renderer = sceneEl.renderer;
        if (!renderer || !THREE || !THREE.RGBELoader) return;
        const pmrem = new THREE.PMREMGenerator(renderer);
        pmrem.compileEquirectangularShader();

        const loader = new THREE.RGBELoader();
        loader.setDataType(THREE.UnsignedByteType);
        loader.setCrossOrigin('anonymous');

        const url = this.data.src;
        loader.load(url, (hdrTexture) => {
          const envMap = pmrem.fromEquirectangular(hdrTexture).texture;
          sceneEl.object3D.environment = envMap;
          if (this.data.background) sceneEl.object3D.background = envMap;
          hdrTexture.dispose();
          pmrem.dispose();
        }, undefined, (err) => {
          console.warn('[env-hdri] failed to load HDR:', url, err);
          pmrem.dispose();
        });
      }
    });

AFRAME.registerComponent('cave-displace', {
  schema: {
    amp:   { type: 'number', default: 0.22 },  // displacement amplitude (meters)
    freq:  { type: 'number', default: 1.15 },  // base noise frequency
    seed:  { type: 'number', default: 13 },    // per-mesh seed
    oct:   { type: 'number', default: 4 },     // octaves
    lac:   { type: 'number', default: 2.0 },   // lacunarity
    gain:  { type: 'number', default: 0.52 },  // amplitude falloff per octave
    // optional extra "macro" shaping so the cave reads as large, soft bulges + small chisel detail
    macroFreq: { type: 'number', default: 0.42 },
    macroAmp:  { type: 'number', default: 0.65 }
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },

  // ---- Smooth value noise (trilinear interpolation) ----
  _hash11: function (n) {
    // deterministic pseudo-random in [0,1)
    const s = Math.sin(n) * 43758.5453123;
    return s - Math.floor(s);
  },
  _randLattice: function (ix, iy, iz, seed) {
    // lattice random in [-1,1]
    const n = ix * 127.1 + iy * 311.7 + iz * 74.7 + seed * 19.19;
    return this._hash11(n) * 2.0 - 1.0;
  },
  _fade: function (t) { return t * t * (3.0 - 2.0 * t); },
  _lerp: function (a, b, t) { return a + (b - a) * t; },
  _noise3: function (x, y, z, seed) {
    // value noise in [-1,1]
    const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
    const fx = x - ix, fy = y - iy, fz = z - iz;

    const u = this._fade(fx), v = this._fade(fy), w = this._fade(fz);

    const n000 = this._randLattice(ix,     iy,     iz,     seed);
    const n100 = this._randLattice(ix + 1, iy,     iz,     seed);
    const n010 = this._randLattice(ix,     iy + 1, iz,     seed);
    const n110 = this._randLattice(ix + 1, iy + 1, iz,     seed);

    const n001 = this._randLattice(ix,     iy,     iz + 1, seed);
    const n101 = this._randLattice(ix + 1, iy,     iz + 1, seed);
    const n011 = this._randLattice(ix,     iy + 1, iz + 1, seed);
    const n111 = this._randLattice(ix + 1, iy + 1, iz + 1, seed);

    const nx00 = this._lerp(n000, n100, u);
    const nx10 = this._lerp(n010, n110, u);
    const nx01 = this._lerp(n001, n101, u);
    const nx11 = this._lerp(n011, n111, u);

    const nxy0 = this._lerp(nx00, nx10, v);
    const nxy1 = this._lerp(nx01, nx11, v);

    return this._lerp(nxy0, nxy1, w);
  },
  _fbm: function (x, y, z, seed, oct, freq, lac, gain) {
    let a = 1.0, f = freq, sum = 0.0, norm = 0.0;
    for (let i = 0; i < oct; i++) {
      sum += a * this._noise3(x * f, y * f, z * f, seed + i * 101.7);
      norm += a;
      a *= gain;
      f *= lac;
    }
    return (norm > 0) ? (sum / norm) : 0;
  },

  _apply: function () {
    const obj = this.el.getObject3D('mesh');
    if (!obj) return;

    const meshes = [];
    obj.traverse(o => { if (o && o.isMesh && o.geometry) meshes.push(o); });
    if (!meshes.length) return;

    const d = this.data;

    for (let m = 0; m < meshes.length; m++) {
      const mesh = meshes[m];
      const geom = mesh.geometry;
      if (!geom || !geom.attributes || !geom.attributes.position) continue;

      // Avoid double-applying.
      if (geom.userData && geom.userData._caveDisplaced) continue;

      const g = geom.clone();
      const pos = g.attributes.position;

      if (!g.attributes.normal) g.computeVertexNormals();
      const normals = g.attributes.normal;

      const v = new THREE.Vector3();
      const nrm = new THREE.Vector3();

      // Two-layer noise: broad bulges (macro) + surface chiseling (micro)
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        nrm.fromBufferAttribute(normals, i);

        const macro = this._fbm(v.x, v.y, v.z, d.seed + 17.0, d.oct, d.macroFreq, d.lac, d.gain);
        const micro = this._fbm(v.x, v.y, v.z, d.seed,        d.oct, d.freq,      d.lac, d.gain);

        const w = (macro * d.macroAmp) + (micro * (1.0 - d.macroAmp));

        v.addScaledVector(nrm, w * d.amp);
        pos.setXYZ(i, v.x, v.y, v.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      g.userData = g.userData || {};
      g.userData._caveDisplaced = true;

      mesh.geometry = g;
    }
  }
});




// Pulls the lowest edge of the cave shell down to meet the floor (world Y), with a smooth falloff upward.
// This alters the *main dome mesh* (no extra skirt meshes) and keeps the upper coverage essentially unchanged.
AFRAME.registerComponent('cave-floor-seal', {
  schema: {
    floorY:       { type: 'number', default: 0 },     // world-space floor Y to touch
    anchorHeight: { type: 'number', default: 0.75 },  // in meters above the shell's current lowest point where deformation fades to 0
    retries:      { type: 'int',    default: 6 }      // wait for cave-displace to finish
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },

  _smoothstep: function (t) { return t * t * (3.0 - 2.0 * t); },

  _apply: function () {
    const obj = this.el.getObject3D('mesh');
    if (!obj) return;

    const meshes = [];
    obj.traverse(o => { if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) meshes.push(o); });
    if (!meshes.length) return;

    const d = this.data;

    // If cave-displace is present, wait until it has tagged geometry as displaced.
    // This prevents double-cloning and avoids racing the displacement step.
    const needsDisplace = this.el.hasAttribute('cave-displace');
    if (needsDisplace) {
      let allDisplaced = true;
      for (const m of meshes) {
        if (!(m.geometry.userData && m.geometry.userData._caveDisplaced)) { allDisplaced = false; break; }
      }
      if (!allDisplaced) {
        if (d.retries > 0) {
          this.el.setAttribute('cave-floor-seal', { retries: d.retries - 1 });
          setTimeout(this._apply, 25);
        }
        return;
      }
    }

    // Find the current lowest vertex in WORLD space.
    let minY = Infinity;
    const _v = new THREE.Vector3();

    obj.updateMatrixWorld(true);
    obj.traverse(m => { if (m && m.isMesh) m.updateMatrixWorld(true); });

    for (const mesh of meshes) {
      const pos = mesh.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        _v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
        if (_v.y < minY) minY = _v.y;
      }
    }

    const delta = d.floorY - minY; // negative means we need to pull DOWN
    if (delta >= 0) return; // already touching or below

    const anchorY = minY + Math.max(0.05, d.anchorHeight);
    const _w = new THREE.Vector3();
    const _local = new THREE.Vector3();
    const _inv = new THREE.Matrix4();

    for (const mesh of meshes) {
      // Avoid double-applying.
      if (mesh.geometry.userData && mesh.geometry.userData._floorSealed) continue;

      // Clone so we don't mutate shared geometry.
      const g = mesh.geometry.clone();
      const pos = g.attributes.position;

      _inv.copy(mesh.matrixWorld).invert();

      for (let i = 0; i < pos.count; i++) {
        _local.fromBufferAttribute(pos, i);
        _w.copy(_local).applyMatrix4(mesh.matrixWorld);

        if (_w.y >= anchorY) continue;

        const t = (_w.y - minY) / (anchorY - minY); // 0..1
        const s = this._smoothstep(Math.min(1, Math.max(0, t)));
        const wgt = 1.0 - s;

        _w.y += delta * wgt;

        _local.copy(_w).applyMatrix4(_inv);
        pos.setXYZ(i, _local.x, _local.y, _local.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      g.userData = g.userData || {};
      g.userData._floorSealed = true;

      mesh.geometry = g;
    }
  }
});


// Ensures uv2 exists for aoMap on primitives (copies uv -> uv2).


// Adds two things to the main dome mesh:
// 1) Softens the dome ↔ flat-wall intersection by insetting / chipping the ring near a local Z plane (typically z=0).
// 2) Adds low-frequency, non-axis-symmetric irregularity so the interior feels less mathematically perfect.
// This is a pure geometry edit (no extra meshes). Safe for photoreal seams.
AFRAME.registerComponent('cave-dome-naturalize', {
  schema: {
    seamZ:        { type: 'number', default: 0.0 },   // local Z plane where the flat wall sits in dome-local space
    seamBand:     { type: 'number', default: 0.70 },  // thickness (local units) of the blend band around seamZ
    seamInset:    { type: 'number', default: 0.16 },  // meters (local units) to push the seam ring behind the wall (negative Z)
    seamRadAmp:   { type: 'number', default: 0.10 },  // meters (local units) radial chip amplitude near seam
    seamNoiseFreq:{ type: 'number', default: 0.55 },  // noise frequency along seam
    globalAmp:    { type: 'number', default: 0.10 },  // meters (local units) global irregularity amplitude
    globalFreq:   { type: 'number', default: 0.18 },  // global noise frequency
    tangentialAmp:{ type: 'number', default: 0.06 },  // meters (local units) tangential warp amplitude
    seed:         { type: 'number', default: 101 },
    retries:      { type: 'int',    default: 10 }     // wait for displace + floor seal
  },

  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },

  remove: function () { this.el.removeEventListener('object3dset', this._apply); },

  _hash11: function (n) { const s = Math.sin(n) * 43758.5453123; return s - Math.floor(s); },
  _randLattice: function (ix, iy, iz, seed) {
    const n = ix * 127.1 + iy * 311.7 + iz * 74.7 + seed * 19.19;
    return this._hash11(n) * 2.0 - 1.0;
  },
  _fade: function (t) { return t * t * (3.0 - 2.0 * t); },
  _lerp: function (a, b, t) { return a + (b - a) * t; },
  _noise3: function (x, y, z, seed) {
    const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
    const fx = x - ix, fy = y - iy, fz = z - iz;
    const u = this._fade(fx), v = this._fade(fy), w = this._fade(fz);

    const n000 = this._randLattice(ix,   iy,   iz,   seed);
    const n100 = this._randLattice(ix+1, iy,   iz,   seed);
    const n010 = this._randLattice(ix,   iy+1, iz,   seed);
    const n110 = this._randLattice(ix+1, iy+1, iz,   seed);
    const n001 = this._randLattice(ix,   iy,   iz+1, seed);
    const n101 = this._randLattice(ix+1, iy,   iz+1, seed);
    const n011 = this._randLattice(ix,   iy+1, iz+1, seed);
    const n111 = this._randLattice(ix+1, iy+1, iz+1, seed);

    const nx00 = this._lerp(n000, n100, u);
    const nx10 = this._lerp(n010, n110, u);
    const nx01 = this._lerp(n001, n101, u);
    const nx11 = this._lerp(n011, n111, u);

    const nxy0 = this._lerp(nx00, nx10, v);
    const nxy1 = this._lerp(nx01, nx11, v);

    return this._lerp(nxy0, nxy1, w);
  },

  _smoothstep: function (t) { return t * t * (3.0 - 2.0 * t); },

  _apply: function () {
    const obj = this.el.getObject3D('mesh');
    if (!obj) return;

    // Wait for cave-displace + cave-floor-seal to finish so we bake on top of the final shape.
    const meshes = [];
    let allReady = true;

    obj.traverse(o => {
      if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) {
        meshes.push(o);
        const g = o.geometry;
        const ud = g.userData || {};
        if (!(ud._caveDisplaced && ud._floorSealed)) allReady = false;
      }
    });

    if (!meshes.length) return;

    if (!allReady) {
      if (this.data.retries > 0) {
        this.data.retries -= 1;
        setTimeout(this._apply, 60);
      }
      return;
    }

    for (const mesh of meshes) {
      const g0 = mesh.geometry;
      g0.userData = g0.userData || {};
      if (g0.userData._domeNaturalized) continue;

      // Clone to avoid mutating shared geometry.
      const g = g0.clone();
      const pos = g.attributes.position;
      if (!pos) continue;

      // Bounding box for bottom-weighting: helps soften the floor+wall+dome tri-junction.
      g.computeBoundingBox();
      const minY = g.boundingBox ? g.boundingBox.min.y : -1.0;
      const maxY = g.boundingBox ? g.boundingBox.max.y :  1.0;
      const bottomBandY = Math.max(1e-6, (maxY - minY) * 0.18);

      // Cache the current (post-displace + post-floor-seal) positions as a baseline to prevent stacking.
      if (!g.userData._basePos) {
        g.userData._basePos = new Float32Array(pos.array);
      }
      const base = g.userData._basePos;

      const d = this.data;
      const seedA = d.seed * 1.0;
      const seedB = d.seed * 3.7;

      const v = new THREE.Vector3();
      const n = new THREE.Vector3();
      const up = new THREE.Vector3(0, 1, 0);
      const t1 = new THREE.Vector3();
      const t2 = new THREE.Vector3();

      for (let i = 0; i < pos.count; i++) {
        v.set(base[i*3+0], base[i*3+1], base[i*3+2]);

        // Approximate normal from position (works well for sphere-like shells).
        n.copy(v).normalize();

        // --- Global irregularity (breaks perfect ellipsoid symmetry) ---
        const gx = v.x * d.globalFreq;
        const gy = v.y * d.globalFreq;
        const gz = v.z * d.globalFreq;

        const ng = this._noise3(gx, gy, gz, seedA);
        v.addScaledVector(n, ng * d.globalAmp);

        // Tangential warp (prevents "inflated balloon" look)
        // Build a stable tangent basis.
        t1.crossVectors(n, up);
        if (t1.lengthSq() < 1e-6) t1.set(1, 0, 0);
        t1.normalize();
        t2.crossVectors(n, t1).normalize();

        const nt1 = this._noise3(gx + 7.1, gy + 3.3, gz + 1.9, seedB);
        const nt2 = this._noise3(gx + 2.4, gy + 9.7, gz + 5.2, seedB + 11.0);
        v.addScaledVector(t1, nt1 * d.tangentialAmp);
        v.addScaledVector(t2, nt2 * d.tangentialAmp);

        // --- Seam softening at the flat wall plane (local z ~= seamZ) ---
        const dz = Math.abs(v.z - d.seamZ);
        const t = 1.0 - Math.min(1.0, dz / Math.max(1e-6, d.seamBand));
        const w = this._smoothstep(t); // 0..1

        if (w > 0.0) {
          // Noise evaluated in seam plane so it's irregular around the ring.
          const sx = v.x * d.seamNoiseFreq;
          const sy = v.y * d.seamNoiseFreq;
          const sn = this._noise3(sx, sy, 0.0, seedA + 27.0); // [-1,1]

          // Push seam slightly behind wall (negative Z) with jitter so it's not a perfect circle line.
          // Extra weighting near the bottom of the dome so the seam doesn't read as a perfect hard circle.
          const bottomT = 1.0 - Math.min(1.0, Math.max(0.0, (v.y - (minY + bottomBandY)) / bottomBandY));
          const wBottom = this._smoothstep(bottomT) * w;
          const inset = d.seamInset * (w + 0.75 * wBottom) * (0.65 + 0.35 * (sn * 0.5 + 0.5));
          v.z -= inset;

          // Radial chip (in/out along normal) to break the circular precision.
          const chip = d.seamRadAmp * (w + 0.85 * wBottom) * sn;
          v.addScaledVector(n, chip);
        }

        pos.setXYZ(i, v.x, v.y, v.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      g.userData = g.userData || {};
      g.userData._domeNaturalized = true;

      mesh.geometry = g;

      // Re-seat the bottom edge to the floor after the irregularity pass.
      const seal = this.el.components['cave-floor-seal'];
      if (seal && typeof seal._apply === 'function') {
        // Clear the flag so the seal will run again.
        g.userData._floorSealed = false;
        setTimeout(() => seal._apply(), 0);
      }
    }
  }
});

AFRAME.registerComponent('uv2-from-uv', {
  init: function () {
    const apply = () => {
      const obj = this.el.getObject3D('mesh');
      if (!obj) return;
      obj.traverse(o => {
        if (!o || !o.isMesh || !o.geometry || !o.geometry.attributes || !o.geometry.attributes.uv) return;
        const g = o.geometry;
        if (!g.attributes.uv2) {
          g.setAttribute('uv2', new THREE.BufferAttribute(g.attributes.uv.array, 2));
          g.attributes.uv2.needsUpdate = true;
        }
      });
    };
    this.el.addEventListener('object3dset', apply);
    setTimeout(apply, 0);
  }
});

            let nx = x + dx;
            for (let i = 0; i < this._colliders.length; i++) {
              const a = this._aabbExpanded(this._colliders[i], radius);
              if (nx > a.minX && nx < a.maxX && z > a.minZ && z < a.maxZ) nx = (dx > 0) ? (a.minX - EPS) : (a.maxX + EPS);
            }
            return nx;
          },
          _resolveZ: function (x, z, dz, radius) {
            let nz = z + dz;
            for (let i = 0; i < this._colliders.length; i++) {
              const a = this._aabbExpanded(this._colliders[i], radius);
              if (x > a.minX && x < a.maxX && nz > a.minZ && nz < a.maxZ) nz = (dz > 0) ? (a.minZ - EPS) : (a.maxZ + EPS);

            const speed = this.data.speed;
            const r = this.data.radius;

            const s = !!this.keys['KeyS'] || !!this.keys['ArrowDown'];
            const a = !!this.keys['KeyA'] || !!this.keys['ArrowLeft'];
            const d = !!this.keys['KeyD'] || !!this.keys['ArrowRight'];

            const rightX = cos, rightZ = -sin;

            const moveX = (rightX * str + forwardX * f) * speed * dtS;
            const moveZ = (rightZ * str + forwardZ * f) * speed * dtS;

            const pos = this.el.object3D.position;
            const nx = this._resolveX(pos.x, pos.z, moveX, r);
            const nz = this._resolveZ(nx, pos.z, moveZ, r);

AFRAME.registerComponent('floor-seam-sculpt', {
  schema: {
    // Back wall seam Z in WORLD space
    wallZ: {type: 'number', default: 0.49},

    // Elliptical footprint of the dome on the floor in WORLD space:
    // (x - cx)^2 / a^2 + (z - cz)^2 / b^2 = 1
    domeCenter: {type: 'vec3', default: {x: 0, y: 1.92, z: 0.49}},
    domeA: {type: 'number', default: 3.34},
    domeB: {type: 'number', default: 4.58},

    // Blend band widths in METERS (how far from the seam we start ramping up)
    domeBand: {type: 'number', default: 0.85},
    wallBand: {type: 'number', default: 0.95},

    // Max vertical rise (meters)
    maxRise: {type: 'number', default: 0.12},

    // Noise controls
    noiseScale: {type: 'number', default: 0.70},   // meters per noise feature (bigger = smoother)
    noiseAmp:   {type: 'number', default: 0.85},   // 0..1-ish
    edgeJitter: {type: 'number', default: 0.14},   // meters of seam wobble
    seed: {type: 'int', default: 11},

    // Keep the elevator cab + doorway area flat (meters)
    elevatorClearX: {type: 'number', default: 1.45},
    elevatorClearZ: {type: 'number', default: 1.10},

    // Whether to recompute normals (slightly costlier once, but improves realism)
    recomputeNormals: {type: 'boolean', default: true}
  },

  init: function () {
    this._applied = false;
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._apply);
  },

  _smoothstep: function (e0, e1, x) {
    const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  },

  _hash2: function (x, y, seed) {
    // integer hash -> [0,1)
    let n = (x * 374761393 + y * 668265263 + seed * 1442695041) | 0;
    n = (n ^ (n >> 13)) | 0;
    n = (n * 1274126177) | 0;
    return ((n ^ (n >> 16)) >>> 0) / 4294967296;
  },

  _noise2: function (x, y, seed) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;

    const a = this._hash2(xi, yi, seed);
    const b = this._hash2(xi + 1, yi, seed);
    const c = this._hash2(xi, yi + 1, seed);
    const d = this._hash2(xi + 1, yi + 1, seed);

    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const ab = a + (b - a) * u;
    const cd = c + (d - c) * u;
    return ab + (cd - ab) * v; // ~[0,1]
  },

  _fbm: function (x, y, seed) {
    let amp = 0.58;
    let sum = 0.0;
    let freq = 1.0;
    for (let i = 0; i < 4; i++) {
      sum += amp * this._noise2(x * freq, y * freq, seed + i * 13);
      freq *= 2.03;
      amp *= 0.52;
    }
    return sum; // ~[0,1]
  },

  _apply: function () {
    if (this._applied) return;

    const mesh = this.el.getObject3D('mesh');
    if (!mesh || !mesh.geometry || !mesh.geometry.attributes || !mesh.geometry.attributes.position) return;

    // Clone once so we don't mutate shared geometry.
    const geom = mesh.geometry.clone();
    mesh.geometry = geom;

    const pos = geom.attributes.position;

    // Compute LOCAL up (for displacing along the floor normal even if the plane rotates).
    const qWorld = new THREE.Quaternion();
    mesh.getWorldQuaternion(qWorld);
    const invQ = qWorld.clone().invert();
    const upLocal = new THREE.Vector3(0, 1, 0).applyQuaternion(invQ).normalize();

    const tmpLocal = new THREE.Vector3();
    const tmpWorld = new THREE.Vector3();

    const d = this.data;
    const cx = d.domeCenter.x, cz = d.domeCenter.z;
    const a = Math.max(1e-6, d.domeA), b = Math.max(1e-6, d.domeB);

    const wallBand = Math.max(0.05, d.wallBand);
    const domeBand = Math.max(0.05, d.domeBand);
    const noiseScale = Math.max(0.05, d.noiseScale);

    // Convert ellipse seam distance to meters (approx, good enough visually)
    const avgR = 0.5 * (a + b);

    for (let i = 0; i < pos.count; i++) {
      tmpLocal.fromBufferAttribute(pos, i);
      tmpWorld.copy(tmpLocal);
      mesh.localToWorld(tmpWorld);

      // Keep elevator interior / doorway region flat.
      const inElevatorClear =
        (Math.abs(tmpWorld.x) <= d.elevatorClearX) &&
        (tmpWorld.z <= (d.wallZ + d.elevatorClearZ));

      if (inElevatorClear) continue;

      // Seam wobble (breaks the "perfect line" read)
      const seamJ = (this._noise2(tmpWorld.x * 0.55, 0.0, d.seed + 31) * 2.0 - 1.0);
      const wallZJ = d.wallZ + d.edgeJitter * 0.55 * seamJ;

      // --- Influence 1: back wall seam (distance in meters) ---
      const dWall = Math.abs(tmpWorld.z - wallZJ);
      let wWall = 1.0 - this._smoothstep(0.0, wallBand, dWall);
      wWall = Math.pow(Math.max(0, wWall), 0.65);

      // --- Influence 2: dome footprint seam (distance in meters, approx) ---
      const dx = (tmpWorld.x - cx) / a;
      const dz = (tmpWorld.z - cz) / b;
      const r = Math.sqrt(dx * dx + dz * dz);

      // jitter the ellipse "radius" slightly so it doesn't read like math
      const rJ = 1.0 + (d.edgeJitter / Math.max(1e-6, avgR)) * 0.75 *
        (this._noise2(tmpWorld.x * 0.40, tmpWorld.z * 0.40, d.seed + 13) * 2.0 - 1.0);

      const dDomeMeters = Math.abs(r - rJ) * avgR;
      let wDome = 1.0 - this._smoothstep(0.0, domeBand, dDomeMeters);
      wDome = Math.pow(Math.max(0, wDome), 0.65);

      // Tri-junction boost: where both seam influences exist (use min)
      let wTri = Math.min(wWall, wDome);
      wTri = Math.pow(wTri, 0.55);

      // Combine: broad berm from max + extra lumpy lift at tri-junction
      let w = Math.max(wWall, wDome);
      if (w < 1e-5) continue;

      // Multi-scale noise in WORLD meters (fast, non-repeating enough for this use)
      const n = this._fbm(tmpWorld.x / noiseScale, tmpWorld.z / noiseScale, d.seed); // 0..1
      const nSigned = (n * 2.0 - 1.0); // -1..1
      const ridge = 1.0 - Math.abs(nSigned); // 0..1 (chunkier clumps)

      const amp = 1.0 + d.noiseAmp * (0.55 * nSigned + 0.25 * (ridge - 0.5));
      const micro = 0.010 * d.noiseAmp * (this._noise2(tmpWorld.x * 7.5, tmpWorld.z * 7.5, d.seed + 19) * 2.0 - 1.0);

      const rise = (d.maxRise * w * amp) + (d.maxRise * 0.55 * wTri * (1.0 + 0.60 * d.noiseAmp * nSigned)) + micro * w;

      tmpLocal.addScaledVector(upLocal, rise);
      pos.setXYZ(i, tmpLocal.x, tmpLocal.y, tmpLocal.z);
    }

    pos.needsUpdate = true;
    if (d.recomputeNormals) geom.computeVertexNormals();

    this._applied = true;
  }
});

    const ab = a + (b - a) * u;
    const cd = c + (d - c) * u;
    return ab + (cd - ab) * v;
  },

  _fbm: function (x, y) {
    let amp = 0.58;
    let sum = 0.0;
    let freq = 1.0;
    for (let i = 0; i < 4; i++) {
      sum += amp * this._noise2(x * freq, y * freq);
      freq *= 2.03;
      amp *= 0.52;
    }
    return sum; // ~[0,1]
  },

  _apply: function () {
    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;

    const mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
    if (!mat) return;

    const N = 768; // subtle band; slightly lower than dust for perf
    const canvas = document.createElement('canvas');
    canvas.width = N;
    canvas.height = N;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(N, N);
    const data = img.data;

    const d = this.data;
    const w = d.width, h = d.height, cz = d.centerZ;
    const wallZ = d.wallZ;
    const cx = d.domeCenter.x, czD = d.domeCenter.z;
    const a = Math.max(0.001, d.domeA), b = Math.max(0.001, d.domeB);
    const avgR = 0.5 * (a + b);

    const bandWall = Math.max(0.05, d.wallBand);
    const bandDomeN = Math.max(0.05, d.domeBand / avgR);
    const noiseScale = Math.max(0.05, d.noiseScale);
    const strength = Math.max(0, d.strength);

    for (let j = 0; j < N; j++) {
      const v = j / (N - 1);
      const worldZ = (v - 0.5) * h + cz;

      for (let i = 0; i < N; i++) {
        const u = i / (N - 1);
        const worldX = (u - 0.5) * w;

        // Keep elevator interior clean
        if (Math.abs(worldX) < d.elevatorClearX && Math.abs(worldZ - wallZ) < d.elevatorClearZ) {
          const idx = (j * N + i) * 4;
          data[idx + 0] = 255;
          data[idx + 1] = 255;
          data[idx + 2] = 255;
          data[idx + 3] = 0;
          continue;
        }

        // Wall seam weight
        const dW = Math.abs(worldZ - wallZ);
        let wWall = 1.0 - this._smooth(0.0, bandWall, dW);
        wWall = Math.pow(Math.max(0, wWall), 0.80);

        // Dome footprint seam weight (ellipse)
        const dx = (worldX - cx) / a;
        const dz = (worldZ - czD) / b;
        const r = Math.sqrt(dx * dx + dz * dz);
        const dDN = Math.abs(r - 1.0);

        let wDome = 1.0 - this._smooth(0.0, bandDomeN, dDN);
        wDome = Math.pow(Math.max(0, wDome), 0.80);

        let wComb = Math.max(wWall, wDome);
        // Slightly favor the tri-junction area
        const wTri = Math.pow(Math.min(wWall, wDome), 0.65);
        wComb = Math.max(wComb, wTri * 1.08);

        // Subtle mottling so it reads like dampness, not a painted stripe
        const n = this._fbm(worldX / noiseScale, worldZ / noiseScale);
        const nSigned = (n * 2.0 - 1.0);
        const breakup = Math.max(0.0, 1.0 + nSigned * d.noiseAmount);

        // Dampness: strong right at seam, falls off quickly
        let alpha = strength * Math.pow(wComb, 1.15) * breakup;

        // Keep it restrained
        alpha = Math.min(0.55, Math.max(0.0, alpha));

        const idx = (j * N + i) * 4;
        data[idx + 0] = 255;
        data[idx + 1] = 255;
        data[idx + 2] = 255;
        data[idx + 3] = Math.floor(alpha * 255);
      }
    }

    ctx.putImageData(img, 0, 0);

    const alphaTex = new THREE.CanvasTexture(canvas);
    alphaTex.wrapS = THREE.ClampToEdgeWrapping;
    alphaTex.wrapT = THREE.ClampToEdgeWrapping;
    alphaTex.needsUpdate = true;

    mat.transparent = true;
    mat.depthWrite = false;
    mat.alphaMap = alphaTex;
    mat.polygonOffset = true;
    mat.polygonOffsetFactor = -2;
    mat.polygonOffsetUnits = -2;
    mesh.renderOrder = 8;
    mat.needsUpdate = true;
  }
});


AFRAME.registerComponent('seam-rubble-skirt', {
  schema: {
    domeCenter: {type: 'vec3', default: {x: 0, y: 1.92, z: 0.49}},
    domeA: {type: 'number', default: 3.34},
    domeB: {type: 'number', default: 4.58},

    y: {type: 'number', default: 0.02},

    // Counts (keep reasonable)
    count: {type: 'int', default: 140},
    heroCount: {type: 'int', default: 7},

    // How far inward from the seam we place rubble (meters)
    bandWidth: {type: 'number', default: 0.55},

    // Randomness
    seed: {type: 'int', default: 77},
    tangentJitter: {type: 'number', default: 0.10},
    yJitter: {type: 'number', default: 0.03},

    // Scale in meters (rock radius-ish)
    scaleMin: {type: 'number', default: 0.05},
    scaleMax: {type: 'number', default: 0.14},
    heroScaleMin: {type: 'number', default: 0.22},
    heroScaleMax: {type: 'number', default: 0.38},

    // Look
    color1: {type: 'color', default: '#1a1a1a'},
    color2: {type: 'color', default: '#2a2a2a'},
    roughness: {type: 'number', default: 0.98},
    metalness: {type: 'number', default: 0.02}
  },

  init: function () {
    const THREE = AFRAME.THREE;
    const d = this.data;


    // Procedural micro normal map to give the black rocks readable surface under light (no external textures).
    function makeRockNormalTexture(seed, size) {
      size = size || 128;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const img = ctx.createImageData(size, size);
      const data = img.data;

      function hash(x, y) {
        let n = (x * 374761393 + y * 668265263 + (seed | 0) * 1447) | 0;
        n = (n ^ (n >> 13)) | 0;
        n = (n * 1274126177) | 0;
        return ((n ^ (n >> 16)) >>> 0) / 4294967296;
      }

      function smoothstep(t) { return t * t * (3 - 2 * t); }

      function noise(x, y) {
        const xi = Math.floor(x), yi = Math.floor(y);
        const xf = x - xi, yf = y - yi;
        const a = hash(xi, yi);
        const b = hash(xi + 1, yi);
        const c = hash(xi, yi + 1);
        const d0 = hash(xi + 1, yi + 1);
        const u = smoothstep(xf);
        const v = smoothstep(yf);
        const ab = a + (b - a) * u;
        const cd = c + (d0 - c) * u;
        return ab + (cd - ab) * v; // 0..1
      }

      function fbm(x, y) {
        let f = 0.0;
        let amp = 0.55;
        let freq = 1.0;
        for (let i = 0; i < 4; i++) {
          f += amp * noise(x * freq, y * freq);
          freq *= 2.03;
          amp *= 0.52;
        }
        return f; // ~0..1
      }

      const H = new Float32Array(size * size);
      for (let j = 0; j < size; j++) {
        for (let i = 0; i < size; i++) {
          const u = i / size;
          const v = j / size;
          // Clumpy field (bias toward pockets / pits)
          let h = fbm(u * 6.0, v * 6.0);
          h = Math.pow(Math.max(0.0, h), 1.45);
          H[j * size + i] = h;
        }
      }

      const getH = (i, j) => H[((j + size) % size) * size + ((i + size) % size)];
      const strength = 2.2; // normal intensity

      for (let j = 0; j < size; j++) {
        for (let i = 0; i < size; i++) {
          const hx = getH(i + 1, j) - getH(i - 1, j);
          const hy = getH(i, j + 1) - getH(i, j - 1);

          let nx = -hx * strength;
          let ny = -hy * strength;
          let nz = 1.0;

          const inv = 1.0 / Math.sqrt(nx * nx + ny * ny + nz * nz);
          nx *= inv; ny *= inv; nz *= inv;

          const idx = (j * size + i) * 4;
          data[idx + 0] = Math.floor((nx * 0.5 + 0.5) * 255);
          data[idx + 1] = Math.floor((ny * 0.5 + 0.5) * 255);
          data[idx + 2] = Math.floor((nz * 0.5 + 0.5) * 255);
          data[idx + 3] = 255;
        }
      }

      ctx.putImageData(img, 0, 0);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      tex.anisotropy = 1;
      // Normal maps must be linear / non-color data
      if (tex.colorSpace !== undefined && THREE.NoColorSpace !== undefined) tex.colorSpace = THREE.NoColorSpace;

      return tex;
    }

    const cx = d.domeCenter.x, cz = d.domeCenter.z;
    const a = Math.max(0.001, d.domeA), b = Math.max(0.001, d.domeB);

    // Low-poly but shaded rocks
    const geo = new THREE.IcosahedronGeometry(1, 1);
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(d.color1),
      // Restore a touch of highlight response without going back to "wet" shine.
      // Keep mostly matte, but allow slightly less roughness + a tiny env contribution.
      // Slightly less rough to bring back a subtle reflective read under lights.
      roughness: Math.max(0.84, d.roughness),
      metalness: Math.min(0.02, d.metalness),
      envMapIntensity: 0.12,
      vertexColors: true,
      flatShading: true,
      normalMap: makeRockNormalTexture(d.seed, 128),
      normalScale: new THREE.Vector2(0.55, 0.55)
    });

    const count = Math.max(0, d.count | 0);
    const inst = new THREE.InstancedMesh(geo, mat, count);
    inst.castShadow = true;
    inst.receiveShadow = true;

    // Instance colors supported in modern Three.
    if (inst.instanceColor === null) inst.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(count * 3), 3);

    const colA = new THREE.Color(d.color1);
    const colB = new THREE.Color(d.color2);

    const m = new THREE.Matrix4();
    const p = new THREE.Vector3();
    const q = new THREE.Quaternion();
    const s = new THREE.Vector3();

    const up = new THREE.Vector3(0, 1, 0);
    const dir = new THREE.Vector3();
    const tan = new THREE.Vector3();

    function rand01(i) {
      // deterministic-ish [0,1)
      const t = Math.sin((i + 1) * 133.7 + d.seed * 17.3) * 43758.5453123;
      return t - Math.floor(t);
    }

    for (let i = 0; i < count; i++) {
      const r0 = rand01(i);
      const r1 = rand01(i + 19);
      const r2 = rand01(i + 41);

      // Spread around the ellipse seam with slight jitter
      const theta = (i / count) * Math.PI * 2.0 + (r0 - 0.5) * 0.35;

      const ex = cx + a * Math.cos(theta);
      const ez = cz + b * Math.sin(theta);

      // Ellipse outward normal (gradient of implicit ellipse)
      dir.set((ex - cx) / (a * a), (ez - cz) / (b * b), 0); // temp in x,z
      // remap into x,z
      const nx = dir.x, nz = dir.y;
      dir.set(nx, 0, nz).normalize();

      tan.set(-dir.z, 0, dir.x).normalize();

      // Inward offset + a little tangential jitter to avoid "perfect ring"
      const inward = -d.bandWidth * (0.35 + 0.65 * r1);
      const tJ = d.bandWidth * d.tangentJitter * (r2 - 0.5);

      p.set(ex, d.y + (r2 - 0.5) * d.yJitter, ez);
      p.addScaledVector(dir, inward);
      p.addScaledVector(tan, tJ);

      // Slight random orientation (mostly upright)
      q.setFromAxisAngle(up, r0 * Math.PI * 2.0);
      const tiltX = (r1 - 0.5) * 0.35;
      const tiltZ = (r2 - 0.5) * 0.35;
      q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), tiltX));
      q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), tiltZ));

      // Scale
      const sc = d.scaleMin + (d.scaleMax - d.scaleMin) * Math.pow(r0, 1.6);
      s.set(sc, sc * (0.65 + 0.70 * r1), sc);

      m.compose(p, q, s);
      inst.setMatrixAt(i, m);

      // Color lerp
      const c = colA.clone().lerp(colB, r2);
      inst.setColorAt(i, c);
    }

    inst.instanceMatrix.needsUpdate = true;
    if (inst.instanceColor) inst.instanceColor.needsUpdate = true;

    // A few larger "hero" rocks to break silhouette (non-instanced, still cheap)
    const heroes = new THREE.Group();
    const heroCount = Math.max(0, d.heroCount | 0);

    for (let i = 0; i < heroCount; i++) {
      const r0 = rand01(900 + i);
      const r1 = rand01(930 + i);
      const r2 = rand01(960 + i);

      const theta = r0 * Math.PI * 2.0;

      const ex = cx + a * Math.cos(theta);
      const ez = cz + b * Math.sin(theta);

      dir.set((ex - cx) / (a * a), (ez - cz) / (b * b), 0);
      const nx = dir.x, nz = dir.y;
      dir.set(nx, 0, nz).normalize();
      tan.set(-dir.z, 0, dir.x).normalize();

      const inward = -d.bandWidth * (0.20 + 0.55 * r1);
      const tJ = d.bandWidth * 0.20 * (r2 - 0.5);

      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      mesh.position.set(ex, d.y + (r1 - 0.5) * d.yJitter, ez);
      mesh.position.addScaledVector(dir, inward);
      mesh.position.addScaledVector(tan, tJ);

      mesh.rotation.set((r1 - 0.5) * 0.45, r0 * Math.PI * 2.0, (r2 - 0.5) * 0.45);

      const sc = d.heroScaleMin + (d.heroScaleMax - d.heroScaleMin) * Math.pow(r2, 1.3);
      mesh.scale.set(sc, sc * (0.70 + 0.55 * r1), sc);

      // Tint a bit
      mesh.material = mat.clone();
      mesh.material.color = colA.clone().lerp(colB, r0);
      heroes.add(mesh);
    }

    this.el.object3D.add(inst);
    this.el.object3D.add(heroes);
  }
});

    for (let k = 0; k < patchCount; k++) {
