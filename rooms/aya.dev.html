// Force deterministic draw ordering for layered liquid.
AFRAME.registerComponent('render-order', {
  schema: { value: { type: 'int', default: 0 } },
  init: function () {

    // --- Impact dots setup (soft projected hotspot at beam hits) ---
    this._impactRoot = null;
    this._impactTex = null;
    this._impactMat = null;
    this._impactGeo = null;

// ===== Mercurial torch kit (ported from dome_safe_01) =====
// Futuristic flame core (procedural additive planes + inner hotspot)
// Procedural moving gobo / cookie for torch spotlights (patterned, not just intensity pulsing).
// Simple IBL so metallic materials read as "silvery" instead of black (no external HDR needed).
AFRAME.registerComponent('simple-ibl', {
  schema: { intensity: { type: 'number', default: 1.25 }, color: { type: 'color', default: '#dfe6ef' } },
  init: function () {
    const sceneObj = this.el.sceneEl.object3D;

    const mkCanvas = () => {
      const cv = document.createElement('canvas'); cv.width = cv.height = 2;
      const ctx = cv.getContext('2d');
      // Slight gradient so reflections aren't totally flat.
      const g = ctx.createLinearGradient(0,0,2,2);
      g.addColorStop(0, this.data.color);
      g.addColorStop(1, '#aeb7c3');
      ctx.fillStyle = g; ctx.fillRect(0,0,2,2);
      return cv;
    };

    const cube = new THREE.CubeTexture([mkCanvas(), mkCanvas(), mkCanvas(), mkCanvas(), mkCanvas(), mkCanvas()]);
    cube.needsUpdate = true;
    sceneObj.environment = cube;

    const applyIntensity = () => {
      sceneObj.traverse(o => {
        if (!o || !o.isMesh) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => {
          if (m && m.isMeshStandardMaterial) {
            m.envMapIntensity = this.data.intensity;
            m.needsUpdate = true;
          }
        });
      });
    };

    // Apply now and whenever A-Frame attaches new meshes/materials.
    applyIntensity();
    this.el.sceneEl.addEventListener('object3dset', applyIntensity);
  }
});

// Shader-based circular portal clip (smooth hole) in world space.
// Use this on the cavern shell so the tunnel connection is a clean round opening.
// Shader-based CYLINDRICAL portal clip (smooth round hole) in world space.
// This makes the tunnel read like it *pierces* through the dome (no starburst triangulation, no wall "ghosting").



// Make the tunnel feel like a *lava-tube arch* instead of a clean cylinder.
// feel like a *lava-tube arch* instead of a clean cylinder.
// Assumes a cylinder primitive rotated 90 0 0 (so local Z becomes world Y).
AFRAME.registerComponent('tunnel-archify', {
  schema: {
    radius: { type: 'number', default: 2.7 },
    floor:  { type: 'number', default: 0.58 }, // fraction of radius used as "flat" floor depth (local +Z)
    squash: { type: 'number', default: 0.80 }, // vertical squash (local Z)
    wobble: { type: 'number', default: 0.14 }, // lateral irregularity
    freq:   { type: 'number', default: 0.55 },
    seed:   { type: 'number', default: 19 }
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },
  _apply: function () {
    const mesh = this.el.getObject3D('mesh');
    if (!mesh || !mesh.geometry || !mesh.geometry.attributes || !mesh.geometry.attributes.position) return;
    const g = mesh.geometry;
    const pos = g.attributes.position;
    const d = this.data;

    const floorZ = d.radius * d.floor;  // local +Z is "down" after entity rotation
    const rMax = d.radius;

    for (let i = 0; i < pos.count; i++) {
      let x = pos.getX(i);
      let y = pos.getY(i); // along tunnel length (becomes world Z)
      let z = pos.getZ(i); // vertical cross-section (becomes world -Y)

      // Flatten the floor smoothly (z > 0 is "down")
      if (z > floorZ) {
        const t = Math.min(Math.max((z - floorZ) / (rMax - floorZ + 1e-6), 0.0), 1.0);
        // pull towards floorZ, smoothing the transition
        z = floorZ + (z - floorZ) * (1.0 - t);
      }

      // Overall vertical squash for a wider arch feel
      z *= d.squash;

      // Subtle lateral wobble so the silhouette isn't perfectly round
      const w1 = Math.sin((y * d.freq) + d.seed * 0.73);
      const w2 = Math.sin((y * d.freq * 1.37) + d.seed * 1.91);
      x += w1 * d.wobble * 0.25;
      z += w2 * d.wobble * 0.18;

      pos.setXYZ(i, x, y, z);
    }

    pos.needsUpdate = true;
    g.computeVertexNormals();
    // Use the helper from the file if present (prevents faceted seams under heavy deformation)
    if (typeof smoothNormalsByPosition === 'function') smoothNormalsByPosition(g, 1e-4);
  }
});

      // Shared constants required by index.html components
      const DEG2RAD = Math.PI / 180;
      const EPS = 0.001;


      // Smooth normals across duplicated vertices (common in non-indexed geometries),
      // to avoid faceted "cracked plates" look after deformation.
      function smoothNormalsByPosition(geometry, tol = 1e-4) {
        if (!geometry || !geometry.attributes || !geometry.attributes.position) return;
        if (!geometry.attributes.normal) geometry.computeVertexNormals();

        const pos = geometry.attributes.position;
        const nor = geometry.attributes.normal;

        const map = new Map();
        const sums = [];
        const idxs = new Array(pos.count);

        const q = (v) => Math.round(v / tol);

        // First pass: bucket by quantized position and accumulate normals.
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
          const key = q(x) + ',' + q(y) + ',' + q(z);
          let entry = map.get(key);
          if (!entry) {
            entry = { id: sums.length };
            map.set(key, entry);
            sums.push(new THREE.Vector3(0,0,0));
          }
          idxs[i] = entry.id;
          sums[entry.id].x += nor.getX(i);
          sums[entry.id].y += nor.getY(i);
          sums[entry.id].z += nor.getZ(i);
        }

        // Normalize buckets.
        for (let i = 0; i < sums.length; i++) sums[i].normalize();

        // Second pass: write back smoothed normals.
        for (let i = 0; i < pos.count; i++) {
          const s = sums[idxs[i]];
          nor.setXYZ(i, s.x, s.y, s.z);
        }

        nor.needsUpdate = true;
      }




// ===== Portal rim naturalization (irregular / organic) =====
// Deforms a torus frame so the tunnel/dome junction doesn't read as a perfect engineered ring.
// Deterministic (seeded) and applied once per geometry instance.
AFRAME.registerComponent('organic-rim', {
  schema: {
    amp:  { type: 'number', default: 0.10 }, // meters (radial jitter amplitude)
    freq: { type: 'number', default: 7.0  }, // angular frequency
    seed: { type: 'int',    default: 83   }, // deterministic seed
    zAmp: { type: 'number', default: 0.03 }  // meters (tube wobble)
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },
  _apply: function () {
    const root = this.el.getObject3D('mesh');
    if (!root) return;

    const d = this.data;

    root.traverse(o => {
      if (!o || !o.isMesh || !o.geometry || !o.geometry.attributes || !o.geometry.attributes.position) return;

      const geom = o.geometry;
      if (geom.userData && geom.userData._organicRim) return;

      const g = geom.clone();
      const pos = g.attributes.position;

      // Estimate tube radius from Z extent (torus axis is Z in Three's TorusGeometry).
      g.computeBoundingBox();
      const bb = g.boundingBox;
      const zSpan = bb ? Math.max(1e-6, (bb.max.z - bb.min.z)) : 0.12;
      const tube = 0.5 * zSpan;

      const v2 = new THREE.Vector2();

      const s = d.seed * 0.173;
      const f = Math.max(0.1, d.freq);

      // Deterministic "noise" in [-1,1] based on angle
      const n1 = (a) => Math.sin(a * f + s);
      const n2 = (a) => Math.sin(a * f * 2.17 + s * 3.1);
      const n3 = (a) => Math.sin(a * f * 3.73 + s * 5.7);

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const z = pos.getZ(i);

        const r = Math.sqrt(x*x + y*y);
        if (r < 1e-6) continue;

        const ang = Math.atan2(y, x);

        // Weighted multi-sine
        let n = (n1(ang) + 0.5 * n2(ang) + 0.25 * n3(ang)) / 1.75;

        // Radial perturbation (break the perfect circle)
        const dr = d.amp * n;
        const nx = x / r, ny = y / r;
        let xx = x + nx * dr;
        let yy = y + ny * dr;

        // Tube wobble (kept subtle; weighted towards tube outer band)
        const zw = (tube > 1e-6) ? (1.0 - Math.min(1.0, Math.abs(z) / tube)) : 1.0;
        const dz = d.zAmp * zw * Math.sin(ang * f * 1.31 + s * 7.9) * (0.55 + 0.45 * Math.abs(n));

        pos.setXYZ(i, xx, yy, z + dz);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      if (typeof smoothNormalsByPosition === 'function') smoothNormalsByPosition(g, 1e-4);

      g.userData = g.userData || {};
      g.userData._organicRim = true;
      o.geometry = g;
    });
  }
});

// Deforms only the OUTER edge band of a ring, keeping the inner radius essentially intact.
// Useful for seam-hiding rings that must remain circular at the actual portal hole.
AFRAME.registerComponent('organic-ring-edge', {
  schema: {
    inner: { type: 'number', default: 1.25 },
    outer: { type: 'number', default: 1.33 },
    amp:   { type: 'number', default: 0.035 }, // meters (outer edge jitter)
    freq:  { type: 'number', default: 11.0  },
    seed:  { type: 'int',    default: 91    }
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },
  _apply: function () {
    const root = this.el.getObject3D('mesh');
    if (!root) return;

    const d = this.data;

    root.traverse(o => {
      if (!o || !o.isMesh || !o.geometry || !o.geometry.attributes || !o.geometry.attributes.position) return;

      const geom = o.geometry;
      if (geom.userData && geom.userData._organicRingEdge) return;

      const g = geom.clone();
      const pos = g.attributes.position;

      const inner = Math.max(1e-6, d.inner);
      const outer = Math.max(inner + 1e-6, d.outer);
      const span = outer - inner;

      const s = d.seed * 0.219;
      const f = Math.max(0.1, d.freq);

      const n1 = (a) => Math.sin(a * f + s);
      const n2 = (a) => Math.sin(a * f * 2.03 + s * 2.7);

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const z = pos.getZ(i);

        const r = Math.sqrt(x*x + y*y);
        if (r < 1e-6) continue;

        const ang = Math.atan2(y, x);

        // 0 at inner edge, 1 at outer edge
        const t = Math.max(0.0, Math.min(1.0, (r - inner) / span));
        // bias strongly towards the outer band
        const w = t * t;

        let n = (n1(ang) + 0.5 * n2(ang)) / 1.5;
        const dr = d.amp * n * w;

        const nx = x / r, ny = y / r;
        pos.setXYZ(i, x + nx * dr, y + ny * dr, z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      if (typeof smoothNormalsByPosition === 'function') smoothNormalsByPosition(g, 1e-4);

      g.userData = g.userData || {};
      g.userData._organicRingEdge = true;
      o.geometry = g;
    });
  }
});

// ===== Aya Dome: bake watertight solid shell from the existing inner/outer sheets =====



AFRAME.registerComponent('thick-dome-shell', {
  schema: {
    // Base sphere radius before scaling
    radius: {type: 'number', default: 12.0},

    // Ellipsoid scaling for inner and outer surfaces
    innerScale: {type: 'vec3', default: {x: 1.15, y: 0.68, z: 1.05}},
    outerScale: {type: 'vec3', default: {x: 1.19, y: 0.71, z: 1.09}},

    // Dome segment in DEGREES from the "top" (thetaStart is fixed at 0)
    thetaLength: {type: 'number', default: 132},

    // Segments
    widthSegments: {type: 'int', default: 128},
    heightSegments: {type: 'int', default: 96},

    // Textures (use <img> assets)
    diffuse: {type: 'selector'},
    normal:  {type: 'selector'},
    rough:   {type: 'selector'},
    ao:      {type: 'selector'},

    // Tiling
    repeat: {type: 'vec2', default: {x: 14, y: 10}},

    // Normal intensity (outer). Inner gets Y flipped automatically.
    normalScale: {type: 'vec2', default: {x: 0.95, y: 0.95}},

    // Optional subtle displacement to keep the cave feel even without the old bake system
    displaceAmp:  {type: 'number', default: 0.55},
    displaceFreq: {type: 'number', default: 1.20},
    macroAmp:     {type: 'number', default: 0.85},
    macroFreq:    {type: 'number', default: 0.28},
    seed:         {type: 'int', default: 41},
    octaves:      {type: 'int', default: 4},
    lacunarity:   {type: 'number', default: 2.05},
    gain:         {type: 'number', default: 0.52}
  },

  init: function () {
    this._mesh = null;
    this._build();
  },

  update: function () {
    this._build();
  },

  remove: function () {
    if (this._mesh) {
      this.el.object3D.remove(this._mesh);
      this._mesh.geometry && this._mesh.geometry.dispose();
      const mats = Array.isArray(this._mesh.material) ? this._mesh.material : [this._mesh.material];
      mats.forEach(m => m && m.dispose && m.dispose());
      this._mesh = null;
    }
  },

  _texFromImg: function (imgEl, kind) {
    if (!imgEl) return null;

    // Use the same image element, but apply proper Three.js color-management so
    // the dome matches A-Frame material textures (no "self-lit" / gamma mismatch).
    const tex = new THREE.Texture(imgEl);
    tex.needsUpdate = true;

    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 8;

    // Color space:
    // - BaseColor/Diffuse must be SRGB
    // - Normal/Roughness/AO are data textures (no color space)
    try {
      if (kind === 'color') {
        if ('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
        else if ('encoding' in tex) tex.encoding = THREE.sRGBEncoding;
      } else {
        if ('colorSpace' in tex) tex.colorSpace = THREE.NoColorSpace;
        else if ('encoding' in tex) tex.encoding = THREE.LinearEncoding;
      }
    } catch (e) {}

    return tex;
  },

  _hash3: function (x, y, z, seed) {
    // integer hash -> [0,1)
    let h = (x * 374761393 + y * 668265263 + z * 2147483647 + seed * 374761393) | 0;
    h = (h ^ (h >> 13)) | 0;
    h = (h * 1274126177) | 0;
    h = (h ^ (h >> 16)) | 0;
    return (h >>> 0) / 4294967296;
  },

  _valueNoise3: function (x, y, z, seed) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = x - xi, yf = y - yi, zf = z - zi;

    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const w = zf * zf * (3 - 2 * zf);

    const n000 = this._hash3(xi,     yi,     zi,     seed);
    const n100 = this._hash3(xi + 1, yi,     zi,     seed);
    const n010 = this._hash3(xi,     yi + 1, zi,     seed);
    const n110 = this._hash3(xi + 1, yi + 1, zi,     seed);
    const n001 = this._hash3(xi,     yi,     zi + 1, seed);
    const n101 = this._hash3(xi + 1, yi,     zi + 1, seed);
    const n011 = this._hash3(xi,     yi + 1, zi + 1, seed);
    const n111 = this._hash3(xi + 1, yi + 1, zi + 1, seed);

    const x00 = n000 + (n100 - n000) * u;
    const x10 = n010 + (n110 - n010) * u;
    const x01 = n001 + (n101 - n001) * u;
    const x11 = n011 + (n111 - n011) * u;

    const y0 = x00 + (x10 - x00) * v;
    const y1 = x01 + (x11 - x01) * v;

    return y0 + (y1 - y0) * w; // [0,1]
  },

  _fbm3: function (x, y, z, seed, oct, lac, gain) {
    let amp = 0.58;
    let sum = 0.0;
    let freq = 1.0;
    for (let i = 0; i < oct; i++) {
      sum += amp * (this._valueNoise3(x * freq, y * freq, z * freq, seed + i * 101) * 2 - 1);
      amp *= gain;
      freq *= lac;
    }
    return sum; // roughly [-1,1]
  },

  _displaceInPlace: function (geom, amp, freq, macroAmp, macroFreq, seed, oct, lac, gain) {
    const pos = geom.attributes.position;
    const normal = geom.attributes.normal;
    const v = new THREE.Vector3();
    const n = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      n.fromBufferAttribute(normal, i).normalize();

      const micro = this._fbm3(v.x * freq, v.y * freq, v.z * freq, seed, oct, lac, gain);
      const macro = this._fbm3(v.x * macroFreq, v.y * macroFreq, v.z * macroFreq, seed + 999, Math.max(2, Math.floor(oct/2)), lac, gain);
      const d = amp * micro + macroAmp * 0.35 * macro;

      v.addScaledVector(n, d);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    pos.needsUpdate = true;
  },

  _reverseWinding: function (geom) {
    if (!geom.index) return;
    const idx = geom.index.array;
    for (let i = 0; i < idx.length; i += 3) {
      const b = idx[i + 1];
      idx[i + 1] = idx[i + 2];
      idx[i + 2] = b;
    }
    geom.index.needsUpdate = true;
  },

  _build: function () {
    // Clean previous
    if (this._mesh) {
      this.el.object3D.remove(this._mesh);
      this._mesh.geometry && this._mesh.geometry.dispose();
      const mats = Array.isArray(this._mesh.material) ? this._mesh.material : [this._mesh.material];
      mats.forEach(m => m && m.dispose && m.dispose());
      this._mesh = null;
    }

    const d = this.data;

    const thetaLen = THREE.MathUtils.degToRad(d.thetaLength);

    // Build base dome geometry (unit radius) as a segment
    const outer = new THREE.SphereGeometry(1, d.widthSegments, d.heightSegments, 0, Math.PI * 2, 0, thetaLen);
    const inner = new THREE.SphereGeometry(1, d.widthSegments, d.heightSegments, 0, Math.PI * 2, 0, thetaLen);

    // Scale to ellipsoids (radius * scale)
    const outerScale = new THREE.Vector3(d.radius * d.outerScale.x, d.radius * d.outerScale.y, d.radius * d.outerScale.z);
    const innerScale = new THREE.Vector3(d.radius * d.innerScale.x, d.radius * d.innerScale.y, d.radius * d.innerScale.z);

    outer.applyMatrix4(new THREE.Matrix4().makeScale(outerScale.x, outerScale.y, outerScale.z));
    inner.applyMatrix4(new THREE.Matrix4().makeScale(innerScale.x, innerScale.y, innerScale.z));

    // Add uv2 for AO
    outer.setAttribute('uv2', new THREE.BufferAttribute(outer.attributes.uv.array.slice(), 2));
    inner.setAttribute('uv2', new THREE.BufferAttribute(inner.attributes.uv.array.slice(), 2));

    // Compute normals before displacement
    outer.computeVertexNormals();
    inner.computeVertexNormals();

    // Optional displacement to preserve the cave feel
    if (d.displaceAmp > 0.0001 || d.macroAmp > 0.0001) {
      this._displaceInPlace(outer, d.displaceAmp, d.displaceFreq, d.macroAmp, d.macroFreq, d.seed, d.octaves, d.lacunarity, d.gain);
      this._displaceInPlace(inner, d.displaceAmp * 0.88, d.displaceFreq, d.macroAmp * 0.90, d.macroFreq, d.seed + 17, d.octaves, d.lacunarity, d.gain);
      outer.computeVertexNormals();
      inner.computeVertexNormals();
    }

    // Reverse inner winding so normals point inward (toward the cavity)
    this._reverseWinding(inner);
    inner.computeVertexNormals();

    const outerPos = outer.attributes.position;
    const innerPos = inner.attributes.position;
    const outerNor = outer.attributes.normal;
    const innerNor = inner.attributes.normal;
    const outerUv  = outer.attributes.uv;
    const innerUv  = inner.attributes.uv;
    const outerUv2 = outer.attributes.uv2;
    const innerUv2 = inner.attributes.uv2;

    const outerCount = outerPos.count;
    const innerCount = innerPos.count;

    // Combined attributes
    const positions = new Float32Array((outerCount + innerCount + (d.widthSegments + 1) * 2) * 3);
    const normals   = new Float32Array(positions.length);
    const uvs       = new Float32Array((outerCount + innerCount + (d.widthSegments + 1) * 2) * 2);
    const uv2s      = new Float32Array(uvs.length);

    // Copy outer
    positions.set(outerPos.array, 0);
    normals.set(outerNor.array, 0);
    uvs.set(outerUv.array, 0);
    uv2s.set(outerUv2.array, 0);

    // Copy inner
    const o3 = outerCount * 3;
    const o2 = outerCount * 2;
    positions.set(innerPos.array, o3);
    normals.set(innerNor.array, o3);
    uvs.set(innerUv.array, o2);
    uv2s.set(innerUv2.array, o2);

    // Add ring vertices (duplicated) for cleaner wall UVs
    const ringBaseOuter = d.heightSegments * (d.widthSegments + 1);
    const ringBaseInner = ringBaseOuter; // same indexing layout

    const wallVertStart = outerCount + innerCount;
    for (let i = 0; i <= d.widthSegments; i++) {
      const oi = ringBaseOuter + i;
      const ii = ringBaseInner + i;

      // outer ring vertex
      positions.set([outerPos.getX(oi), outerPos.getY(oi), outerPos.getZ(oi)], (wallVertStart + i) * 3);
      // inner ring vertex
      positions.set([innerPos.getX(ii), innerPos.getY(ii), innerPos.getZ(ii)], (wallVertStart + (d.widthSegments + 1) + i) * 3);

      // temporary normals; will recompute later
      normals.set([0, -1, 0], (wallVertStart + i) * 3);
      normals.set([0, -1, 0], (wallVertStart + (d.widthSegments + 1) + i) * 3);

      // UVs around the rim
      const u = i / d.widthSegments;
      uvs.set([u, 0], (wallVertStart + i) * 2);
      uvs.set([u, 1], (wallVertStart + (d.widthSegments + 1) + i) * 2);
      uv2s.set([u, 0], (wallVertStart + i) * 2);
      uv2s.set([u, 1], (wallVertStart + (d.widthSegments + 1) + i) * 2);
    }

    // Indices
    const outerIdx = outer.index.array;
    const innerIdx = inner.index.array;

    // Wall uses (widthSegments) quads -> 2 tris each
    const wallTris = d.widthSegments * 2;
    const wallIdxCount = wallTris * 3;

    const index = new Uint32Array(outerIdx.length + innerIdx.length + wallIdxCount);

    // Outer indices (material 0)
    index.set(outerIdx, 0);
    const outerIndexStart = 0;
    const outerIndexCount = outerIdx.length;

    // Inner indices (material 1) with vertex offset
    const innerIndexStart = outerIdx.length;
    for (let i = 0; i < innerIdx.length; i++) index[innerIndexStart + i] = innerIdx[i] + outerCount;
    const innerIndexCount = innerIdx.length;

    // Wall indices (material 2)
    const wallIndexStart = innerIndexStart + innerIdx.length;
    let wptr = wallIndexStart;

    const outerRingStart = wallVertStart; // duplicated outer ring
    const innerRingStart = wallVertStart + (d.widthSegments + 1); // duplicated inner ring

    for (let i = 0; i < d.widthSegments; i++) {
      const a = outerRingStart + i;
      const b = outerRingStart + i + 1;
      const c = innerRingStart + i + 1;
      const d0 = innerRingStart + i;

      // Two triangles forming the thickness wall (winding outward)
      index[wptr++] = a; index[wptr++] = b; index[wptr++] = c;
      index[wptr++] = a; index[wptr++] = c; index[wptr++] = d0;
    }

    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    geom.setAttribute('uv2', new THREE.BufferAttribute(uv2s, 2));
    geom.setIndex(new THREE.BufferAttribute(index, 1));

    // Groups for multi-material
    geom.clearGroups();
    geom.addGroup(outerIndexStart, outerIndexCount, 0);
    geom.addGroup(innerIndexStart, innerIndexCount, 1);
    geom.addGroup(wallIndexStart, wallIdxCount, 2);

    geom.computeBoundingSphere();
    geom.computeVertexNormals();

    // Build materials
    const map = this._texFromImg(d.diffuse, 'color');
    const normalMap = this._texFromImg(d.normal, 'data');
    const roughMap = this._texFromImg(d.rough, 'data');
    const aoMap = this._texFromImg(d.ao, 'data');

    if (map) map.repeat.set(d.repeat.x, d.repeat.y);
    if (normalMap) normalMap.repeat.set(d.repeat.x, d.repeat.y);
    if (roughMap) roughMap.repeat.set(d.repeat.x, d.repeat.y);
    if (aoMap) aoMap.repeat.set(d.repeat.x, d.repeat.y);

    const outerMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: map || null,
      normalMap: normalMap || null,
      roughnessMap: roughMap || null,
      aoMap: aoMap || null,
      aoMapIntensity: 1.0,
      metalness: 0.0,
      roughness: 1.0,
      side: THREE.FrontSide
    });
    if (outerMat.normalMap) outerMat.normalScale.set(d.normalScale.x, d.normalScale.y);

    const innerMat = outerMat.clone();
    if (innerMat.normalMap) innerMat.normalScale.set(d.normalScale.x, -Math.abs(d.normalScale.y)); // flip Y for inside

    const wallMat = outerMat.clone();

    const mesh = new THREE.Mesh(geom, [outerMat, innerMat, wallMat]);
    mesh.castShadow = false;
    mesh.receiveShadow = true;

    this.el.setObject3D('mesh', mesh);
    this._mesh = mesh;

    // Let other systems/components know geometry exists
    this.el.emit('dome-shell-built', {mesh: mesh});
  }
});

AFRAME.registerComponent('cave-displace', {
  schema: {
    amp:   { type: 'number', default: 0.22 },  // displacement amplitude (meters)
    maxDown:    { type: 'number', default: 0.030 }, // meters (clamp for shallow depressions; prevents showing bottom)
    freq:  { type: 'number', default: 1.15 },  // base noise frequency
    seed:  { type: 'number', default: 13 },    // per-mesh seed
    oct:   { type: 'number', default: 4 },     // octaves
    lac:   { type: 'number', default: 2.0 },   // lacunarity
    gain:  { type: 'number', default: 0.52 },  // amplitude falloff per octave
    // optional extra "macro" shaping so the cave reads as large, soft bulges + small chisel detail
    macroFreq: { type: 'number', default: 0.42 },
    macroAmp:  { type: 'number', default: 0.65 }
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },

  // ---- Smooth value noise (trilinear interpolation) ----
  _hash11: function (n) {
    // deterministic pseudo-random in [0,1)
    const s = Math.sin(n) * 43758.5453123;
    return s - Math.floor(s);
  },
  _randLattice: function (ix, iy, iz, seed) {
    // lattice random in [-1,1]
    const n = ix * 127.1 + iy * 311.7 + iz * 74.7 + seed * 19.19;
    return this._hash11(n) * 2.0 - 1.0;
  },
  _fade: function (t) { return t * t * (3.0 - 2.0 * t); },
  _lerp: function (a, b, t) { return a + (b - a) * t; },
  _noise3: function (x, y, z, seed) {
    // value noise in [-1,1]
    const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
    const fx = x - ix, fy = y - iy, fz = z - iz;

    const u = this._fade(fx), v = this._fade(fy), w = this._fade(fz);

    const n000 = this._randLattice(ix,     iy,     iz,     seed);
    const n100 = this._randLattice(ix + 1, iy,     iz,     seed);
    const n010 = this._randLattice(ix,     iy + 1, iz,     seed);
    const n110 = this._randLattice(ix + 1, iy + 1, iz,     seed);

    const n001 = this._randLattice(ix,     iy,     iz + 1, seed);
    const n101 = this._randLattice(ix + 1, iy,     iz + 1, seed);
    const n011 = this._randLattice(ix,     iy + 1, iz + 1, seed);
    const n111 = this._randLattice(ix + 1, iy + 1, iz + 1, seed);

    const nx00 = this._lerp(n000, n100, u);
    const nx10 = this._lerp(n010, n110, u);
    const nx01 = this._lerp(n001, n101, u);
    const nx11 = this._lerp(n011, n111, u);

    const nxy0 = this._lerp(nx00, nx10, v);
    const nxy1 = this._lerp(nx01, nx11, v);

    return this._lerp(nxy0, nxy1, w);
  },
  _fbm: function (x, y, z, seed, oct, freq, lac, gain) {
    let a = 1.0, f = freq, sum = 0.0, norm = 0.0;
    for (let i = 0; i < oct; i++) {
      sum += a * this._noise3(x * f, y * f, z * f, seed + i * 101.7);
      norm += a;
      a *= gain;
      f *= lac;
    }
    return (norm > 0) ? (sum / norm) : 0;
  },

  _apply: function () {
    const obj = this.el.getObject3D('mesh');
    if (!obj) return;

    const meshes = [];
    obj.traverse(o => { if (o && o.isMesh && o.geometry) meshes.push(o); });
    if (!meshes.length) return;

    const d = this.data;

    for (let m = 0; m < meshes.length; m++) {
      const mesh = meshes[m];
      const geom = mesh.geometry;
      if (!geom || !geom.attributes || !geom.attributes.position) continue;

      // Avoid double-applying.
      if (geom.userData && geom.userData._caveDisplaced) continue;

      const g = geom.clone();
      const pos = g.attributes.position;

      if (!g.attributes.normal) g.computeVertexNormals();
      const normals = g.attributes.normal;

      const v = new THREE.Vector3();
      const nrm = new THREE.Vector3();

      // Two-layer noise: broad bulges (macro) + surface chiseling (micro)
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        nrm.fromBufferAttribute(normals, i);

        const macro = this._fbm(v.x, v.y, v.z, d.seed + 17.0, d.oct, d.macroFreq, d.lac, d.gain);
        const micro = this._fbm(v.x, v.y, v.z, d.seed,        d.oct, d.freq,      d.lac, d.gain);

        const w = (macro * d.macroAmp) + (micro * (1.0 - d.macroAmp));

        v.addScaledVector(nrm, w * d.amp);
        pos.setXYZ(i, v.x, v.y, v.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      smoothNormalsByPosition(g, 1e-4);
      g.userData = g.userData || {};
      g.userData._caveDisplaced = true;

      mesh.geometry = g;
    }
  }
});


// Shape a single "rectangular-ish" rock seat (tapered + slightly skewed), keeping it watertight/solid.
// Intended for rock_seat_01. Runs BEFORE cave-displace (vertex push) and keeps a flat-ish base.
AFRAME.registerComponent('rock-seat-shape', {
  schema: {
    endShrink:   { type: 'number', default: 0.14 }, // fraction (0..0.4) : small end width shrink
    endDrop:     { type: 'number', default: 0.16 }, // fraction (0..0.4) : small end height drop
    longSideCut: { type: 'number', default: 0.12 }, // meters: shorten one long side near the small end
    cutSide:     { type: 'string', default: 'posz' } , // 'posz' or 'negz'
    edgeBevel:  { type: 'number', default: 0.0 } // meters: chamfer amount (0..0.12)
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },
  _apply: function () {
    const root = this.el.getObject3D('mesh');
    if (!root) return;

    const d = this.data;
    const meshes = [];
    root.traverse(o => { if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) meshes.push(o); });
    if (!meshes.length) return;

    for (let m = 0; m < meshes.length; m++) {
      const mesh = meshes[m];
      const geom = mesh.geometry;
      if (geom.userData && geom.userData._rockSeatShaped) continue;

      const g = geom.clone();
      g.computeBoundingBox();
      const bb = g.boundingBox;
      if (!bb) continue;

      const minX = bb.min.x, maxX = bb.max.x;
      const minY = bb.min.y;
      const centerZ = (bb.min.z + bb.max.z) * 0.5;

      const maxY = bb.max.y;
      const minZ = bb.min.z, maxZ = bb.max.z;
      const centerX = (minX + maxX) * 0.5;
      const spanY = Math.max(1e-6, (maxY - minY));
      const spanZ = Math.max(1e-6, (maxZ - minZ));

      const spanX = Math.max(1e-6, (maxX - minX));

      const bevelMax = 0.25 * Math.min(spanX, spanY, spanZ);
      const bevel = Math.max(0, Math.min((d.edgeBevel || 0), bevelMax));
      const pos = g.attributes.position;

      const clamp01 = (v) => Math.max(0, Math.min(1, v));
      const shrink = clamp01(d.endShrink);
      const drop   = clamp01(d.endDrop);

      const v = new THREE.Vector3();

      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);

        // xNorm: 0 at "small end" (minX), 1 at "big end" (maxX)
        const xNorm = clamp01((v.x - minX) / spanX);

        // Width taper (Z): smaller at xNorm=0, full at xNorm=1.
        const wFactor = (1.0 - shrink) + (shrink * xNorm); // 1-shrink .. 1
        v.z = centerZ + (v.z - centerZ) * wFactor;

        // Height taper anchored to the bottom: top lowers at xNorm=0, bottom stays put.
        const hFactor = (1.0 - drop) + (drop * xNorm); // 1-drop .. 1
        v.y = minY + (v.y - minY) * hFactor;

        // Shorten one of the long sides (plan-view trapezoid feel).
        const isCutSide = (d.cutSide === 'negz') ? (v.z < centerZ) : (v.z > centerZ);
        if (isCutSide) {
          const cut = d.longSideCut * (1.0 - xNorm);
          v.x += cut; // pulls the small-end corner inward on this side only
        }

        // Slight chamfer to avoid razor-sharp box edges (keeps it rock-like but still angular)
        if (bevel > 1e-6) {
          const sx = (v.x >= centerX) ? 1 : -1;
          const sz = (v.z >= centerZ) ? 1 : -1;

          let dx = (sx > 0) ? (maxX - v.x) : (v.x - minX);
          let dz = (sz > 0) ? (maxZ - v.z) : (v.z - minZ);
          dx = Math.max(0, dx);
          dz = Math.max(0, dz);

          // XZ edge chamfer (vertical edges)
          if (dx < bevel && dz < bevel) {
            const t = (bevel - (dx + dz)) * 0.5;
            dx = Math.max(0, Math.min(bevel, dx + t));
            dz = Math.max(0, Math.min(bevel, dz + t));
            v.x = (sx > 0) ? (maxX - dx) : (minX + dx);
            v.z = (sz > 0) ? (maxZ - dz) : (minZ + dz);
          }

          // Top-edge chamfers only (keep the base solid/flat)
          let dy = maxY - v.y;
          if (dy < bevel) {
            dy = Math.max(0, dy);

            // Top corner (XYZ) chamfer
            if (dx < bevel && dz < bevel) {
              const t3 = (bevel - (dx + dz + dy)) / 3.0;
              dx = Math.max(0, Math.min(bevel, dx + t3));
              dz = Math.max(0, Math.min(bevel, dz + t3));
              dy = Math.max(0, Math.min(bevel, dy + t3));
              v.x = (sx > 0) ? (maxX - dx) : (minX + dx);
              v.z = (sz > 0) ? (maxZ - dz) : (minZ + dz);
              v.y = maxY - dy;
            } else {
              // XY chamfer
              if (dx < bevel) {
                const t = (bevel - (dx + dy)) * 0.5;
                dx = Math.max(0, Math.min(bevel, dx + t));
                dy = Math.max(0, Math.min(bevel, dy + t));
                v.x = (sx > 0) ? (maxX - dx) : (minX + dx);
                v.y = maxY - dy;
              }

              // ZY chamfer
              dy = maxY - v.y;
              if (dz < bevel && dy < bevel) {
                const t = (bevel - (dz + dy)) * 0.5;
                dz = Math.max(0, Math.min(bevel, dz + t));
                dy = Math.max(0, Math.min(bevel, dy + t));
                v.z = (sz > 0) ? (maxZ - dz) : (minZ + dz);
                v.y = maxY - dy;
              }
            }
          }
        }

        pos.setXYZ(i, v.x, v.y, v.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      smoothNormalsByPosition(g, 1e-4);
      g.userData = g.userData || {};
      g.userData._rockSeatShaped = true;

      mesh.geometry = g;
    }
  }
});

  },
  _fade: function (t) { return t * t * (3.0 - 2.0 * t); },
  _lerp: function (a, b, t) { return a + (b - a) * t; },
  _noise3: function (x, y, z, seed) {

    const fx = x - ix, fy = y - iy, fz = z - iz;
    const u = this._fade(fx), v = this._fade(fy), w = this._fade(fz);

    const n000 = this._randLattice(ix,     iy,     iz,     seed);
    const n100 = this._randLattice(ix + 1, iy,     iz,     seed);
    const n010 = this._randLattice(ix,     iy + 1, iz,     seed);
    const n110 = this._randLattice(ix + 1, iy + 1, iz,     seed);

    const n001 = this._randLattice(ix,     iy,     iz + 1, seed);
    const n101 = this._randLattice(ix + 1, iy,     iz + 1, seed);
    const n011 = this._randLattice(ix,     iy + 1, iz + 1, seed);
    const n111 = this._randLattice(ix + 1, iy + 1, iz + 1, seed);

    const nx00 = this._lerp(n000, n100, u);
    const nx10 = this._lerp(n010, n110, u);
    const nx01 = this._lerp(n001, n101, u);
    const nx11 = this._lerp(n011, n111, u);

    const nxy0 = this._lerp(nx00, nx10, v);
    const nxy1 = this._lerp(nx01, nx11, v);

    return this._lerp(nxy0, nxy1, w);
  },
  _fbm: function (x, y, z, seed, oct, freq, lac, gain) {
    let a = 1.0, f = freq, sum = 0.0, norm = 0.0;
    for (let i = 0; i < oct; i++) {
      sum += a * this._noise3(x * f, y * f, z * f, seed + i * 101.7);
      norm += a;
      a *= gain;
      f *= lac;
    }
    return (norm > 0) ? (sum / norm) : 0;

  _apply: function () {
    const obj = this.el.getObject3D('mesh');
    if (!obj) return;

    const meshes = [];
    obj.traverse(o => { if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) meshes.push(o); });
    if (!meshes.length) return;

    const d = this.data;

    for (let mi = 0; mi < meshes.length; mi++) {
      const mesh = meshes[mi];
      const geom = mesh.geometry;
      if (geom.userData && geom.userData._caveWarped) continue;

      const g = geom.clone();
      if (!g.attributes.normal) g.computeVertexNormals();
      const pos = g.attributes.position;
      const nor = g.attributes.normal;

      // bbox for vertical weighting (more warp/sag near bottom)
      g.computeBoundingBox();
      const bb = g.boundingBox;
      const yMin = bb.min.y, yMax = bb.max.y;
      const ySpan = Math.max(1e-6, yMax - yMin);

      const v = new THREE.Vector3();
      const nrm = new THREE.Vector3();
      const axis = new THREE.Vector3(0, 1, 0);
      const t1 = new THREE.Vector3();
      const t2 = new THREE.Vector3();

      for (let i = 0; i < pos.count; i++) {

        if (Math.abs(nrm.dot(axis)) > 0.92) axis.set(1, 0, 0);

        t2.crossVectors(nrm, t1).normalize();

        const nB = this._fbm(v.x, v.y, v.z, d.seed+37,  d.oct, d.freq, d.lac, d.gain);

        // Tangential warp (breaks perfect symmetry without "inflating" the shell much).

        v.addScaledVector(t1, nA * warpScale);
        v.addScaledVector(t2, nB * warpScale);

        // Gentle vertical sag / asymmetry (stronger near bottom).
        const yN = (v.y - yMin) / ySpan;       // 0 bottom → 1 top
        const bottomW = 1.0 - Math.min(1.0, Math.max(0.0, yN));
        const sagN = this._fbm(v.x, 0.0, v.z, d.seed+91, 2, d.freq * 1.35, 2.0, 0.55);
        v.y += (-d.vertical) * bottomW * (0.35 + 0.65 * Math.abs(sagN)) * 0.35;

        pos.setXYZ(i, v.x, v.y, v.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      smoothNormalsByPosition(g, 1e-4);
      g.userData = g.userData || {};
      g.userData._caveWarped = true;
      mesh.geometry = g;
    }
  }
});


// Adds subtle walkable regolith undulation (keeps a flat "donut" around the basin).

// Cuts a circular "portal" opening in a cave shell so a tunnel can connect cleanly.
// Lightweight triangle filtering (not a true boolean) that removes the wall at the tunnel mouth.

AFRAME.registerComponent('cave-portal-cut', {
  schema: {
    // If provided, the cylinder is derived from this entity's world transform.
    target:     { type: 'selector', default: null },
    // Axis in the TARGET's local space (e.g., tunnel cylinder axis is local Y).
    targetAxis: { type: 'vec3', default: {x:0, y:1, z:0} },

    // Fallback (local to the mesh) if no target is supplied.
    center: { type: 'vec3', default: {x:0, y:0, z:0} },
    axis:   { type: 'vec3', default: {x:1, y:0, z:0} },

    // Cylinder definition.
    radius:     { type: 'number', default: 1.25 },  // base radius (meters)
    halfLength: { type: 'number', default: 10.7 },  // extends +/- along axis (meters)

    // Extra clearance to eliminate "paper leftovers" and z-fighting slivers.
    padding: { type: 'number', default: 0.18 },     // meters added to radius
    safety:  { type: 'number', default: 1.04 },     // multiplicative safety margin

    debug:   { type: 'boolean', default: false }
  },

  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    // Also retry after load; the target may exist later (e.g., imported module).
    const scene = this.el.sceneEl;
    if (scene && !scene.hasLoaded) scene.addEventListener('loaded', this._apply);
    setTimeout(this._apply, 0);
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._apply);
    const scene = this.el.sceneEl;
    if (scene) scene.removeEventListener('loaded', this._apply);
  },

  _apply: function () {
    const root = this.el.getObject3D('mesh');
    if (!root) { requestAnimationFrame(this._apply); return; }

    const d = this.data;

    // Resolve target (may load after this component).
    const targetEl = d.target;
    if (targetEl && !targetEl.object3D) { requestAnimationFrame(this._apply); return; }

    // Gather meshes under this entity.
    const meshes = [];
    root.traverse(o => { if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) meshes.push(o); });
    if (!meshes.length) return;

    // Ensure world matrices are current before deriving the cylinder.
    if (this.el.sceneEl && this.el.sceneEl.object3D) this.el.sceneEl.object3D.updateMatrixWorld(true);

    // Compute cylinder segment endpoints in WORLD.
    const cWorld = new THREE.Vector3();
    const dirWorld = new THREE.Vector3();

    if (targetEl) {
      targetEl.object3D.getWorldPosition(cWorld);
      const q = new THREE.Quaternion();
      targetEl.object3D.getWorldQuaternion(q);
      dirWorld.set(d.targetAxis.x, d.targetAxis.y, d.targetAxis.z).applyQuaternion(q).normalize();
    } else {
      // Fallback: interpret center/axis as LOCAL to each mesh (we'll convert per-mesh below).
      cWorld.set(d.center.x, d.center.y, d.center.z);
      dirWorld.set(d.axis.x, d.axis.y, d.axis.z).normalize();
    }

    const halfL = Math.max(0.1, d.halfLength || 1.0);

    const rCut = ((d.radius || 1.0) + Math.max(0, d.padding || 0)) * Math.max(1.0, d.safety || 1.0) + 0.012;
    const rCut2 = rCut * rCut;

    // --- Helpers (Ericson, Real-Time Collision Detection) ---

    // Closest squared distance from point P to triangle ABC.
    const pointSegDistSq = (px,py,pz, ax,ay,az, bx,by,bz) => {
      const abx = bx-ax, aby = by-ay, abz = bz-az;
      const apx = px-ax, apy = py-ay, apz = pz-az;
      const ab2 = abx*abx + aby*aby + abz*abz;
      let t = (ab2 > 1e-12) ? ((apx*abx + apy*aby + apz*abz) / ab2) : 0.0;
      t = t < 0 ? 0 : (t > 1 ? 1 : t);
      const cx = ax + abx*t, cy = ay + aby*t, cz = az + abz*t;
      const dx = px-cx, dy = py-cy, dz = pz-cz;
      return dx*dx + dy*dy + dz*dz;
    };

    const pointTriDistSq = (px,py,pz, ax,ay,az, bx,by,bz, cx,cy,cz) => {
      const abx = bx-ax, aby = by-ay, abz = bz-az;
      const acx = cx-ax, acy = cy-ay, acz = cz-az;
      const apx = px-ax, apy = py-ay, apz = pz-az;

      const d1 = abx*apx + aby*apy + abz*apz;
      const d2 = acx*apx + acy*apy + acz*apz;
      if (d1 <= 0 && d2 <= 0) { const dx=apx,dy=apy,dz=apz; return dx*dx+dy*dy+dz*dz; } // A

      const bpx = px-bx, bpy = py-by, bpz = pz-bz;
      const d3 = abx*bpx + aby*bpy + abz*bpz;
      const d4 = acx*bpx + acy*bpy + acz*bpz;
      if (d3 >= 0 && d4 <= d3) { const dx=bpx,dy=bpy,dz=bpz; return dx*dx+dy*dy+dz*dz; } // B

      const vc = d1*d4 - d3*d2;
      if (vc <= 0 && d1 >= 0 && d3 <= 0) {
        const v = d1 / (d1 - d3);
        const qx = ax + abx*v, qy = ay + aby*v, qz = az + abz*v;
        const dx=px-qx,dy=py-qy,dz=pz-qz; return dx*dx+dy*dy+dz*dz; // AB
      }

      const cpx = px-cx, cpy = py-cy, cpz = pz-cz;
      const d5 = abx*cpx + aby*cpy + abz*cpz;
      const d6 = acx*cpx + acy*cpy + acz*cpz;
      if (d6 >= 0 && d5 <= d6) { const dx=cpx,dy=cpy,dz=cpz; return dx*dx+dy*dy+dz*dz; } // C

      const vb = d5*d2 - d1*d6;
      if (vb <= 0 && d2 >= 0 && d6 <= 0) {
        const w = d2 / (d2 - d6);
        const qx = ax + acx*w, qy = ay + acy*w, qz = az + acz*w;
        const dx=px-qx,dy=py-qy,dz=pz-qz; return dx*dx+dy*dy+dz*dz; // AC
      }

      const va = d3*d6 - d5*d4;
      if (va <= 0 && (d4 - d3) >= 0 && (d5 - d6) >= 0) {
        const w = (d4 - d3) / ((d4 - d3) + (d5 - d6));
        const bcx = cx-bx, bcy = cy-by, bcz = cz-bz;
        const qx = bx + bcx*w, qy = by + bcy*w, qz = bz + bcz*w;
        const dx=px-qx,dy=py-qy,dz=pz-qz; return dx*dx+dy*dy+dz*dz; // BC
      }

      // Inside face region: distance to plane
      const nx = aby*acz - abz*acy;
      const ny = abz*acx - abx*acz;
      const nz = abx*acy - aby*acx;
      const n2 = nx*nx + ny*ny + nz*nz;
      if (n2 < 1e-12) {
        const dAB = pointSegDistSq(px,py,pz, ax,ay,az, bx,by,bz);
        const dBC = pointSegDistSq(px,py,pz, bx,by,bz, cx,cy,cz);
        const dCA = pointSegDistSq(px,py,pz, cx,cy,cz, ax,ay,az);
        return Math.min(dAB, dBC, dCA);
      }
      return ((apx*nx + apy*ny + apz*nz) ** 2) / n2;
    };

    const segSegDistSq = (p1x,p1y,p1z,p2x,p2y,p2z, q1x,q1y,q1z,q2x,q2y,q2z) => {
      const ux = p2x - p1x, uy = p2y - p1y, uz = p2z - p1z;
      const vx = q2x - q1x, vy = q2y - q1y, vz = q2z - q1z;
      const wx = p1x - q1x, wy = p1y - q1y, wz = p1z - q1z;

      const a = ux*ux + uy*uy + uz*uz;
      const b = ux*vx + uy*vy + uz*vz;
      const c = vx*vx + vy*vy + vz*vz;
      const d0 = ux*wx + uy*wy + uz*wz;
      const e0 = vx*wx + vy*wy + vz*wz;
      const D = a*c - b*b;

      const SMALL = 1e-12;
      let sc, sN, sD = D;
      let tc, tN, tD = D;

      if (D < SMALL) { sN = 0.0; sD = 1.0; tN = e0; tD = c; }
      else {
        sN = (b*e0 - c*d0);
        tN = (a*e0 - b*d0);
        if (sN < 0.0) { sN = 0.0; tN = e0; tD = c; }
        else if (sN > sD) { sN = sD; tN = e0 + b; tD = c; }
      }

      if (tN < 0.0) {
        tN = 0.0;
        if (-d0 < 0.0) sN = 0.0;
        else if (-d0 > a) sN = sD;
        else { sN = -d0; sD = a; }
      } else if (tN > tD) {
        tN = tD;
        if ((-d0 + b) < 0.0) sN = 0.0;
        else if ((-d0 + b) > a) sN = sD;
        else { sN = (-d0 + b); sD = a; }
      }

      sc = (Math.abs(sN) < SMALL ? 0.0 : sN / sD);
      tc = (Math.abs(tN) < SMALL ? 0.0 : tN / tD);

      const dx = wx + (sc * ux) - (tc * vx);
      const dy = wy + (sc * uy) - (tc * vy);
      const dz = wz + (sc * uz) - (tc * vz);
      return dx*dx + dy*dy + dz*dz;
    };

    // Segment-triangle intersection (Möller–Trumbore); returns true if the segment pierces the triangle.
    const segIntersectsTri = (p0x,p0y,p0z, p1x,p1y,p1z, ax,ay,az, bx,by,bz, cx,cy,cz) => {
      const dirx = p1x-p0x, diry = p1y-p0y, dirz = p1z-p0z;
      const e1x = bx-ax, e1y = by-ay, e1z = bz-az;
      const e2x = cx-ax, e2y = cy-ay, e2z = cz-az;

      const pvx = diry*e2z - dirz*e2y;
      const pvy = dirz*e2x - dirx*e2z;
      const pvz = dirx*e2y - diry*e2x;

      const det = e1x*pvx + e1y*pvy + e1z*pvz;
      if (Math.abs(det) < 1e-10) return false;
      const invDet = 1.0 / det;

      const tvx = p0x-ax, tvy = p0y-ay, tvz = p0z-az;
      const u = (tvx*pvx + tvy*pvy + tvz*pvz) * invDet;
      if (u < 0.0 || u > 1.0) return false;

      const qvx = tvy*e1z - tvz*e1y;
      const qvy = tvz*e1x - tvx*e1z;
      const qvz = tvx*e1y - tvy*e1x;

      const v = (dirx*qvx + diry*qvy + dirz*qvz) * invDet;
      if (v < 0.0 || (u + v) > 1.0) return false;

      const t = (e2x*qvx + e2y*qvy + e2z*qvz) * invDet;
      return (t >= 0.0 && t <= 1.0);
    };

    // Minimum squared distance between a segment and a triangle.
    const segTriDistSq = (p0x,p0y,p0z, p1x,p1y,p1z, ax,ay,az, bx,by,bz, cx,cy,cz) => {
      if (segIntersectsTri(p0x,p0y,p0z, p1x,p1y,p1z, ax,ay,az, bx,by,bz, cx,cy,cz)) return 0.0;

      let d2 = pointTriDistSq(p0x,p0y,p0z, ax,ay,az, bx,by,bz, cx,cy,cz);
      d2 = Math.min(d2, pointTriDistSq(p1x,p1y,p1z, ax,ay,az, bx,by,bz, cx,cy,cz));

      d2 = Math.min(d2, segSegDistSq(p0x,p0y,p0z, p1x,p1y,p1z, ax,ay,az, bx,by,bz));
      d2 = Math.min(d2, segSegDistSq(p0x,p0y,p0z, p1x,p1y,p1z, bx,by,bz, cx,cy,cz));
      d2 = Math.min(d2, segSegDistSq(p0x,p0y,p0z, p1x,p1y,p1z, cx,cy,cz, ax,ay,az));
      return d2;
    };

    const tmpP0 = new THREE.Vector3();
    const tmpP1 = new THREE.Vector3();

    for (let mi = 0; mi < meshes.length; mi++) {
      const mesh = meshes[mi];
      const geom = mesh.geometry;
      if (!geom || !geom.attributes || !geom.attributes.position) continue;

      if (geom.userData && geom.userData._portalCut) continue;

      // Clone once per mesh so we don't mutate shared buffers.
      const g = geom.clone();
      mesh.geometry = g;

      const pos = g.attributes.position;

      // Ensure there is an index to filter.
      if (!g.index) {
        const n = pos.count;
        const Arr = (n > 65535) ? Uint32Array : Uint16Array;
        const idx = new Arr(n);
        for (let i = 0; i < n; i++) idx[i] = i;
        g.setIndex(new THREE.BufferAttribute(idx, 1));
      }

      const idxArr = g.index.array;

      // Compute segment endpoints in THIS MESH's LOCAL space.
      let p0x,p0y,p0z,p1x,p1y,p1z;
      if (targetEl) {
        tmpP0.copy(cWorld).addScaledVector(dirWorld, -halfL);
        tmpP1.copy(cWorld).addScaledVector(dirWorld,  halfL);
        mesh.worldToLocal(tmpP0);
        mesh.worldToLocal(tmpP1);
        p0x=tmpP0.x; p0y=tmpP0.y; p0z=tmpP0.z;
        p1x=tmpP1.x; p1y=tmpP1.y; p1z=tmpP1.z;
      } else {
        // Fallback: treat center/axis as local to the mesh.
        const u = dirWorld; // already normalized from d.axis
        p0x = d.center.x - u.x * halfL; p0y = d.center.y - u.y * halfL; p0z = d.center.z - u.z * halfL;
        p1x = d.center.x + u.x * halfL; p1y = d.center.y + u.y * halfL; p1z = d.center.z + u.z * halfL;
      }

      // Groups-aware index filtering (preserves multi-material dome shell).
      const groups = (g.groups && g.groups.length) ? g.groups.slice() : [{ start: 0, count: idxArr.length, materialIndex: 0 }];

      const newIndex = [];
      const newGroups = [];
      let cursor = 0;

      for (let gi = 0; gi < groups.length; gi++) {
        const gr = groups[gi];
        const start = gr.start | 0;
        const end = Math.min(idxArr.length, start + (gr.count | 0));
        const kept = [];

        for (let ii = start; ii + 2 < end; ii += 3) {
          const ia = idxArr[ii], ib = idxArr[ii+1], ic = idxArr[ii+2];

          const ax = pos.getX(ia), ay = pos.getY(ia), az = pos.getZ(ia);
          const bx = pos.getX(ib), by = pos.getY(ib), bz = pos.getZ(ib);
          const cx = pos.getX(ic), cy = pos.getY(ic), cz = pos.getZ(ic);

          const d2 = segTriDistSq(p0x,p0y,p0z, p1x,p1y,p1z, ax,ay,az, bx,by,bz, cx,cy,cz);

          // Keep only triangles outside the clearance cylinder.
          if (d2 > rCut2) {
            kept.push(ia, ib, ic);
          }
        }

        if (kept.length) {
          newGroups.push({ start: cursor, count: kept.length, materialIndex: (gr.materialIndex | 0) });
          cursor += kept.length;
          for (let k = 0; k < kept.length; k++) newIndex.push(kept[k]);
        }
      }

      const Arr = (pos.count > 65535) ? Uint32Array : Uint16Array;
      g.setIndex(new THREE.BufferAttribute(new Arr(newIndex), 1));
      g.clearGroups();
      for (let gi = 0; gi < newGroups.length; gi++) {
        const gr = newGroups[gi];
        g.addGroup(gr.start, gr.count, gr.materialIndex);
      }

      g.computeVertexNormals();
      smoothNormalsByPosition(g, 1e-4);

      g.userData = g.userData || {};
      g.userData._portalCut = true;
    }
  }
});





// Wait until the imported tunnel has been merge-aligned to the host anchor, then cut the dome portal.
// This avoids the classic failure mode where the cut runs using the tunnel's pre-aligned transform (wrong location),
// producing no opening (or cutting in the wrong place) and later leaving "dome leftovers" inside the tunnel.
AFRAME.registerComponent('portal-cut-wait', {
  schema: {
    target: { type: 'selector' },         // e.g., #tunnel_01_shell_inner
    far:    { type: 'selector' },         // e.g., #tunnel_01_rim_far
    anchor: { type: 'selector' },         // e.g., #merge_portal_anchor

    targetAxis: { type: 'vec3', default: {x:0, y:1, z:0} }, // axis in TARGET local space

    radius:     { type: 'number', default: 1.25 },  // tunnel inner radius
    padding:    { type: 'number', default: 0.24 },  // extra clearance (kills slivers)
    safety:     { type: 'number', default: 1.06 },  // multiplicative margin
    halfLength: { type: 'number', default: 12.0 },  // cut span along the tunnel axis

    epsilon:    { type: 'number', default: 0.03 },  // how close far rim must be to anchor to be "aligned"
    debug:      { type: 'boolean', default: false }
  },

  init: function () {
    this._done = false;
    this._wFar = new THREE.Vector3();
    this._wAnc = new THREE.Vector3();
    this._lastLogAt = 0;
  },

  tick: function (t) {
    if (this._done) return;

    const d = this.data;
    const targetEl = d.target;
    const farEl    = d.far;
    const anchorEl = d.anchor;

    if (!targetEl || !farEl || !anchorEl) return;
    if (!targetEl.object3D || !farEl.object3D || !anchorEl.object3D) return;

    // Keep world matrices current.
    const sceneObj = this.el.sceneEl && this.el.sceneEl.object3D;
    if (sceneObj) sceneObj.updateMatrixWorld(true);

    farEl.object3D.getWorldPosition(this._wFar);
    anchorEl.object3D.getWorldPosition(this._wAnc);

    const dist = this._wFar.distanceTo(this._wAnc);

    if (d.debug && (t - this._lastLogAt > 500)) {
      this._lastLogAt = t;
      console.log('[portal-cut-wait] far→anchor dist:', dist.toFixed(4));
    }

    if (dist > Math.max(0.005, d.epsilon)) return;

    // Apply cut only after alignment is stable.
    const cutStr =
      'target: #'+ targetEl.id + '; ' +
      'targetAxis: ' + d.targetAxis.x + ' ' + d.targetAxis.y + ' ' + d.targetAxis.z + '; ' +
      'radius: ' + d.radius + '; ' +
      'padding: ' + d.padding + '; ' +
      'halfLength: ' + d.halfLength + '; ' +
      'safety: ' + d.safety + ';';

    if (d.debug) console.log('[portal-cut-wait] applying cave-portal-cut:', cutStr);

    // Setting the attribute will instantiate the cutter and run once.
    this.el.setAttribute('cave-portal-cut', cutStr);

    this._done = true;

    // Optional: hide this component once finished.
    this.el.removeAttribute('portal-cut-wait');
  }
});



AFRAME.registerComponent('ground-undulate', {
  schema: {
    amp:         { type: 'number', default: 0.07 },   // meters
    freq:        { type: 'number', default: 0.22 },   // low frequency
    seed:        { type: 'int',    default: 23 },
    flatCenter:  { type: 'vec3',   default: {x: 0, y: 0, z: 0} }, // world
    flatRadius:  { type: 'number', default: 5.2 },    // meters
    falloff:     { type: 'number', default: 2.0 }     // meters
  },

  init: function () {
    this._applied = false;
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },

  remove: function () { this.el.removeEventListener('object3dset', this._apply); },

  _hash: function (x, z, seed) {
    const s = Math.sin(x * 127.1 + z * 311.7 + seed * 17.0) * 43758.5453123;
    return s - Math.floor(s);
  },
  _fade: function (t) { return t * t * (3.0 - 2.0 * t); },
  _lerp: function (a, b, t) { return a + (b - a) * t; },

  _noise2: function (x, z, seed) {
    const ix = Math.floor(x), iz = Math.floor(z);
    const fx = x - ix, fz = z - iz;
    const u = this._fade(fx), v = this._fade(fz);

    const n00 = this._hash(ix,     iz,     seed) * 2.0 - 1.0;
    const n10 = this._hash(ix + 1, iz,     seed) * 2.0 - 1.0;
    const n01 = this._hash(ix,     iz + 1, seed) * 2.0 - 1.0;
    const n11 = this._hash(ix + 1, iz + 1, seed) * 2.0 - 1.0;

    const nx0 = this._lerp(n00, n10, u);
    const nx1 = this._lerp(n01, n11, u);
    return this._lerp(nx0, nx1, v);
  },

  _smoothstep: function (t) { return t * t * (3.0 - 2.0 * t); },

  _apply: function () {
    if (this._applied) return;

    const mesh = this.el.getObject3D('mesh');
    if (!mesh || !mesh.geometry || !mesh.geometry.attributes || !mesh.geometry.attributes.position) return;

    const geom = mesh.geometry.clone();
    mesh.geometry = geom;

    const pos = geom.attributes.position;

    const qWorld = new THREE.Quaternion();
    mesh.getWorldQuaternion(qWorld);
    const invQ = qWorld.clone().invert();
    const upLocal = new THREE.Vector3(0, 1, 0).applyQuaternion(invQ).normalize();

    const tmpLocal = new THREE.Vector3();
    const tmpWorld = new THREE.Vector3();

    const d = this.data;
    const c = new THREE.Vector3(d.flatCenter.x, d.flatCenter.y, d.flatCenter.z);

    for (let i = 0; i < pos.count; i++) {
      tmpLocal.fromBufferAttribute(pos, i);
      tmpWorld.copy(tmpLocal);
      mesh.localToWorld(tmpWorld);

      const dx = tmpWorld.x - c.x;
      const dz = tmpWorld.z - c.z;
      const r = Math.sqrt(dx*dx + dz*dz);

      // Mask: keep an inner donut area flat around the basin.
      const t = (r - d.flatRadius) / Math.max(1e-6, d.falloff);
      const mask = Math.min(1.0, Math.max(0.0, this._smoothstep(t)));

      if (mask <= 0.0001) continue;

      const n1 = this._noise2(tmpWorld.x * d.freq, tmpWorld.z * d.freq, d.seed);
      const n2 = this._noise2(tmpWorld.x * d.freq * 2.7, tmpWorld.z * d.freq * 2.7, d.seed + 9);
      const n = (n1 * 0.7 + n2 * 0.3);

      const rise = d.amp * n * mask;
      tmpLocal.addScaledVector(upLocal, rise);

      pos.setXYZ(i, tmpLocal.x, tmpLocal.y, tmpLocal.z);
    }

    pos.needsUpdate = true;
    geom.computeVertexNormals();

      smoothNormalsByPosition(geom, 1e-4);
    this._applied = true;
  }
});

  _smoothstep: function (t) { return t * t * (3.0 - 2.0 * t); },

  _apply: function () {

    obj.traverse(o => { if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) meshes.push(o); });

    // This prevents double-cloning and avoids racing the displacement step.

          this.el.setAttribute('cave-floor-seal', { retries: d.retries - 1 });
          setTimeout(this._apply, 25);

    obj.traverse(m => { if (m && m.isMesh) m.updateMatrixWorld(true); });

AFRAME.registerComponent('collider-ring', {
  schema: {
    center:    { type: 'vec3',   default: {x:0,y:0,z:0} },
    radiusX:   { type: 'number', default: 10 },
    radiusZ:   { type: 'number', default: 10 },
    segments:  { type: 'int',    default: 36 },
    height:    { type: 'number', default: 5.5 },
    thickness: { type: 'number', default: 1.0 },
    y:         { type: 'number', default: 2.4 },
    openStart: { type: 'number', default: -1 }, // degrees
    openEnd:   { type: 'number', default: -1 }, // degrees
    layers:    { type: 'int',    default: 2 },  // 2 staggered rings to eliminate gaps
    overlap:   { type: 'number', default: 1.45 } // segment depth multiplier
  },
  init: function () { this._build(); },
  update: function () { this._build(); },
  _build: function () {
    while (this.el.firstChild) this.el.removeChild(this.el.firstChild);

    const d = this.data;
    const cx = d.center.x, cz = d.center.z;
    const seg = Math.max(12, d.segments|0);
    const step = 360 / seg;

    const avgR = (d.radiusX + d.radiusZ) * 0.5;
    const segLen = (2 * Math.PI * avgR / seg) * d.overlap;

    const inOpen = (deg) => {
      if (d.openStart < 0 || d.openEnd < 0) return false;
      const a = (deg % 360 + 360) % 360;
      const s = (d.openStart % 360 + 360) % 360;
      const e = (d.openEnd % 360 + 360) % 360;
      if (s <= e) return (a >= s && a <= e);
      return (a >= s || a <= e);
    };

    const layers = Math.max(1, d.layers|0);

    for (let layer = 0; layer < layers; layer++) {
      const phase = (layer / layers) * (step * 0.5); // stagger
      // Slightly different radii per layer to cover micro-gaps from ellipse curvature.
      const rx = d.radiusX + (layer === 0 ? 0 : d.thickness * 0.25);
      const rz = d.radiusZ + (layer === 0 ? 0 : d.thickness * 0.25);

        const deg = i * step + phase;
        if (inOpen(deg)) continue;

        const rad = deg * DEG2RAD;
        const x = cx + Math.cos(rad) * rx;
        const z = cz + Math.sin(rad) * rz;

        b.setAttribute('class', 'collider');
        b.setAttribute('visible', 'false');
        b.setAttribute('width',  d.thickness);
        b.setAttribute('height', d.height);
        b.setAttribute('depth',  segLen);
        b.setAttribute('position', `${x.toFixed(3)} ${d.y.toFixed(3)} ${z.toFixed(3)}`);
        b.setAttribute('rotation', `0 ${rotY.toFixed(3)} 0`);
        this.el.appendChild(b);

    const a = !!this.keys['KeyA'] || !!this.keys['ArrowLeft'];
    const d = !!this.keys['KeyD'] || !!this.keys['ArrowRight'];

    let f = (w ? 1 : 0) - (s ? 1 : 0);
    let str = (d ? 1 : 0) - (a ? 1 : 0);
    if (f === 0 && str === 0) return;

    const mag = Math.hypot(str, f);
    if (mag > 1e-6) { str /= mag; f /= mag; }

    const yaw = this._getYaw();
    const sin = Math.sin(yaw), cos = Math.cos(yaw);

    const forwardX = -sin, forwardZ = -cos;
    const rightX = cos, rightZ = -sin;

    const moveX = (rightX * str + forwardX * f) * speed * dtS;
    const moveZ = (rightZ * str + forwardZ * f) * speed * dtS;

    const pos = this.el.object3D.position;
    pos.x += moveX;
    pos.z += moveZ;

    this._resolveCollisions(pos);
  }
});

/* ---- Mercury pool local IBL (silver-only: darker silver + higher specular contrast; NO black) ---- */
AFRAME.registerComponent('mercury-ibl-silver', {
  schema: { intensity: { type: 'number', default: 1 } },

  init: function () {
    const makeFace = (w, h, stops) => {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d');

      // Base gradient (all silver/steel tones; avoid pure black)
      const grd = g.createLinearGradient(0, 0, 0, h);
      stops.forEach(s => grd.addColorStop(s[0], s[1]));
      g.fillStyle = grd;
      g.fillRect(0, 0, w, h);

      // Bright silver streaks (mercury "flow")
      g.globalAlpha = 0.26;
      g.fillStyle = '#ffffff';
      for (let i = 0; i < 16; i++) {
        const y = Math.random() * h;
        const hh = 1 + Math.random() * 6;
        g.fillRect(0, y, w, hh);
      }
      g.globalAlpha = 1.0;

      // Gentle vignette for contrast (dark steel gray, NOT black)
      const vg = g.createRadialGradient(w*0.5, h*0.5, h*0.12, w*0.5, h*0.5, h*0.82);
      vg.addColorStop(0, 'rgba(255,255,255,0.0)');
      vg.addColorStop(1, 'rgba(88,94,103,0.28)');
      g.fillStyle = vg;
      g.fillRect(0, 0, w, h);

      return c;
    };

    const size = 256;

    // Faces: +X, -X, +Y, -Y, +Z, -Z
    // Darker silver base with a bright band for crisp specular highlights (no black).
    const side = [[0.0,'#58606b'],[0.40,'#2a3038'],[0.50,'#f7f8fa'],[0.72,'#343b45'],[1.0,'#4b535e']];
    const px = makeFace(size, size, side);
    const nx = makeFace(size, size, side);
    const pz = makeFace(size, size, side);
    const nz = makeFace(size, size, side);

    const py = makeFace(size, size, [[0.0,'#f8fafc'],[0.30,'#d6dbe2'],[0.58,'#a5adb8'],[1.0,'#3a424d']]);
    const ny = makeFace(size, size, [[0.0,'#3a424d'],[0.55,'#232a33'],[1.0,'#3a424d']]);

    const cubeTex = new THREE.CubeTexture([px, nx, py, ny, pz, nz]);
    cubeTex.needsUpdate = true;
    cubeTex.generateMipmaps = true;
    cubeTex.minFilter = THREE.LinearMipmapLinearFilter;
    cubeTex.magFilter = THREE.LinearFilter;


    // three r152+ uses colorSpace; older uses encoding
    if (cubeTex.colorSpace !== undefined && THREE.SRGBColorSpace) cubeTex.colorSpace = THREE.SRGBColorSpace;
    if (cubeTex.encoding !== undefined && THREE.sRGBEncoding) cubeTex.encoding = THREE.sRGBEncoding;

    cubeTex.mapping = THREE.CubeReflectionMapping;
    this._cubeTex = cubeTex;

    this._applyNow = this._applyNow.bind(this);
    this.el.addEventListener('object3dset', this._applyNow);

    // If mesh already exists
    this._applyNow();
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._applyNow);
  },

  _applyNow: function () {
    const mesh = this.el.getObject3D('mesh');
    if (!mesh || !this._cubeTex) return;

    const id = (this.el && this.el.id) ? this.el.id : '';
    let k = 1.0;
    if (id === 'mercury_surface') k = 1.00;
    else if (id === 'mercury_surface_fill') k = 0.82;
    else if (id === 'mercury_subsurface') k = 0.55;
    else if (id === 'mercury_liquid_volume') k = 0.48;
    else if (id === 'mercury_liquid_core') k = 0.42;
    else if (id === 'mercury_liquid_bottom') k = 0.40;

    // Keep reflections punchy, but let the base color drive the darker tone.
    const intensity = (this.data.intensity || 1) * (8.4 * k);

    mesh.traverse((obj) => {
      if (!obj.isMesh) return;
      const mat = obj.material;
      const applyOne = (m) => {
        if (!m || !m.isMaterial) return;
        m.envMap = this._cubeTex;
        m.envMapIntensity = intensity;
        m.needsUpdate = true;
      };
      if (Array.isArray(mat)) mat.forEach(applyOne);
      else applyOne(mat);
    });

/**
 * Triplanar world-space projection for the *diffuse/basecolor map only* on MeshStandardMaterial.
 * This removes UV pole "convergence" artifacts on sphere/ellipsoid ceilings without touching
 * the rest of the PBR pipeline (normal/roughness/AO remain unchanged for stability).
 *
 * Usage:
 */
AFRAME.registerComponent('triplanar-diffuse', {
  schema: {
    // Repeats per meter in world space.
    scale: {type: 'number', default: 0.35},
    // Blend sharpness between projections (higher = crisper).
    sharpness: {type: 'number', default: 4.0}
  },

  init: function () {
    this._applied = false;
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    this.el.addEventListener('model-loaded', this._apply);
    setTimeout(this._apply, 0);
  },

  update: function () {
    this._applied = false;
    this._apply();
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._apply);
    this.el.removeEventListener('model-loaded', this._apply);
  },

  _apply: function () {
    if (this._applied) return;

    const root = this.el.getObject3D('mesh');
    if (!root) return;

    const scale = this.data.scale;
    const sharpness = this.data.sharpness;

    const patchOne = (mat) => {
      if (!mat || !mat.isMeshStandardMaterial) return;
      if (mat.userData && mat.userData._triDiffusePatched) return;

      mat.userData = mat.userData || {};
      mat.userData._triDiffusePatched = true;

      if (mat.map) {
        mat.map.wrapS = THREE.RepeatWrapping;
        mat.map.wrapT = THREE.RepeatWrapping;
        mat.map.needsUpdate = true;
      }

      const prevOnBeforeCompile = mat.onBeforeCompile;
      mat.onBeforeCompile = function (shader) {
        if (prevOnBeforeCompile) prevOnBeforeCompile(shader);

        shader.uniforms.triScale = { value: scale };
        shader.uniforms.triSharpness = { value: sharpness };

        // Vertex: add world position + world normal varyings.
        if (shader.vertexShader.indexOf('varying vec3 vTriWorldPos;') === -1) {
          shader.vertexShader = shader.vertexShader.replace(
            '#include <common>',
            '#include <common>\nvarying vec3 vTriWorldPos;\nvarying vec3 vTriWorldNormal;'
          );

          shader.vertexShader = shader.vertexShader.replace(
            '#include <begin_vertex>',
            '#include <begin_vertex>\nvec4 triWorldPos = modelMatrix * vec4( transformed, 1.0 );\nvTriWorldPos = triWorldPos.xyz;'
          );

          shader.vertexShader = shader.vertexShader.replace(
            '#include <beginnormal_vertex>',
            '#include <beginnormal_vertex>\nvTriWorldNormal = normalize( mat3( modelMatrix ) * objectNormal );'
          );
        }

        // Fragment: helpers + replace the map sampling line in <map_fragment>.
        if (shader.fragmentShader.indexOf('vec4 triSampleColor') === -1) {
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <common>',
            '#include <common>\n' +
            'varying vec3 vTriWorldPos;\n' +
            'varying vec3 vTriWorldNormal;\n' +
            'uniform float triScale;\n' +
            'uniform float triSharpness;\n' +
            'vec3 triWeights(vec3 n){\n' +
            '  vec3 an = abs(n);\n' +
            '  an = pow(an, vec3(triSharpness));\n' +
            '  return an / (an.x + an.y + an.z + 1e-5);\n' +
            '}\n' +
            'vec4 triSampleColor(sampler2D tex, vec3 p, vec3 n){\n' +
            '  vec3 w = triWeights(n);\n' +
            '  vec2 uvx = p.yz * triScale;\n' +
            '  vec2 uvy = p.zx * triScale;\n' +
            '  vec2 uvz = p.xy * triScale;\n' +
            '  return texture2D(tex, uvx) * w.x + texture2D(tex, uvy) * w.y + texture2D(tex, uvz) * w.z;\n' +
            '}\n'
          );

          // Replace the sampledDiffuseColor assignment (keeps the rest of the chunk intact).
          shader.fragmentShader = shader.fragmentShader.replace(
            /vec4\s+sampledDiffuseColor\s*=\s*texture2D\(\s*map\s*,\s*vUv\s*\)\s*;/,
            'vec4 sampledDiffuseColor = triSampleColor( map, vTriWorldPos, normalize(vTriWorldNormal) );'
          );
        }
      };

      mat.needsUpdate = true;
    };

    root.traverse((o) => {
      if (!o || !o.isMesh || !o.material) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(patchOne);
    });

    this._applied = true;
  }
});

          .replace('#include <clipping_planes_fragment>',
                   '#include <clipping_planes_fragment>\nfloat pitD = distance(vPitWorldPos.xz, uPitCenter.xz);\nif (pitD < uPitRadius && vPitWorldPos.y < uPitTopY && vPitWorldPos.y > uPitBottomY) discard;');
