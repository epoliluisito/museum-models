    // even when the beam points toward/away from the camera (prevents "hole dots" without beams).
    if (cam && b.cards) {
      b.obj.getWorldPosition(this._tmpV1);
      this._tmpV2.copy(this._camPos).sub(this._tmpV1);
      if (this._tmpV2.lengthSq() > 1e-6) {
        this._tmpV2.normalize();
        b.obj.getWorldQuaternion(this._tmpQ1);
        this._tmpQ2.copy(this._tmpQ1).invert();
        this._tmpV3.copy(this._tmpV2).applyQuaternion(this._tmpQ2);
        this._tmpV3.y = 0;
        if (this._tmpV3.lengthSq() > 1e-6) {
          this._tmpV3.normalize();
          const ang = Math.atan2(this._tmpV3.x, this._tmpV3.z);
          b.cards.rotation.y = ang + (b._yawWob || 0);
        }
      }
    }

    // If this beam owns a real spotlight, drive it from the same intensity.
    if (b.spot) {
      const roomI = intensity * intensity;
      // Stronger, more realistic spill in the room, still driven by the same hole intensity.
      b.spot.intensity = (0.80 + 14.0 * roomI) * 8.00;
      b.spot.color.copy(this._cBlue).lerp(this._cWhite, 0.35 * w);
    }
  }
}
});

/* -------------------------------------------------------------------------
   sphere-hole-beams
   - Fake "volumetric" shafts using additive cone/cylinder meshes.
   - Beams originate on the sphere surface (as if through perforations),
     biased slightly downward to read like a "forest of light".
   - Animated with smooth noise (no loop snaps).
--------------------------------------------------------------------------- */
AFRAME.registerComponent('sphere-hole-beams', {
  schema: {
    count:       {type: 'int',    default: 60},
    radius:      {type: 'number', default: 1.5},
    minLen:      {type: 'number', default: 2.5},
    maxLen:      {type: 'number', default: 10.0},
    baseOpacity: {type: 'number', default: 0.25},
    blue:        {type: 'color',  default: '#7cc9ff'},
    white:       {type: 'color',  default: '#ffffff'},
    jitter:      {type: 'number', default: 0.06},  // radians
    downBias:    {type: 'number', default: 0.65},  // 0..1 (more = more downward)
    flicker:     {type: 'number', default: 1.35}   // speed multiplier
  },

  init: function () {
    this._group = new THREE.Group();
    this.el.object3D.add(this._group);

    this._up = new THREE.Vector3(0, 1, 0);
    this._down = new THREE.Vector3(0, -1, 0);

    this._cBlue  = new THREE.Color(this.data.blue);
    this._cWhite = new THREE.Color(this.data.white);

    // A unit-height cylinder that we'll scale on Y to set the beam length.
    // Open-ended so it reads like a light volume, not a solid rod.
    this._beamGeo = new THREE.CylinderGeometry(0.035, 0.22, 1.0, 12, 1, true);
    this._dotGeo  = new THREE.SphereGeometry(0.045, 10, 10);

    this._beams = [];

    // Build a soft radial texture for impact dots.
    (function buildImpactTexture(self){
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(128,128,0, 128,128,128);
      g.addColorStop(0.0, 'rgba(255,255,255,1.0)');
      g.addColorStop(0.18,'rgba(255,255,255,0.65)');
      g.addColorStop(0.45,'rgba(140,200,255,0.22)');
      g.addColorStop(1.0, 'rgba(0,0,0,0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,256,256);
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      self._impactTex = tex;
      self._impactMat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        depthWrite: false,
        depthTest: true,
        blending: THREE.AdditiveBlending
      });
      self._impactGeo = new THREE.PlaneGeometry(1,1,1,1);
      // Root that holds all impact planes (world space).
      self._impactRoot = new THREE.Group();
      self._impactRoot.renderOrder = 999;
      if (self.el.sceneEl && self.el.sceneEl.object3D) self.el.sceneEl.object3D.add(self._impactRoot);
    })(this);

    this._spots = [];

    const N = Math.max(6, this.data.count|0);
    for (let i = 0; i < N; i++) {
      const seed = this._hash(i + 13.37);

      // Fibonacci-ish distribution on a sphere, then bias to keep more points on lower hemisphere.
      const u = (i + 0.5) / N;
      const v = this._fract(seed * 1.618);
      const theta = 2.0 * Math.PI * v;
      // y in [-1..1] with a bias toward -1 (lower hemisphere)
      let y = 1.0 - 2.0 * u;
      y = (y * 0.65) - 0.35; // push downward
      y = THREE.MathUtils.clamp(y, -0.98, 0.65);
      const r = Math.sqrt(Math.max(0.0001, 1.0 - y*y));
      const normal = new THREE.Vector3(Math.cos(theta) * r, y, Math.sin(theta) * r).normalize();

      // Beam direction: blend between outward normal and downward vector.
      const dir = normal.clone().multiplyScalar(1.0 - this.data.downBias)
        .add(this._down.clone().multiplyScalar(this.data.downBias))
        .normalize();

      const len = THREE.MathUtils.lerp(this.data.minLen, this.data.maxLen, this._fract(seed * 7.31));
      const basePos = normal.clone().multiplyScalar(this.data.radius * 0.985); // slightly inside the shell
      const midPos  = basePos.clone().add(dir.clone().multiplyScalar(len * 0.5));

      const mat = new THREE.MeshBasicMaterial({
        color: this._cBlue.clone(),
        transparent: true,
        opacity: this.data.baseOpacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: true,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(this._beamGeo, mat);
      mesh.renderOrder = 30;

      // Align cylinder Y axis with dir
      mesh.quaternion.setFromUnitVectors(this._up, dir);
      mesh.position.copy(midPos);
      mesh.scale.set(1, len, 1);

      // A small "hole glow" dot at the exit point.
      const dotMat = new THREE.MeshBasicMaterial({
        color: this._cWhite.clone(),
        transparent: true,
        opacity: 0.55,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: true
      });
      const dot = new THREE.Mesh(this._dotGeo, dotMat);
      dot.renderOrder = 31;
      dot.position.copy(basePos);

      this._group.add(mesh);
      this._group.add(dot);

      this._beams.push({
        seed,
        normal,
        dir,
        basePos,
        lenBase: len,
        mesh,
        dot
      });
    }
  },

  remove: function () {
    if (this._group && this.el.object3D) this.el.object3D.remove(this._group);
    this._beams = [];

    // Build a soft radial texture for impact dots.
    (function buildImpactTexture(self){
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(128,128,0, 128,128,128);
      g.addColorStop(0.0, 'rgba(255,255,255,1.0)');
      g.addColorStop(0.18,'rgba(255,255,255,0.65)');
      g.addColorStop(0.45,'rgba(140,200,255,0.22)');
      g.addColorStop(1.0, 'rgba(0,0,0,0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,256,256);
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      self._impactTex = tex;
      self._impactMat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        depthWrite: false,
        depthTest: true,
        blending: THREE.AdditiveBlending
      });
      self._impactGeo = new THREE.PlaneGeometry(1,1,1,1);
      // Root that holds all impact planes (world space).
      self._impactRoot = new THREE.Group();
      self._impactRoot.renderOrder = 999;
      if (self.el.sceneEl && self.el.sceneEl.object3D) self.el.sceneEl.object3D.add(self._impactRoot);
    })(this);

    this._spots = [];
    this._group = null;
  },

  tick: function (time, timeDelta) {
    if (!this._beams || !this._beams.length) return;

    const t = (time || 0) * 0.001;
    const sp = this.data.flicker;

    for (let i = 0; i < this._beams.length; i++) {
      const b = this._beams[i];

      // Smooth pseudo-noise
      const n1 = 0.5 + 0.5 * Math.sin((t * (0.9 * sp)) + b.seed * 12.7);
      const n2 = 0.5 + 0.5 * Math.sin((t * (1.4 * sp)) + b.seed * 31.3);

      const intensity = THREE.MathUtils.clamp(0.55 * n1 + 0.45 * n2, 0, 1);

      // Opacity + color shift blue <-> white
      const op = this.data.baseOpacity * THREE.MathUtils.lerp(0.55, 1.35, intensity);
      b.mesh.material.opacity = op;
      b.dot.material.opacity  = THREE.MathUtils.lerp(0.25, 0.75, intensity);

      b.mesh.material.color.copy(this._cBlue).lerp(this._cWhite, intensity * 0.55);
      b.dot.material.color.copy(this._cWhite).lerp(this._cBlue, 0.10);

      // Length breathe
      const len = b.lenBase * THREE.MathUtils.lerp(0.82, 1.18, intensity);
      b.mesh.scale.y = len;

      // Direction micro-jitter (rotate slightly around an axis perpendicular to dir)
      const j = this.data.jitter * (intensity - 0.5);
      const axis = new THREE.Vector3(-b.dir.z, 0.0, b.dir.x).normalize();
      const q = new THREE.Quaternion().setFromAxisAngle(axis, j);
      const dirJ = b.dir.clone().applyQuaternion(q).normalize();

      b.mesh.quaternion.setFromUnitVectors(this._up, dirJ);

      // Recompute positions so the base stays pinned to the sphere surface
      const midPos = b.basePos.clone().add(dirJ.multiplyScalar(len * 0.5));
      b.mesh.position.copy(midPos);
      b.dot.position.copy(b.basePos);
    }
  },

  _fract: function (x) {
    return x - Math.floor(x);
  },

  _hash: function (x) {
    // deterministic pseudo-random in [0..1)
    const s = Math.sin(x * 127.1) * 43758.5453123;
    return this._fract(s);
  }
});


// ===== Forest-of-Lights beam (cheap faux-volumetric) =====
// Two crossed frustum-planes with an additive, fog-aware beam texture.
// This reads like haze catching light, without real volumetric lighting.

// ===== Forest-of-Lights beam + haze particles (cheap faux-volumetric) =====
// Goal: cones of light that feel like spotlights made visible by moving haze (not solid objects).
// Implementation:
// - A very faint frustum mesh (additive) for a stable silhouette.
// - A small particle volume (THREE.Points) drifting/jittering inside the frustum.
// Performance:
// - No shadows
// - Shared textures/material settings
// - ~300-500 points per cone (default 420)
AFRAME.registerComponent('fol-beam', {
  schema: {
    height:       { type: 'number', default: 7.0 },
    radiusTop:    { type: 'number', default: 0.04 },
    radiusBottom: { type: 'number', default: 0.28 },
    color:        { type: 'color',  default: '#bfe8ff' },

    // Base (very faint) cone silhouette
    opacity:      { type: 'number', default: 0.12 },
    solidFactor:  { type: 'number', default: 0.25 },

    // Haze particles are disabled (we keep the cone as faint haze volume).
    // (User requested: remove particles.)
    particles:    { type: 'int',    default: 0 },
    pSize:        { type: 'number', default: 0.022 },
    drift:        { type: 'number', default: 0.22 },
    jitter:       { type: 'number', default: 0.14 },
    flutter:      { type: 'number', default: 0.28 }
  },

  init: function () {
    this._group = new THREE.Group();
    this.el.object3D.add(this._group);

    // Stable per-instance seed (so cones don't animate in sync).
    const a = this.el.getAttribute('fol-cone-anim');
    this._seed = (a && typeof a.seed === 'number') ? a.seed : (Math.random() * 1000.0);

    this._coneTex = this._getSharedConeTex();
    this._dotTex  = this._getSharedDotTex();

    this._coneMesh = null;
    this._coneMat  = null;

    this._pts = null;
    this._ptsGeo = null;
    this._ptsMat = null;

    this._vel = null;
    this._phase = null;

    this._lastH = this._lastRT = this._lastRB = -1;
    this._tPrev = 0;

    this._rebuild(true);
  },

  update: function () {
    this._rebuild(false);
  },

  remove: function () {
    if (this._coneMesh && this._coneMesh.geometry) this._coneMesh.geometry.dispose();
    if (this._coneMat) this._coneMat.dispose();

    if (this._ptsGeo) this._ptsGeo.dispose();
    if (this._ptsMat) this._ptsMat.dispose();

    this.el.object3D.remove(this._group);
  },

  tick: function (timeMs) {
    // Subtle, non-directional “density” movement so the beam feels less solid.
    // Avoids any visible vertical sliding.
    const d = this.data;
    const t = (timeMs || 0) * 0.001;
    if (this._coneMat) {
      const w1 = 0.5 + 0.5 * Math.sin(t * 0.72 + this._seed * 1.17);
      const w2 = 0.5 + 0.5 * Math.sin(t * 1.03 + this._seed * 2.63);
      const w = 0.65 * w1 + 0.35 * w2;
      const base = d.opacity * d.solidFactor;
      this._coneMat.opacity = base * (0.70 + 0.40 * w);
    }

    // No particles: done.
    if (!this._ptsGeo) return;

    // (Legacy particle code below; kept but inactive when particles=0)
    const dt = Math.min(0.033, Math.max(0.0, (this._tPrev ? (t - this._tPrev) : 0.016)));
    this._tPrev = t;

    const h = Math.max(0.1, d.height);
    const half = h * 0.5;
    const rt = Math.max(0.001, d.radiusTop);
    const rb = Math.max(rt + 0.001, d.radiusBottom);

    const posAttr = this._ptsGeo.getAttribute('position');
    const p = posAttr.array;

    // DOWNWARD drift (toward floor). The beam entity is positioned so its top
    // aligns with the lamp (see markup: beam positioned to match y=5.40).
    const down = Math.max(0.0, d.drift);

    for (let i = 0; i < this._pCount; i++) {
      const ix = i * 3;
      let x = p[ix + 0];
      let y = p[ix + 1];
      let z = p[ix + 2];

      // Normalized height 0..1 where 0 = top, 1 = bottom.
      const yn = (y + half) / h;
      const rHere = rt + (rb - rt) * yn;

      // Small swirling turbulence (stable, non-sliding).
      const ph = this._phase[i] + t * 0.9;
      const sx = Math.sin(ph * 1.37) * 0.6 + Math.sin(ph * 2.11) * 0.4;
      const sz = Math.cos(ph * 1.19) * 0.6 + Math.cos(ph * 2.07) * 0.4;

      // Integrate.
      x += (this._vel[ix + 0] + sx * d.jitter) * dt;
      z += (this._vel[ix + 2] + sz * d.jitter) * dt;
      y += (this._vel[ix + 1] - down) * dt;

      // Keep inside cone cross-section.
      const rr = x * x + z * z;
      const rMax = rHere;
      if (rr > rMax * rMax) {
        const r = Math.sqrt(rr) || 1.0;
        const k = (rMax / r) * 0.98;
        x *= k;
        z *= k;
      }

      // Respawn when exiting bottom: place near the top (close to lamp).
      if (y < -half) {
        // Slightly below the very top so we don't form a razor-thin column.
        y = half - (Math.random() * 0.25);

        const yn2 = (y + half) / h;
        const r2 = rt + (rb - rt) * yn2;
        const ang = Math.random() * Math.PI * 2.0;
        const rad = Math.sqrt(Math.random()) * r2;
        x = Math.cos(ang) * rad;
        z = Math.sin(ang) * rad;

        // New micro-vel + phase.
        this._vel[ix + 0] = (Math.random() - 0.5) * 0.06;
        this._vel[ix + 1] = (Math.random() - 0.5) * 0.02;
        this._vel[ix + 2] = (Math.random() - 0.5) * 0.06;
        this._phase[i] = (Math.random() * 1000.0) + this._seed;
      }

      p[ix + 0] = x;
      p[ix + 1] = y;
      p[ix + 2] = z;
    }

    posAttr.needsUpdate = true;

    // Subtle breathing on particle opacity (feels like density fluctuation).
    if (this._ptsMat) {
      const w = 0.5 + 0.5 * Math.sin(t * 0.55 + this._seed * 1.37);
      this._ptsMat.opacity = 0.18 + (d.flutter * 0.22) * w;
    }
  },

  _getSharedConeTex: function () {
    const key = '__FOL_CONE_TEX_V2';
    if (window[key]) return window[key];

    const w = 64;
    const h = 256;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');

    const img = ctx.createImageData(w, h);
    const data = img.data;

    const clamp01 = (v) => Math.max(0, Math.min(1, v));

    for (let y = 0; y < h; y++) {
      const v = y / (h - 1);
      // Stronger near top, softer near bottom.
      const fall = Math.pow(1.0 - v, 1.35);
      for (let x = 0; x < w; x++) {
        const u = x / (w - 1);
        const du = Math.abs(u - 0.5) / 0.5;
        const edge = Math.exp(-(du * du) * 2.2);
        let a = edge * (0.18 + 0.62 * fall);
        a = clamp01(a);
        const i = (y * w + x) * 4;
        data[i + 0] = 255;
        data[i + 1] = 255;
        data[i + 2] = 255;
        data[i + 3] = Math.floor(a * 255);
      }
    }

    ctx.putImageData(img, 0, 0);

    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;

    window[key] = tex;
    return tex;
  },

  _getSharedDotTex: function () {
    const key = '__FOL_DOT_TEX_V2';
    if (window[key]) return window[key];

    const s = 64;
    const c = document.createElement('canvas');
    c.width = s; c.height = s;
    const ctx = c.getContext('2d');

    const g = ctx.createRadialGradient(s * 0.5, s * 0.5, 0, s * 0.5, s * 0.5, s * 0.5);
    g.addColorStop(0.00, 'rgba(255,255,255,0.70)');
    g.addColorStop(0.22, 'rgba(255,255,255,0.22)');
    g.addColorStop(0.60, 'rgba(255,255,255,0.06)');
    g.addColorStop(1.00, 'rgba(255,255,255,0.00)');

    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);

    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;

    window[key] = tex;
    return tex;
  },

  _rebuild: function (forceGeo) {
    const d = this.data;

    const rt = Math.max(0.001, d.radiusTop);
    const rb = Math.max(rt + 0.001, d.radiusBottom);
    const h  = Math.max(0.1, d.height);

    const needsGeo = forceGeo || !this._coneMesh ||
      this._lastRT !== rt || this._lastRB !== rb || this._lastH !== h;

    if (needsGeo) {
      if (this._coneMesh && this._coneMesh.geometry) this._coneMesh.geometry.dispose();

      const geo = new THREE.CylinderGeometry(rt, rb, 1.0, 32, 1, true);

      if (!this._coneMat) {
        this._coneMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(d.color),
          map: this._coneTex,
          alphaMap: this._coneTex,
          transparent: true,
          opacity: d.opacity * d.solidFactor,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          depthTest: true,
          side: THREE.DoubleSide,
          fog: true
        });
      }

      this._coneMesh = new THREE.Mesh(geo, this._coneMat);
      this._coneMesh.renderOrder = 30;

      // Particles removed (per request). Keep only the faint additive cone.
      if (this._pts) {
        this._group.remove(this._pts);
        this._pts = null;
      }
      if (this._ptsGeo) { this._ptsGeo.dispose(); this._ptsGeo = null; }
      if (this._ptsMat) { this._ptsMat.dispose(); this._ptsMat = null; }

      this._group.clear();
      this._group.add(this._coneMesh);

      this._lastRT = rt; this._lastRB = rb; this._lastH = h;
    }

    // Scale to requested height (geometry is unit height, centered at origin).
    if (this._coneMesh) {
      this._coneMesh.scale.set(1, h, 1);
    }

    // Material updates
    if (this._coneMat) {
      this._coneMat.color.set(d.color);
      this._coneMat.opacity = d.opacity * d.solidFactor;
      this._coneMat.needsUpdate = true;
    }

    if (this._ptsMat) {
      this._ptsMat.size = d.pSize;
      this._ptsMat.needsUpdate = true;
    }
  }
});

AFRAME.registerComponent('fol-cone-anim', {
  schema: {
    seed:  {type: 'number', default: 1},
    amp:   {type: 'number', default: 0.13},
    speed: {type: 'number', default: 0.9}
  },

  init: function () {
    // Find first descendant with a spot light.
    this._lightEl = null;
    const kids = this.el.querySelectorAll('[light]');
    for (let i = 0; i < kids.length; i++) {
      const l = kids[i].getAttribute('light');
      if (l && l.type === 'spot') { this._lightEl = kids[i]; break; }
    }

    this._lampEl = this.el.querySelector('.fol_lamp');

    this._baseI = 0.0;
    if (this._lightEl) {
      const l = this._lightEl.getAttribute('light');
      this._baseI = (l && typeof l.intensity === 'number') ? l.intensity : 0.35;
    }
  },

  tick: function (timeMs) {
    const t = timeMs * 0.001;
    const s = this.data.seed;

    // Very subtle breathing (no noticeable flicker).
    const w = 0.5 + 0.5 * Math.sin(t * this.data.speed + s * 1.37);
    const w2 = 0.5 + 0.5 * Math.sin(t * (this.data.speed * 2.1) + s * 2.91);
    const k = 1.0 - this.data.amp + this.data.amp * (0.72 * w + 0.28 * w2);

    if (this._lightEl) {
      this._lightEl.setAttribute('light', 'intensity', this._baseI * k);
    }

    // Lamp disc emissive intensity modulation (direct material poke; very cheap).
    if (this._lampEl) {
      const mesh = this._lampEl.getObject3D('mesh');
      if (mesh && mesh.material) {
        const baseE = 26.0;
        mesh.material.emissiveIntensity = baseE * (0.92 + 0.08 * w);
      }
    }
  }
});


AFRAME.registerComponent('equator-gap-clip', {
  schema: {
    thetaStart: {type: 'number', default: 80},  // degrees from +Y down
    thetaEnd:   {type: 'number', default: 100}  // degrees from +Y down
  },

  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    this._apply();
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._apply);
  },

  update: function () {
    this._updateUniforms();
  },

  _apply: function (e) {
    if (e && e.detail && e.detail.type !== 'mesh') return;

    const root = this.el.getObject3D('mesh');
    if (!root) return;

    const self = this;

    const applyToMat = (mat) => {
      if (!mat || !mat.isMeshStandardMaterial || mat.userData.__equatorGapApplied) return;
      mat.userData.__equatorGapApplied = true;
      mat.userData.__equatorGapUniforms = null;

      const prevOnBeforeCompile = mat.onBeforeCompile;
      mat.onBeforeCompile = (shader) => {
        if (prevOnBeforeCompile) prevOnBeforeCompile(shader);
        shader.uniforms.uGapTheta = { value: new THREE.Vector2(
          self.data.thetaStart * Math.PI / 180,
          self.data.thetaEnd   * Math.PI / 180
        ) };
        mat.userData.__equatorGapUniforms = shader.uniforms;

        // Vertex: pass (displaced) local position.
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vGapLocalPos;')
          .replace('#include <begin_vertex>', '#include <begin_vertex>\nvGapLocalPos = transformed;')
          .replace('#include <displacementmap_vertex>', '#include <displacementmap_vertex>\nvGapLocalPos = transformed;');

        // Fragment: discard pixels inside the equatorial band.
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vGapLocalPos;\nuniform vec2 uGapTheta;')
          .replace(
            '#include <dithering_fragment>',
            `
            // --- equator gap clip ---
            vec3 pn = normalize(vGapLocalPos);
            float th = acos(clamp(pn.y, -1.0, 1.0)); // 0..PI
            if (th > uGapTheta.x && th < uGapTheta.y) discard;

            #include <dithering_fragment>
            `
          );
      };

      mat.needsUpdate = true;
    };

    root.traverse((o) => {
      if (!o.isMesh) return;
      const m = o.material;
      if (Array.isArray(m)) m.forEach(applyToMat);
      else applyToMat(m);
    });
  },

  _updateUniforms: function () {
    const root = this.el.getObject3D('mesh');
    if (!root) return;

    const a = this.data.thetaStart * Math.PI / 180;
    const b = this.data.thetaEnd   * Math.PI / 180;

    root.traverse((o) => {
      if (!o.isMesh) return;
      const mat = o.material;
      const mats = Array.isArray(mat) ? mat : [mat];
      mats.forEach((m) => {
        const u = m && m.userData && m.userData.__equatorGapUniforms;
        if (!u || !u.uGapTheta) return;
        u.uGapTheta.value.set(a, b);
      });
    });
  }
});


/* -------------------------------------------------------------------------
   pool-sheen-fresnel
   - Elegant "fake" pool contribution on the sphere underside WITHOUT extra
     transparent meshes (prevents sort flicker while walking around).
   - Injects a fresnel + vertical mask into the existing MeshStandardMaterial.
--------------------------------------------------------------------------- */
AFRAME.registerComponent('pool-sheen-fresnel', {
  schema: {
    color:        {type: 'color',  default: '#a8e5ff'},
    intensity:    {type: 'number', default: 0.55},
    fresnelPower: {type: 'number', default: 3.4},
    radius:       {type: 'number', default: 1.52}
  },

  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    this._apply();
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._apply);
  },

  update: function () {
    this._updateUniforms();
  },

  _apply: function (e) {
    if (e && e.detail && e.detail.type !== 'mesh') return;

    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;

    const applyToMat = (mat) => {
      if (!mat || mat.userData.__poolSheenApplied) return;
      mat.userData.__poolSheenApplied = true;
      mat.userData.__poolSheenUniforms = null;

      const self = this;
      const prevOnBeforeCompile = mat.onBeforeCompile;
      mat.onBeforeCompile = (shader) => {
        if (prevOnBeforeCompile) prevOnBeforeCompile(shader);
        shader.uniforms.uPoolSheenColor     = { value: new THREE.Color(self.data.color) };
        shader.uniforms.uPoolSheenIntensity = { value: self.data.intensity };
        shader.uniforms.uPoolSheenPower     = { value: self.data.fresnelPower };
        shader.uniforms.uPoolSheenRadius    = { value: self.data.radius };
        mat.userData.__poolSheenUniforms = shader.uniforms;

        // Vertex: pass local Y for underside mask.
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying float vPoolPosY;')
          .replace('#include <begin_vertex>', '#include <begin_vertex>\nvPoolPosY = position.y;');

        // Fragment: declare uniforms/varying.
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <common>',
          '#include <common>\n' +
          'varying float vPoolPosY;\n' +
          'uniform vec3 uPoolSheenColor;\n' +
          'uniform float uPoolSheenIntensity;\n' +
          'uniform float uPoolSheenPower;\n' +
          'uniform float uPoolSheenRadius;'
        );

        // Inject just before final output.
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <output_fragment>',
          `
          // --- pool sheen cheat (opaque; stable) ---
          float ndv_pool = clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0);
          float fres_pool = pow(1.0 - ndv_pool, uPoolSheenPower);

          float down_pool = clamp((-vPoolPosY) / max(uPoolSheenRadius, 0.0001), 0.0, 1.0);
          float vertical_pool = down_pool * down_pool * (3.0 - 2.0 * down_pool);

          // subtle breakup so it doesn't read as a perfect gradient
          float b = 0.92 + 0.08 * sin((vPoolPosY * 13.0) + (gl_FragCoord.x + gl_FragCoord.y) * 0.02);

          totalEmissiveRadiance += uPoolSheenColor * (uPoolSheenIntensity * fres_pool * vertical_pool * b);
          #include <output_fragment>
          `
        );
      };

      mat.needsUpdate = true;
    };

    mesh.traverse((o) => {
      if (!o.isMesh) return;
      const m = o.material;
      if (Array.isArray(m)) m.forEach(applyToMat);
      else applyToMat(m);
    });
  },

  _updateUniforms: function () {
    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;

    mesh.traverse((o) => {
      if (!o.isMesh) return;
      const mat = o.material;
      const mats = Array.isArray(mat) ? mat : [mat];
      mats.forEach((m) => {
        const u = m && m.userData && m.userData.__poolSheenUniforms;
        if (!u) return;
        u.uPoolSheenColor.value.set(this.data.color);
        u.uPoolSheenIntensity.value = this.data.intensity;
        u.uPoolSheenPower.value = this.data.fresnelPower;
        u.uPoolSheenRadius.value = this.data.radius;
      });
    });
  }
});


/* -------------------------------------------------------------------------
   rock-surface: apply the same PBR "rock" look used by rubble clusters
   to simple primitives (e.g., the pool rim / shoreline ring).
   - no external textures (works on file://)
   ------------------------------------------------------------------------- */
(function () {
  const CACHE = (window.__ROCK_SURFACE_CACHE = window.__ROCK_SURFACE_CACHE || {});

  function makeRockNormalTexture(seed, size) {
    size = size || 256;
    const key = `n_${seed}_${size}`;
    if (CACHE[key]) return CACHE[key];

    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const img = ctx.createImageData(size, size);
    const data = img.data;

    function hash(x, y) {
      let n = (x * 374761393 + y * 668265263 + (seed | 0) * 1447) | 0;
      n = (n ^ (n >> 13)) | 0;
      n = (n * 1274126177) | 0;
      return ((n ^ (n >> 16)) >>> 0) / 4294967296;
    }
    function fbm(x, y) {
      let v = 0, a = 0.55, f = 1.0;
      for (let i = 0; i < 4; i++) {
        v += a * (hash((x * f) | 0, (y * f) | 0) * 2 - 1);
        f *= 2.0; a *= 0.55;
      }
      return v;
    }

    // Height field
    const h = new Float32Array(size * size);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const nx = x / size, ny = y / size;
        h[y * size + x] = fbm(nx * 64, ny * 64);
      }
    }

    // Convert to normals (simple Sobel)
    function sample(ix, iy) {
      ix = (ix + size) % size;
      iy = (iy + size) % size;
      return h[iy * size + ix];
    }

    const strength = 2.2;
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const sx =
          (sample(x + 1, y - 1) + 2 * sample(x + 1, y) + sample(x + 1, y + 1)) -
          (sample(x - 1, y - 1) + 2 * sample(x - 1, y) + sample(x - 1, y + 1));
        const sy =
          (sample(x - 1, y + 1) + 2 * sample(x, y + 1) + sample(x + 1, y + 1)) -
          (sample(x - 1, y - 1) + 2 * sample(x, y - 1) + sample(x + 1, y - 1));

        let nx = -sx * strength;
        let ny = -sy * strength;
        let nz = 1.0;

        const invLen = 1.0 / Math.sqrt(nx * nx + ny * ny + nz * nz);
        nx *= invLen; ny *= invLen; nz *= invLen;

        const i = (y * size + x) * 4;
        data[i + 0] = Math.round((nx * 0.5 + 0.5) * 255);
        data[i + 1] = Math.round((ny * 0.5 + 0.5) * 255);
        data[i + 2] = Math.round((nz * 0.5 + 0.5) * 255);
        data[i + 3] = 255;
      }
    }

    ctx.putImageData(img, 0, 0);

    const tex = new AFRAME.THREE.CanvasTexture(canvas);
    tex.anisotropy = 4;
    tex.needsUpdate = true;
    CACHE[key] = tex;
    return tex;
  }

  AFRAME.registerComponent('rock-surface', {
    schema: {
      color: { type: 'color', default: '#2a2a2a' },
      roughness: { type: 'number', default: 0.92 },
      metalness: { type: 'number', default: 0.0 },
      normalScale: { type: 'vec2', default: { x: 0.9, y: 0.9 } },
      repeat: { type: 'vec2', default: { x: 6, y: 2 } },
      seed: { type: 'int', default: 77 }
    },

    init: function () {
      this.apply = this.apply.bind(this);
      this.el.addEventListener('object3dset', this.apply);
      this.el.addEventListener('model-loaded', this.apply);
      this.apply();
    },

    update: function () {
      this.apply();
    },

    apply: function () {
      const THREE = AFRAME.THREE;
      const d = this.data;
      const root = this.el.getObject3D('mesh');
      if (!root) return;

      const key = `m_${d.seed}_${d.color}_${d.roughness}_${d.metalness}_${d.repeat.x}_${d.repeat.y}_${d.normalScale.x}_${d.normalScale.y}`;
      let mat = CACHE[key];
      if (!mat) {
        const ntex = makeRockNormalTexture(d.seed, 256);
        ntex.wrapS = ntex.wrapT = THREE.RepeatWrapping;
        ntex.repeat.set(d.repeat.x, d.repeat.y);

        mat = new THREE.MeshStandardMaterial({
          color: new THREE.Color(d.color),
          roughness: d.roughness,
          metalness: d.metalness,
          normalMap: ntex,
          normalScale: new THREE.Vector2(d.normalScale.x, d.normalScale.y),
          side: THREE.DoubleSide
        });
        CACHE[key] = mat;
      }

      root.traverse((o) => {
        if (!o.isMesh) return;
        o.material = mat;
        o.material.needsUpdate = true;
      });
    }
  });
})();


/* --- Force double-sided material on a mesh (for interior wall visibility) --- */
AFRAME.registerComponent('force-double-side', {
  init: function () {
    this.apply = this.apply.bind(this);
    this.el.addEventListener('object3dset', this.apply);
    this.apply();
  },
  apply: function () {
    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;
    mesh.traverse(obj => {
      if (!obj.isMesh || !obj.material) return;
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach(m => {
        m.side = THREE.DoubleSide;
        m.needsUpdate = true;
      });
    });
  }
});

/* --- Extruded ring geometry (for raised pool shore) --- */
AFRAME.registerGeometry('extruded-ring', {
  schema: {
    radiusInner: { type: 'number', default: 1 },
    radiusOuter: { type: 'number', default: 2 },
    height:      { type: 'number', default: 0.10 },
    segments:    { type: 'int',    default: 96 }
  },
  init: function (data) {
    const shape = new THREE.Shape();
    shape.absarc(0, 0, data.radiusOuter, 0, Math.PI * 2, false);

    const hole = new THREE.Path();
    hole.absarc(0, 0, data.radiusInner, 0, Math.PI * 2, true);
    shape.holes.push(hole);

    const geo = new THREE.ExtrudeGeometry(shape, {
      depth: data.height,
      bevelEnabled: false,
      steps: 1,
      curveSegments: Math.max(12, data.segments | 0)
    });

    // ExtrudeGeometry extrudes along +Z; rotate so thickness becomes +Y and ring lies on XZ plane.
    geo.rotateX(-Math.PI / 2);

    // Keep bottom at y=0 (after rotation, the old +Z becomes +Y).
    // No translate needed because extrusion starts at z=0.

    geo.computeVertexNormals();
    this.geometry = geo;
  }
});


// Builds a solid *side-wall* volume from a displaced ring surface.
// Fixes the classic issue where a flat extruded ring intersects a sculpted top surface ("piercing").
// Usage: <a-entity solidify-from-ring="source: #aya_dome_sand_floor; thickness: 0.22"></a-entity>
AFRAME.registerComponent('solidify-from-ring', {
  schema: {
    source:    { type: 'selector' },
    thickness: { type: 'number', default: 0.22 },
    maxTries:  { type: 'int', default: 60 },
    tryEveryMs:{ type: 'int', default: 80 }
  },

  init: function () {
    this._tries = 0;
    this._tickTry = this._tickTry.bind(this);
    this._timer = setInterval(this._tickTry, this.data.tryEveryMs);
    this._tickTry();
  },

  remove: function () {
    if (this._timer) clearInterval(this._timer);
  },

  _isReady: function (srcEl) {
    if (!srcEl) return false;
    const mesh = srcEl.getObject3D('mesh');
    if (!mesh || !mesh.geometry) return false;

    // If sculpt components exist, wait until they've applied.
    const c1 = srcEl.components['floor-seam-sculpt'];
    if (c1 && !c1._applied) return false;
    const c2 = srcEl.components['ground-undulate'];
    if (c2 && !c2._applied) return false;
    const c3 = srcEl.components['dome-sand-organic'];
    if (c3 && !c3._applied) return false;

    // Need an indexed geometry (ring primitive is indexed by default).
    const g = mesh.geometry;
    return !!(g && g.attributes && g.attributes.position && g.index);
  },

  _tickTry: function () {
    const d = this.data;
    const srcEl = d.source;

    this._tries++;
    if (this._tries > d.maxTries) {
      clearInterval(this._timer);
      return;
    }

    if (!this._isReady(srcEl)) return;

    clearInterval(this._timer);
    this._buildFromSource(srcEl);
  },

  _buildFromSource: function (srcEl) {
    const d = this.data;
    const srcMesh = srcEl.getObject3D('mesh');
    const srcGeom = srcMesh.geometry;

    // Match transforms so the volume is locked to the floor surface.
    // (Prevents tiny offsets/gaps if the author moved the source later.)
    const srcObj = srcEl.object3D;
    const obj = this.el.object3D;
    obj.position.copy(srcObj.position);
    obj.quaternion.copy(srcObj.quaternion);
    obj.scale.copy(srcObj.scale);

    const pos = srcGeom.attributes.position;
    const idx = srcGeom.index.array;
    const nV = pos.count;

    // Local direction that corresponds to WORLD up (same trick as floor-seam-sculpt).
    const qWorld = new THREE.Quaternion();
    srcMesh.getWorldQuaternion(qWorld);
    const invQ = qWorld.clone().invert();
    const upLocal = new THREE.Vector3(0, 1, 0).applyQuaternion(invQ).normalize();

    const t = Math.max(0.001, d.thickness);

    // --- Find boundary edges (edges used by only one triangle) ---
    const edgeCount = new Map();
    function eKey(a,b){ return a < b ? (a+'_'+b) : (b+'_'+a); }
    for (let i=0; i<idx.length; i+=3){
      const a = idx[i], b = idx[i+1], c = idx[i+2];
      const k1 = eKey(a,b), k2 = eKey(b,c), k3 = eKey(c,a);
      edgeCount.set(k1, (edgeCount.get(k1)||0)+1);
      edgeCount.set(k2, (edgeCount.get(k2)||0)+1);
      edgeCount.set(k3, (edgeCount.get(k3)||0)+1);
    }

    const boundary = [];
    for (let i=0; i<idx.length; i+=3){
      const a = idx[i], b = idx[i+1], c = idx[i+2];
      const edges = [[a,b],[b,c],[c,a]];
      for (const [u,v] of edges){
        const k = eKey(u,v);
        if (edgeCount.get(k) === 1) boundary.push([u,v]);
      }
    }

    // Build ONLY side walls (no top face), using shared top/bottom vertices.
    // This removes z-fighting and the "volume piercing" artifact.
    const positions = new Float32Array(nV * 2 * 3);

    // Copy top verts
    for (let i=0; i<nV; i++){
      positions[i*3+0] = pos.getX(i);
      positions[i*3+1] = pos.getY(i);
      positions[i*3+2] = pos.getZ(i);
    }

    // Bottom verts: offset downward along -upLocal
    for (let i=0; i<nV; i++){
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const bx = x - upLocal.x * t;
      const by = y - upLocal.y * t;
      const bz = z - upLocal.z * t;
      const j = nV + i;
      positions[j*3+0] = bx;
      positions[j*3+1] = by;
      positions[j*3+2] = bz;
    }

    // UVs: reuse top UVs for both layers if present.
    let uvs = null;
    if (srcGeom.attributes.uv){
      const uv = srcGeom.attributes.uv;
      uvs = new Float32Array(nV * 2 * 2);
      for (let i=0; i<nV; i++){
        uvs[i*2+0] = uv.getX(i);
        uvs[i*2+1] = uv.getY(i);
        const j = nV + i;
        uvs[j*2+0] = uv.getX(i);
        uvs[j*2+1] = uv.getY(i);
      }
    }

    // Wall indices
    const wallIdx = [];
    for (let i=0; i<boundary.length; i++){
      const a = boundary[i][0];
      const b = boundary[i][1];
      const aB = nV + a;
      const bB = nV + b;
      // quad: a -> b -> bB -> aB
      wallIdx.push(a, b, bB);
      wallIdx.push(a, bB, aB);
    }

    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    if (uvs) g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

    // Try to preserve uv2 if the source has it.
    if (srcGeom.attributes.uv2){
      const uv2 = srcGeom.attributes.uv2;
      const uv2s = new Float32Array(nV * 2 * 2);
      for (let i=0; i<nV; i++){
        uv2s[i*2+0] = uv2.getX(i);
        uv2s[i*2+1] = uv2.getY(i);
        const j = nV + i;
        uv2s[j*2+0] = uv2.getX(i);
        uv2s[j*2+1] = uv2.getY(i);
      }
      g.setAttribute('uv2', new THREE.BufferAttribute(uv2s, 2));
    }

    g.setIndex(wallIdx);
    g.computeVertexNormals();

    const mesh = new THREE.Mesh(g, null);
    this.el.setObject3D('mesh', mesh);

    // Make sure our material is applied (A-Frame will set it after object3Dset).
    this.el.emit('object3dset', {type: 'mesh'});
  }
});

/* ============================================================
   Aya — Seat-triggered USER GUIDE + Autopilot sit + Video start
   - Step 1: within ~2m of a rock seat => show guide (E)
   - Step 2: after autopilot 'sit' => show guide (F)
   - F starts the video overlay on the mercury pool surface.
   ============================================================ */
AFRAME.registerComponent('aya-seat-experience', {
  schema: {
    triggerDist: { type: 'number', default: 2.5 },           // meters
    triggerHysteresis: { type: 'number', default: 0.25 },    // meters
    sitCamHeight: { type: 'number', default: 1.40 },
    autopilotDurationMs: { type: 'number', default: 950 },
    facePoolDotThreshold: { type: 'number', default: 0.93 }, // ~21° cone
    standUpDurationMs: { type: 'number', default: 500 }
  },

  init: function () {
    this.rig = document.querySelector('#rig');
    this.cam = document.querySelector('#playerCam');

    // Pool target (surface entity exists in the scene).
    this.mercurySurface = document.querySelector('#mercury_surface');

    // Fullscreen video overlay
    this.overlay = document.getElementById('ayaFullscreenOverlay');
    this.overlayVideo = document.getElementById('ayaFullscreenVideo');

    this.guide = document.getElementById('userGuide');
    this.guideBody = document.getElementById('userGuideBody');

    this.seats = [
      document.querySelector('#rock_seat_01'),
      document.querySelector('#rock_seat_02'),
      document.querySelector('#rock_seat_03'),
      document.querySelector('#rock_seat_04')
    ].filter(Boolean);

    this._poolWorld = new THREE.Vector3();
    this._rigWorld = new THREE.Vector3();
    this._seatWorld = new THREE.Vector3();

    this.state = {
      activeSeat: null,        // seat that triggered the guide
      step: 0,                 // 0 none, 1 near seat, 2 seated-ready, 3 playing
      autopilot: false,
      apStart: 0,
      apFrom: new THREE.Vector3(),
      apTo: new THREE.Vector3(),
      apYawFromRad: null,
      apYawToRad: null,
      neutralRigPos: null,
      neutralRigYaw: null,
      neutralCamY: null,
      seatedRigPos: null,
      returningToNeutral: false,
      lastSeatedGuideKey: '',
      standAnim: false,
      standStart: 0,
      standFromY: 0,
      standToY: 0,
      videoRigYaw: null,
      videoLookYaw: null,
      videoLookPitch: null,
      apLookYawFrom: null,
      apLookYawTo: null,
      apLookPitchFrom: null,
      apLookPitchTo: null
    };

    // Used to prevent spurious pointer-lock events (some browsers can toggle
    // pointer lock when look-controls is temporarily disabled/enabled).
    this._suppressPointerLockUntil = 0;

    // Cache "neutral" pose at load (DO NOT alter spawn — we only read it).
    const initNeutral = () => {
      if (!this.rig || !this.cam) return;
      const rp = this.rig.getAttribute('position') || { x: 0, y: 0, z: 0 };
      const rr = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
      const cp = this.cam.getAttribute('position') || { x: 0, y: 1.6, z: 0 };
      this.state.neutralRigPos = new THREE.Vector3(rp.x, rp.y, rp.z);
      this.state.neutralRigYaw = rr.y || 0;
      this.state.neutralCamY = cp.y;
    };
    // Run once after scene is ready-ish.
    setTimeout(initNeutral, 0);

    // Track pointer-lock state (ESC can release pointer lock before keydown is delivered).
    this._wasPointerLocked = !!document.pointerLockElement;

    // Key handling (E / F / ESC)
    this._onKeyDown = (e) => {
      if (e.repeat) return;

      const isE = (e.code === 'KeyE' || e.key === 'e' || e.key === 'E');
      const isF = (e.code === 'KeyF' || e.key === 'f' || e.key === 'F');
      const isEsc = (e.code === 'Escape' || e.key === 'Escape');

      // ESC: exit video, or stand up from seated (return to neutral).
      if (isEsc) {
        if (this.state.step === 3) {
          e.preventDefault();
          this._stopExperience(/*byEsc=*/true);
          return;
        }
        if (this.state.step === 2 && !this.state.autopilot) {
          e.preventDefault();
          this._standUpInPlace();
          return;
        }
      }

      // Step 1: E to sit (autopilot to the seat that triggered the guide)
      if (isE && this.state.step === 1 && !this.state.autopilot) {
        e.preventDefault();
        this._startAutopilotToSeat(this.state.activeSeat);
        return;
      }

      // Step 2: F to start fullscreen experience (only if facing the pool)
      if (isF && this.state.step === 2 && !this.state.autopilot && !this.state.standAnim) {
        e.preventDefault();
        if (this._isFacingPool()) {
          this._startExperience();
        } else {
          this._updateSeatedGuide(true);
        }
        return;
      }
    };

    window.addEventListener('keydown', this._onKeyDown, { passive: false });


// Make ESC work reliably even when pointer-lock consumes the keypress.
// When ESC releases pointer lock during the video, treat that as "exit video".
// When seated-ready, treat pointer-lock release as "stand up" (ESC).
this._onPointerLockChange = () => {
  if (!this.state) return;
  if (this.state.autopilot) return;
  if (performance.now() < this._suppressPointerLockUntil) {
    this._wasPointerLocked = !!document.pointerLockElement;
    return;
  }

  const nowLocked = !!document.pointerLockElement;
  const released = (this._wasPointerLocked && !nowLocked);
  this._wasPointerLocked = nowLocked;

  if (!released) return;

  // If ESC released pointer lock during the video, treat as an exit.
  if (this.state.step === 3) {
    this._stopExperience(/*byEsc=*/true);
    return;
  }

  // If seated-ready and pointer lock was released, treat as ESC (stand up).
  if (this.state.step === 2 && this.state.seatedRigPos) {
    this._standUpInPlace();
  }
};
document.addEventListener('pointerlockchange', this._onPointerLockChange);

    // Video end handler (fade back + restore room control)
    if (this.overlayVideo) {
      this.overlayVideo.addEventListener('ended', () => this._stopExperience(false));
    }

    this._hideGuide();
    this._hideOverlay(true);
  },

  remove: function () {
    window.removeEventListener('keydown', this._onKeyDown);
    document.removeEventListener('pointerlockchange', this._onPointerLockChange);
    if (this.overlayVideo) {
      this.overlayVideo.pause();
      this.overlayVideo.currentTime = 0;
    }
  },

  tick: function () {
    if (!this.rig || !this.cam || this.seats.length === 0) return;

    // Update pool world position.
    if (this.mercurySurface) {
      this.mercurySurface.object3D.getWorldPosition(this._poolWorld);
      this._poolWorld.y += 0.01; // tiny lift so lookAt hits the surface cleanly
    } else {
      this._poolWorld.set(0, 0.045, 38.7);
    }

    // Stand-up (in-place) animation: smoothly restore POV height without teleporting or yaw reset.
    if (this.state.standAnim) {
      const u = Math.min(1, (performance.now() - this.state.standStart) / this.data.standUpDurationMs);
      const s = u * u * (3 - 2 * u); // smoothstep
      const camPos = this.cam.getAttribute('position') || { x: 0, y: 1.6, z: 0 };
      const y = (this.state.standFromY + (this.state.standToY - this.state.standFromY) * s);
      this.cam.setAttribute('position', `${camPos.x} ${y.toFixed(3)} ${camPos.z}`);

      if (u >= 1) {
        this.state.standAnim = false;
        this._setWalkEnabled(true);
        // Re-enter proximity mode; guide will be shown if still in range.
        this.state.step = 0;
      }
      // Continue; proximity check below will decide guide visibility this frame.
    }

    // Autopilot movement (either to seat or back to neutral)
    if (this.state.autopilot) {
      const u = Math.min(1, (performance.now() - this.state.apStart) / this.data.autopilotDurationMs);
      const s = u * u * (3 - 2 * u); // smoothstep
      this.rig.object3D.position.lerpVectors(this.state.apFrom, this.state.apTo, s);

      // Autopilot yaw interpolation (rotate the RIG), preserving the user's current head/camera offset.
      if (this.state.apYawFromRad != null && this.state.apYawToRad != null) {
        const norm = (a) => {
          let x = a;
          while (x <= -Math.PI) x += Math.PI * 2;
          while (x > Math.PI) x -= Math.PI * 2;
          return x;
        };
        const lerpAngle = (a, b, t) => a + norm(b - a) * t;

        const yawRad = lerpAngle(this.state.apYawFromRad, this.state.apYawToRad, s);
        const yawDeg = yawRad * 180 / Math.PI;

        const r = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
        this.rig.setAttribute('rotation', `${r.x} ${yawDeg.toFixed(3)} ${r.z}`);
      }

      // Autopilot look-controls interpolation (rotate the VIEW smoothly).
      // During autopilot we continuously write the yaw/pitch objects so user input can't fight the motion,
      // but we keep look-controls enabled (disabling it can cause resets/pointer-lock churn).
      if (this.state.apLookYawFrom != null && this.state.apLookYawTo != null) {
        const norm = (a) => {
          let x = a;
          while (x <= -Math.PI) x += Math.PI * 2;
          while (x > Math.PI) x -= Math.PI * 2;
          return x;
        };
        const lerpAngle = (a, b, t) => a + norm(b - a) * t;

        const lc = this.cam.components && this.cam.components['look-controls'];
        if (lc) {
          try {
            const ly = lerpAngle(this.state.apLookYawFrom, this.state.apLookYawTo, s);
            const lp = (this.state.apLookPitchFrom != null && this.state.apLookPitchTo != null)
              ? (this.state.apLookPitchFrom + (this.state.apLookPitchTo - this.state.apLookPitchFrom) * s)
              : (lc.pitchObject.rotation.x || 0);

            lc.yawObject.rotation.y = norm(ly);
            lc.pitchObject.rotation.x = lp;
          } catch (err) {}
        }
      }

      if (u >= 1) {
        this.state.autopilot = false;

        if (this.state.returningToNeutral) {
          this.state.returningToNeutral = false;
          this._finishReturnToNeutral();
        } else {
          this._finishSitPose();
        }
      }
      return;
    }

    // While video is playing, we don't update proximity/guide.
    if (this.state.step === 3) return;

    // While seated-ready, keep the user in the seated pose until they press ESC.
    // (No auto-stand due to tiny physics/controller drift.)
    if (this.state.step === 2) {
      this._updateSeatedGuide(false);
      return;
    }

    // Proximity check to seats (Step 0/1)
    this.rig.object3D.getWorldPosition(this._rigWorld);

    let bestSeat = null;
    let bestDist = Infinity;

    for (let i = 0; i < this.seats.length; i++) {
      const seat = this.seats[i];
      if (!seat) continue;
      seat.object3D.getWorldPosition(this._seatWorld);
      const d = this._seatWorld.distanceTo(this._rigWorld);
      if (d < bestDist) { bestDist = d; bestSeat = seat; }
    }

    const onDist = this.data.triggerDist;
    const offDist = this.data.triggerDist + this.data.triggerHysteresis;

    if (bestSeat && bestDist <= onDist) {
      if (this.state.step !== 1 || this.state.activeSeat !== bestSeat) {
        this.state.step = 1;
        this.state.activeSeat = bestSeat;
        this._showGuide(
          'You can sit down and try the mercury pool experience.<br>' +
          'Press <span class="kbd">E</span> to sit (autopilot).'
        );
      }
    } else if (this.state.step === 1 && bestDist > offDist) {
      this.state.step = 0;
      this.state.activeSeat = null;
      this._hideGuide();
    }
  },

  _setWalkEnabled: function (enabled) {
    if (!this.rig) return;
    const rigWalk = this.rig.components && this.rig.components['rig-walk'];
    if (!rigWalk) return;
    if (enabled) {
      if (rigWalk.play) rigWalk.play();
      if (rigWalk.resume) rigWalk.resume();
    } else {
      if (rigWalk.pause) rigWalk.pause();
      if (rigWalk.stop) rigWalk.stop();
    }
  },

    _isFacingPool: function () {
    if (!this.cam) return false;

    // Direction from camera position to pool (XZ only).
    const camWorld = new THREE.Vector3();
    this.cam.object3D.getWorldPosition(camWorld);
    const toPool = new THREE.Vector3().subVectors(this._poolWorld, camWorld);
    toPool.y = 0;
    if (toPool.length() < 1e-6) return true;
    toPool.normalize();

    // IMPORTANT:
    // In A-Frame, `this.cam.object3D` is typically the look-controls yawObject (not the Three.js Camera).
    // Object3D.getWorldDirection() returns +Z forward, which is opposite of the camera view direction.
    // So we use the actual Three.js Camera when available.
    const threeCam =
      (this.cam.getObject3D && this.cam.getObject3D('camera')) ||
      (this.el && this.el.sceneEl && this.el.sceneEl.camera) ||
      null;

    const fwd = new THREE.Vector3();
    if (threeCam && threeCam.getWorldDirection) {
      threeCam.getWorldDirection(fwd); // Camera override returns true view direction.
    } else {
      // Fallback: use -Z as "view forward" from the camera entity.
      fwd.set(0, 0, -1).applyQuaternion(this.cam.object3D.getWorldQuaternion(new THREE.Quaternion()));
    }

    fwd.y = 0;
    if (fwd.length() < 1e-6) return false;
    fwd.normalize();

    return fwd.dot(toPool) >= this.data.facePoolDotThreshold;
  },

  _updateSeatedGuide: function (force) {
    if (!this.guide || !this.guideBody) return;
    if (this.state.step !== 2) return;

    const facing = this._isFacingPool();
    const key = facing ? 'FACE_OK' : 'FACE_BAD';
    if (!force && this.state.lastSeatedGuideKey === key) return;
    this.state.lastSeatedGuideKey = key;

    if (facing) {
      this._showGuide(
        'Seated.<br>' +
        'Press <span class="kbd">F</span> to begin.<br>' +
        'Press <span class="kbd">ESC</span> to stand up.'
      );
    } else {
      this._showGuide(
        'Seated.<br>' +
        'Turn toward the mercury pool to enable <span class="kbd">F</span>.<br>' +
        'Press <span class="kbd">ESC</span> to stand up.'
      );
    }
  },

  _computeYawToPoolDeg: function () {
// Compute yaw so that the rig/camera faces the pool.
// Robust against 180° flips by evaluating both candidate yaws and choosing the one that
// actually points the camera forward vector (-Z) toward the pool direction.
this.rig.object3D.getWorldPosition(this._rigWorld);
const dx = this._poolWorld.x - this._rigWorld.x;
const dz = this._poolWorld.z - this._rigWorld.z;

// If we're basically on top of the target, keep current yaw.
if (Math.abs(dx) < 1e-6 && Math.abs(dz) < 1e-6) {
  const rr = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
  return rr.y || 0;
}

const dir = new THREE.Vector3(dx, 0, dz);
const len = dir.length();
if (len > 1e-6) dir.multiplyScalar(1 / len);

// Base yaw candidate (common A-Frame convention: forward = -Z).
const base = Math.atan2(dx, -dz);
const alt  = base + Math.PI;

const fwd = new THREE.Vector3(0, 0, -1);
const yAxis = new THREE.Vector3(0, 1, 0);

const dotFor = (yawRad) => {
  const v = fwd.clone().applyAxisAngle(yAxis, yawRad);
  return v.dot(dir);
};

const chosen = (dotFor(alt) > dotFor(base)) ? alt : base;
return chosen * 180 / Math.PI;
  },

  _startAutopilotToSeat: function (seatEl) {
    if (!seatEl || !this.rig || !this.cam) return;

    this._setWalkEnabled(false);

    // Use world positions but apply to rig local (rig is root-level, so ok).
    this.rig.object3D.getWorldPosition(this._rigWorld);
    seatEl.object3D.getWorldPosition(this._seatWorld);

    // Target: seat position in XZ, keep rig's current Y.
    const to = new THREE.Vector3(this._seatWorld.x, this.rig.object3D.position.y, this._seatWorld.z);

    // Small bias toward the pool so you "sit" looking into the basin, not behind the seat.
    const dirToPool = new THREE.Vector3().subVectors(this._poolWorld, this._seatWorld);
    dirToPool.y = 0;
    const len = dirToPool.length();
    if (len > 0.0001) {
      dirToPool.multiplyScalar(1 / len);
      to.addScaledVector(dirToPool, 0.10);
    }


    // ---- Yaw planning ----
    // We want the seated *view* (camera world direction) to end up facing the pool,
    // and we want to get there smoothly (no snap) from the user's current pose.
    //
    // Key detail: "where I'm looking" is rig yaw + look-controls yaw. So during autopilot
    // we animate BOTH:
    //   - rig yaw -> yaw that faces the pool (forward = -Z)
    //   - look-controls yaw -> 0 (so head aligns with body at the end)
    //
    // While autopilot runs, we continuously write yawObject/pitchObject so user input can't
    // fight the animation, but without disabling look-controls (which can cause resets).
    if (this.mercurySurface) {
      this.mercurySurface.object3D.getWorldPosition(this._poolWorld);
      this._poolWorld.y += 0.01;
    } else {
      this._poolWorld.set(0, 0.045, 38.7);
    }

    const norm = (a) => {
      let x = a;
      while (x <= -Math.PI) x += Math.PI * 2;
      while (x > Math.PI) x -= Math.PI * 2;

    };

    // points toward the pool in world space.
    //
    // IMPORTANT: For a forward vector of (0,0,-1), the yaw that aims at a world-space
    // direction dir=(dx,0,dz) is atan2(-dx, -dz). A sign mistake here produces a clean
    // 180° opposite facing.
    let desiredRigYawRad = 0;

      const dir = new THREE.Vector3().subVectors(this._poolWorld, to);
      dir.y = 0;
      if (dir.length() > 1e-6) {
        dir.normalize();

        const base = Math.atan2(-dir.x, -dir.z); // forward = -Z (true view direction)
        const alt  = base + Math.PI;

        // Choose the candidate that actually aligns the forward vector with the pool direction.
        const fwd = new THREE.Vector3(0, 0, -1);
        const yAxis = new THREE.Vector3(0, 1, 0);
        const dotFor = (yawRad) => fwd.clone().applyAxisAngle(yAxis, yawRad).dot(dir);
        desiredRigYawRad = (dotFor(alt) > dotFor(base)) ? alt : base;
      } else {
        const rr = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
        desiredRigYawRad = (rr.y || 0) * Math.PI / 180;
      }
    }

    const r0 = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
    const rigYawRad = (r0.y || 0) * Math.PI / 180;

    // Current look-controls yaw/pitch (head).
    const lc = this.cam.components && this.cam.components['look-controls'];
    let lookYawFrom = 0;
    let lookPitchFrom = 0;
    if (lc) {
      try {
        lookYawFrom = lc.yawObject.rotation.y;
        lookPitchFrom = lc.pitchObject.rotation.x;
      } catch (err) {}
    }

    // Target head orientation during seating: align yaw to the rig (yaw=0), keep pitch as-is.
    const lookYawTo = 0;
    const lookPitchTo = lookPitchFrom;

    this.state.apYawFromRad = rigYawRad;
    this.state.apYawToRad = norm(desiredRigYawRad);

    this.state.apLookYawFrom = norm(lookYawFrom);
    this.state.apLookYawTo = norm(lookYawTo);
    this.state.apLookPitchFrom = lookPitchFrom;
    this.state.apLookPitchTo = lookPitchTo;


    this.state.apFrom.copy(this.rig.object3D.position);
    this.state.apTo.copy(to);
    this.state.apStart = performance.now();
    this.state.autopilot = true;
    this.state.returningToNeutral = false;

    this._showGuide('Autopilot engaged…<br>Bringing you to the seat.');

  _finishSitPose: function () {

    // Store seated rig position.

    // Lock seated POV height.

    this.cam.setAttribute('position', `${camPos.x} ${this.data.sitCamHeight.toFixed(3)} ${camPos.z}`);

    // Ensure autopilot lands on the planned rig yaw (so the VIEW is facing the pool).

      } catch (err) {}

    this.state.apLookYawTo = null;
    this.state.apLookPitchFrom = null;
    this.state.apLookPitchTo = null;

    this._setWalkEnabled(false);

    const y = (this.state.neutralCamY != null) ? this.state.neutralCamY : 1.6;

    this.state.seatedRigPos = null;
  },

    _standUpInPlace: function () {
    if (!this.rig || !this.cam) return;

    // If we're not seated, ignore.
    if (this.state.step !== 2) return;

    // Stop any overlay/video if somehow active (safety).
    if (this.state.step === 3) return;

    // Restore POV height smoothly, without moving the rig or resetting yaw.
    this._setWalkEnabled(false);

    const camPos = this.cam.getAttribute('position') || { x: 0, y: 1.6, z: 0 };
    const fromY = camPos.y;
    const toY = (this.state.neutralCamY != null) ? this.state.neutralCamY : 1.6;

    this.state.standAnim = true;
    this.state.standStart = performance.now();
    this.state.standFromY = fromY;
    this.state.standToY = toY;

    // Clear seated marker (we're standing up).
    this.state.seatedRigPos = null;

    // While standing, show a brief message; proximity guide will reappear immediately after.
    this._showGuide('Standing up…');
  },

  _finishReturnToNeutral: function () {
    // Restore neutral yaw + normal POV and unlock movement.
    this._restoreNormalPOV();

    if (this.state.neutralRigYaw != null) {
      const rr = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
      this.rig.setAttribute('rotation', `${rr.x} ${Number(this.state.neutralRigYaw).toFixed(3)} ${rr.z}`);
    }

    this._setWalkEnabled(true);

    // After returning, recompute guide state next tick (hide now, it'll reappear if still in range).
    this.state.step = 0;
    this.state.activeSeat = null;
    this._hideGuide();

  _startExperience: function () {
    if (this.state.step !== 2) return;

    // Disable movement while video is playing.
    this._setWalkEnabled(false);

    // Snapshot current orientation so we can restore it exactly after playback/ESC.
    const rr = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
    this.state.videoRigYaw = rr.y || 0;
    const lc = this.cam.components && this.cam.components['look-controls'];
    if (lc) {
      try {
        this.state.videoLookYaw = lc.yawObject.rotation.y;
        this.state.videoLookPitch = lc.pitchObject.rotation.x;

      // Freeze look during video to guarantee yaw doesn't drift.
      this.cam.setAttribute('look-controls', 'enabled: false');
      this._suppressPointerLockUntil = performance.now() + 700;

    this.state.step = 3;
    this._hideGuide();

    this._showOverlay();

    if (this.overlayVideo) {
      try {
        this.overlayVideo.currentTime = 0;
        const p = this.overlayVideo.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      } catch (err) {}

  },

  _stopExperience: function (byEsc) {
    if (this.state.step !== 3) return;

    // Stop playback
    if (this.overlayVideo) {
      try { this.overlayVideo.pause(); } catch (err) {}
      // If exited by ESC, reset to start; if ended naturally, keep at end.
      if (byEsc) {
        try { this.overlayVideo.currentTime = 0; } catch (err) {}
      }
    }

    // Fade out, then restore room.
    this._hideOverlay(false, () => {
      // Keep movement disabled (we return to the seated-ready state).
      this._setWalkEnabled(false);
      // Ensure keyboard input routes back to the scene (ESC shouldn't require a second press).
      try { if (this.overlayVideo) this.overlayVideo.blur(); } catch (err) {}
      try {
        const canvas = (this.el && this.el.sceneEl && this.el.sceneEl.canvas) ? this.el.sceneEl.canvas : null;

        else if (document && document.body && document.body.focus) document.body.focus();
      } catch (err) {}

      // Restore orientation exactly as it was when the video started.
      if (this.rig) {
        const rr = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
        if (this.state.videoRigYaw != null) {
          this.rig.setAttribute('rotation', `${rr.x} ${Number(this.state.videoRigYaw).toFixed(3)} ${rr.z}`);
        }
      }
      const lc = this.cam && this.cam.components && this.cam.components['look-controls'];
      if (lc) {
        // Re-enable look controls, then restore yaw/pitch on the next tick to avoid re-init resets.
        this.cam.setAttribute('look-controls', 'enabled: true');
        this._suppressPointerLockUntil = performance.now() + 700;

        setTimeout(() => {
          const lc2 = this.cam && this.cam.components && this.cam.components['look-controls'];
          if (!lc2) return;
          try {
            if (this.state.videoLookYaw != null) lc2.yawObject.rotation.y = this.state.videoLookYaw;
            if (this.state.videoLookPitch != null) lc2.pitchObject.rotation.x = this.state.videoLookPitch;
          } catch (err) {}
        }, 0);
      }

      this.state.step = 2;
      this.state.lastSeatedGuideKey = '';
      this._updateSeatedGuide(true);
});
  },

  _showOverlay: function () {
    if (!this.overlay) return;
    this.overlay.classList.add('visible');
  },

  _hideOverlay: function (immediate, cb) {
    if (!this.overlay) { if (cb) cb(); return; }
    if (immediate) {
      this.overlay.classList.remove('visible');
      if (cb) cb();
      return;
    }
    this.overlay.classList.remove('visible');
    // Match CSS transition duration (keep in sync with CSS).
    setTimeout(() => { if (cb) cb(); }, 260);
  },

  _showGuide: function (html) {
    if (!this.guide || !this.guideBody) return;
    this.guideBody.innerHTML = html;
    this.guide.classList.add('visible');
  },

  _hideGuide: function () {
    if (!this.guide) return;
    this.guide.classList.remove('visible');
  }
});

(function () {
  if (!window.AFRAME) return;

  // Guard: ignore duplicate component registrations.
  const _reg = AFRAME.registerComponent.bind(AFRAME);
  AFRAME.registerComponent = function(name, def) {
    if (AFRAME.components && AFRAME.components[name]) {
      console.warn('[merge] component already registered:', name);
      return;
    }
    return _reg(name, def);

AFRAME.registerComponent('endchamber-lift', {
  schema: {
    platform:  { type: 'selector' },
    panel:     { type: 'selector' },
    triggerDist:{ type: 'number', default: 3.0 },
    boardDist: { type: 'number', default: 2.1 },
    autopilotDurationMs: { type: 'number', default: 900 },
    nextUrl:   { type: 'string', default: 'end_level_01.html?spawn=end_chamber' }
  },

  init: function () {
    this.rig = document.querySelector('#rig');
    this.cam = document.querySelector('#playerCam');

    this.guide = document.getElementById('userGuide');
    this.guideBody = document.getElementById('userGuideBody');

    this._a = new THREE.Vector3();
    this._b = new THREE.Vector3();
    this._tmp = new THREE.Vector3();

    this.state = {
      step: 0,          // 0 none, 1 near platform, 2 boarded/ready
      autopilot: false,
      owner: 'endchamber-lift',
      originalSpeed: null
    };

    this._onKeyDown = (e) => {
      if (e.repeat) return;
      const isF = (e.code === 'KeyF' || e.key === 'f' || e.key === 'F');
      if (!isF) return;

      // Only respond when our guide is active.
      if (this.state.step !== 1 && this.state.step !== 2) return;

      e.preventDefault();
      e.stopPropagation();

      if (this.state.step === 1) {
        this._boardPlatform();
      } else if (this.state.step === 2) {
        this._activateLift();
      }
    };

    window.addEventListener('keydown', this._onKeyDown, { capture: true });
  },

  remove: function () {
    window.removeEventListener('keydown', this._onKeyDown, { capture: true });
  },

  tick: function () {
    const p = this.data.platform;
    if (!this.rig || !this.cam || !p) return;

    this.cam.object3D.getWorldPosition(this._a);
    p.object3D.getWorldPosition(this._b);

    const d = this._a.distanceTo(this._b);

    // Hysteresis to avoid flicker.
    const on = this.data.triggerDist;
    const off = on + 0.35;

    if (this.state.autopilot) return;

    if (this.state.step === 0 && d <= on) {
      this.state.step = 1;
      this._showGuide('Approach the platform.<br><b>F</b> — Step onto platform');
      return;
    }

    if ((this.state.step === 1 || this.state.step === 2) && d > off) {
      // Only hide if we are the current owner (don't fight other guides).
      this._hideGuideIfOwner();
      this.state.step = 0;
      return;
    }

    if (this.state.step === 1) {
      // If already standing on platform, promote to step 2 automatically.
      if (d <= this.data.boardDist) {
        this.state.step = 2;
        this._showGuide('On platform.<br><b>F</b> — Activate lift (loads next level)');
      }
    }
  },

  _hideGuideIfOwner: function () {
    if (!this.guide) return;
    const owner = this.guide.getAttribute('data-owner');
    if (owner && owner !== this.state.owner) return;
    this.guide.style.opacity = 0;
    this.guide.setAttribute('data-owner', '');
  },

  _showGuide: function (html) {
    if (!this.guide || !this.guideBody) return;
    this.guide.setAttribute('data-owner', this.state.owner);
    this.guideBody.innerHTML = html;
    this.guide.style.opacity = 1;
  },

  _captureShaftLights: function () {
    if (this._shaftLights) return;
    const out = [];
    const add = (el) => {
      if (!el) return;
      const l = el.getAttribute && el.getAttribute('light');
      if (!l) return;
      const inten = (typeof l.intensity === 'number') ? l.intensity : 1.0;
      out.push({ el, intensity: inten });
    };

    add(this._oculusSpotEl);

    if (this._moonlightEl && this._moonlightEl.querySelectorAll) {
      this._moonlightEl.querySelectorAll('[light]').forEach(add);
    }

    this._shaftLights = out;
  },

  _setShaftLightsEnabled: function (enabled) {
    this._captureShaftLights();
    if (!this._shaftLights || !this._shaftLights.length) return;

    const wantOff = !enabled;
    if (this._shaftLightsOff === wantOff) return;

    this._shaftLights.forEach((s) => {
      try {
        s.el.setAttribute('light', 'intensity', enabled ? s.intensity : 0.0);
      } catch (e) {}
    });

    this._shaftLightsOff = wantOff;
  },


  _boardPlatform: function () {
    const p = this.data.platform;
    const panel = this.data.panel;
    if (!p || !this.rig) return;

    // If already close enough, just switch to step 2.
    this.cam.object3D.getWorldPosition(this._a);
    p.object3D.getWorldPosition(this._b);
    if (this._a.distanceTo(this._b) <= this.data.boardDist) {
      this.state.step = 2;
      this._showGuide('On platform.<br><b>F</b> — Activate lift (loads next level)');
      return;
    }

    this.state.autopilot = true;

    // Temporarily stop movement
    const rw = this.rig.components && this.rig.components['rig-walk'];
    if (rw) {
      this.state.originalSpeed = rw.data && typeof rw.data.speed === 'number' ? rw.data.speed : null;
      try { this.rig.setAttribute('rig-walk', 'speed', 0.0); } catch (e) {}
      if (rw.keys) Object.keys(rw.keys).forEach(k => rw.keys[k] = false);
    }

    // Target rig xz to platform center (keep current rig y).
    const rigStart = this.rig.object3D.position.clone();
    const worldTarget = new THREE.Vector3();
    p.object3D.getWorldPosition(worldTarget);

    const rigTarget = new THREE.Vector3(worldTarget.x, rigStart.y, worldTarget.z);

    // Face the panel (or center) at end.
    const faceTarget = new THREE.Vector3(worldTarget.x, rigStart.y, worldTarget.z);
    if (panel && panel.object3D) {
      panel.object3D.getWorldPosition(faceTarget);
    }

    const duration = this.data.autopilotDurationMs;
    const t0 = performance.now();

    // Make autopilot collision-aware and route through the handrail opening (toward tunnel_06 at +X).
    const desired = new THREE.Vector3();
    const center = new THREE.Vector3(worldTarget.x, rigStart.y, worldTarget.z);

    // Direction to the portal opening (fallback: +X).
    const portalEl = document.querySelector('#end_chamber_06_portal') || document.querySelector('#end_chamber_06_rim');
    const portalPos = new THREE.Vector3();
    if (portalEl && portalEl.object3D) portalEl.object3D.getWorldPosition(portalPos);
    else portalPos.set(worldTarget.x + 1, rigStart.y, worldTarget.z);

    const dir = new THREE.Vector3(portalPos.x - worldTarget.x, 0, portalPos.z - worldTarget.z);
    if (dir.lengthSq() < 1e-8) dir.set(1, 0, 0);
    dir.normalize();

    // Match endchamber_handrail_colliders radius (~1.48).
    const handR = 1.48;

    // Two waypoints: outside the handrail at the opening, then inside the opening, then center.
    const wpOutside = new THREE.Vector3(center.x + dir.x * (handR + 0.70), rigStart.y, center.z + dir.z * (handR + 0.70));
    const wpInside  = new THREE.Vector3(center.x + dir.x * (handR - 0.55), rigStart.y, center.z + dir.z * (handR - 0.55));

    const startToCenter = new THREE.Vector3(rigStart.x - center.x, 0, rigStart.z - center.z).length();
    const needsGate = startToCenter > (handR + 0.10);

    const pts = needsGate ? [rigStart.clone(), wpOutside, wpInside, rigTarget.clone()] : [rigStart.clone(), rigTarget.clone()];
    const segs = pts.length - 1;

    const easeInOutQuad = (u) => (u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2)/2);

    const step = () => {
      const t = performance.now();
      const u = Math.min(1, (t - t0) / duration);
      const uu = easeInOutQuad(u);

      if (segs <= 1) {
        desired.lerpVectors(pts[0], pts[1], uu);
      } else {
        const tt = uu * segs;
        const i = Math.min(segs - 1, Math.floor(tt));
        const lt = tt - i;
        desired.lerpVectors(pts[i], pts[i + 1], lt);
      }

      // Apply + collision resolve (XZ). Keep y constant.
      this.rig.object3D.position.set(desired.x, rigStart.y, desired.z);
      if (rw && typeof rw._resolveCollisions === 'function') {
        rw._resolveCollisions(this.rig.object3D.position);
        this.rig.object3D.position.y = rigStart.y;
      }

      if (u < 1) {
        requestAnimationFrame(step);
      } else {
        // Set yaw toward faceTarget
        const dx = faceTarget.x - this.rig.object3D.position.x;
        const dz = faceTarget.z - this.rig.object3D.position.z;
        const yaw = Math.atan2(dx, dz) * 180/Math.PI;
        this.rig.object3D.rotation.y = THREE.MathUtils.degToRad(yaw);

        // Restore movement
        if (rw && this.state.originalSpeed != null) {
          try { this.rig.setAttribute('rig-walk', 'speed', this.state.originalSpeed); } catch (e) {}
        }

        this.state.autopilot = false;
        this.state.step = 2;
        this._showGuide('On platform.<br><b>F</b> — Activate lift (loads next level)');
      }
    };

    requestAnimationFrame(step);
  },

  _activateLift: function () {
    // Explicit loading moment is OK (per user request).
    this._showGuide('Activating lift…<br><span style="opacity:.9">Loading next level…</span>');

    try { sessionStorage.setItem('spawn', 'end_chamber'); } catch (e) {}

    // Small delay so the guide update is seen.
    setTimeout(() => {
      window.location.href = this.data.nextUrl;
    }, 450);
  }
});
/* --- end endchamber-lift --- */

  _normAngle: function (a) {
    // Normalize to [-180, 180)

    return a;

    center = this._normAngle(center);

    if (d > range) d = range;
    if (d < -range) d = -range;
    return this._normAngle(center + d);

  _enableAscentLookLock: function () {

    const pitchRad = lc.pitchObject.rotation.x || 0;

    this.state.lookYawCenter = lc.yawObject.rotation.y || 0;

    this.state.lookLeveling = true;
    this.state.lookLevelT0 = performance.now();

  _disableAscentLookLock: function () {

  _applyAscentLookLock: function () {

    const lc = this.cam.components && this.cam.components['look-controls'];
    if (!lc || !lc.pitchObject) return;

    const maxUp = 89 * DEG2RAD;

      if (u >= 1) this.state.lookLeveling = false;

    const minDuring = Math.min(0, (this.state.lookPitchFrom || 0));

    if (this.state.lookLeveling) {
      if (pitch < minDuring) pitch = minDuring;

    if (pitch > maxUp) pitch = maxUp;

  tick: function () {
    const p = this.data.platform;
    if (!this.rig || !this.cam || !p) return;

    if (this.state.running) return;

    this.cam.object3D.getWorldPosition(this._a);
    p.object3D.getWorldPosition(this._b);
    const d = this._a.distanceTo(this._b);

    const on = this.data.triggerDist;
    const off = on + 0.35;

    if (this.state.step === 0 && d <= on) {
      this.state.step = 1;
      this._showGuide('Approach the platform.<br><b>F</b> — Step onto platform');
      return;
    }

    if ((this.state.step === 1 || this.state.step === 2) && d > off) {
      this._hideGuideIfOwner();
      this.state.step = 0;
      return;
    }

    if (this.state.step === 1 && d <= this.data.boardDist) {
      this.state.step = 2;
      this._showGuide('On platform.<br><b>F</b> — Ascend (test)');
    }

  _hideGuideIfOwner: function () {
    if (!this.guide) return;

    this.guide.style.opacity = 0;
    this.guide.setAttribute('data-owner', '');
  },

  _showGuide: function (html) {
