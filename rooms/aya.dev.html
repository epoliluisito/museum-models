    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },

  _hash11: function (n) {
    const s = Math.sin(n) * 43758.5453123;
    return s - Math.floor(s);
  },
  _randLattice: function (ix, iy, iz, seed) {
    const n = ix * 127.1 + iy * 311.7 + iz * 74.7 + seed * 19.19;
    return this._hash11(n) * 2.0 - 1.0;
  },
  _fade: function (t) { return t * t * (3.0 - 2.0 * t); },
  _lerp: function (a, b, t) { return a + (b - a) * t; },
  _noise3: function (x, y, z, seed) {
    const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
    const fx = x - ix, fy = y - iy, fz = z - iz;
    const u = this._fade(fx), v = this._fade(fy), w = this._fade(fz);

    const n000 = this._randLattice(ix,     iy,     iz,     seed);
    const n100 = this._randLattice(ix + 1, iy,     iz,     seed);
    const n010 = this._randLattice(ix,     iy + 1, iz,     seed);
    const n110 = this._randLattice(ix + 1, iy + 1, iz,     seed);

    const n001 = this._randLattice(ix,     iy,     iz + 1, seed);
    const n101 = this._randLattice(ix + 1, iy,     iz + 1, seed);
    const n011 = this._randLattice(ix,     iy + 1, iz + 1, seed);
    const n111 = this._randLattice(ix + 1, iy + 1, iz + 1, seed);

    const nx00 = this._lerp(n000, n100, u);
    const nx10 = this._lerp(n010, n110, u);
    const nx01 = this._lerp(n001, n101, u);
    const nx11 = this._lerp(n011, n111, u);

    const nxy0 = this._lerp(nx00, nx10, v);
    const nxy1 = this._lerp(nx01, nx11, v);

    return this._lerp(nxy0, nxy1, w);
  },
  _fbm: function (x, y, z, seed, oct, freq, lac, gain) {
    let a = 1.0, f = freq, sum = 0.0, norm = 0.0;
    for (let i = 0; i < oct; i++) {
      sum += a * this._noise3(x * f, y * f, z * f, seed + i * 101.7);
      norm += a;
      a *= gain;
      f *= lac;
    }
    return (norm > 0) ? (sum / norm) : 0;
  },

  _apply: function () {
    const obj = this.el.getObject3D('mesh');
    if (!obj) return;

    const meshes = [];
    obj.traverse(o => { if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) meshes.push(o); });
    if (!meshes.length) return;

    const d = this.data;

    for (let mi = 0; mi < meshes.length; mi++) {
      const mesh = meshes[mi];
      const geom = mesh.geometry;
      if (geom.userData && geom.userData._caveWarped) continue;

      const g = geom.clone();
      if (!g.attributes.normal) g.computeVertexNormals();
      const pos = g.attributes.position;
      const nor = g.attributes.normal;

      // bbox for vertical weighting (more warp/sag near bottom)
      g.computeBoundingBox();
      const bb = g.boundingBox;
      const yMin = bb.min.y, yMax = bb.max.y;
      const ySpan = Math.max(1e-6, yMax - yMin);

      const v = new THREE.Vector3();
      const nrm = new THREE.Vector3();
      const axis = new THREE.Vector3(0, 1, 0);
      const t1 = new THREE.Vector3();
      const t2 = new THREE.Vector3();

      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        nrm.fromBufferAttribute(nor, i).normalize();

        // Build stable tangents.
        axis.set(0, 1, 0);
        if (Math.abs(nrm.dot(axis)) > 0.92) axis.set(1, 0, 0);
        t1.crossVectors(nrm, axis).normalize();
        t2.crossVectors(nrm, t1).normalize();

        const nA = this._fbm(v.x, v.y, v.z, d.seed,     d.oct, d.freq, d.lac, d.gain);
        const nB = this._fbm(v.x, v.y, v.z, d.seed+37,  d.oct, d.freq, d.lac, d.gain);

        // Tangential warp (breaks perfect symmetry without "inflating" the shell much).
        const warpScale = d.amp * (0.55 + 0.45 * Math.abs(nA));
        v.addScaledVector(t1, nA * warpScale);
        v.addScaledVector(t2, nB * warpScale);

        // Gentle vertical sag / asymmetry (stronger near bottom).
        const yN = (v.y - yMin) / ySpan;       // 0 bottom → 1 top
        const bottomW = 1.0 - Math.min(1.0, Math.max(0.0, yN));
        const sagN = this._fbm(v.x, 0.0, v.z, d.seed+91, 2, d.freq * 1.35, 2.0, 0.55);
        v.y += (-d.vertical) * bottomW * (0.35 + 0.65 * Math.abs(sagN)) * 0.35;

        pos.setXYZ(i, v.x, v.y, v.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      smoothNormalsByPosition(g, 1e-4);
      g.userData = g.userData || {};
      g.userData._caveWarped = true;
      mesh.geometry = g;
    }
  }
});


// Adds subtle walkable regolith undulation (keeps a flat "donut" around the basin).

// Cuts a circular "portal" opening in a cave shell so a tunnel can connect cleanly.
// Lightweight triangle filtering (not a true boolean) that removes the wall at the tunnel mouth.

AFRAME.registerComponent('cave-portal-cut', {
  schema: {
    // If provided, the cylinder is derived from this entity's world transform.
    target:     { type: 'selector', default: null },
    // Axis in the TARGET's local space (e.g., tunnel cylinder axis is local Y).
    targetAxis: { type: 'vec3', default: {x:0, y:1, z:0} },

    // Fallback (local to the mesh) if no target is supplied.
    center: { type: 'vec3', default: {x:0, y:0, z:0} },
    axis:   { type: 'vec3', default: {x:1, y:0, z:0} },

    // Cylinder definition.
    radius:     { type: 'number', default: 1.25 },  // base radius (meters)
    halfLength: { type: 'number', default: 10.7 },  // extends +/- along axis (meters)

    // Extra clearance to eliminate "paper leftovers" and z-fighting slivers.
    padding: { type: 'number', default: 0.18 },     // meters added to radius
    safety:  { type: 'number', default: 1.04 },     // multiplicative safety margin

    debug:   { type: 'boolean', default: false }
  },

  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    // Also retry after load; the target may exist later (e.g., imported module).
    const scene = this.el.sceneEl;
    if (scene && !scene.hasLoaded) scene.addEventListener('loaded', this._apply);
    setTimeout(this._apply, 0);
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._apply);
    const scene = this.el.sceneEl;
    if (scene) scene.removeEventListener('loaded', this._apply);
  },

  _apply: function () {
    const root = this.el.getObject3D('mesh');
    if (!root) { requestAnimationFrame(this._apply); return; }

    const d = this.data;

    // Resolve target (may load after this component).
    const targetEl = d.target;
    if (targetEl && !targetEl.object3D) { requestAnimationFrame(this._apply); return; }

    // Gather meshes under this entity.
    const meshes = [];
    root.traverse(o => { if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) meshes.push(o); });
    if (!meshes.length) return;

    // Ensure world matrices are current before deriving the cylinder.
    if (this.el.sceneEl && this.el.sceneEl.object3D) this.el.sceneEl.object3D.updateMatrixWorld(true);

    // Compute cylinder segment endpoints in WORLD.
    const cWorld = new THREE.Vector3();
    const dirWorld = new THREE.Vector3();

    if (targetEl) {
      targetEl.object3D.getWorldPosition(cWorld);
      const q = new THREE.Quaternion();
      targetEl.object3D.getWorldQuaternion(q);
      dirWorld.set(d.targetAxis.x, d.targetAxis.y, d.targetAxis.z).applyQuaternion(q).normalize();
    } else {
      // Fallback: interpret center/axis as LOCAL to each mesh (we'll convert per-mesh below).
      cWorld.set(d.center.x, d.center.y, d.center.z);
      dirWorld.set(d.axis.x, d.axis.y, d.axis.z).normalize();
    }

    const halfL = Math.max(0.1, d.halfLength || 1.0);

    const rCut = ((d.radius || 1.0) + Math.max(0, d.padding || 0)) * Math.max(1.0, d.safety || 1.0) + 0.012;
    const rCut2 = rCut * rCut;

    // --- Helpers (Ericson, Real-Time Collision Detection) ---

    // Closest squared distance from point P to triangle ABC.
    const pointSegDistSq = (px,py,pz, ax,ay,az, bx,by,bz) => {
      const abx = bx-ax, aby = by-ay, abz = bz-az;
      const apx = px-ax, apy = py-ay, apz = pz-az;
      const ab2 = abx*abx + aby*aby + abz*abz;
      let t = (ab2 > 1e-12) ? ((apx*abx + apy*aby + apz*abz) / ab2) : 0.0;
      t = t < 0 ? 0 : (t > 1 ? 1 : t);
      const cx = ax + abx*t, cy = ay + aby*t, cz = az + abz*t;
      const dx = px-cx, dy = py-cy, dz = pz-cz;
      return dx*dx + dy*dy + dz*dz;
    };

    const pointTriDistSq = (px,py,pz, ax,ay,az, bx,by,bz, cx,cy,cz) => {
      const abx = bx-ax, aby = by-ay, abz = bz-az;
      const acx = cx-ax, acy = cy-ay, acz = cz-az;
      const apx = px-ax, apy = py-ay, apz = pz-az;

      const d1 = abx*apx + aby*apy + abz*apz;
      const d2 = acx*apx + acy*apy + acz*apz;
      if (d1 <= 0 && d2 <= 0) { const dx=apx,dy=apy,dz=apz; return dx*dx+dy*dy+dz*dz; } // A

      const bpx = px-bx, bpy = py-by, bpz = pz-bz;
      const d3 = abx*bpx + aby*bpy + abz*bpz;
      const d4 = acx*bpx + acy*bpy + acz*bpz;
      if (d3 >= 0 && d4 <= d3) { const dx=bpx,dy=bpy,dz=bpz; return dx*dx+dy*dy+dz*dz; } // B

      const vc = d1*d4 - d3*d2;
      if (vc <= 0 && d1 >= 0 && d3 <= 0) {
        const v = d1 / (d1 - d3);
        const qx = ax + abx*v, qy = ay + aby*v, qz = az + abz*v;
        const dx=px-qx,dy=py-qy,dz=pz-qz; return dx*dx+dy*dy+dz*dz; // AB
      }

      const cpx = px-cx, cpy = py-cy, cpz = pz-cz;
      const d5 = abx*cpx + aby*cpy + abz*cpz;
      const d6 = acx*cpx + acy*cpy + acz*cpz;
      if (d6 >= 0 && d5 <= d6) { const dx=cpx,dy=cpy,dz=cpz; return dx*dx+dy*dy+dz*dz; } // C

      const vb = d5*d2 - d1*d6;
      if (vb <= 0 && d2 >= 0 && d6 <= 0) {
        const w = d2 / (d2 - d6);
        const qx = ax + acx*w, qy = ay + acy*w, qz = az + acz*w;
        const dx=px-qx,dy=py-qy,dz=pz-qz; return dx*dx+dy*dy+dz*dz; // AC
      }

      const va = d3*d6 - d5*d4;
      if (va <= 0 && (d4 - d3) >= 0 && (d5 - d6) >= 0) {
        const w = (d4 - d3) / ((d4 - d3) + (d5 - d6));
        const bcx = cx-bx, bcy = cy-by, bcz = cz-bz;
        const qx = bx + bcx*w, qy = by + bcy*w, qz = bz + bcz*w;
        const dx=px-qx,dy=py-qy,dz=pz-qz; return dx*dx+dy*dy+dz*dz; // BC
      }

      // Inside face region: distance to plane
      const nx = aby*acz - abz*acy;
      const ny = abz*acx - abx*acz;
      const nz = abx*acy - aby*acx;
      const n2 = nx*nx + ny*ny + nz*nz;
      if (n2 < 1e-12) {
        const dAB = pointSegDistSq(px,py,pz, ax,ay,az, bx,by,bz);
        const dBC = pointSegDistSq(px,py,pz, bx,by,bz, cx,cy,cz);
        const dCA = pointSegDistSq(px,py,pz, cx,cy,cz, ax,ay,az);
        return Math.min(dAB, dBC, dCA);
      }
      return ((apx*nx + apy*ny + apz*nz) ** 2) / n2;
    };

    const segSegDistSq = (p1x,p1y,p1z,p2x,p2y,p2z, q1x,q1y,q1z,q2x,q2y,q2z) => {
      const ux = p2x - p1x, uy = p2y - p1y, uz = p2z - p1z;
      const vx = q2x - q1x, vy = q2y - q1y, vz = q2z - q1z;
      const wx = p1x - q1x, wy = p1y - q1y, wz = p1z - q1z;

      const a = ux*ux + uy*uy + uz*uz;
      const b = ux*vx + uy*vy + uz*vz;
      const c = vx*vx + vy*vy + vz*vz;
      const d0 = ux*wx + uy*wy + uz*wz;
      const e0 = vx*wx + vy*wy + vz*wz;
      const D = a*c - b*b;

      const SMALL = 1e-12;
      let sc, sN, sD = D;
      let tc, tN, tD = D;

      if (D < SMALL) { sN = 0.0; sD = 1.0; tN = e0; tD = c; }
      else {
        sN = (b*e0 - c*d0);
        tN = (a*e0 - b*d0);
        if (sN < 0.0) { sN = 0.0; tN = e0; tD = c; }
        else if (sN > sD) { sN = sD; tN = e0 + b; tD = c; }
      }

      if (tN < 0.0) {
        tN = 0.0;
        if (-d0 < 0.0) sN = 0.0;
        else if (-d0 > a) sN = sD;
        else { sN = -d0; sD = a; }
      } else if (tN > tD) {
        tN = tD;
        if ((-d0 + b) < 0.0) sN = 0.0;
        else if ((-d0 + b) > a) sN = sD;
        else { sN = (-d0 + b); sD = a; }
      }

      sc = (Math.abs(sN) < SMALL ? 0.0 : sN / sD);
      tc = (Math.abs(tN) < SMALL ? 0.0 : tN / tD);

      const dx = wx + (sc * ux) - (tc * vx);
      const dy = wy + (sc * uy) - (tc * vy);
      const dz = wz + (sc * uz) - (tc * vz);
      return dx*dx + dy*dy + dz*dz;
    };

    // Segment-triangle intersection (Möller–Trumbore); returns true if the segment pierces the triangle.
    const segIntersectsTri = (p0x,p0y,p0z, p1x,p1y,p1z, ax,ay,az, bx,by,bz, cx,cy,cz) => {
      const dirx = p1x-p0x, diry = p1y-p0y, dirz = p1z-p0z;
      const e1x = bx-ax, e1y = by-ay, e1z = bz-az;
      const e2x = cx-ax, e2y = cy-ay, e2z = cz-az;

      const pvx = diry*e2z - dirz*e2y;
      const pvy = dirz*e2x - dirx*e2z;
      const pvz = dirx*e2y - diry*e2x;

      const det = e1x*pvx + e1y*pvy + e1z*pvz;
      if (Math.abs(det) < 1e-10) return false;
      const invDet = 1.0 / det;

      const tvx = p0x-ax, tvy = p0y-ay, tvz = p0z-az;
      const u = (tvx*pvx + tvy*pvy + tvz*pvz) * invDet;
      if (u < 0.0 || u > 1.0) return false;

      const qvx = tvy*e1z - tvz*e1y;
      const qvy = tvz*e1x - tvx*e1z;
      const qvz = tvx*e1y - tvy*e1x;

      const v = (dirx*qvx + diry*qvy + dirz*qvz) * invDet;
      if (v < 0.0 || (u + v) > 1.0) return false;

      const t = (e2x*qvx + e2y*qvy + e2z*qvz) * invDet;
      return (t >= 0.0 && t <= 1.0);
    };

    // Minimum squared distance between a segment and a triangle.
    const segTriDistSq = (p0x,p0y,p0z, p1x,p1y,p1z, ax,ay,az, bx,by,bz, cx,cy,cz) => {
      if (segIntersectsTri(p0x,p0y,p0z, p1x,p1y,p1z, ax,ay,az, bx,by,bz, cx,cy,cz)) return 0.0;

      let d2 = pointTriDistSq(p0x,p0y,p0z, ax,ay,az, bx,by,bz, cx,cy,cz);
      d2 = Math.min(d2, pointTriDistSq(p1x,p1y,p1z, ax,ay,az, bx,by,bz, cx,cy,cz));

      d2 = Math.min(d2, segSegDistSq(p0x,p0y,p0z, p1x,p1y,p1z, ax,ay,az, bx,by,bz));
      d2 = Math.min(d2, segSegDistSq(p0x,p0y,p0z, p1x,p1y,p1z, bx,by,bz, cx,cy,cz));
      d2 = Math.min(d2, segSegDistSq(p0x,p0y,p0z, p1x,p1y,p1z, cx,cy,cz, ax,ay,az));
      return d2;
    };

    const tmpP0 = new THREE.Vector3();
    const tmpP1 = new THREE.Vector3();

    for (let mi = 0; mi < meshes.length; mi++) {
      const mesh = meshes[mi];
      const geom = mesh.geometry;
      if (!geom || !geom.attributes || !geom.attributes.position) continue;

      if (geom.userData && geom.userData._portalCut) continue;

      // Clone once per mesh so we don't mutate shared buffers.
      const g = geom.clone();
      mesh.geometry = g;

      const pos = g.attributes.position;

      // Ensure there is an index to filter.
      if (!g.index) {
        const n = pos.count;
        const Arr = (n > 65535) ? Uint32Array : Uint16Array;
        const idx = new Arr(n);
        for (let i = 0; i < n; i++) idx[i] = i;
        g.setIndex(new THREE.BufferAttribute(idx, 1));
      }

      const idxArr = g.index.array;

      // Compute segment endpoints in THIS MESH's LOCAL space.
      let p0x,p0y,p0z,p1x,p1y,p1z;
      if (targetEl) {
        tmpP0.copy(cWorld).addScaledVector(dirWorld, -halfL);
        tmpP1.copy(cWorld).addScaledVector(dirWorld,  halfL);
        mesh.worldToLocal(tmpP0);
        mesh.worldToLocal(tmpP1);
        p0x=tmpP0.x; p0y=tmpP0.y; p0z=tmpP0.z;
        p1x=tmpP1.x; p1y=tmpP1.y; p1z=tmpP1.z;
      } else {
        // Fallback: treat center/axis as local to the mesh.
        const u = dirWorld; // already normalized from d.axis
        p0x = d.center.x - u.x * halfL; p0y = d.center.y - u.y * halfL; p0z = d.center.z - u.z * halfL;
        p1x = d.center.x + u.x * halfL; p1y = d.center.y + u.y * halfL; p1z = d.center.z + u.z * halfL;
      }

      // Groups-aware index filtering (preserves multi-material dome shell).
      const groups = (g.groups && g.groups.length) ? g.groups.slice() : [{ start: 0, count: idxArr.length, materialIndex: 0 }];

      const newIndex = [];
      const newGroups = [];
      let cursor = 0;

      for (let gi = 0; gi < groups.length; gi++) {
        const gr = groups[gi];
        const start = gr.start | 0;
        const end = Math.min(idxArr.length, start + (gr.count | 0));
        const kept = [];

        for (let ii = start; ii + 2 < end; ii += 3) {
          const ia = idxArr[ii], ib = idxArr[ii+1], ic = idxArr[ii+2];

          const ax = pos.getX(ia), ay = pos.getY(ia), az = pos.getZ(ia);
          const bx = pos.getX(ib), by = pos.getY(ib), bz = pos.getZ(ib);
          const cx = pos.getX(ic), cy = pos.getY(ic), cz = pos.getZ(ic);

          const d2 = segTriDistSq(p0x,p0y,p0z, p1x,p1y,p1z, ax,ay,az, bx,by,bz, cx,cy,cz);

          // Keep only triangles outside the clearance cylinder.
          if (d2 > rCut2) {
            kept.push(ia, ib, ic);
          }
        }

        if (kept.length) {
          newGroups.push({ start: cursor, count: kept.length, materialIndex: (gr.materialIndex | 0) });
          cursor += kept.length;
          for (let k = 0; k < kept.length; k++) newIndex.push(kept[k]);
        }
      }

      const Arr = (pos.count > 65535) ? Uint32Array : Uint16Array;
      g.setIndex(new THREE.BufferAttribute(new Arr(newIndex), 1));
      g.clearGroups();
      for (let gi = 0; gi < newGroups.length; gi++) {
        const gr = newGroups[gi];
        g.addGroup(gr.start, gr.count, gr.materialIndex);
      }

      g.computeVertexNormals();
      smoothNormalsByPosition(g, 1e-4);

      g.userData = g.userData || {};
      g.userData._portalCut = true;
    }
  }
});


// Wait until the imported tunnel has been merge-aligned to the host anchor, then cut the dome portal.
// This avoids the classic failure mode where the cut runs using the tunnel's pre-aligned transform (wrong location),
// producing no opening (or cutting in the wrong place) and later leaving "dome leftovers" inside the tunnel.
AFRAME.registerComponent('portal-cut-wait', {
  schema: {
    target: { type: 'selector' },         // e.g., #tunnel_01_shell_inner
    far:    { type: 'selector' },         // e.g., #tunnel_01_rim_far
    anchor: { type: 'selector' },         // e.g., #merge_portal_anchor

    targetAxis: { type: 'vec3', default: {x:0, y:1, z:0} }, // axis in TARGET local space

    radius:     { type: 'number', default: 1.25 },  // tunnel inner radius
    padding:    { type: 'number', default: 0.24 },  // extra clearance (kills slivers)
    safety:     { type: 'number', default: 1.06 },  // multiplicative margin
    halfLength: { type: 'number', default: 12.0 },  // cut span along the tunnel axis

    epsilon:    { type: 'number', default: 0.03 },  // how close far rim must be to anchor to be "aligned"
    debug:      { type: 'boolean', default: false }
  },

  init: function () {
    this._done = false;
    this._wFar = new THREE.Vector3();
    this._wAnc = new THREE.Vector3();
    this._lastLogAt = 0;
  },

  tick: function (t) {
    if (this._done) return;

    const d = this.data;
    const targetEl = d.target;
    const farEl    = d.far;
    const anchorEl = d.anchor;

    if (!targetEl || !farEl || !anchorEl) return;
    if (!targetEl.object3D || !farEl.object3D || !anchorEl.object3D) return;

    // Keep world matrices current.
    const sceneObj = this.el.sceneEl && this.el.sceneEl.object3D;
    if (sceneObj) sceneObj.updateMatrixWorld(true);

    farEl.object3D.getWorldPosition(this._wFar);
    anchorEl.object3D.getWorldPosition(this._wAnc);

    const dist = this._wFar.distanceTo(this._wAnc);

    if (d.debug && (t - this._lastLogAt > 500)) {
      this._lastLogAt = t;
      console.log('[portal-cut-wait] far→anchor dist:', dist.toFixed(4));
    }

    if (dist > Math.max(0.005, d.epsilon)) return;

    // Apply cut only after alignment is stable.
    const cutStr =
      'target: #'+ targetEl.id + '; ' +
      'targetAxis: ' + d.targetAxis.x + ' ' + d.targetAxis.y + ' ' + d.targetAxis.z + '; ' +
      'radius: ' + d.radius + '; ' +
      'padding: ' + d.padding + '; ' +
      'halfLength: ' + d.halfLength + '; ' +
      'safety: ' + d.safety + ';';

    if (d.debug) console.log('[portal-cut-wait] applying cave-portal-cut:', cutStr);

    // Setting the attribute will instantiate the cutter and run once.
    this.el.setAttribute('cave-portal-cut', cutStr);

    this._done = true;

    // Optional: hide this component once finished.
    this.el.removeAttribute('portal-cut-wait');
  }
});


AFRAME.registerComponent('ground-undulate', {
  schema: {
    amp:         { type: 'number', default: 0.07 },   // meters
    freq:        { type: 'number', default: 0.22 },   // low frequency
    seed:        { type: 'int',    default: 23 },
    flatCenter:  { type: 'vec3',   default: {x: 0, y: 0, z: 0} }, // world
    flatRadius:  { type: 'number', default: 5.2 },    // meters
    falloff:     { type: 'number', default: 2.0 }     // meters
  },

  init: function () {
    this._applied = false;
    this._inv = new THREE.Matrix4();
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },

  remove: function () { this.el.removeEventListener('object3dset', this._apply); },

  _hash: function (x, z, seed) {
    const s = Math.sin(x * 127.1 + z * 311.7 + seed * 17.0) * 43758.5453123;
    return s - Math.floor(s);
  },
  _fade: function (t) { return t * t * (3.0 - 2.0 * t); },
  _lerp: function (a, b, t) { return a + (b - a) * t; },

  _noise2: function (x, z, seed) {
    const ix = Math.floor(x), iz = Math.floor(z);
    const fx = x - ix, fz = z - iz;
    const u = this._fade(fx), v = this._fade(fz);

    const n00 = this._hash(ix,     iz,     seed) * 2.0 - 1.0;
    const n10 = this._hash(ix + 1, iz,     seed) * 2.0 - 1.0;
    const n01 = this._hash(ix,     iz + 1, seed) * 2.0 - 1.0;
    const n11 = this._hash(ix + 1, iz + 1, seed) * 2.0 - 1.0;

    const nx0 = this._lerp(n00, n10, u);
    const nx1 = this._lerp(n01, n11, u);
    return this._lerp(nx0, nx1, v);
  },

  _smoothstep: function (t) { return t * t * (3.0 - 2.0 * t); },

  _apply: function () {
    if (this._applied) return;

    const mesh = this.el.getObject3D('mesh');
    if (!mesh || !mesh.geometry || !mesh.geometry.attributes || !mesh.geometry.attributes.position) return;

    const geom = mesh.geometry.clone();
    mesh.geometry = geom;

    const pos = geom.attributes.position;

    const qWorld = new THREE.Quaternion();
    mesh.getWorldQuaternion(qWorld);
    const invQ = qWorld.clone().invert();
    const upLocal = new THREE.Vector3(0, 1, 0).applyQuaternion(invQ).normalize();

    const tmpLocal = new THREE.Vector3();
    const tmpWorld = new THREE.Vector3();

    const d = this.data;
    const c = new THREE.Vector3(d.flatCenter.x, d.flatCenter.y, d.flatCenter.z);

    for (let i = 0; i < pos.count; i++) {
      tmpLocal.fromBufferAttribute(pos, i);
      tmpWorld.copy(tmpLocal);
      mesh.localToWorld(tmpWorld);

      const dx = tmpWorld.x - c.x;
      const dz = tmpWorld.z - c.z;
      const r = Math.sqrt(dx*dx + dz*dz);

      // Mask: keep an inner donut area flat around the basin.
      const t = (r - d.flatRadius) / Math.max(1e-6, d.falloff);
      const mask = Math.min(1.0, Math.max(0.0, this._smoothstep(t)));

      if (mask <= 0.0001) continue;

      const n1 = this._noise2(tmpWorld.x * d.freq, tmpWorld.z * d.freq, d.seed);
      const n2 = this._noise2(tmpWorld.x * d.freq * 2.7, tmpWorld.z * d.freq * 2.7, d.seed + 9);
      const n = (n1 * 0.7 + n2 * 0.3);

      const rise = d.amp * n * mask;
      tmpLocal.addScaledVector(upLocal, rise);

      pos.setXYZ(i, tmpLocal.x, tmpLocal.y, tmpLocal.z);
    }

    pos.needsUpdate = true;
    geom.computeVertexNormals();

      smoothNormalsByPosition(geom, 1e-4);
    this._applied = true;
  }
});


// Pulls the lowest edge of the cave shell down to meet the floor (world Y), with a smooth falloff upward.
// This alters the *main dome mesh* (no extra skirt meshes) and keeps the upper coverage essentially unchanged.
AFRAME.registerComponent('cave-floor-seal', {
  schema: {
    floorY:       { type: 'number', default: 0 },     // world-space floor Y to touch
    anchorHeight: { type: 'number', default: 0.75 },  // in meters above the shell's current lowest point where deformation fades to 0
    retries:      { type: 'int',    default: 6 }      // wait for cave-displace to finish
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },

  _smoothstep: function (t) { return t * t * (3.0 - 2.0 * t); },

  _apply: function () {
    const obj = this.el.getObject3D('mesh');
    if (!obj) return;

    const meshes = [];
    obj.traverse(o => { if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) meshes.push(o); });
    if (!meshes.length) return;

    const d = this.data;

    // If cave-displace is present, wait until it has tagged geometry as displaced.
    // This prevents double-cloning and avoids racing the displacement step.
    const needsDisplace = this.el.hasAttribute('cave-displace');
    if (needsDisplace) {
      let allDisplaced = true;
      for (const m of meshes) {
        if (!(m.geometry.userData && m.geometry.userData._caveDisplaced)) { allDisplaced = false; break; }
      }
      if (!allDisplaced) {
        if (d.retries > 0) {
          this.el.setAttribute('cave-floor-seal', { retries: d.retries - 1 });
          setTimeout(this._apply, 25);
        }
        return;
      }
    }

    // Find the current lowest vertex in WORLD space.
    let minY = Infinity;
    const _v = new THREE.Vector3();

    obj.updateMatrixWorld(true);
    obj.traverse(m => { if (m && m.isMesh) m.updateMatrixWorld(true); });

    for (const mesh of meshes) {
      const pos = mesh.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        _v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
        if (_v.y < minY) minY = _v.y;
      }
    }

    const delta = d.floorY - minY; // negative means we need to pull DOWN
    if (delta >= 0) return; // already touching or below

    const anchorY = minY + Math.max(0.05, d.anchorHeight);
    const _w = new THREE.Vector3();
    const _local = new THREE.Vector3();
    const _inv = new THREE.Matrix4();

    for (const mesh of meshes) {
      // Avoid double-applying.
      if (mesh.geometry.userData && mesh.geometry.userData._floorSealed) continue;

      // Clone so we don't mutate shared geometry.
      const g = mesh.geometry.clone();
      const pos = g.attributes.position;

      _inv.copy(mesh.matrixWorld).invert();

      for (let i = 0; i < pos.count; i++) {
        _local.fromBufferAttribute(pos, i);
        _w.copy(_local).applyMatrix4(mesh.matrixWorld);

        if (_w.y >= anchorY) continue;

        const t = (_w.y - minY) / (anchorY - minY); // 0..1
        const s = this._smoothstep(Math.min(1, Math.max(0, t)));
        const wgt = 1.0 - s;

        _w.y += delta * wgt;

        _local.copy(_w).applyMatrix4(_inv);
        pos.setXYZ(i, _local.x, _local.y, _local.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      smoothNormalsByPosition(g, 1e-4);
      g.userData = g.userData || {};
      g.userData._floorSealed = true;

      mesh.geometry = g;
    }
  }
});


// Ensures uv2 exists for aoMap on primitives (copies uv -> uv2).


// Adds two things to the main dome mesh:
// 1) Softens the dome ↔ flat-wall intersection by insetting / chipping the ring near a local Z plane (typically z=0).
// 2) Adds low-frequency, non-axis-symmetric irregularity so the interior feels less mathematically perfect.
// This is a pure geometry edit (no extra meshes). Safe for photoreal seams.
AFRAME.registerComponent('cave-dome-naturalize', {
  schema: {
    seamZ:        { type: 'number', default: 0.0 },   // local Z plane where the flat wall sits in dome-local space
    seamBand:     { type: 'number', default: 0.70 },  // thickness (local units) of the blend band around seamZ
    seamInset:    { type: 'number', default: 0.16 },  // meters (local units) to push the seam ring behind the wall (negative Z)
    seamRadAmp:   { type: 'number', default: 0.10 },  // meters (local units) radial chip amplitude near seam
    seamNoiseFreq:{ type: 'number', default: 0.55 },  // noise frequency along seam
    globalAmp:    { type: 'number', default: 0.10 },  // meters (local units) global irregularity amplitude
    globalFreq:   { type: 'number', default: 0.18 },  // global noise frequency
    tangentialAmp:{ type: 'number', default: 0.06 },  // meters (local units) tangential warp amplitude
    seed:         { type: 'number', default: 101 },
    retries:      { type: 'int',    default: 10 }     // wait for displace + floor seal
  },

  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },

  remove: function () { this.el.removeEventListener('object3dset', this._apply); },

  _hash11: function (n) { const s = Math.sin(n) * 43758.5453123; return s - Math.floor(s); },
  _randLattice: function (ix, iy, iz, seed) {
    const n = ix * 127.1 + iy * 311.7 + iz * 74.7 + seed * 19.19;
    return this._hash11(n) * 2.0 - 1.0;
  },
  _fade: function (t) { return t * t * (3.0 - 2.0 * t); },
  _lerp: function (a, b, t) { return a + (b - a) * t; },
  _noise3: function (x, y, z, seed) {
    const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
    const fx = x - ix, fy = y - iy, fz = z - iz;
    const u = this._fade(fx), v = this._fade(fy), w = this._fade(fz);

    const n000 = this._randLattice(ix,   iy,   iz,   seed);
    const n100 = this._randLattice(ix+1, iy,   iz,   seed);
    const n010 = this._randLattice(ix,   iy+1, iz,   seed);
    const n110 = this._randLattice(ix+1, iy+1, iz,   seed);
    const n001 = this._randLattice(ix,   iy,   iz+1, seed);
    const n101 = this._randLattice(ix+1, iy,   iz+1, seed);
    const n011 = this._randLattice(ix,   iy+1, iz+1, seed);
    const n111 = this._randLattice(ix+1, iy+1, iz+1, seed);

    const nx00 = this._lerp(n000, n100, u);
    const nx10 = this._lerp(n010, n110, u);
    const nx01 = this._lerp(n001, n101, u);
    const nx11 = this._lerp(n011, n111, u);

    const nxy0 = this._lerp(nx00, nx10, v);
    const nxy1 = this._lerp(nx01, nx11, v);

    return this._lerp(nxy0, nxy1, w);
  },

  _smoothstep: function (t) { return t * t * (3.0 - 2.0 * t); },

  _apply: function () {
    const obj = this.el.getObject3D('mesh');
    if (!obj) return;

    // Wait for cave-displace + cave-floor-seal to finish so we bake on top of the final shape.
    const meshes = [];
    let allReady = true;

    obj.traverse(o => {
      if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) {
        meshes.push(o);
        const g = o.geometry;
        const ud = g.userData || {};
        if (!(ud._caveDisplaced && ud._floorSealed)) allReady = false;
      }
    });

    if (!meshes.length) return;

    if (!allReady) {
      if (this.data.retries > 0) {
        this.data.retries -= 1;
        setTimeout(this._apply, 60);
      }
      return;
    }

    for (const mesh of meshes) {
      const g0 = mesh.geometry;
      g0.userData = g0.userData || {};
      if (g0.userData._domeNaturalized) continue;

      // Clone to avoid mutating shared geometry.
      const g = g0.clone();
      const pos = g.attributes.position;
      if (!pos) continue;

      // Bounding box for bottom-weighting: helps soften the floor+wall+dome tri-junction.
      g.computeBoundingBox();
      const minY = g.boundingBox ? g.boundingBox.min.y : -1.0;
      const maxY = g.boundingBox ? g.boundingBox.max.y :  1.0;
      const bottomBandY = Math.max(1e-6, (maxY - minY) * 0.18);

      // Cache the current (post-displace + post-floor-seal) positions as a baseline to prevent stacking.
      if (!g.userData._basePos) {
        g.userData._basePos = new Float32Array(pos.array);
      }
      const base = g.userData._basePos;

      const d = this.data;
      const seedA = d.seed * 1.0;
      const seedB = d.seed * 3.7;

      const v = new THREE.Vector3();
      const n = new THREE.Vector3();
      const up = new THREE.Vector3(0, 1, 0);
      const t1 = new THREE.Vector3();
      const t2 = new THREE.Vector3();

      for (let i = 0; i < pos.count; i++) {
        v.set(base[i*3+0], base[i*3+1], base[i*3+2]);

        // Approximate normal from position (works well for sphere-like shells).
        n.copy(v).normalize();

        // --- Global irregularity (breaks perfect ellipsoid symmetry) ---
        const gx = v.x * d.globalFreq;
        const gy = v.y * d.globalFreq;
        const gz = v.z * d.globalFreq;

        const ng = this._noise3(gx, gy, gz, seedA);
        v.addScaledVector(n, ng * d.globalAmp);

        // Tangential warp (prevents "inflated balloon" look)
        // Build a stable tangent basis.
        t1.crossVectors(n, up);
        if (t1.lengthSq() < 1e-6) t1.set(1, 0, 0);
        t1.normalize();
        t2.crossVectors(n, t1).normalize();

        const nt1 = this._noise3(gx + 7.1, gy + 3.3, gz + 1.9, seedB);
        const nt2 = this._noise3(gx + 2.4, gy + 9.7, gz + 5.2, seedB + 11.0);
        v.addScaledVector(t1, nt1 * d.tangentialAmp);
        v.addScaledVector(t2, nt2 * d.tangentialAmp);

        // --- Seam softening at the flat wall plane (local z ~= seamZ) ---
        const dz = Math.abs(v.z - d.seamZ);
        const t = 1.0 - Math.min(1.0, dz / Math.max(1e-6, d.seamBand));
        const w = this._smoothstep(t); // 0..1

        if (w > 0.0) {
          // Noise evaluated in seam plane so it's irregular around the ring.
          const sx = v.x * d.seamNoiseFreq;
          const sy = v.y * d.seamNoiseFreq;
          const sn = this._noise3(sx, sy, 0.0, seedA + 27.0); // [-1,1]

          // Push seam slightly behind wall (negative Z) with jitter so it's not a perfect circle line.
          // Extra weighting near the bottom of the dome so the seam doesn't read as a perfect hard circle.
          const bottomT = 1.0 - Math.min(1.0, Math.max(0.0, (v.y - (minY + bottomBandY)) / bottomBandY));
          const wBottom = this._smoothstep(bottomT) * w;
          const inset = d.seamInset * (w + 0.75 * wBottom) * (0.65 + 0.35 * (sn * 0.5 + 0.5));
          v.z -= inset;

          // Radial chip (in/out along normal) to break the circular precision.
          const chip = d.seamRadAmp * (w + 0.85 * wBottom) * sn;
          v.addScaledVector(n, chip);
        }

        pos.setXYZ(i, v.x, v.y, v.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      smoothNormalsByPosition(g, 1e-4);
      g.userData = g.userData || {};
      g.userData._domeNaturalized = true;

      mesh.geometry = g;

      // Re-seat the bottom edge to the floor after the irregularity pass.
      const seal = this.el.components['cave-floor-seal'];
      if (seal && typeof seal._apply === 'function') {
        // Clear the flag so the seal will run again.
        g.userData._floorSealed = false;
        setTimeout(() => seal._apply(), 0);
      }
    }
  }
});

AFRAME.registerComponent('collider-ring', {
  schema: {
    center:    { type: 'vec3',   default: {x:0,y:0,z:0} },
    radiusX:   { type: 'number', default: 10 },
    radiusZ:   { type: 'number', default: 10 },
    segments:  { type: 'int',    default: 36 },
    height:    { type: 'number', default: 5.5 },
    thickness: { type: 'number', default: 1.0 },
    y:         { type: 'number', default: 2.4 },

    // Back-compat single opening (deg range). Use openRanges for multiple openings.
    openStart: { type: 'number', default: -1 }, // degrees
    openEnd:   { type: 'number', default: -1 }, // degrees

    // Multiple openings, comma-separated ranges like: "352-8,170-190".
    // If provided, it overrides openStart/openEnd.
    openRanges:{ type: 'string', default: '' },

    layers:    { type: 'int',    default: 2 },  // 2 staggered rings to eliminate gaps
    overlap:   { type: 'number', default: 1.45 } // segment depth multiplier
  },
  init: function () { this._build(); },
  update: function () { this._build(); },
  _build: function () {
    while (this.el.firstChild) this.el.removeChild(this.el.firstChild);

    const d = this.data;
    const cx = d.center.x, cz = d.center.z;
    const seg = Math.max(12, d.segments|0);
    const step = 360 / seg;

    const avgR = (d.radiusX + d.radiusZ) * 0.5;
    const segLen = (2 * Math.PI * avgR / seg) * d.overlap;

    const norm = (deg) => (deg % 360 + 360) % 360;

    // Parse openRanges once per build.
    const parsedRanges = [];
    const rs = (d.openRanges || '').trim();
    if (rs) {
      for (const part of rs.split(',')) {
        const p = part.trim();
        if (!p) continue;
        const mm = p.match(/^(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)$/);
        if (!mm) continue;
        parsedRanges.push({ s: norm(parseFloat(mm[1])), e: norm(parseFloat(mm[2])) });
      }
    }

    const inOpen = (deg) => {
      const a = norm(deg);

      // Multi-range override.
      if (parsedRanges.length) {
        for (let i = 0; i < parsedRanges.length; i++) {
          const s = parsedRanges[i].s;
          const e = parsedRanges[i].e;
          if (s <= e) {
            if (a >= s && a <= e) return true;
          } else {
            if (a >= s || a <= e) return true;
          }
        }
        return false;
      }

      // Back-compat single range.
      if (d.openStart < 0 || d.openEnd < 0) return false;
      const s = norm(d.openStart);
      const e = norm(d.openEnd);
      if (s <= e) return (a >= s && a <= e);
      return (a >= s || a <= e);
    };

    const layers = Math.max(1, d.layers|0);

    for (let layer = 0; layer < layers; layer++) {
      const phase = (layer / layers) * (step * 0.5); // stagger
      // Slightly different radii per layer to cover micro-gaps from ellipse curvature.
      const rx = d.radiusX + (layer === 0 ? 0 : d.thickness * 0.25);
      const rz = d.radiusZ + (layer === 0 ? 0 : d.thickness * 0.25);

      for (let i = 0; i < seg; i++) {
        const deg = i * step + phase;
        if (inOpen(deg)) continue;

        const rad = deg * DEG2RAD;
        const x = cx + Math.cos(rad) * rx;
        const z = cz + Math.sin(rad) * rz;

        const rotY = (-deg + 90);

        const b = document.createElement('a-box');
        b.setAttribute('class', 'collider');
        b.setAttribute('visible', 'false');
        b.setAttribute('width',  d.thickness);
        b.setAttribute('height', d.height);
        b.setAttribute('depth',  segLen);
        b.setAttribute('position', `${x.toFixed(3)} ${d.y.toFixed(3)} ${z.toFixed(3)}`);
        b.setAttribute('rotation', `0 ${rotY.toFixed(3)} 0`);
        this.el.appendChild(b);
      }
    }
  }
});

AFRAME.registerComponent('prune-colliders', {
  schema: {
    keepRoots: { type: 'string', default: '#industrial_elevator_1, #dome_tunnel_import' },
    runForMs: { type: 'number', default: 4500 },
    intervalMs: { type: 'number', default: 300 }
  },
  init: function () {
    const parseRoots = () => (this.data.keepRoots || '')
      .split(',')
      .map(s => s.trim())
      .filter(Boolean)
      .map(sel => document.querySelector(sel))
      .filter(Boolean);

    const pruneOnce = () => {
      const roots = parseRoots();
      const keep = (el) => roots.some(r => r.contains(el));
      const all = Array.from(this.el.querySelectorAll('.collider, [data-tube="1"]'));
      let removed = 0;
      for (const el of all) {
        if (!keep(el)) {
          el.parentNode && el.parentNode.removeChild(el);
          removed++;
        }
      }
      // Refresh rig collision cache after structural changes.
      const rig = document.getElementById('rig');
      const rw = rig && rig.components && rig.components['rig-walk'];
      if (rw && typeof rw._refreshColliders === 'function') {
        rw._refreshColliders();
      }
      return removed;
    };

    const start = performance.now();
    const tick = () => {
      pruneOnce();
      if (performance.now() - start < this.data.runForMs) {
        this._t = setTimeout(tick, this.data.intervalMs);
      }
    };

    this.el.addEventListener('loaded', () => {
      // Run a few passes to catch colliders created during init / delayed loads.
      setTimeout(tick, 120);
      setTimeout(pruneOnce, 900);
      setTimeout(pruneOnce, 1800);
    });
  },
  remove: function () {
    if (this._t) clearTimeout(this._t);
  }
});



AFRAME.registerComponent('tube-wall', {

/* ============================
   Rim side blockers (TEMP/ROBUST)
   - Blocks walking "through the ring material" at tunnel rims.
   - Creates 2 upright slab colliders at the rim plane, leaving the opening free.
   - Anchors to an existing rim entity (e.g. #tunnel_02_rim_near).
============================ */
AFRAME.registerComponent('rim-side-blockers', {
  schema: {
    target: { type: 'selector' },           // rim entity to follow
    inner:  { type: 'number', default: 1.25 },
    outer:  { type: 'number', default: 3.25 },
    depth:  { type: 'number', default: 0.55 }, // along tunnel axis
    height: { type: 'number', default: 3.2 },
    yOffset:{ type: 'number', default: 0.40 }  // raises collider center so bottom ~ y=0 in world
  },
  init: function () {
    this._built = false;
    this._apply = this._apply.bind(this);
    const scene = this.el.sceneEl;
    const run = () => requestAnimationFrame(() => requestAnimationFrame(this._apply));
    if (scene && scene.hasLoaded) run();
    else if (scene) scene.addEventListener('loaded', run, { once: true });

    // Also retry a few times to catch late loads / transforms.
    setTimeout(run, 250);
    setTimeout(run, 1200);
    setTimeout(run, 3000);
  },
  _ensureBuilt: function () {
    if (this._built) return;

    const band = Math.max(0.01, this.data.outer - this.data.inner);
    const mk = (id) => {
      const b = document.createElement('a-box');
      b.setAttribute('id', id);
      b.setAttribute('class', 'collider');
      b.setAttribute('visible', 'false');
      b.setAttribute('width', band.toFixed(4));         // spans ring band in horizontal (perp) direction
      b.setAttribute('height', this.data.height.toFixed(4));
      b.setAttribute('depth', this.data.depth.toFixed(4));
      // Safety: keep new segments offscreen until _apply places them.
      b.setAttribute('position', '9999 -9999 9999'); // small thickness along axis
      return b;
    };

    this._L = mk(this.el.id ? `${this.el.id}__L` : '');
    this._R = mk(this.el.id ? `${this.el.id}__R` : '');

    this.el.appendChild(this._L);
    this.el.appendChild(this._R);

    this._built = true;
  },
  _apply: function () {
    const t = this.data.target;
    if (!t || !t.object3D) return;

    this._ensureBuilt();

    t.object3D.updateMatrixWorld(true);

    // World position of rim center.
    const pos = new THREE.Vector3();
    t.object3D.getWorldPosition(pos);
    pos.y += this.data.yOffset;

    // World orientation: we only need yaw (rig-walk uses yaw-only).
    const quat = new THREE.Quaternion();
    t.object3D.getWorldQuaternion(quat);

    // Rim normal in world (ring default normal is +Z).
    const n = new THREE.Vector3(0, 0, 1).applyQuaternion(quat);
    n.y = 0;
    if (n.lengthSq() < 1e-6) return;
    n.normalize();

    const yawRad = Math.atan2(n.x, n.z);
    const yawDeg = yawRad * 180 / Math.PI;

    // Place container at rim center, yaw-aligned with axis.
    this.el.setAttribute('position', `${pos.x.toFixed(6)} ${pos.y.toFixed(6)} ${pos.z.toFixed(6)}`);
    this.el.setAttribute('rotation', `0 ${yawDeg.toFixed(6)} 0`);

    const band = Math.max(0.01, this.data.outer - this.data.inner);
    const offset = this.data.inner + band * 0.5;

    // Two side slabs: left/right in local X, leaving the opening clear.
    if (this._L) this._L.setAttribute('position', `${offset.toFixed(6)} 0 0`);
    if (this._R) this._R.setAttribute('position', `${(-offset).toFixed(6)} 0 0`);

    // Refresh rig colliders cache after we update transforms.
    const rig = document.getElementById('rig');
    const rw = rig && rig.components && rig.components['rig-walk'];
    if (rw && typeof rw._refreshColliders === 'function') rw._refreshColliders();
  }
});




/* --- Proxy box colliders (auto-fit to a target mesh) --- */
AFRAME.registerComponent('proxy-box-collider', {
  schema: {
    target:    { type: 'selector' },
    pad:       { type: 'vec3', default: {x: 0.08, y: 0.08, z: 0.08} },
    minHeight: { type: 'number', default: 0.35 }
  },
  init: function () {
    this._built = false;
    this._build = this._build.bind(this);
    // Try a few times in case geometry/components settle after load
    this._tries = 0;
    this.el.sceneEl.addEventListener('loaded', () => setTimeout(this._build, 50));
    setTimeout(this._build, 150);
    setTimeout(this._build, 450);
    setTimeout(this._build, 900);
  },
  _build: function () {
    if (this._built) return;
    const t = this.data.target;
    if (!t || !t.object3D) return;

    // If target isn't ready yet, retry a few times
    const obj = t.object3D;
    if (!obj || obj.children.length === 0) {
      if (this._tries++ < 12) return setTimeout(this._build, 200);
    }

    const box = new THREE.Box3().setFromObject(obj);
    if (box.isEmpty()) {
      if (this._tries++ < 12) return setTimeout(this._build, 200);
      return;
    }

    const size = new THREE.Vector3();
    const center = new THREE.Vector3();
    box.getSize(size);
    box.getCenter(center);

    const pad = this.data.pad || {x:0.08,y:0.08,z:0.08};
    const w = Math.max(0.05, size.x + pad.x * 2);
    const h = Math.max(this.data.minHeight || 0.35, size.y + pad.y * 2);
    const d = Math.max(0.05, size.z + pad.z * 2);

    // Yaw only rotation (matches rig-walk collider expectations)

AFRAME.registerComponent('dome-ring-barrier', {
  schema: {
    dome:    { type: 'selector' },
    portals: { type: 'string', default: '' },
    segments:{ type: 'int', default: 48 },
    gapDeg:  { type: 'number', default: 34 },
    inset:   { type: 'number', default: 1.0 },
    height:  { type: 'number', default: 4.0 },
    depth:   { type: 'number', default: 2.4 },
    yOffset: { type: 'number', default: 0.40 }
  },
  init: function () {
    this._built = false;
    this._boxes = [];
    this._apply = this._apply.bind(this);

    const run = () => requestAnimationFrame(() => requestAnimationFrame(this._apply));
    if (scene && scene.hasLoaded) run();
    else if (scene) scene.addEventListener('loaded', run, { once: true });

    setTimeout(run, 250);
    setTimeout(run, 1200);
    setTimeout(run, 3000);
  },
  _ensureBuilt: function (n, width) {
    if (this._built) return;
    for (let i = 0; i < n; i++) {
      const b = document.createElement('a-box');
      b.setAttribute('class', 'collider');
      b.setAttribute('visible', 'false');
      b.setAttribute('width', width.toFixed(4));
      b.setAttribute('height', this.data.height.toFixed(4));
      b.setAttribute('depth', this.data.depth.toFixed(4));
      // Safety: keep new segments offscreen until _apply places them.
      b.setAttribute('position', '9999 -9999 9999');
      this.el.appendChild(b);
      this._boxes.push(b);
    }
    this._built = true;
  },
  _portalAngles: function (center) {
    const s = (this.data.portals || '').split(',').map(v => v.trim()).filter(Boolean);
    const out = [];
    for (const sel of s) {
      const pEl = document.querySelector(sel);
      if (!pEl || !pEl.object3D) continue;
      pEl.object3D.updateMatrixWorld(true);
      const p = new THREE.Vector3();
      pEl.object3D.getWorldPosition(p);
      const dx = p.x - center.x;
      const dz = p.z - center.z;
      out.push(Math.atan2(dx, dz) * 180 / Math.PI);

    return out;
  },
  _apply: function () {
    const d = this.data.dome;
    if (!d || !d.object3D) return;

    d.object3D.updateMatrixWorld(true);

    const center = new THREE.Vector3();
    d.object3D.getWorldPosition(center);
    center.y += this.data.yOffset;

    let baseR = 11.0;
    let sx = 1.0, sz = 1.0;
    const tds = d.getAttribute('thick-dome-shell');
    if (tds && typeof tds === 'object') {
      const rr = parseFloat(tds.radius);
      if (Number.isFinite(rr)) baseR = rr;
      if (tds.innerScale) {
        const parts = ('' + tds.innerScale).trim().split(/[\s,]+/).map(parseFloat);
        if (parts.length >= 3) {
          if (Number.isFinite(parts[0])) sx = parts[0];
          if (Number.isFinite(parts[2])) sz = parts[2];
        }
      }
    }

    const innerR = baseR * Math.min(sx, sz);
    const R = Math.max(1.0, innerR - this.data.inset);

    const portals = this._portalAngles(center);

    const normDiff = (a, b) => {
      let d = a - b;
      while (d > 180) d -= 360;
      while (d < -180) d += 360;
      return d;
    };

    this.el.setAttribute('position', `${center.x.toFixed(6)} ${center.y.toFixed(6)} ${center.z.toFixed(6)}`);
    this.el.setAttribute('rotation', `0 0 0`);

    for (let i = 0; i < n; i++) {
      const ang = (i / n) * 360;
      let skip = false;
      for (const pa of portals) {
        if (Math.abs(normDiff(ang, pa)) < halfGap) { skip = true; break; }
      }

      const b = this._boxes[i];
      if (!b) continue;

      if (skip) {
        b.setAttribute('position', `9999 -9999 9999`);
        continue;
      }

      const rad = ang * Math.PI / 180;
      const x = Math.sin(rad) * R;
      const z = Math.cos(rad) * R;

      b.setAttribute('position', `${x.toFixed(6)} 0 ${z.toFixed(6)}`);
      b.setAttribute('rotation', `0 ${ang.toFixed(6)} 0`);

    const rig = document.getElementById('rig');
    const rw = rig && rig.components && rig.components['rig-walk'];
    if (rw && typeof rw._refreshColliders === 'function') rw._refreshColliders();
  }

AFRAME.registerComponent('mercury-ibl-silver', {

      c.width = w; c.height = h;

        const y = Math.random() * h;
        const hh = 1 + Math.random() * 6;
        g.fillRect(0, y, w, hh);

      vg.addColorStop(0, 'rgba(255,255,255,0.0)');
      vg.addColorStop(1, 'rgba(88,94,103,0.18)');

      g.fillRect(0, 0, w, h);

    // Faces: +X, -X, +Y, -Y, +Z, -Z
    // Darker silver base with a bright band for crisp specular highlights (no black).
    const side = [[0.0,'#707784'],[0.40,'#3c434d'],[0.50,'#ffffff'],[0.72,'#464e59'],[1.0,'#5f6773']];
    const px = makeFace(size, size, side);
    const nx = makeFace(size, size, side);
    const pz = makeFace(size, size, side);
    const nz = makeFace(size, size, side);

    const py = makeFace(size, size, [[0.0,'#fbfcfe'],[0.30,'#e1e6ee'],[0.58,'#b3bcc8'],[1.0,'#4a5360']]);
    const ny = makeFace(size, size, [[0.0,'#4a5360'],[0.55,'#2b333d'],[1.0,'#4a5360']]);

    const cubeTex = new THREE.CubeTexture([px, nx, py, ny, pz, nz]);
    cubeTex.needsUpdate = true;
    cubeTex.generateMipmaps = true;
    cubeTex.minFilter = THREE.LinearMipmapLinearFilter;
    cubeTex.magFilter = THREE.LinearFilter;


    // three r152+ uses colorSpace; older uses encoding
    if (cubeTex.colorSpace !== undefined && THREE.SRGBColorSpace) cubeTex.colorSpace = THREE.SRGBColorSpace;
    if (cubeTex.encoding !== undefined && THREE.sRGBEncoding) cubeTex.encoding = THREE.sRGBEncoding;

    cubeTex.mapping = THREE.CubeReflectionMapping;
    this._cubeTex = cubeTex;

    this.el.addEventListener('object3dset', this._applyNow);

    this._applyNow();

    const id = (this.el && this.el.id) ? this.el.id : '';

    if (id === 'mercury_surface') k = 1.00;
    else if (id === 'mercury_surface_fill') k = 0.82;
    else if (id === 'mercury_subsurface') k = 0.55;
    else if (id === 'mercury_liquid_volume') k = 0.48;
    else if (id === 'mercury_liquid_core') k = 0.42;
    else if (id === 'mercury_liquid_bottom') k = 0.40;

      const mat = obj.material;

/* ---- Mercury pool: port of index.html analytic ripple look (non-interactive, multi-emitter) ----
   - No ping-pong simulation, no render targets.
   - One ShaderMaterial on the pool plane; ripples are analytic wavefronts like index.html.

  schema: {
    radius: { type: 'number', default: 4.05 },       // disc radius in world units (visual mask is UV-based)

    // Empty points (w=0 => unused)
    for (let i = 0; i < this._POINTS; i++) {
      this._points[i*4 + 0] = 0.5;
      this._points[i*4 + 1] = 0.5;
      this._points[i*4 + 2] = -1e9;
      this._points[i*4 + 3] = 0.0;
    }

    const mkMaterial = () => {
      const THREE = window.THREE;
      const uniforms = {
        uRes:    { value: new THREE.Vector2(1, 1) },
        uTime:   { value: 0 },
        uPoints: { value: this._points } // flattened vec4 array (xyzt) for broad compatibility
      };

      const mat = new THREE.ShaderMaterial({
        uniforms,
        transparent: false,
        depthWrite: true,
        depthTest: true,
        side: THREE.DoubleSide,
        vertexShader: `
          varying vec2 vUv;
          void main(){
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec2 vUv;

          uniform vec2  uRes;
          uniform float uTime;
          uniform float uPoints[${96*4}];

          float hash21(vec2 p){
            p = fract(p*vec2(123.34, 345.45));
            p += dot(p, p+34.345);
            return fract(p.x*p.y);
          }

          vec4 getPoint(int i){
            int o = i*4;
            return vec4(uPoints[o+0], uPoints[o+1], uPoints[o+2], uPoints[o+3]);
          }

          float heightField(vec2 uv){
            float h = 0.0;

            // Outward-expanding ripples: identical model to index.html
            float k = 32.0;              // ring density
            float propagate = 0.065625;   // wavefront speed (4x slower)
            float spatialDecay = 0.36;   // how far ripples travel before dying
            float timeDecay = 0.95;      // how long each emission lasts
            float frontSoft = 0.014;     // softness of the leading edge

            for(int i=0;i<${96};i++){
              vec4 p = getPoint(i);
              float t0 = p.z;
              float st = p.w;
              float s  = abs(st);
              if(s <= 0.0) continue;

              float age = max(0.0, uTime - t0);

              vec2 d = uv - p.xy;
              // Aspect correction so rings stay circular on non-square viewports
              d.x *= uRes.x / uRes.y;
              float dist = length(d);

              float travel = age * propagate;

              // Gate: no wave ahead of the front
              float gate = smoothstep(0.0, frontSoft, travel - dist);

              // Oscillation follows the moving front
              float phase = (dist - travel) * k;

              // Damping: distance + time
              float env = exp(-dist/spatialDecay) * exp(-age/4.40);

              // Reduce hotspot at the emission point
              float core = 1.0 - exp(-pow(dist/0.010, 2.0));

              // Persistent wake (subtle, because this is autonomous)
              float wakeEnv = exp(-dist/0.110) * exp(-age/18.4);
              h += wakeEnv * core * s * 0.070;

              h += sin(phase) * env * gate * core * s * 0.45;
            }

            // Ambient slow swell (very subtle, keeps the surface alive)
            h += 0.006 * sin(uv.x*5.6 + uTime*0.045);

            // Edge damping so ripples feel bounded by the basin interior
            vec2 dd = uv - 0.5;
            float r = length(dd);
            float edgeFade = 1.0 - smoothstep(0.460, 0.495, r);
            h *= edgeFade;

            return h;
          }

          vec3 normalFromHeight(vec2 uv){
            // Finite differences; epsilon tied to pixel size
            vec2 px = 1.0 / uRes;
            float hC = heightField(uv);
            float hX = heightField(uv + vec2(px.x, 0.0));
            float hY = heightField(uv + vec2(0.0, px.y));

            float sx = (hX - hC) * 6.5;
            float sy = (hY - hC) * 6.5;

            return normalize(vec3(-sx, -sy, 1.0));
          }

          void main(){
            vec2 uv = vUv;

            // Disc mask (plane clipped to circle at uv center)
            vec2 dd = uv - 0.5;
            float r = length(dd);
            float disc = 1.0 - smoothstep(0.495, 0.505, r);
            if(disc <= 0.0) discard;

            // Base "black mercury" with a faint cool tint
            vec3 base = vec3(0.0065, 0.0072, 0.0086);

            // Vignette
            float vig = smoothstep(0.52, 0.18, r);
            base *= mix(0.90, 1.10, vig);

            vec3 n = normalFromHeight(uv);

            // Two studio lights (same idea as the webpage shader)
            vec3 l1 = normalize(vec3(-0.35, 0.25, 0.90));
            vec3 l2 = normalize(vec3( 0.25,-0.10, 0.95));
            vec3 v  = vec3(0.0, 0.0, 1.0);

            float ndl1 = max(dot(n, l1), 0.0);
            float ndl2 = max(dot(n, l2), 0.0);

            // Specular with Fresnel (slick)
            vec3 h1 = normalize(l1 + v);
            float spec1 = pow(max(dot(n, h1), 0.0), 92.0) * 1.10;

            vec3 h2 = normalize(l2 + v);
            float spec2 = pow(max(dot(n, h2), 0.0), 72.0) * 0.62;

            float fres = pow(1.0 - max(dot(n, v), 0.0), 2.6);

            // "Reflection" gradient (no env map, but feels reflective)
            float refl = smoothstep(-0.2, 0.9, n.y*0.6 + 0.35);
            vec3 reflection = vec3(0.040, 0.042, 0.045) + refl*vec3(0.070, 0.076, 0.084);

            vec3 col = base;
            col += reflection * (1.18 * fres);
            col += vec3(0.020, 0.021, 0.022) * (0.26*ndl1 + 0.14*ndl2);
            col += vec3(0.200, 0.206, 0.214) * (spec1 + spec2);

            // Tiny cinematic grain
            float g = hash21(uv * (uRes.xy * 0.9) + uTime*0.0375) - 0.5;
            col += g * 0.009;

            // Gentle filmic curve
            col = 1.0 - exp(-col * 1.28);
            col = clamp(col, 0.0, 1.0);

            gl_FragColor = vec4(col, 1.0);
          }
        `
      });

      // Preserve previous z-fight mitigation on the surface
      mat.polygonOffset = true;
      mat.polygonOffsetFactor = -2;
      mat.polygonOffsetUnits = -2;

      return mat;
    };

    const apply = () => {
      const mesh = el.getObject3D('mesh');
      if (!mesh) return false;
      if (!this._mat) this._mat = mkMaterial();
      mesh.material = this._mat;
      mesh.material.needsUpdate = true;
      // Avoid shadow-map artifacts / geometric bands on close camera
      mesh.castShadow = false;
      mesh.receiveShadow = false;
      mesh.traverse && mesh.traverse((o)=>{ if(o && o.isMesh){ o.castShadow=false; o.receiveShadow=false; } });
      return true;
    };

    if (!apply()) {
      el.addEventListener('object3dset', () => apply());
    }
  },

  tick: function (t, dt) {
    if (!this._mat) return;

    const time = ((t || 0) / 1000.0) * 0.5;
    this._mat.uniforms.uTime.value = time;

    const sceneEl = this.el.sceneEl;
    const renderer = sceneEl && sceneEl.renderer;
    if (renderer) {
      const size = new THREE.Vector2();
      if (renderer.getDrawingBufferSize) {
        renderer.getDrawingBufferSize(size);
      } else {
        renderer.getSize(size);
      }
      this._mat.uniforms.uRes.value.set(Math.max(1, size.x), Math.max(1, size.y));
    }

    // Spawn new ripple points over time, cycling through the buffer
    if (time >= this._nextSpawn) {
      const idx = Math.floor(time / this.data.spawnInterval) % this._POINTS;

      // Uniform random point inside a disc in UV space (keep away from rim)
      const a = this._rand() * 6.28318530718;
      const rr = Math.sqrt(this._rand()) * 0.48;
      const x = 0.5 + Math.cos(a) * rr;
      const y = 0.5 + Math.sin(a) * rr;

      const o = idx * 4;
      this._points[o + 0] = x;
      this._points[o + 1] = y;
      this._points[o + 2] = time;
      this._points[o + 3] = 1.0; // strength

      this._mat.uniforms.uPoints.value = this._points;
      this._nextSpawn = time + this.data.spawnInterval;
    }
  }
});

/**
 * Triplanar world-space projection for the *diffuse/basecolor map only* on MeshStandardMaterial.
 * This removes UV pole "convergence" artifacts on sphere/ellipsoid ceilings without touching
 * the rest of the PBR pipeline (normal/roughness/AO remain unchanged for stability).
 *
 * Usage:
 */
AFRAME.registerComponent('triplanar-diffuse', {
  schema: {
    // Repeats per meter in world space.
    scale: {type: 'number', default: 0.35},
    // Blend sharpness between projections (higher = crisper).
    sharpness: {type: 'number', default: 4.0}
  },

  init: function () {
    this._applied = false;
    this._inv = new THREE.Matrix4();
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    this.el.addEventListener('model-loaded', this._apply);
    setTimeout(this._apply, 0);
  },

  update: function () {
    this._applied = false;
    this._apply();
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._apply);
    this.el.removeEventListener('model-loaded', this._apply);
  },

  _apply: function () {
    if (this._applied) return;

    const root = this.el.getObject3D('mesh');
    if (!root) return;

    const scale = this.data.scale;
    const sharpness = this.data.sharpness;

    const patchOne = (mat) => {
      if (!mat || !mat.isMeshStandardMaterial) return;
      if (mat.userData && mat.userData._triDiffusePatched) return;

      mat.userData = mat.userData || {};
      mat.userData._triDiffusePatched = true;

      if (mat.map) {
        mat.map.wrapS = THREE.RepeatWrapping;
        mat.map.wrapT = THREE.RepeatWrapping;
        mat.map.needsUpdate = true;
      }

      const prevOnBeforeCompile = mat.onBeforeCompile;
      mat.onBeforeCompile = function (shader) {
        if (prevOnBeforeCompile) prevOnBeforeCompile(shader);

        shader.uniforms.triScale = { value: scale };
        shader.uniforms.triSharpness = { value: sharpness };

        // Vertex: add world position + world normal varyings.
        if (shader.vertexShader.indexOf('varying vec3 vTriWorldPos;') === -1) {
          shader.vertexShader = shader.vertexShader.replace(
            '#include <common>',
            '#include <common>\nvarying vec3 vTriWorldPos;\nvarying vec3 vTriWorldNormal;'
          );

          shader.vertexShader = shader.vertexShader.replace(
            '#include <begin_vertex>',
            '#include <begin_vertex>\nvec4 triWorldPos = modelMatrix * vec4( transformed, 1.0 );\nvTriWorldPos = triWorldPos.xyz;'
          );

          shader.vertexShader = shader.vertexShader.replace(
            '#include <beginnormal_vertex>',
            '#include <beginnormal_vertex>\nvTriWorldNormal = normalize( mat3( modelMatrix ) * objectNormal );'
          );
        }

        // Fragment: helpers + replace the map sampling line in <map_fragment>.
        if (shader.fragmentShader.indexOf('vec4 triSampleColor') === -1) {
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <common>',
            '#include <common>\n' +
            'varying vec3 vTriWorldPos;\n' +
            'varying vec3 vTriWorldNormal;\n' +
            'uniform float triScale;\n' +
            'uniform float triSharpness;\n' +
            'vec3 triWeights(vec3 n){\n' +
            '  vec3 an = abs(n);\n' +
            '  an = pow(an, vec3(triSharpness));\n' +
            '  return an / (an.x + an.y + an.z + 1e-5);\n' +
            '}\n' +
            'vec4 triSampleColor(sampler2D tex, vec3 p, vec3 n){\n' +
            '  vec3 w = triWeights(n);\n' +
            '  vec2 uvx = p.yz * triScale;\n' +
            '  vec2 uvy = p.zx * triScale;\n' +
            '  vec2 uvz = p.xy * triScale;\n' +
            '  return texture2D(tex, uvx) * w.x + texture2D(tex, uvy) * w.y + texture2D(tex, uvz) * w.z;\n' +
            '}\n'
          );

          // Replace the sampledDiffuseColor assignment (keeps the rest of the chunk intact).
          shader.fragmentShader = shader.fragmentShader.replace(
            /vec4\s+sampledDiffuseColor\s*=\s*texture2D\(\s*map\s*,\s*vUv\s*\)\s*;/,
            'vec4 sampledDiffuseColor = triSampleColor( map, vTriWorldPos, normalize(vTriWorldNormal) );'
          );
        }
      };

      mat.needsUpdate = true;
    };

    root.traverse((o) => {
      if (!o || !o.isMesh || !o.material) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(patchOne);
    });

    this._applied = true;
  }
});

AFRAME.registerComponent('cave-pit-cut', {
  schema: {
    center:   { type: 'vec3',   default: {x: 0, y: 0, z: 0} }, // world-space
    radius:   { type: 'number', default: 4.2 },               // meters

  },

    mesh.traverse((obj) => {

        const sh = m && m.userData && m.userData.__pitCutShader;

        sh.uniforms.uPitBottomY.value= this.data.bottomY;
      };
      if (Array.isArray(mat)) mat.forEach(applyUniforms);
      else applyUniforms(mat);
    });
  },

  _apply: function () {
    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;

    const patchMaterial = (mat) => {
      if (!mat || !mat.isMaterial) return;
      if (mat.userData && mat.userData.__pitCutPatched) return;
      mat.userData = mat.userData || {};
      mat.userData.__pitCutPatched = true;

      mat.onBeforeCompile = (shader) => {
        // Varying world position.
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vPitWorldPos;')
          .replace('#include <begin_vertex>',
                   '#include <begin_vertex>\nvec4 pitWorld = modelMatrix * vec4(transformed, 1.0);\nvPitWorldPos = pitWorld.xyz;');

        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>',
                   '#include <common>\nvarying vec3 vPitWorldPos;\nuniform vec3 uPitCenter;\nuniform float uPitRadius;\nuniform float uPitTopY;\nuniform float uPitBottomY;')
          .replace('#include <clipping_planes_fragment>',
                   '#include <clipping_planes_fragment>\nfloat pitD = distance(vPitWorldPos.xz, uPitCenter.xz);\nif (pitD < uPitRadius && vPitWorldPos.y < uPitTopY && vPitWorldPos.y > uPitBottomY) discard;');

        shader.uniforms.uPitCenter  = { value: new THREE.Vector3(this.data.center.x, this.data.center.y, this.data.center.z) };
        shader.uniforms.uPitRadius  = { value: this.data.radius };
        shader.uniforms.uPitTopY    = { value: this.data.topY };
        shader.uniforms.uPitBottomY = { value: this.data.bottomY };

        mat.userData.__pitCutShader = shader;
      };

      mat.needsUpdate = true;
    };

    mesh.traverse((obj) => {
      if (!obj.isMesh) return;
      const mat = obj.material;
      if (Array.isArray(mat)) mat.forEach(patchMaterial);
      else patchMaterial(mat);
    });

    this.update();
  }
});

// Subtle mercury-like surface motion: multiple shallow "whirl" dimples + gentle concentric ripples.
// Designed for a subdivided PLANE whose local +Z is "up" before rotation.
// Keep amp small (centimeters) for heavy surface tension feel.

// Subtle mercury-like surface motion: slow base waves + staggered "swallowing" vortices with rotational flow.
// Works on a subdivided DISC mesh (ring with very small inner radius). Local +Z is "up" before rotation.

/* --- helpers: math utils --- */
function smoothstep(edge0, edge1, x) {
  // Scale, bias and saturate x to 0..1 range
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  // Evaluate polynomial
  return t * t * (3 - 2 * t);
}

AFRAME.registerComponent('mercury-surface', {

    this._mesh = null;

    this._cells = [];

      const root = this.el.getObject3D('mesh');

      if (root.isMesh && root.geometry && root.geometry.attributes && root.geometry.attributes.position) {
        mesh = root;

        root.traverse((o) => {
          if (mesh) return;
          if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) mesh = o;
        });

      this._geom = mesh.geometry;

      const pos = this._geom.attributes.position;
      this._base = new Float32Array(pos.array);

      // Estimate disc radius from geometry.
      let rMax = 0;
      for (let i = 0; i < pos.count; i++) {
        const x = this._base[i*3+0];
        const y = this._base[i*3+1];
        const r = Math.sqrt(x*x + y*y);
        if (r > rMax) rMax = r;
      }
      if (rMax > 0.001) this._R = rMax;
      if (this.data.radius && this.data.radius > 0) this._R = this.data.radius;

  _rand01: function (i, a, b, seed) {
    const u = Math.sin((i + 1) * 12.9898 + seed * 78.233 + a * 3.1 + b * 7.7) * 43758.5453123;

  _spawnCell: function (nowS) {
