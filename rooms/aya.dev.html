// reflect-layer
// Assign an entity (and its meshes) to a Three.js render layer.
// - Default keeps layer 0 enabled (object remains visible to the main camera)
// - Set `exclusive: true` to make it ONLY visible on that layer
AFRAME.registerComponent('reflect-layer', {
  schema: {
    layer: { type: 'int', default: 1 },
    exclusive: { type: 'boolean', default: false }
  },

  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    this._apply();
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._apply);
  },

  _apply: function () {
    const root = this.el.getObject3D('mesh');
    if (!root) return;
    const layer = this.data.layer | 0;
    const exclusive = !!this.data.exclusive;
    root.traverse((o) => {
      if (!o.layers) return;
      if (exclusive) o.layers.set(layer);
      else o.layers.enable(layer);
    });
  }
});
AFRAME.registerComponent('planar-reflector', {
  schema: {
    resolution: {type: 'int', default: 1024},
    // If >= 0, render ONLY this layer into the reflection (big perf win).
    reflectLayer: {type: 'int', default: -1},
    color: {type: 'color', default: '#20242b'},
    opacity: {type: 'number', default: 0.34},
    clipBias: {type: 'number', default: 0.003},
    // Performance: cap reflection update rate. Default chosen to be visually indistinguishable.
    maxHz: {type: 'number', default: 30},
    // Always refresh if the camera moves a lot (prevents noticeable lag during quick turns).
    forcePosDelta: {type: 'number', default: 0.15},
    forceAngDelta: {type: 'number', default: 0.02},
    // Optional perf gating: skip reflection if the camera is far away.
    maxDistance: {type: 'number', default: 999},
    // Optional perf gating: clamp reflection camera far plane (culls distant draw in reflection).
    maxFar: {type: 'number', default: 120},
    // Optional perf gating: pause reflection when a UI overlay is visible.
    pauseWhenOverlay: {type: 'boolean', default: false},
    overlayId: {type: 'string', default: 'ayaFullscreenOverlay'},
    // Optional perf gating: pause reflection when a video overlay is visible on the pool.
    pauseWhenVideo: {type: 'boolean', default: false},
    videoEntityId: {type: 'string', default: 'aya_experience_video'}
  },

  init: function () {
    this._setupIfReady = this._setupIfReady.bind(this);
    this.el.addEventListener('object3dset', this._setupIfReady);

    // Optional perf gating (UI/video).
    this._overlayEl = null;
    this._videoEl = null;
    if (typeof document !== 'undefined') {
      this._overlayEl = document.getElementById(this.data.overlayId);
      this._videoEl = document.getElementById(this.data.videoEntityId);
    }

    this._setupIfReady();
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._setupIfReady);
    if (this.mesh) this.mesh.onBeforeRender = null;
    if (this.renderTarget) this.renderTarget.dispose();
  },

  update: function () {
    if (!this.material) return;
    this.material.uniforms.color.value.set(this.data.color);
    this.material.uniforms.opacity.value = this.data.opacity;
  },

  _setupIfReady: function () {
    const sceneEl = this.el.sceneEl;
    if (!sceneEl || !sceneEl.renderer) return;

    const meshRoot = this.el.getObject3D('mesh');
    if (!meshRoot || this.mesh) return; // already set up

    const THREE = AFRAME.THREE;
    this.mesh = meshRoot;

    // Render target.
    const rt = new THREE.WebGLRenderTarget(this.data.resolution, this.data.resolution, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      depthBuffer: false,
      stencilBuffer: false
    });
    rt.texture.generateMipmaps = false;
    this.renderTarget = rt;

    // Shader (projected reflection).
    const uniforms = {
      color: { value: new THREE.Color(this.data.color) },
      tDiffuse: { value: rt.texture },
      textureMatrix: { value: new THREE.Matrix4() },
      opacity: { value: this.data.opacity }
    };

    const material = new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: `
        precision highp float;
        uniform mat4 textureMatrix;
        varying vec4 vUv;
        void main() {
          vUv = textureMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        uniform vec3 color;
        uniform sampler2D tDiffuse;
        uniform float opacity;
        varying vec4 vUv;
        void main() {
          vec2 uv = vUv.xy / max(vUv.w, 0.0001);
          vec4 base = texture2D(tDiffuse, uv);
          vec3 outc = mix(color, base.rgb, 0.92);
          gl_FragColor = vec4(outc, opacity);
        }
      `,
      transparent: true,
      depthWrite: false,
      depthTest: true
    });

    this.material = material;

    // Apply material to all meshes under this entity.
    this.mesh.traverse((o) => { if (o.isMesh) o.material = material; });

    // Working vars.
    this.virtualCamera = new THREE.PerspectiveCamera();
    this.reflectorPlane = new THREE.Plane();
    this.normal = new THREE.Vector3();
    this.reflectorWorldPosition = new THREE.Vector3();
    this.cameraWorldPosition = new THREE.Vector3();
    this.rotationMatrix = new THREE.Matrix4();
    this.lookAtPosition = new THREE.Vector3(0, 0, -1);
    this.clipPlane = new THREE.Vector4();
    this.q = new THREE.Vector4();
    this.textureMatrix = uniforms.textureMatrix.value;

    // Perf throttling state (reflection is expensive: a full extra scene render).
    this._lastReflAt = 0;
    this._hasLastCam = false;
    this._lastCamPos = new THREE.Vector3();
    this._lastCamQuat = new THREE.Quaternion();
    this._tmpCamQuat = new THREE.Quaternion();

    // Avoid per-frame allocations (reduces GC stutter).
    this._viewVec = new THREE.Vector3();
    this._lookAtWorld = new THREE.Vector3();
    this._targetVec = new THREE.Vector3();

    // Hook.
    this.mesh.onBeforeRender = (renderer, scene, camera) => {
      if (!camera || !camera.isCamera) return;

      // World positions.
      this.reflectorWorldPosition.setFromMatrixPosition(this.mesh.matrixWorld);
      this.cameraWorldPosition.setFromMatrixPosition(camera.matrixWorld);

      // Reflector normal (assumes plane geometry; +Z is plane normal in local space).
      this.rotationMatrix.extractRotation(this.mesh.matrixWorld);
      this.normal.set(0, 0, 1).applyMatrix4(this.rotationMatrix);

      // Only render when reflector faces camera.
      const view = this._viewVec;
      view.copy(this.reflectorWorldPosition).sub(this.cameraWorldPosition);

      // Optional perf gating: skip updates when the reflector is far from the camera.
      if (this.data.maxDistance > 0) {
        const md = this.data.maxDistance;
        if (view.lengthSq() > (md * md)) return;
      }

      // Optional perf gating: if overlays are visible, reflection isn't seen anyway.
      if (this.data.pauseWhenOverlay && this._overlayEl && this._overlayEl.classList && this._overlayEl.classList.contains('visible')) return;
      if (this.data.pauseWhenVideo && this._videoEl) {
        const vv = this._videoEl.getAttribute && this._videoEl.getAttribute('visible');
        if (vv === true || vv === 'true') return;
      }

      // Only render when reflector faces camera.
      if (view.dot(this.normal) > 0) return;

      // Throttle reflection updates (major perf win) while keeping the same look.
      // We still refresh immediately on large camera moves to avoid visible lag.
      const now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      const minDt = (this.data.maxHz > 0) ? (1000 / this.data.maxHz) : 0;
      camera.getWorldQuaternion(this._tmpCamQuat);

      if (this._hasLastCam && minDt > 0) {
        const dt = now - this._lastReflAt;
        const posD = this.cameraWorldPosition.distanceTo(this._lastCamPos);
        const angD = 1.0 - Math.abs(this._tmpCamQuat.dot(this._lastCamQuat));
        const force = (posD >= this.data.forcePosDelta) || (angD >= this.data.forceAngDelta);
        if (!force && dt < minDt) return;
      }

      // Virtual camera: reflected position.
      view.reflect(this.normal).negate();
      view.add(this.reflectorWorldPosition);
      this.virtualCamera.position.copy(view);

      // Virtual camera orientation (mirror of the real camera).
      this.rotationMatrix.extractRotation(camera.matrixWorld);

      const lookAtPosition = this._lookAtWorld;
      lookAtPosition.copy(this.lookAtPosition).applyMatrix4(this.rotationMatrix).add(this.cameraWorldPosition);
      const target = this._targetVec;
      target.copy(this.reflectorWorldPosition).sub(lookAtPosition);
      target.reflect(this.normal).negate();
      target.add(this.reflectorWorldPosition);

      this.virtualCamera.up.set(0, 1, 0).applyMatrix4(this.rotationMatrix);
      this.virtualCamera.up.reflect(this.normal);

      this.virtualCamera.lookAt(target);

      this.virtualCamera.near = camera.near;
      this.virtualCamera.far = Math.min(camera.far, (this.data.maxFar || camera.far));
      this.virtualCamera.aspect = camera.aspect;
      this.virtualCamera.projectionMatrix.copy(camera.projectionMatrix);
      this.virtualCamera.updateMatrixWorld();
      this.virtualCamera.matrixWorldInverse.copy(this.virtualCamera.matrixWorld).invert();

      // Texture matrix.
      this.textureMatrix.set(
        0.5, 0.0, 0.0, 0.5,
        0.0, 0.5, 0.0, 0.5,
        0.0, 0.0, 0.5, 0.5,
        0.0, 0.0, 0.0, 1.0
      );
      this.textureMatrix.multiply(this.virtualCamera.projectionMatrix);
      this.textureMatrix.multiply(this.virtualCamera.matrixWorldInverse);
      this.textureMatrix.multiply(this.mesh.matrixWorld);

      // Oblique clip plane (prevents artifacts).
      this.reflectorPlane.setFromNormalAndCoplanarPoint(this.normal, this.reflectorWorldPosition);
      this.reflectorPlane.applyMatrix4(this.virtualCamera.matrixWorldInverse);

      this.clipPlane.set(this.reflectorPlane.normal.x, this.reflectorPlane.normal.y, this.reflectorPlane.normal.z, this.reflectorPlane.constant);

      const projectionMatrix = this.virtualCamera.projectionMatrix;
      this.q.x = (Math.sign(this.clipPlane.x) + projectionMatrix.elements[8]) / projectionMatrix.elements[0];
      this.q.y = (Math.sign(this.clipPlane.y) + projectionMatrix.elements[9]) / projectionMatrix.elements[5];
      this.q.z = -1.0;
      this.q.w = (1.0 + projectionMatrix.elements[10]) / projectionMatrix.elements[14];

      // Calculate scaled plane vector.
      const c = this.clipPlane.multiplyScalar(2.0 / this.clipPlane.dot(this.q));
      projectionMatrix.elements[2]  = c.x;
      projectionMatrix.elements[6]  = c.y;
      projectionMatrix.elements[10] = c.z + 1.0 - this.data.clipBias;
      projectionMatrix.elements[14] = c.w;

      // Render.
      const currentRT = renderer.getRenderTarget();
      const currentXr = renderer.xr.enabled;
      const currentShadow = renderer.shadowMap.enabled;

      renderer.xr.enabled = false;
      renderer.shadowMap.enabled = false;

      // Layer selection: optionally render only a curated layer into the reflection.
      if (this.data.reflectLayer >= 0) {
        this.virtualCamera.layers.set(this.data.reflectLayer);
      } else {
        // Match the main camera layers by default.
        this.virtualCamera.layers.mask = camera.layers.mask;
      }

      this.mesh.visible = false;
      renderer.setRenderTarget(this.renderTarget);
      renderer.clear();
      renderer.render(scene, this.virtualCamera);
      this.mesh.visible = true;

      renderer.setRenderTarget(currentRT);
      renderer.xr.enabled = currentXr;
      renderer.shadowMap.enabled = currentShadow;

      // Update throttle state after a successful render.
      this._lastReflAt = now;
      this._lastCamPos.copy(this.cameraWorldPosition);
      this._lastCamQuat.copy(this._tmpCamQuat);
      this._hasLastCam = true;
    };
  }
});


/* -------------------------------------------------------------------------
   equator-gap-clip
   - Cuts an equatorial "band" out of a sphere *in the shader*.
   - This keeps the sphere as a single stable silhouette while still revealing
     the core through a clean gap (no two-mesh parallax / convergence artifacts).
   - Works with MeshStandardMaterial (keeps PBR maps).
--------------------------------------------------------------------------- */

/* -------------------------------------------------------------------------
   sin-bob + spin
   - Replaces A-Frame animation looping on transforms to avoid wrap/jump snaps.
   - Keeps motion perfectly continuous (no reset at loop boundaries).
--------------------------------------------------------------------------- */
AFRAME.registerComponent('sin-bob', {
  schema: {
    baseY: {type: 'number', default: 0},
    amp:   {type: 'number', default: 0.12},
    speed: {type: 'number', default: 0.10} // cycles per second
  },
  init: function () {
    this._p = this.el.object3D.position;
    // If baseY not provided, capture current Y.
    if (this.data.baseY === 0 && this._p) this.data.baseY = this._p.y;
  },
  tick: function (time) {
    if (!this._p) return;
    const t = (time || 0) / 1000;
    this._p.y = this.data.baseY + this.data.amp * Math.sin(t * this.data.speed * Math.PI * 2);
  }
});

AFRAME.registerComponent('spin', {
  schema: {
    // degrees per second
    speed: {type: 'number', default: 12},
    axis:  {type: 'string', default: 'y'}
  },
  init: function () {
    this._r = this.el.object3D.rotation;
  },

  _buildRaycastTargets: function () {
    const root = this.el.sceneEl && this.el.sceneEl.object3D;
    if (!root) return [];
    const selfRoot = this.el.object3D;
    const impactsRoot = this._impactRoot;
    const meshes = [];
    root.traverse(function (o) {
      if (!o.isMesh) return;
      // Exclude the perforated sphere + beams (everything under this component's entity)
      if (selfRoot && selfRoot.children && selfRoot.children.length) {
        let p = o;
        while (p) { if (p === selfRoot) return; p = p.parent; }
      }
      // Exclude impact planes themselves
      if (impactsRoot) {
        let p = o;
        while (p) { if (p === impactsRoot) return; p = p.parent; }
      }
      // Exclude explicitly invisible meshes
      if (o.visible === false) return;
      // Must be raycastable (three's default raycast)
      meshes.push(o);
    });
    return meshes;
  },

  _updateImpacts: function () {
    if (!this.data.impactDots) return;
    if (!this._impactRoot || !this._raycaster) return;

    // Lazy build target list (and refresh occasionally if needed)
    if (!this._raycastMeshes || this._raycastMeshes.length === 0) {
      this._raycastMeshes = this._buildRaycastTargets();
    }

    const originW = this._tmpImpactOrigin || (this._tmpImpactOrigin = new THREE.Vector3());
    const dirW    = this._tmpImpactDir    || (this._tmpImpactDir    = new THREE.Vector3());
    const upY     = this._tmpImpactUp     || (this._tmpImpactUp     = new THREE.Vector3(0,1,0));
    const zAxis   = this._tmpImpactZ      || (this._tmpImpactZ      = new THREE.Vector3(0,0,1));
    const q       = this._tmpImpactQ      || (this._tmpImpactQ      = new THREE.Quaternion());
    const qBeam   = this._tmpImpactQB     || (this._tmpImpactQB     = new THREE.Quaternion());
    const normalW = this._tmpImpactN      || (this._tmpImpactN      = new THREE.Vector3());

    const maxD = this.data.impactReach || this.data.lightReach || 60;

    for (let i = 0; i < this._beams.length; i++) {
      const b = this._beams[i];
      const impact = b.impact;
      if (!impact) continue;

      // If this beam is essentially off, hide its impact.
      const w = b._lastW || 0.0;
      if (w <= 0.0) { impact.visible = false; continue; }

      // Beam origin at the hole position (world), pushed slightly outward to avoid self-intersection.
      originW.copy(b.holePos);
      this.el.object3D.localToWorld(originW);

      b.obj.getWorldQuaternion(qBeam);
      dirW.set(0, 1, 0).applyQuaternion(qBeam).normalize();

      originW.addScaledVector(dirW, 0.06);

      this._raycaster.set(originW, dirW);
      this._raycaster.far = maxD;

      const hits = this._raycaster.intersectObjects(this._raycastMeshes, true);
      if (!hits || hits.length === 0) { impact.visible = false; continue; }

      const hit = hits[0];
      if (!hit.point || !hit.face) { impact.visible = false; continue; }

      // Position slightly above the surface along normal.
      normalW.copy(hit.face.normal);
      if (hit.object && hit.object.matrixWorld) {
        normalW.transformDirection(hit.object.matrixWorld).normalize();
      } else {
        normalW.normalize();
      }

      impact.position.copy(hit.point).addScaledVector(normalW, 0.015);

      // Orient plane so its normal matches the surface normal.
      q.setFromUnitVectors(zAxis, normalW);
      impact.quaternion.copy(q);

      // Size & opacity
      const d = hit.distance;
      const size = this.data.impactSize * (0.65 + 0.75 * w) * (0.90 + 0.10 * Math.max(0, (maxD - d) / maxD));
      impact.scale.set(size, size, 1);

      // Material per impact is cloned, so we can set per-beam opacity.
      const mat = impact.material;
      const op = this.data.impactOpacity * (0.55 + 0.65 * w);
      mat.opacity = Math.min(1.0, op);

      impact.visible = true;
    }
  },

  tick: function (time, timeDelta) {
    if (this.data.impactDots && time >= (this._nextImpactAt || 0)) { this._nextImpactAt = time + this.data.impactEveryMs; this._updateImpacts(); }
    if (!this._r) return;
    const dt = (timeDelta || 0) / 1000;
    const w = THREE.MathUtils.degToRad(this.data.speed);
    const d = w * dt;
    if (this.data.axis === 'x') this._r.x += d;
    else if (this.data.axis === 'z') this._r.z += d;
    else this._r.y += d;
  }
});

/* -------------------------------------------------------------------------
   perforated-sphere-light
   - Full sphere with tiny perforations + thin, soft beams driven by an inner core.
   - Holes are an alphaMap (white = opaque shell, black = hole).
   - Beams are additive, fog-aware, no hard solids.
--------------------------------------------------------------------------- */

// ===== Subtle dust particles (catching beams) =====
AFRAME.registerComponent('beam-dust', {
  schema: {
    center:  {type: 'vec3', default: {x:0, y:2.6, z:38.7}},
    radius:  {type: 'number', default: 26},
    height:  {type: 'number', default: 14},
    count:   {type: 'int', default: 900},
    size:    {type: 'number', default: 0.045},
    opacity: {type: 'number', default: 0.08},
    drift:   {type: 'number', default: 0.055},
    twinkle: {type: 'number', default: 0.35}
  },
  init: function () {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(32,32,0, 32,32,32);
    g.addColorStop(0.0, 'rgba(255,255,255,1.0)');
    g.addColorStop(0.35,'rgba(255,255,255,0.55)');
    g.addColorStop(1.0, 'rgba(0,0,0,0.0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,64,64);
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;

    const geo = new THREE.BufferGeometry();
    const n = this.data.count;
    const pos = new Float32Array(n * 3);
    const vel = new Float32Array(n * 3);
    const rnd = (a,b)=>a+(b-a)*Math.random();

    for (let i=0;i<n;i++){
      const r = this.data.radius * Math.sqrt(Math.random());
      const a = Math.random() * Math.PI * 2;
      const y = rnd(-this.data.height*0.5, this.data.height*0.5);
      pos[i*3+0] = this.data.center.x + r*Math.cos(a);
      pos[i*3+1] = this.data.center.y + y;
      pos[i*3+2] = this.data.center.z + r*Math.sin(a);

      vel[i*3+0] = rnd(-1,1);
      vel[i*3+1] = rnd(-0.6,0.6);
      vel[i*3+2] = rnd(-1,1);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('velocity', new THREE.BufferAttribute(vel, 3));

    const mat = new THREE.PointsMaterial({
      map: tex,
      transparent: true,
      opacity: this.data.opacity,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      size: this.data.size,
      sizeAttenuation: true,
      color: 0xffffff
    });

    this._points = new THREE.Points(geo, mat);
    this._points.frustumCulled = false;
    this.el.setObject3D('beamDust', this._points);
    this._t = 0;
  },
  tick: function (time, dt) {
    if (!this._points) return;
    // Throttle particle simulation to reduce CPU spikes (still renders every frame).
    if (!this._accumMs) this._accumMs = 0;
    this._accumMs += (dt || 16);
    if (this._accumMs < 33) return; // ~30Hz
    dt = this._accumMs;
    this._accumMs = 0;

    const geo = this._points.geometry;
    const pos = geo.attributes.position.array;
    const vel = geo.attributes.velocity.array;
    const n = this.data.count;
    const d = (dt || 16) / 1000;
    const drift = this.data.drift;
    this._t += d;

    const cx = this.data.center.x, cy = this.data.center.y, cz = this.data.center.z;
    const R = this.data.radius, H = this.data.height*0.5;

    for (let i=0;i<n;i++){
      const ix = i*3;
      pos[ix+0] += vel[ix+0]*d*drift;
      pos[ix+1] += vel[ix+1]*d*drift*0.6;
      pos[ix+2] += vel[ix+2]*d*drift;

      // Gentle curl / twinkle drift
      pos[ix+0] += Math.sin(this._t*0.7 + i*0.013) * d * drift * 0.15;
      pos[ix+2] += Math.cos(this._t*0.6 + i*0.011) * d * drift * 0.15;

      // Wrap inside a cylinder volume
      const dx = pos[ix+0]-cx;
      const dz = pos[ix+2]-cz;
      const rr = dx*dx + dz*dz;
      if (rr > R*R){
        const a = Math.random()*Math.PI*2;
        const r = R*Math.sqrt(Math.random());
        pos[ix+0] = cx + r*Math.cos(a);
        pos[ix+2] = cz + r*Math.sin(a);
      }
      if (pos[ix+1] > cy + H) pos[ix+1] = cy - H;
      if (pos[ix+1] < cy - H) pos[ix+1] = cy + H;
    }
    geo.attributes.position.needsUpdate = true;

    // Subtle global twinkle (very low amplitude)
    const tw = 0.75 + 0.25*Math.sin(this._t*0.9);
    this._points.material.opacity = this.data.opacity * (1.0 - this.data.twinkle + this.data.twinkle * tw);
  },
  remove: function () {
    this.el.removeObject3D('beamDust');
  }
});


AFRAME.registerComponent('perforated-sphere-light', {
  schema: {
    radius:      {type: 'number', default: 1.5},
    holes:       {type: 'int',    default: 180},
    holeSize:    {type: 'number', default: 0.010}, // UV fraction (~0.01 = tiny)
    // Hole rendering mode:
    // - 'cutout': real holes via alphaTest (can shimmer at distance)
    // - 'blend' : soft transparency via alphaMap (stable, but not a hard cut)
    // - 'none'  : no actual cutouts (prevents '+' artifacts completely)
    holeMode:    {type: 'string', default: 'none'},
    beamMin:     {type: 'number', default: 3.0},
    beamMax:     {type: 'number', default: 14.0},
    beamRadius:  {type: 'number', default: 0.012},
    baseOpacity: {type: 'number', default: 0.16},
    blue:        {type: 'color',  default: '#7cc9ff'},
    white:       {type: 'color',  default: '#ffffff'},
    flicker:     {type: 'number', default: 1.2},
    wobble:      {type: 'number', default: 0.020},

    // Cinematic controls
    innerFrac:   {type: 'number', default: 0.40}, // portion of radius used as “internal spill” length
    spillBoost:  {type: 'number', default: 1.35}, // inner beam opacity multiplier
    glowBoost:   {type: 'number', default: 1.15}, // hole-glow / core-glow multiplier
    lightCount:  {type: 'int',    default: 10},   // max spotlights
    lightAngle:  {type: 'number', default: 0.12}, // radians (small to avoid giant wall blobs)
    lightReach:  {type: 'number', default: 62}    ,
    impactReach: {type: 'number', default: 62},

    // Impact dots (a soft projected hotspot where beams hit geometry)
    impactDots: {type: 'boolean', default: true},
    impactSize: {type: 'number',  default: 0.65},
    impactOpacity: {type: 'number', default: 0.28},
    impactEveryMs: {type: 'number', default: 90},
    // Performance gating: disable expensive updates when player is far.
    maxActiveDistance: {type: 'number', default: 22},
    // Throttle per-beam updates (billboarding, flicker) to reduce CPU work.
    updateEveryMs: {type: 'number', default: 50},
// distance
  },

  init: function () {
    this._up = new THREE.Vector3(0, 1, 0);
    this._dirs = [];
    this._beams = [];

    // Build a soft radial texture for impact dots.
    (function buildImpactTexture(self){
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(128,128,0, 128,128,128);
      g.addColorStop(0.0, 'rgba(255,255,255,1.0)');
      g.addColorStop(0.18,'rgba(255,255,255,0.65)');
      g.addColorStop(0.45,'rgba(140,200,255,0.22)');
      g.addColorStop(1.0, 'rgba(0,0,0,0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,256,256);
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      self._impactTex = tex;
      self._impactMat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        depthWrite: false,
        depthTest: true,
        blending: THREE.AdditiveBlending
      });
      self._impactGeo = new THREE.PlaneGeometry(1,1,1,1);
      // Root that holds all impact planes (world space).
      self._impactRoot = new THREE.Group();
      self._impactRoot.renderOrder = 999;
      if (self.el.sceneEl && self.el.sceneEl.object3D) self.el.sceneEl.object3D.add(self._impactRoot);
    })(this);

    this._spots = [];
    this._group = new THREE.Group();
    this.el.object3D.add(this._group);

    this._cBlue  = new THREE.Color(this.data.blue);
    this._cWhite = new THREE.Color(this.data.white);

    this._shellEl = this.el.querySelector('#sphere_shell');
    this._coreLightEl = this.el.querySelector('#sphere_core_light');
    this._coreFlameEl = this.el.querySelector('#sphere_core_flame');

    // Raycaster used to cap beam lengths against the room geometry (so beams reach the walls).
    this._lenRay = new THREE.Raycaster();
    this._lenTargets = null;
    this._capsDone = false;

    // Textures
    this._beamTex = this._makeBeamTexture();
    this._exitTex = this._makeExitTexture();
    this._ringTex = this._makeRingTexture();
    this._spotCookie = this._makeSpotCookie();

    // Add a faint additive “core haze” so the beams feel like spills from a flame.
    const glowGeo = new THREE.SphereGeometry(this.data.radius * 0.56, 32, 20);
    this._coreGlowMat = new THREE.MeshBasicMaterial({
      color: this._cWhite.clone(),
      transparent: true,
      opacity: 0.18,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      side: THREE.DoubleSide
    });
    this._coreGlow = new THREE.Mesh(glowGeo, this._coreGlowMat);
    this._coreGlow.renderOrder = 25;
    this._group.add(this._coreGlow);

    const tryBuild = () => {
      if (this._built) return;
      if (!this._shellEl) return;

      const obj = this._shellEl.getObject3D('mesh');
      if (!obj) return;

      this._built = true;
      this._shellObj = obj;

      this._buildDirs();
      this._applyPerforationTextures(obj);
      this._buildBeams();
      this._buildSpots();

      // Compute per-beam room-capped lengths once the scene has meshes (delayed a tick).
      setTimeout(() => { this._computeBeamCaps && this._computeBeamCaps(); }, 0);
    };

    if (this._shellEl) {
      this._shellEl.addEventListener('object3dset', tryBuild);
      setTimeout(tryBuild, 0);
    }
  },

  remove: function () {
    if (this._group && this._group.parent) this._group.parent.remove(this._group);
    this._beams.length = 0;
    this._spots.length = 0;
  },

  _buildDirs: function () {
    const n = Math.max(12, this.data.holes | 0);
    const inc = Math.PI * (3 - Math.sqrt(5));
    const off = 2 / n;

    this._dirs.length = 0;
    for (let i = 0; i < n; i++) {
      const y = i * off - 1 + (off / 2);
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const phi = i * inc;
      const x = Math.cos(phi) * r;
      const z = Math.sin(phi) * r;
      this._dirs.push(new THREE.Vector3(x, y, z).normalize());
    }
  },

  _makeBeamTexture: function () {
    const W = 64, H = 512;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');

    const img = g.createImageData(W, H);
    const cx = (W - 1) / 2;
    const sigma = W * 0.26;

    for (let y = 0; y < H; y++) {
      const t = y / (H - 1);
      const hot = Math.exp(-t * 10.0); // strong near-emitter haze
      // Soft near-emitter lift (avoid crisp "+" when the crossed beam cards are edge-on)
      const startCap = Math.exp(-Math.pow(t / 0.030, 2.0));
      const lenFade = (0.08 * Math.pow(1 - t, 7.0) + 0.92 * hot) * (0.40 + 0.60 * startCap);
      // (No hard step at the hole — prevents tiny bright throats from popping without a readable shaft)

      for (let x = 0; x < W; x++) {
        const dx = x - cx;
        const radial = Math.exp(-(dx * dx) / (2 * sigma * sigma));
        const a = Math.min(1, radial * lenFade);
        const idx = (y * W + x) * 4;
        img.data[idx + 0] = 255;
        img.data[idx + 1] = 255;
        img.data[idx + 2] = 255;
        img.data[idx + 3] = Math.floor(255 * a);
      }
    }
    g.putImageData(img, 0, 0);

    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    // IMPORTANT: Canvas textures are uploaded with flipY=true by default in three.js,
    // which inverts our along-beam gradient (making the end look hotter than the hole).
    // For beams we want V=0 at the emitter (hole) to match canvas Y=0.
    tex.flipY = false;
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.anisotropy = 4;
    return tex;
  },

  _makeExitTexture: function () {
    const S = 128;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');

    g.clearRect(0, 0, S, S);
    const grd = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    grd.addColorStop(0.00, 'rgba(255,255,255,1.0)');
    grd.addColorStop(0.20, 'rgba(210,240,255,0.55)');
    grd.addColorStop(0.55, 'rgba(110,200,255,0.16)');
    grd.addColorStop(1.00, 'rgba(0,0,0,0.0)');
    g.fillStyle = grd;
    g.beginPath();
    g.arc(S/2, S/2, S/2, 0, Math.PI * 2);
    g.fill();

    const tex = new THREE.CanvasTexture(c);
    // Disable mipmaps: tiny additive sprites can shimmer/pixel-pop (often reading as a '+') when minified.
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  },


  _makeRingTexture: function () {
    // A hollow ring (annulus) so the "hole rim" glow is always tied to a beam (no texture-only dots).
    const S = 128;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');

    g.clearRect(0, 0, S, S);

    const cx = S / 2, cy = S / 2;
    const rOuter = S * 0.48;
    const rInner = S * 0.22;

    const grd = g.createRadialGradient(cx, cy, rInner * 0.55, cx, cy, rOuter);
    grd.addColorStop(0.00, 'rgba(0,0,0,0.0)');
    grd.addColorStop((rInner / rOuter) * 0.92, 'rgba(0,0,0,0.0)');
    grd.addColorStop((rInner / rOuter) * 1.02, 'rgba(255,255,255,0.95)');
    grd.addColorStop(0.52, 'rgba(210,240,255,0.55)');
    grd.addColorStop(0.78, 'rgba(110,200,255,0.14)');
    grd.addColorStop(1.00, 'rgba(0,0,0,0.0)');

    g.fillStyle = grd;
    g.beginPath();
    g.arc(cx, cy, rOuter, 0, Math.PI * 2);
    g.fill();

    // Punch the center to keep it reading as a perforation, not a blob.
    g.globalCompositeOperation = 'destination-out';
    g.beginPath();
    g.arc(cx, cy, rInner, 0, Math.PI * 2);
    g.fill();
    g.globalCompositeOperation = 'source-over';

    const tex = new THREE.CanvasTexture(c);
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  },


  _makeSpotCookie: function () {
    // Speckled cookie so wall/floor hits read like a tiny, scattered night-sky pattern (not big blobs).
    // Kept small + mipmap-free to avoid shimmering/popping.
    const S = 256;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');

    const cx = S / 2, cy = S / 2;

    // Base: black.
    g.fillStyle = 'rgba(0,0,0,1)';
    g.fillRect(0, 0, S, S);

    // Dot field (biased toward center).
    const dotCount = 160;
    for (let i = 0; i < dotCount; i++) {
      const a = Math.random() * Math.PI * 2;
      const rr = Math.pow(Math.random(), 1.65) * (S * 0.48);
      const x = cx + Math.cos(a) * rr;
      const y = cy + Math.sin(a) * rr;
      const r = 0.55 + Math.random() * 1.75; // px
      const op = 0.25 + Math.random() * 0.75;
      g.fillStyle = `rgba(255,255,255,${op.toFixed(3)})`;
      g.beginPath();
      g.arc(x, y, r, 0, Math.PI * 2);
      g.fill();
    }

    // A handful of slightly larger "hero" specks.
    const heroCount = 18;
    for (let i = 0; i < heroCount; i++) {
      const a = Math.random() * Math.PI * 2;
      const rr = Math.pow(Math.random(), 1.35) * (S * 0.38);
      const x = cx + Math.cos(a) * rr;
      const y = cy + Math.sin(a) * rr;
      const r = 2.2 + Math.random() * 3.2;
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      grd.addColorStop(0.0, 'rgba(255,255,255,0.95)');
      grd.addColorStop(0.35,'rgba(255,255,255,0.55)');
      grd.addColorStop(1.0, 'rgba(0,0,0,0.0)');
      g.fillStyle = grd;
      g.beginPath();
      g.arc(x, y, r, 0, Math.PI * 2);
      g.fill();
    }

    // Soft circular mask so the projection stays contained.
    g.globalCompositeOperation = 'destination-in';
    const mask = g.createRadialGradient(cx, cy, S * 0.05, cx, cy, S * 0.50);
    mask.addColorStop(0.00, 'rgba(255,255,255,1.0)');
    mask.addColorStop(0.78, 'rgba(255,255,255,1.0)');
    mask.addColorStop(1.00, 'rgba(255,255,255,0.0)');
    g.fillStyle = mask;
    g.fillRect(0, 0, S, S);
    g.globalCompositeOperation = 'source-over';

    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.anisotropy = 2;
    return tex;
  },
  _applyPerforationTextures: function (rootObj) {
  const W = 1024, H = 512;
  const cA = document.createElement('canvas');
  cA.width = W; cA.height = H;
  const gA = cA.getContext('2d');

  // Alpha: opaque shell.
  gA.fillStyle = '#ffffff';
  gA.fillRect(0, 0, W, H);

  // Hole radius in pixels (kept stable so every hole is truly "open").
  const holePx = Math.max(1.2, this.data.holeSize * H * 1.9);

  const drawAt = (x, y) => {
    gA.fillStyle = '#000000';
    gA.beginPath();
    gA.arc(x, y, holePx, 0, Math.PI * 2);
    gA.fill();
  };

  // Punch holes ONLY where we spawn beams (1:1 correlation, no glow texture artifacts).
  for (let i = 0; i < this._dirs.length; i++) {
    const d = this._dirs[i];
    const u = 0.5 + Math.atan2(d.z, d.x) / (2 * Math.PI);
    const v = 0.5 - Math.asin(d.y) / Math.PI;
    const x = Math.floor(u * W);
    const y = Math.floor(v * H);

    drawAt(x, y);

    // Seam wrap (avoid clipped hole near U=0/1)
    if (x < holePx) drawAt(x + W, y);
    if (x > W - holePx) drawAt(x - W, y);
  }

  const alphaTex = new THREE.CanvasTexture(cA);
  alphaTex.wrapS = THREE.RepeatWrapping;
  alphaTex.wrapT = THREE.ClampToEdgeWrapping;
  alphaTex.generateMipmaps = false;
  alphaTex.minFilter = THREE.NearestFilter;
  alphaTex.magFilter = THREE.NearestFilter;
  alphaTex.anisotropy = 2;

  this._shellMats = [];

  rootObj.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = false;
    o.receiveShadow = false;

    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach((m) => {
      if (!m) return;

      const hm = this.data.holeMode;
      if (hm === 'cutout') {
        m.transparent = false;
        m.alphaMap = alphaTex;
        m.alphaTest = 0.62;
        m.alphaToCoverage = false;
      } else if (hm === 'blend') {
        m.transparent = true;
        m.alphaMap = alphaTex;
        m.alphaTest = 0.0;
        m.alphaToCoverage = true;
        m.depthWrite = true;
      } else {
        m.transparent = false;
        m.alphaMap = null;
        m.alphaTest = 0.0;
        m.alphaToCoverage = false;
      }
      m.side = THREE.FrontSide;

      // Remove emissive-map glow entirely; rim glow is now per-beam sprites so we never have "dots without beams".
      if (m.isMeshStandardMaterial) {
        m.emissiveMap = null;
        m.emissive = new THREE.Color('#000000');
        m.emissiveIntensity = 0.0;
      }

      m.needsUpdate = true;
      this._shellMats.push(m);
    });
  });

  this._alphaTex = alphaTex;
},

  _makeTaperPlane: function (wStart, wEnd) {
  // Plane centered at origin, height = 1 (Y).
  // Width tapers from bottom(-0.5) to top(+0.5).
  const g = new THREE.BufferGeometry();

  const hs = 0.5;
  const x0 = wStart * 0.5;
  const x1 = wEnd * 0.5;

  const positions = new Float32Array([
    -x0, -hs, 0,
     x0, -hs, 0,
    -x1,  hs, 0,
     x1,  hs, 0
  ]);

  const uvs = new Float32Array([
    0, 0,
    1, 0,
    0, 1,
    1, 1
  ]);

  const indices = [0, 2, 1, 2, 3, 1];

  g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
},

_buildBeams: function () {
  // Each beam (and its room light) is anchored at a tiny perforation on the shell.
  // Outer shaft spills *out* from the hole; inner spill runs *inward* to imply an internal flame feeding it.
  const br = this.data.beamRadius;

  // Make the beam truly feel like it is *collimated by a tiny hole*:
  // very tight at the emitter, then blooming outward.
  const geoOuter  = this._makeTaperPlane(br * 8.0,  br * 8.0);  // straight shaft (no cone taper)
  const geoInner  = this._makeTaperPlane(br * 8.0,  br * 8.0);  // straight inner spill (no cone taper)
  const geoThroat = this._makeTaperPlane(br * 10.0, br * 10.0); // slightly thicker throat, still straight

  this._beams.length = 0;

  // Anchor exactly on (and just a hair outside) the shell so the first visible pixels sit on the perforation.
  const rHole = this.data.radius * 1.0006;
  for (let i = 0; i < this._dirs.length; i++) {
    const dir = this._dirs[i];
    const phase = Math.random() * Math.PI * 2;
    const rand = 0.65 + Math.random() * 0.55;

    const outerMat = new THREE.MeshBasicMaterial({
      color: this._cBlue.clone(),
      map: this._beamTex,
      alphaMap: this._beamTex,
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      fog: true,
      side: THREE.DoubleSide,
      dithering: true
    });

    const innerMat = new THREE.MeshBasicMaterial({
      color: this._cWhite.clone(),
      map: this._beamTex,
      alphaMap: this._beamTex,
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      fog: true,
      side: THREE.DoubleSide,
      dithering: true
    });

    // Anchor at the hole position on the shell.
    const holePos = dir.clone().multiplyScalar(rHole);

    const g = new THREE.Group();
    g.position.copy(holePos);

    // Local +Y points outward along the beam direction.
    const baseQuat = new THREE.Quaternion().setFromUnitVectors(this._up, dir);
    g.quaternion.copy(baseQuat);

    // Inner segment (inside sphere): spill from flame toward the hole (negative Y).
    const innerG = new THREE.Group();
    const in1 = new THREE.Mesh(geoInner, innerMat);
    const in2 = new THREE.Mesh(geoInner, innerMat);
    in2.rotation.y = Math.PI / 2;
    innerG.add(in1); innerG.add(in2);
    innerG.visible = false; // inward spill disabled for clean emitter read

    // Outer segment (outside sphere): the visible shaft (positive Y).
    const outerG = new THREE.Group();
    const out1 = new THREE.Mesh(geoOuter, outerMat);
    const out2 = new THREE.Mesh(geoOuter, outerMat);
    out2.rotation.y = Math.PI / 2;
    outerG.add(out1); outerG.add(out2);

    // Short bright "throat" segment right at the hole so the beam visually starts from the perforation.
    const throatMat = new THREE.MeshBasicMaterial({
      color: this._cWhite.clone(),
      map: this._beamTex,
      alphaMap: this._beamTex,
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      fog: true,
      side: THREE.DoubleSide,
      dithering: true
    });
    const throatG = new THREE.Group();
    const th1 = new THREE.Mesh(geoThroat, throatMat);
    const th2 = new THREE.Mesh(geoThroat, throatMat);
    th2.rotation.y = Math.PI / 2;
    th1.renderOrder = 60;
    th2.renderOrder = 60;
    throatG.add(th1); throatG.add(th2);

    // Emitter visuals (NOT billboards): a thin rim ring + tiny exit disc, oriented to the hole normal.
    // Using meshes (not sprites) avoids the "floating emissive dots" artifact and respects wall occlusion.
    const ringGeo = new THREE.RingGeometry(0.010, 0.020, 24);
    const ringMat = new THREE.MeshBasicMaterial({
      color: this._cWhite.clone(),
      map: this._ringTex,
      alphaMap: this._ringTex,
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      side: THREE.DoubleSide,
      polygonOffset: true,
      polygonOffsetFactor: -2,
      polygonOffsetUnits: -2
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.renderOrder = 61;
    ring.rotation.x = -Math.PI / 2; // lie in XZ plane (normal +Y)
    ring.position.set(0, 0.0016, 0);

    const exitGeo = new THREE.CircleGeometry(br * 3.2, 18);
    const holeGeo = new THREE.CircleGeometry(br * 2.8, 18);
    const exitMat = new THREE.MeshBasicMaterial({
      color: this._cWhite.clone(),
      map: this._exitTex,
      alphaMap: this._exitTex,
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      side: THREE.DoubleSide,
      polygonOffset: true,
      polygonOffsetFactor: -3,
      polygonOffsetUnits: -3
    });
    const exit = new THREE.Mesh(exitGeo, exitMat);
    exit.renderOrder = 62;
    exit.rotation.x = -Math.PI / 2;
    exit.position.set(0, 0.0020, 0);


    const holeMat = new THREE.MeshBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 0.0,
      depthWrite: false,
      depthTest: true,
      side: THREE.DoubleSide,
      polygonOffset: true,
      polygonOffsetFactor: -4,
      polygonOffsetUnits: -4
    });
    const hole = new THREE.Mesh(holeGeo, holeMat);
    hole.renderOrder = 60;
    hole.rotation.x = -Math.PI / 2;
    // Sit just *inside* the shell so it reads as a real perforation, not a sticker.
    hole.position.set(0, -0.0009, 0);
    const cards = new THREE.Group();
    cards.add(innerG);
    cards.add(outerG);
    cards.add(throatG);

    g.add(cards);
    g.add(hole);
    g.add(ring);
    g.add(exit);

    this._group.add(g);

    this._beams.push({ obj: g, holePos,
      cards: cards,
      innerObj: innerG,
      outerObj: outerG,
      throatObj: throatG,
      innerMat,
      outerMat,
      throatMat,
      exit,
      exitMat: exitMat,
      hole,
      holeMat: holeMat,
      ring,
      ringMat,
      dir: dir.clone(),
      baseQuat,
      phase,
      rand,
      spot: null,
      spotTarget: null
    });
  }
},

_buildSpots: function () {
    if (this.data.lightCount <= 0) return;
// Create a small number of real spotlights that are physically attached to selected holes,
  // so the cave lighting is *literally* emitted from the same places as the beams.
  const n = this._beams.length;
  if (!n) return;

  const count = Math.min(this.data.lightCount, Math.max(6, Math.floor(n / 14)));
  this._spots.length = 0;

  for (let i = 0; i < count; i++) {
    const idx = Math.floor(((i + 0.25) / count) * n);
    const b = this._beams[idx];
    if (!b) continue;

    const spot = new THREE.SpotLight(this._cBlue.clone(), 0.0, this.data.lightReach, this.data.lightAngle, 0.78, 2);
    spot.castShadow = false;

    // Position just outside the hole, pointing outward.
    spot.position.set(0, 0.06, 0);

    const target = new THREE.Object3D();
    target.position.set(0, Math.min(this.data.lightReach * 0.82, 48), 0);

    // Attach to the same anchor as the beam.
    b.obj.add(spot);
    b.obj.add(target);
    spot.target = target;

    b.spot = spot;
    b.spotTarget = target;
    this._spots.push({ idx, spot, target });
  }
},


  _buildRaycastTargets: function () {
    const root = this.el.sceneEl && this.el.sceneEl.object3D;
    if (!root) return [];
    const selfRoot = this.el.object3D;
    const meshes = [];
    root.traverse((o) => {
      if (!o || !o.isMesh) return;
      // Exclude anything under this component's entity (sphere shell + beams).
      if (selfRoot) {
        let p = o;
        while (p) { if (p === selfRoot) return; p = p.parent; }
      }
      if (o.visible === false) return;
      meshes.push(o);
    });
    return meshes;
  },
  _computeBeamCaps: function () {
    if (this._capsDone) return;
    if (!this._built || !this._beams || this._beams.length === 0) return;
    if (!this.el || !this.el.sceneEl) return;

    // Analytic cap against the sphere_dome inner shell (ellipsoid). Much cheaper and more stable than raycasts.
    const domeEl = this._domeShellEl || (this._domeShellEl = document.querySelector('#sphere_dome_shell'));
    if (!domeEl || !domeEl.object3D) return;

    const domeObj = domeEl.object3D;
    domeObj.updateMatrixWorld(true);

    // Read dome parameters once.
    if (!this._domeParams) {
      const cfg = domeEl.getAttribute('thick-dome-shell');
      if (!cfg || !cfg.radius || !cfg.innerScale) return;

      const r = cfg.radius;
      const s = cfg.innerScale; // vec3
      this._domeParams = {
        rx: Math.max(1e-6, r * s.x),
        ry: Math.max(1e-6, r * s.y),
        rz: Math.max(1e-6, r * s.z)
      };
    }

    const p = this._domeParams;
    const invM = this._tmpDomeInvM || (this._tmpDomeInvM = new THREE.Matrix4());
    invM.copy(domeObj.matrixWorld).invert();

    const originW = this._tmpCapO || (this._tmpCapO = new THREE.Vector3());
    const dirW    = this._tmpCapD || (this._tmpCapD = new THREE.Vector3());
    const qW      = this._tmpCapQ || (this._tmpCapQ = new THREE.Quaternion());

    const originL = this._tmpCapOL || (this._tmpCapOL = new THREE.Vector3());
    const dirL    = this._tmpCapDL || (this._tmpCapDL = new THREE.Vector3());
    const hitL    = this._tmpCapHL || (this._tmpCapHL = new THREE.Vector3());
    const hitW    = this._tmpCapHW || (this._tmpCapHW = new THREE.Vector3());

    // If we miss (e.g., through the portal cut), fall back to beamMax in world units.
    const FAR = Math.max(6, this.data.beamMax);

    for (let i = 0; i < this._beams.length; i++) {
      const b = this._beams[i];
      if (!b || !b.obj) continue;

      // Beam origin + direction in world.
      b.obj.getWorldPosition(originW);
      b.obj.getWorldQuaternion(qW);
      dirW.set(0, 1, 0).applyQuaternion(qW).normalize();

      // Push a bit outward so we don't self-intersect immediately.
      originW.addScaledVector(dirW, 0.10);

      // Transform ray into dome local space.
      originL.copy(originW).applyMatrix4(invM);
      dirL.copy(dirW).transformDirection(invM).normalize();

      // Ray/ellipsoid intersection with axis-aligned ellipsoid centered at (0,0,0) in dome local space:
      // (x/rx)^2 + (y/ry)^2 + (z/rz)^2 = 1
      const ox = originL.x, oy = originL.y, oz = originL.z;
      const dx = dirL.x, dy = dirL.y, dz = dirL.z;

      const invRx2 = 1.0 / (p.rx * p.rx);
      const invRy2 = 1.0 / (p.ry * p.ry);
      const invRz2 = 1.0 / (p.rz * p.rz);

      const A = dx*dx*invRx2 + dy*dy*invRy2 + dz*dz*invRz2;
      const B = 2.0 * (ox*dx*invRx2 + oy*dy*invRy2 + oz*dz*invRz2);
      const C = ox*ox*invRx2 + oy*oy*invRy2 + oz*oz*invRz2 - 1.0;

      const D = B*B - 4.0*A*C;

      let capWorld = FAR;

      if (D > 1e-8 && A > 1e-12) {
        const sD = Math.sqrt(D);
        const t1 = (-B - sD) / (2.0*A);
        const t2 = (-B + sD) / (2.0*A);

        // Choose the smallest positive t (we're inside the dome most of the time).
        let tHit = Infinity;
        if (t1 > 0.0) tHit = Math.min(tHit, t1);
        if (t2 > 0.0) tHit = Math.min(tHit, t2);

        if (isFinite(tHit)) {
          hitL.set(ox + dx * tHit, oy + dy * tHit, oz + dz * tHit);
          hitW.copy(hitL).applyMatrix4(domeObj.matrixWorld);

          capWorld = originW.distanceTo(hitW);
        }
      }

      // Cap length to the hit distance (minus a small epsilon), with a readable minimum.
      b.capLen = Math.max(2.0, Math.min(FAR, capWorld - 0.25));
    }

    this._capsDone = true;
  },


  tick: function (time) {
  if (!this._built) return;
  // If the room geometry wasn't ready at init, keep trying until we can cap beam lengths.
  if (!this._capsDone) this._computeBeamCaps && this._computeBeamCaps();
  const t = (time || 0) / 1000;

  // Slow “breath” for the internal flame.
  const core =
    0.86 +
    0.10 * Math.sin(t * 0.18) +
    0.07 * Math.sin(t * 0.43 + 1.7) +
    0.04 * Math.sin(t * 0.11 + 0.4);

  const coreN = THREE.MathUtils.clamp(core, 0.55, 1.10);

  // Camera position (used to billboard the beam cards so shafts don't disappear edge-on).
  const cam = (this.el.sceneEl && this.el.sceneEl.camera) ? this.el.sceneEl.camera : null;
  if (cam) {
    if (!this._camPos) this._camPos = new THREE.Vector3();
    cam.getWorldPosition(this._camPos);

    // --- Performance gating & throttling ---
    // Skip heavy updates when the camera is far away (e.g. you're not in this dome/room).
    if (!this._selfPos) this._selfPos = new THREE.Vector3();
    this.el.object3D.getWorldPosition(this._selfPos);
    const mad = (this.data.maxActiveDistance || 0);
    if (mad > 0) {
      const far = (this._selfPos.distanceToSquared(this._camPos) > mad * mad);
      if (far) {
        if (!this._wasFar) {
          // Hide beams + impacts (one-time), keep core shell visible.
          if (this._beams && this._beams.length) {
            for (let i=0;i<this._beams.length;i++){
              const b=this._beams[i];
              if (b && b.mesh) b.mesh.visible = false;
              if (b && b.impact) b.impact.visible = false;
            }
          }
          // Disable spot lights (one-time).
          if (this._holeLights && this._holeLights.length) {
            for (let i=0;i<this._holeLights.length;i++){
              const le = this._holeLights[i];
              const lo = le && le.getObject3D && le.getObject3D('light');
              if (lo) lo.intensity = 0;
            }
          }
        }
        this._wasFar = true;
        return;
      } else if (this._wasFar) {
        // Re-enable beams when coming back in range.
        if (this._beams && this._beams.length) {
          for (let i=0;i<this._beams.length;i++){
            const b=this._beams[i];
            if (b && b.mesh) b.mesh.visible = true;
          }
        }
        this._wasFar = false;

      if ((time - this._lastHeavyAt) < uem) return;
      this._lastHeavyAt = time;
    }

    if (!this._tmpV1) {
      this._tmpV1 = new THREE.Vector3();
      this._tmpV2 = new THREE.Vector3();
      this._tmpV3 = new THREE.Vector3();
      this._tmpQ1 = new THREE.Quaternion();
      this._tmpQ2 = new THREE.Quaternion();
    }

    // Cache viewport height for projected-size gating (avoid subpixel '+' sparkles).
    // Don't call getSize every frame (it can be surprisingly expensive in some drivers).
    if (!this._lastVPAt) this._lastVPAt = 0;
    if ((time - this._lastVPAt) > 250) {
      this._lastVPAt = time;
      if (this.el.sceneEl && this.el.sceneEl.renderer) {
      if (!this._vp) this._vp = new THREE.Vector2();
      this.el.sceneEl.renderer.getSize(this._vp);
      this._vpH = this._vp.y || 1;

      this._vpH = 1;
    }

        this._tanHalfFov = (cam.isPerspectiveCamera && cam.fov) ? Math.tan(THREE.MathUtils.degToRad(cam.fov * 0.5)) : 1.0;

  const wob = this.data.wobble;

  this.el.object3D.getWorldScale(ws);
  const invScaleY = 1.0 / Math.max(1e-6, ws.y);

  for (let i = 0; i < this._beams.length; i++) {
    const b = this._beams[i];

    const intensity = THREE.MathUtils.clamp(coreN * local, 0.0, 1.20);

                           0.30 * Math.sin(t * (0.93 + 0.41 * b.rand) + b.phase * 1.7));

    const thickInner = 1.05 + 0.45 * w;

    // The emitter is the HOLE (local origin). Outer starts at y=0 and goes outward.
    const outerLenL = outerLen * invScaleY;
    b.outerObj.scale.set(thickOuter, outerLenL, thickOuter);
    b.outerObj.position.set(0, outerLenL * 0.5, 0);

    // Throat: a short, brighter segment right at the perforation so the beam reads as starting at the hole.
    if (b.throatObj) {
      const throatLen = 0.22 + 0.55 * w; // meters-ish (world)
      const throatLenL = throatLen * invScaleY;

      b.throatObj.position.set(0, throatLenL * 0.5 + 0.004 * invScaleY, 0); // keep tiny push consistent under scaling // tiny push outward to avoid depth clipping
      if (b.throatMat) {
        b.throatMat.opacity = THREE.MathUtils.clamp(opOuter * 3.2, 0.0, 0.88) * (0.55 + 0.45 * viewGate);
        b.throatMat.color.copy(this._cWhite).lerp(this._cBlue, 0.20);
      }
    }

    // Inner runs inward from the same hole (negative y).
    const innerLenL = innerLen * invScaleY;
    b.innerObj.scale.set(thickInner, innerLenL, thickInner);
    b.innerObj.position.set(0, -innerLenL * 0.5, 0);

    // Exit sparkle: tiny bright vent.
    const spark = THREE.MathUtils.smoothstep(w, 0.12, 0.30);

    // Screen-space sizing: keep the emitter readable even when we look along the beam axis.
    // Instead of fading to 0 (which reads like "beams not from holes"), we keep a small minimum pixel size
    // and clamp it to avoid the subpixel additive shimmer that used to look like a '+'.
    let dist = 6.0;
    if (cam && this._tanHalfFov && this._vpH) {
      b.obj.getWorldPosition(this._tmpV1);
      dist = this._camPos.distanceTo(this._tmpV1);
    }

    // Target pixel sizes (clamped). Slightly larger when beam is stronger.
    const pixBase = 2.8;
    const pixGain = 3.8; // -> up to ~6.6px
    const pixExit = THREE.MathUtils.clamp(pixBase + pixGain * w, 2.8, 6.8);

    // Convert pixels to world units at this distance.
    let ex = 0.020 + 0.055 * w;
    if (cam && this._tanHalfFov && this._vpH && dist > 1e-3) {
      ex = (pixExit * dist) * (2.0 * this._tanHalfFov / this._vpH);
    }

    b.exitMat.opacity = THREE.MathUtils.clamp(1.10 * w * w * w, 0.0, 1.0)
      * (0.35 + 0.65 * intensityV) * spark;
    b.exit.visible = (b.exitMat.opacity > 0.002);
    b.exit.scale.set(ex, ex, ex);


    // Physical perforation: a dark "hole" disk just inside the shell, always tied to beam intensity.
    if (b.holeMat && b.hole) {
      b.holeMat.opacity = THREE.MathUtils.clamp(0.90 * (0.25 + 0.75 * w) * viewGate, 0.0, 0.95);

      const hx = ex * 1.18;
      b.hole.scale.set(hx, hx, hx);

    // Rim ring glow: always tied to the same beam intensity (so no ring without a beam).
    if (b.ringMat && b.ring) {
      const pixRing = THREE.MathUtils.clamp(pixExit * 2.1, 6.0, 16.0);

      b.ringMat.opacity = THREE.MathUtils.clamp(0.95 * w * w * w, 0.0, 1.0)

      b.obj.quaternion.copy(b.baseQuat);
    }
