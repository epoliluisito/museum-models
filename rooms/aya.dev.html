AFRAME.registerComponent('flicker-light', {
  schema: {
    base: {type: 'number', default: 6.0},
    amp: {type: 'number', default: 1.0},
    speed: {type: 'number', default: 3.0}
  },
  init: function () {
    const light = this.el.getObject3D('light');
    this._light = light || null;
    this._lastJitterT = 0;
    this._jitter = 0;
    // If light not yet ready, wait.
    this.el.addEventListener('object3dset', (e) => {
      if (e.detail.type === 'light') this._light = this.el.getObject3D('light');
    });
  },
  tick: function (t) {
    if (!this._light) return;
    const time = t * 0.001;
    // Low-frequency flicker + micro jitter (flame-like)
    const lf = 0.55 + 0.45 * Math.sin(time * this.data.speed);
    if (t - this._lastJitterT > 90) {
      this._lastJitterT = t;
      this._jitter = (Math.random() * 2 - 1) * 0.22;
    }
    const intensity = this.data.base + this.data.amp * (lf + this._jitter);
    this._light.intensity = Math.max(0.0, intensity);
  }
});

AFRAME.registerComponent('broken-ring-glow', {
  schema: {
    radius: {type: 'number', default: 1.0},
    thickness: {type: 'number', default: 0.06},   // wider = more "structural seam"
    jitter: {type: 'number', default: 0.02},      // radial / vertical irregularity
    color: {type: 'color', default: '#d9f1ff'},
    intensity: {type: 'number', default: 1.2},
    softness: {type: 'number', default: 0.30},    // 0..1 (higher = softer edge)
    segments: {type: 'int', default: 52}          // used as a hint; we purposely facet it
  },
  init: function () {
    const THREE = AFRAME.THREE;

    // --- Deterministic-ish seed from entity id (stable across reloads) ---
    const seedStr = (this.el.id || 'ring') + '_seed';
    let seed = 0;
    for (let i = 0; i < seedStr.length; i++) seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
    const rand = () => {
      // xorshift32
      seed ^= seed << 13; seed >>>= 0;
      seed ^= seed >> 17; seed >>>= 0;
      seed ^= seed << 5;  seed >>>= 0;
      return (seed >>> 0) / 4294967296;
    };

    // --- Build a faceted, not-perfectly-planar closed polyline ---
    const segHint = Math.max(18, this.data.segments | 0);
    const facets = Math.max(14, Math.floor(segHint * 0.55)); // fewer facets => more geometric
    const pts = [];

    for (let i = 0; i < facets; i++) {
      const a0 = (i / facets) * Math.PI * 2;
      const step = (Math.PI * 2) / facets;

      // Keep it geometric but imperfect: snap to facet steps, then nudge slightly.
      const a = a0 + (rand() - 0.5) * step * 0.22;

      const r = this.data.radius + (rand() - 0.5) * this.data.jitter;
      const y = (rand() - 0.5) * this.data.jitter * 0.45;

      pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
    }

    // --- Ribbon geometry around the polyline (flat seam, not a tube/cone) ---
    const positions = [];
    const uvs = [];
    const indices = [];
    const M = pts.length;

    for (let i = 0; i < M; i++) {
      const pPrev = pts[(i - 1 + M) % M];
      const p = pts[i];
      const pNext = pts[(i + 1) % M];

      const tangent = new THREE.Vector3().subVectors(pNext, pPrev).normalize();
      const radial = p.clone().normalize();

      // Bitangent gives "across seam" direction on the surface.
      let bitan = new THREE.Vector3().crossVectors(tangent, radial);
      if (bitan.lengthSq() < 1e-6) bitan.set(0, 1, 0);
      bitan.normalize();

      const off = bitan.multiplyScalar(this.data.thickness);

      const v0 = p.clone().add(off); // outer
      const v1 = p.clone().sub(off); // inner

      positions.push(v0.x, v0.y, v0.z,  v1.x, v1.y, v1.z);

      const u = i / M;
      uvs.push(u, 0,  u, 1);
    }

    for (let i = 0; i < M; i++) {
      const a0 = i * 2;
      const a1 = a0 + 1;
      const b0 = ((i + 1) % M) * 2;
      const b1 = b0 + 1;

      // Two triangles for the quad strip.
      indices.push(a0, a1, b1);
      indices.push(a0, b1, b0);
    }

    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geom.setIndex(indices);
    geom.computeVertexNormals();

    const col = new THREE.Color(this.data.color);

    const makeMat = (mulIntensity, addSoftness) => new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      depthTest: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime: {value: 0},
        uColor: {value: col.clone()},
        uIntensity: {value: this.data.intensity * mulIntensity},
        uSoftness: {value: Math.min(0.96, this.data.softness + addSoftness)}
      },
      vertexShader: `
        varying vec2 vUv;
        varying float vW;
        void main() {
          vUv = uv;
          vW = length(position) * 0.25;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        varying vec2 vUv;
        varying float vW;
        uniform float uTime;
        uniform vec3 uColor;
        uniform float uIntensity;
        uniform float uSoftness;

        float hash(float n) { return fract(sin(n) * 43758.5453123); }
        float noise(float x) {
          float i = floor(x);
          float f = fract(x);
          float u = f*f*(3.0-2.0*f);
          return mix(hash(i), hash(i+1.0), u);
        }

        void main() {
          float x = vUv.x;

          // Breakup along the seam: big gaps + some fine variation
          float n1 = noise(x * 10.0 + uTime * 0.20 + vW);
          float n2 = noise(x * 31.0 - uTime * 0.14);
          float n = (n1 * 0.65 + n2 * 0.35);

          // Make it feel "cracked": more binary on/off with softened transitions
          float mask = smoothstep(0.38, 0.70, n);

          // Edge softness across ribbon thickness (2D seam feel)
          float d = abs(vUv.y - 0.5) * 2.0;   // 0 center -> 1 edge
          float edge = smoothstep(1.0 - uSoftness, 1.0, 1.0 - d);

          // Low-key flicker like a living core
          float flick = 0.80 + 0.20 * sin(uTime * 4.4 + x * 10.5);

          float alpha = mask * edge * flick;
          alpha *= (0.70 + 0.30 * n);

          if (alpha < 0.02) discard;

          vec3 col = uColor * (uIntensity * (0.65 + 0.35 * n));
          gl_FragColor = vec4(col, alpha);
        }
      `
    });

    const matCore = makeMat(1.00, 0.00);
    const matHalo = makeMat(0.55, 0.28);

    // Halo geometry: slightly expanded (keeps it soft without looking like a tube)
    const geom2 = geom.clone();
    const pos2 = geom2.getAttribute('position');
    for (let i = 0; i < pos2.count; i++) {
      pos2.setX(i, pos2.getX(i) * 1.012);
      pos2.setY(i, pos2.getY(i) * 1.012);
      pos2.setZ(i, pos2.getZ(i) * 1.012);
    }
    pos2.needsUpdate = true;

    this._meshHalo = new THREE.Mesh(geom2, matHalo);
    this._meshCore = new THREE.Mesh(geom, matCore);

    this._group = new THREE.Group();
    this._group.add(this._meshHalo);
    this._group.add(this._meshCore);

    this.el.setObject3D('brokenRingGlow', this._group);
  },
  tick: function (t) {
    const time = t * 0.001;
    if (this._meshCore && this._meshCore.material && this._meshCore.material.uniforms) {
      this._meshCore.material.uniforms.uTime.value = time;
    }
    if (this._meshHalo && this._meshHalo.material && this._meshHalo.material.uniforms) {
      this._meshHalo.material.uniforms.uTime.value = time;
    }
  },
  remove: function () {
    const obj = this.el.getObject3D('brokenRingGlow');
    if (obj) this.el.removeObject3D('brokenRingGlow');
  }
});



/**
 * planar-reflector — lightweight planar reflection component.
 * Provides dynamic reflections for the mercury pool when opening via file:// (no external deps).
 * Inspired by three.js Reflector (MIT), adapted to A-Frame.
 */
AFRAME.registerComponent('planar-reflector', {
  schema: {
    resolution: {type: 'int', default: 1024},
    color: {type: 'color', default: '#20242b'},
    opacity: {type: 'number', default: 0.34},
    clipBias: {type: 'number', default: 0.003},
    // Performance: cap reflection update rate. Default chosen to be visually indistinguishable.
    maxHz: {type: 'number', default: 30},
    // Always refresh if the camera moves a lot (prevents noticeable lag during quick turns).
    forcePosDelta: {type: 'number', default: 0.15},
    forceAngDelta: {type: 'number', default: 0.02}
  },

  init: function () {
    this._setupIfReady = this._setupIfReady.bind(this);
    this.el.addEventListener('object3dset', this._setupIfReady);
    this._setupIfReady();
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._setupIfReady);
    if (this.mesh) this.mesh.onBeforeRender = null;
    if (this.renderTarget) this.renderTarget.dispose();
  },

  update: function () {
    if (!this.material) return;
    this.material.uniforms.color.value.set(this.data.color);
    this.material.uniforms.opacity.value = this.data.opacity;
  },

  _setupIfReady: function () {
    const sceneEl = this.el.sceneEl;
    if (!sceneEl || !sceneEl.renderer) return;

    const meshRoot = this.el.getObject3D('mesh');
    if (!meshRoot || this.mesh) return; // already set up

    const THREE = AFRAME.THREE;
    this.mesh = meshRoot;

    // Render target.
    const rt = new THREE.WebGLRenderTarget(this.data.resolution, this.data.resolution, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      depthBuffer: true,
      stencilBuffer: false
    });
    rt.texture.generateMipmaps = false;
    this.renderTarget = rt;

    // Shader (projected reflection).
    const uniforms = {
      color: { value: new THREE.Color(this.data.color) },
      tDiffuse: { value: rt.texture },
      textureMatrix: { value: new THREE.Matrix4() },
      opacity: { value: this.data.opacity }
    };

    const material = new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: `
        precision highp float;
        uniform mat4 textureMatrix;
        varying vec4 vUv;
        void main() {
          vUv = textureMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        uniform vec3 color;
        uniform sampler2D tDiffuse;
        uniform float opacity;
        varying vec4 vUv;
        void main() {
          vec2 uv = vUv.xy / max(vUv.w, 0.0001);
          vec4 base = texture2D(tDiffuse, uv);
          vec3 outc = mix(color, base.rgb, 0.92);
          gl_FragColor = vec4(outc, opacity);
        }
      `,
      transparent: true,
      depthWrite: false,
      depthTest: true
    });

    this.material = material;

    // Apply material to all meshes under this entity.
    this.mesh.traverse((o) => { if (o.isMesh) o.material = material; });

    // Working vars.
    this.virtualCamera = new THREE.PerspectiveCamera();
    this.reflectorPlane = new THREE.Plane();
    this.normal = new THREE.Vector3();
    this.reflectorWorldPosition = new THREE.Vector3();
    this.cameraWorldPosition = new THREE.Vector3();
    this.rotationMatrix = new THREE.Matrix4();
    this.lookAtPosition = new THREE.Vector3(0, 0, -1);
    this.clipPlane = new THREE.Vector4();
    this.q = new THREE.Vector4();
    this.textureMatrix = uniforms.textureMatrix.value;

    // Perf throttling state (reflection is expensive: a full extra scene render).
    this._lastReflAt = 0;
    this._hasLastCam = false;
    this._lastCamPos = new THREE.Vector3();
    this._lastCamQuat = new THREE.Quaternion();
    this._tmpCamQuat = new THREE.Quaternion();

    // Hook.
    this.mesh.onBeforeRender = (renderer, scene, camera) => {
      if (!camera || !camera.isCamera) return;

      // World positions.
      this.reflectorWorldPosition.setFromMatrixPosition(this.mesh.matrixWorld);
      this.cameraWorldPosition.setFromMatrixPosition(camera.matrixWorld);

      // Reflector normal (assumes plane geometry; +Z is plane normal in local space).
      this.rotationMatrix.extractRotation(this.mesh.matrixWorld);
      this.normal.set(0, 0, 1).applyMatrix4(this.rotationMatrix);

      // Only render when reflector faces camera.
      const view = this.reflectorWorldPosition.clone().sub(this.cameraWorldPosition);
      if (view.dot(this.normal) > 0) return;

      // Throttle reflection updates (major perf win) while keeping the same look.
      // We still refresh immediately on large camera moves to avoid visible lag.
      const now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      const minDt = (this.data.maxHz > 0) ? (1000 / this.data.maxHz) : 0;
      camera.getWorldQuaternion(this._tmpCamQuat);

      if (this._hasLastCam && minDt > 0) {
        const dt = now - this._lastReflAt;
        const posD = this.cameraWorldPosition.distanceTo(this._lastCamPos);
        const angD = 1.0 - Math.abs(this._tmpCamQuat.dot(this._lastCamQuat));
        const force = (posD >= this.data.forcePosDelta) || (angD >= this.data.forceAngDelta);
        if (!force && dt < minDt) return;
      }

      // Virtual camera: reflected position.
      view.reflect(this.normal).negate();
      view.add(this.reflectorWorldPosition);
      this.virtualCamera.position.copy(view);

      // Virtual camera orientation (mirror of the real camera).
      this.rotationMatrix.extractRotation(camera.matrixWorld);

      const lookAtPosition = this.lookAtPosition.clone().applyMatrix4(this.rotationMatrix).add(this.cameraWorldPosition);
      const target = this.reflectorWorldPosition.clone().sub(lookAtPosition);
      target.reflect(this.normal).negate();
      target.add(this.reflectorWorldPosition);

      this.virtualCamera.up.set(0, 1, 0).applyMatrix4(this.rotationMatrix);
      this.virtualCamera.up.reflect(this.normal);

      this.virtualCamera.lookAt(target);

      this.virtualCamera.near = camera.near;
      this.virtualCamera.far = camera.far;
      this.virtualCamera.aspect = camera.aspect;
      this.virtualCamera.projectionMatrix.copy(camera.projectionMatrix);
      this.virtualCamera.updateMatrixWorld();
      this.virtualCamera.matrixWorldInverse.copy(this.virtualCamera.matrixWorld).invert();

      // Texture matrix.
      this.textureMatrix.set(
        0.5, 0.0, 0.0, 0.5,
        0.0, 0.5, 0.0, 0.5,
        0.0, 0.0, 0.5, 0.5,
        0.0, 0.0, 0.0, 1.0
      );
      this.textureMatrix.multiply(this.virtualCamera.projectionMatrix);
      this.textureMatrix.multiply(this.virtualCamera.matrixWorldInverse);
      this.textureMatrix.multiply(this.mesh.matrixWorld);

      // Oblique clip plane (prevents artifacts).
      this.reflectorPlane.setFromNormalAndCoplanarPoint(this.normal, this.reflectorWorldPosition);
      this.reflectorPlane.applyMatrix4(this.virtualCamera.matrixWorldInverse);

      this.clipPlane.set(this.reflectorPlane.normal.x, this.reflectorPlane.normal.y, this.reflectorPlane.normal.z, this.reflectorPlane.constant);

      const projectionMatrix = this.virtualCamera.projectionMatrix;
      this.q.x = (Math.sign(this.clipPlane.x) + projectionMatrix.elements[8]) / projectionMatrix.elements[0];
      this.q.y = (Math.sign(this.clipPlane.y) + projectionMatrix.elements[9]) / projectionMatrix.elements[5];
      this.q.z = -1.0;
      this.q.w = (1.0 + projectionMatrix.elements[10]) / projectionMatrix.elements[14];

      // Calculate scaled plane vector.
      const c = this.clipPlane.multiplyScalar(2.0 / this.clipPlane.dot(this.q));
      projectionMatrix.elements[2]  = c.x;
      projectionMatrix.elements[6]  = c.y;
      projectionMatrix.elements[10] = c.z + 1.0 - this.data.clipBias;
      projectionMatrix.elements[14] = c.w;

      // Render.
      const currentRT = renderer.getRenderTarget();
      const currentXr = renderer.xr.enabled;
      const currentShadow = renderer.shadowMap.enabled;

      renderer.xr.enabled = false;
      renderer.shadowMap.enabled = false;

      this.mesh.visible = false;
      renderer.setRenderTarget(this.renderTarget);
      renderer.clear();
      renderer.render(scene, this.virtualCamera);
      this.mesh.visible = true;

      renderer.setRenderTarget(currentRT);
      renderer.xr.enabled = currentXr;
      renderer.shadowMap.enabled = currentShadow;

      // Update throttle state after a successful render.
      this._lastReflAt = now;
      this._lastCamPos.copy(this.cameraWorldPosition);
      this._lastCamQuat.copy(this._tmpCamQuat);
      this._hasLastCam = true;
    };
  }
});





/* -------------------------------------------------------------------------
   equator-gap-clip
   - Cuts an equatorial "band" out of a sphere *in the shader*.
   - This keeps the sphere as a single stable silhouette while still revealing
     the core through a clean gap (no two-mesh parallax / convergence artifacts).
   - Works with MeshStandardMaterial (keeps PBR maps).
--------------------------------------------------------------------------- */

/* -------------------------------------------------------------------------
   sin-bob + spin
   - Replaces A-Frame animation looping on transforms to avoid wrap/jump snaps.
   - Keeps motion perfectly continuous (no reset at loop boundaries).
--------------------------------------------------------------------------- */
AFRAME.registerComponent('sin-bob', {
  schema: {
    baseY: {type: 'number', default: 0},
    amp:   {type: 'number', default: 0.12},
    speed: {type: 'number', default: 0.10} // cycles per second
  },
  init: function () {
    this._p = this.el.object3D.position;
    // If baseY not provided, capture current Y.
    if (this.data.baseY === 0 && this._p) this.data.baseY = this._p.y;
  },
  tick: function (time) {
    if (!this._p) return;
    const t = (time || 0) / 1000;
    this._p.y = this.data.baseY + this.data.amp * Math.sin(t * this.data.speed * Math.PI * 2);
  }
});

AFRAME.registerComponent('spin', {
  schema: {
    // degrees per second
    speed: {type: 'number', default: 12},
    axis:  {type: 'string', default: 'y'}
  },
  init: function () {
    this._r = this.el.object3D.rotation;
  },

  _buildRaycastTargets: function () {
    const root = this.el.sceneEl && this.el.sceneEl.object3D;
    if (!root) return [];
    const selfRoot = this.el.object3D;
    const impactsRoot = this._impactRoot;
    const meshes = [];
    root.traverse(function (o) {
      if (!o.isMesh) return;
      // Exclude the perforated sphere + beams (everything under this component's entity)
      if (selfRoot && selfRoot.children && selfRoot.children.length) {
        let p = o;
        while (p) { if (p === selfRoot) return; p = p.parent; }
      }
      // Exclude impact planes themselves
      if (impactsRoot) {
        let p = o;
        while (p) { if (p === impactsRoot) return; p = p.parent; }
      }
      // Exclude explicitly invisible meshes
      if (o.visible === false) return;
      // Must be raycastable (three's default raycast)
      meshes.push(o);
    });
    return meshes;
  },

  _updateImpacts: function () {
    if (!this.data.impactDots) return;
    if (!this._impactRoot || !this._raycaster) return;

    // Lazy build target list (and refresh occasionally if needed)
    if (!this._raycastMeshes || this._raycastMeshes.length === 0) {
      this._raycastMeshes = this._buildRaycastTargets();
    }

    const originW = this._tmpImpactOrigin || (this._tmpImpactOrigin = new THREE.Vector3());
    const dirW    = this._tmpImpactDir    || (this._tmpImpactDir    = new THREE.Vector3());
    const upY     = this._tmpImpactUp     || (this._tmpImpactUp     = new THREE.Vector3(0,1,0));
    const zAxis   = this._tmpImpactZ      || (this._tmpImpactZ      = new THREE.Vector3(0,0,1));
    const q       = this._tmpImpactQ      || (this._tmpImpactQ      = new THREE.Quaternion());
    const qBeam   = this._tmpImpactQB     || (this._tmpImpactQB     = new THREE.Quaternion());
    const normalW = this._tmpImpactN      || (this._tmpImpactN      = new THREE.Vector3());

    const maxD = this.data.lightReach || 60;

    for (let i = 0; i < this._beams.length; i++) {
      const b = this._beams[i];
      const impact = b.impact;
      if (!impact) continue;

      // If this beam is essentially off, hide its impact.
      const w = b._lastW || 0.0;
      if (w <= 0.0) { impact.visible = false; continue; }

      // Beam origin at the hole position (world), pushed slightly outward to avoid self-intersection.
      originW.copy(b.holePos);
      this.el.object3D.localToWorld(originW);

      b.obj.getWorldQuaternion(qBeam);
      dirW.set(0, 1, 0).applyQuaternion(qBeam).normalize();

      originW.addScaledVector(dirW, 0.06);

      this._raycaster.set(originW, dirW);
      this._raycaster.far = maxD;

      const hits = this._raycaster.intersectObjects(this._raycastMeshes, true);
      if (!hits || hits.length === 0) { impact.visible = false; continue; }

      const hit = hits[0];
      if (!hit.point || !hit.face) { impact.visible = false; continue; }

      // Position slightly above the surface along normal.
      normalW.copy(hit.face.normal);
      if (hit.object && hit.object.matrixWorld) {
        normalW.transformDirection(hit.object.matrixWorld).normalize();
      } else {
        normalW.normalize();
      }

      impact.position.copy(hit.point).addScaledVector(normalW, 0.015);

      // Orient plane so its normal matches the surface normal.
      q.setFromUnitVectors(zAxis, normalW);
      impact.quaternion.copy(q);

      // Size & opacity
      const d = hit.distance;
      const size = this.data.impactSize * (0.65 + 0.75 * w) * (0.90 + 0.10 * Math.max(0, (maxD - d) / maxD));
      impact.scale.set(size, size, 1);

      // Material per impact is cloned, so we can set per-beam opacity.
      const mat = impact.material;
      const op = this.data.impactOpacity * (0.55 + 0.65 * w);
      mat.opacity = Math.min(1.0, op);

      impact.visible = true;
    }
  },

  tick: function (time, timeDelta) {
    if (this.data.impactDots && time >= (this._nextImpactAt || 0)) { this._nextImpactAt = time + this.data.impactEveryMs; this._updateImpacts(); }
    if (!this._r) return;
    const dt = (timeDelta || 0) / 1000;
    const w = THREE.MathUtils.degToRad(this.data.speed);
    const d = w * dt;
    if (this.data.axis === 'x') this._r.x += d;
    else if (this.data.axis === 'z') this._r.z += d;
    else this._r.y += d;
  }
});

/* -------------------------------------------------------------------------
   perforated-sphere-light
   - Full sphere with tiny perforations + thin, soft beams driven by an inner core.
   - Holes are an alphaMap (white = opaque shell, black = hole).
   - Beams are additive, fog-aware, no hard solids.
--------------------------------------------------------------------------- */

// ===== Subtle dust particles (catching beams) =====
AFRAME.registerComponent('beam-dust', {
  schema: {
    center:  {type: 'vec3', default: {x:0, y:2.6, z:38.7}},
    radius:  {type: 'number', default: 26},
    height:  {type: 'number', default: 14},
    count:   {type: 'int', default: 1600},
    size:    {type: 'number', default: 0.045},
    opacity: {type: 'number', default: 0.08},
    drift:   {type: 'number', default: 0.055},
    twinkle: {type: 'number', default: 0.35}
  },
  init: function () {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(32,32,0, 32,32,32);
    g.addColorStop(0.0, 'rgba(255,255,255,1.0)');
    g.addColorStop(0.35,'rgba(255,255,255,0.55)');
    g.addColorStop(1.0, 'rgba(0,0,0,0.0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,64,64);
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;

    const geo = new THREE.BufferGeometry();
    const n = this.data.count;
    const pos = new Float32Array(n * 3);
    const vel = new Float32Array(n * 3);
    const rnd = (a,b)=>a+(b-a)*Math.random();

    for (let i=0;i<n;i++){
      const r = this.data.radius * Math.sqrt(Math.random());
      const a = Math.random() * Math.PI * 2;
      const y = rnd(-this.data.height*0.5, this.data.height*0.5);
      pos[i*3+0] = this.data.center.x + r*Math.cos(a);
      pos[i*3+1] = this.data.center.y + y;
      pos[i*3+2] = this.data.center.z + r*Math.sin(a);

      vel[i*3+0] = rnd(-1,1);
      vel[i*3+1] = rnd(-0.6,0.6);
      vel[i*3+2] = rnd(-1,1);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('velocity', new THREE.BufferAttribute(vel, 3));

    const mat = new THREE.PointsMaterial({
      map: tex,
      transparent: true,
      opacity: this.data.opacity,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      size: this.data.size,
      sizeAttenuation: true,
      color: 0xffffff
    });

    this._points = new THREE.Points(geo, mat);
    this._points.frustumCulled = false;
    this.el.setObject3D('beamDust', this._points);
    this._t = 0;
  },
  tick: function (time, dt) {
    if (!this._points) return;
    const geo = this._points.geometry;
    const pos = geo.attributes.position.array;
    const vel = geo.attributes.velocity.array;
    const n = this.data.count;
    const d = (dt || 16) / 1000;
    const drift = this.data.drift;
    this._t += d;

    const cx = this.data.center.x, cy = this.data.center.y, cz = this.data.center.z;
    const R = this.data.radius, H = this.data.height*0.5;

    for (let i=0;i<n;i++){
      const ix = i*3;
      pos[ix+0] += vel[ix+0]*d*drift;
      pos[ix+1] += vel[ix+1]*d*drift*0.6;
      pos[ix+2] += vel[ix+2]*d*drift;

      // Gentle curl / twinkle drift
      pos[ix+0] += Math.sin(this._t*0.7 + i*0.013) * d * drift * 0.15;
      pos[ix+2] += Math.cos(this._t*0.6 + i*0.011) * d * drift * 0.15;

      // Wrap inside a cylinder volume
      const dx = pos[ix+0]-cx;
      const dz = pos[ix+2]-cz;
      const rr = dx*dx + dz*dz;
      if (rr > R*R){
        const a = Math.random()*Math.PI*2;
        const r = R*Math.sqrt(Math.random());
        pos[ix+0] = cx + r*Math.cos(a);
        pos[ix+2] = cz + r*Math.sin(a);
      }
      if (pos[ix+1] > cy + H) pos[ix+1] = cy - H;
      if (pos[ix+1] < cy - H) pos[ix+1] = cy + H;
    }
    geo.attributes.position.needsUpdate = true;

    // Subtle global twinkle (very low amplitude)
    const tw = 0.75 + 0.25*Math.sin(this._t*0.9);
    this._points.material.opacity = this.data.opacity * (1.0 - this.data.twinkle + this.data.twinkle * tw);
  },
  remove: function () {
    this.el.removeObject3D('beamDust');
  }
});


AFRAME.registerComponent('perforated-sphere-light', {
  schema: {
    radius:      {type: 'number', default: 1.5},
    holes:       {type: 'int',    default: 180},
    holeSize:    {type: 'number', default: 0.010}, // UV fraction (~0.01 = tiny)
    // Hole rendering mode:
    // - 'cutout': real holes via alphaTest (can shimmer at distance)
    // - 'blend' : soft transparency via alphaMap (stable, but not a hard cut)
    // - 'none'  : no actual cutouts (prevents '+' artifacts completely)
    holeMode:    {type: 'string', default: 'none'},
    beamMin:     {type: 'number', default: 3.0},
    beamMax:     {type: 'number', default: 14.0},
    beamRadius:  {type: 'number', default: 0.012},
    baseOpacity: {type: 'number', default: 0.16},
    blue:        {type: 'color',  default: '#7cc9ff'},
    white:       {type: 'color',  default: '#ffffff'},
    flicker:     {type: 'number', default: 1.2},
    wobble:      {type: 'number', default: 0.020},

    // Cinematic controls
    innerFrac:   {type: 'number', default: 0.40}, // portion of radius used as “internal spill” length
    spillBoost:  {type: 'number', default: 1.35}, // inner beam opacity multiplier
    glowBoost:   {type: 'number', default: 1.15}, // hole-glow / core-glow multiplier
    lightCount:  {type: 'int',    default: 10},   // max spotlights
    lightAngle:  {type: 'number', default: 0.12}, // radians (small to avoid giant wall blobs)
    lightReach:  {type: 'number', default: 62}    ,

    // Impact dots (a soft projected hotspot where beams hit geometry)
    impactDots: {type: 'boolean', default: true},
    impactSize: {type: 'number',  default: 0.65},
    impactOpacity: {type: 'number', default: 0.22},
    impactEveryMs: {type: 'number', default: 90},
// distance
  },

  init: function () {
    this._up = new THREE.Vector3(0, 1, 0);
    this._dirs = [];
    this._beams = [];

    // Build a soft radial texture for impact dots.
    (function buildImpactTexture(self){
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(128,128,0, 128,128,128);
      g.addColorStop(0.0, 'rgba(255,255,255,1.0)');
      g.addColorStop(0.18,'rgba(255,255,255,0.65)');
      g.addColorStop(0.45,'rgba(140,200,255,0.22)');
      g.addColorStop(1.0, 'rgba(0,0,0,0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,256,256);
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      self._impactTex = tex;
      self._impactMat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        depthWrite: false,
        depthTest: true,
        blending: THREE.AdditiveBlending
      });
      self._impactGeo = new THREE.PlaneGeometry(1,1,1,1);
      // Root that holds all impact planes (world space).
      self._impactRoot = new THREE.Group();
      self._impactRoot.renderOrder = 999;
      if (self.el.sceneEl && self.el.sceneEl.object3D) self.el.sceneEl.object3D.add(self._impactRoot);
    })(this);

    this._spots = [];
    this._group = new THREE.Group();
    this.el.object3D.add(this._group);

    this._cBlue  = new THREE.Color(this.data.blue);
    this._cWhite = new THREE.Color(this.data.white);

    this._shellEl = this.el.querySelector('#sphere_shell');
    this._coreLightEl = this.el.querySelector('#sphere_core_light');
    this._coreFlameEl = this.el.querySelector('#sphere_core_flame');

    // Textures
    this._beamTex = this._makeBeamTexture();
    this._exitTex = this._makeExitTexture();
    this._ringTex = this._makeRingTexture();
    this._spotCookie = this._makeSpotCookie();

    // Add a faint additive “core haze” so the beams feel like spills from a flame.
    const glowGeo = new THREE.SphereGeometry(this.data.radius * 0.56, 32, 20);
    this._coreGlowMat = new THREE.MeshBasicMaterial({
      color: this._cWhite.clone(),
      transparent: true,
      opacity: 0.18,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      side: THREE.DoubleSide
    });
    this._coreGlow = new THREE.Mesh(glowGeo, this._coreGlowMat);
    this._coreGlow.renderOrder = 25;
    this._group.add(this._coreGlow);

    const tryBuild = () => {
      if (this._built) return;
      if (!this._shellEl) return;

      const obj = this._shellEl.getObject3D('mesh');
      if (!obj) return;

      this._built = true;
      this._shellObj = obj;

      this._buildDirs();
      this._applyPerforationTextures(obj);
      this._buildBeams();
      this._buildSpots();
    };

    if (this._shellEl) {
      this._shellEl.addEventListener('object3dset', tryBuild);
      setTimeout(tryBuild, 0);
    }
  },

  remove: function () {
    if (this._group && this._group.parent) this._group.parent.remove(this._group);
    this._beams.length = 0;
    this._spots.length = 0;
  },

  _buildDirs: function () {
    const n = Math.max(12, this.data.holes | 0);
    const inc = Math.PI * (3 - Math.sqrt(5));
    const off = 2 / n;

    this._dirs.length = 0;
    for (let i = 0; i < n; i++) {
      const y = i * off - 1 + (off / 2);
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const phi = i * inc;
      const x = Math.cos(phi) * r;
      const z = Math.sin(phi) * r;
      this._dirs.push(new THREE.Vector3(x, y, z).normalize());
    }
  },

  _makeBeamTexture: function () {
    const W = 64, H = 512;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');

    const img = g.createImageData(W, H);
    const cx = (W - 1) / 2;
    const sigma = W * 0.26;

    for (let y = 0; y < H; y++) {
      const t = y / (H - 1);
      const hot = Math.exp(-t * 10.0); // strong near-emitter haze
      // Soft near-emitter lift (avoid crisp "+" when the crossed beam cards are edge-on)
      const startCap = Math.exp(-Math.pow(t / 0.030, 2.0));
      const lenFade = (0.08 * Math.pow(1 - t, 7.0) + 0.92 * hot) * (0.40 + 0.60 * startCap);
      // (No hard step at the hole — prevents tiny bright throats from popping without a readable shaft)

      for (let x = 0; x < W; x++) {
        const dx = x - cx;
        const radial = Math.exp(-(dx * dx) / (2 * sigma * sigma));
        const a = Math.min(1, radial * lenFade);
        const idx = (y * W + x) * 4;
        img.data[idx + 0] = 255;
        img.data[idx + 1] = 255;
        img.data[idx + 2] = 255;
        img.data[idx + 3] = Math.floor(255 * a);
      }
    }
    g.putImageData(img, 0, 0);

    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    // IMPORTANT: Canvas textures are uploaded with flipY=true by default in three.js,
    // which inverts our along-beam gradient (making the end look hotter than the hole).
    // For beams we want V=0 at the emitter (hole) to match canvas Y=0.
    tex.flipY = false;
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.anisotropy = 4;
    return tex;
  },

  _makeExitTexture: function () {
    const S = 128;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');

    g.clearRect(0, 0, S, S);
    const grd = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    grd.addColorStop(0.00, 'rgba(255,255,255,1.0)');
    grd.addColorStop(0.20, 'rgba(210,240,255,0.55)');
    grd.addColorStop(0.55, 'rgba(110,200,255,0.16)');
    grd.addColorStop(1.00, 'rgba(0,0,0,0.0)');
    g.fillStyle = grd;
    g.beginPath();
    g.arc(S/2, S/2, S/2, 0, Math.PI * 2);
    g.fill();

    const tex = new THREE.CanvasTexture(c);
    // Disable mipmaps: tiny additive sprites can shimmer/pixel-pop (often reading as a '+') when minified.
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  },


  _makeRingTexture: function () {
    // A hollow ring (annulus) so the "hole rim" glow is always tied to a beam (no texture-only dots).
    const S = 128;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');

    g.clearRect(0, 0, S, S);

    const cx = S / 2, cy = S / 2;
    const rOuter = S * 0.48;
    const rInner = S * 0.22;

    const grd = g.createRadialGradient(cx, cy, rInner * 0.55, cx, cy, rOuter);
    grd.addColorStop(0.00, 'rgba(0,0,0,0.0)');
    grd.addColorStop((rInner / rOuter) * 0.92, 'rgba(0,0,0,0.0)');
    grd.addColorStop((rInner / rOuter) * 1.02, 'rgba(255,255,255,0.95)');
    grd.addColorStop(0.52, 'rgba(210,240,255,0.55)');
    grd.addColorStop(0.78, 'rgba(110,200,255,0.14)');
    grd.addColorStop(1.00, 'rgba(0,0,0,0.0)');

    g.fillStyle = grd;
    g.beginPath();
    g.arc(cx, cy, rOuter, 0, Math.PI * 2);
    g.fill();

    // Punch the center to keep it reading as a perforation, not a blob.
    g.globalCompositeOperation = 'destination-out';
    g.beginPath();
    g.arc(cx, cy, rInner, 0, Math.PI * 2);
    g.fill();
    g.globalCompositeOperation = 'source-over';

    const tex = new THREE.CanvasTexture(c);
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  },


  _makeSpotCookie: function () {
    // Small, tight cookie so the “beam hit” feels like a focused spill, not a huge circle.
    const S = 128;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');

    g.clearRect(0, 0, S, S);
    const grd = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    grd.addColorStop(0.00, 'rgba(255,255,255,1.0)');
    grd.addColorStop(0.18, 'rgba(255,255,255,0.85)');
    grd.addColorStop(0.40, 'rgba(255,255,255,0.35)');
    grd.addColorStop(1.00, 'rgba(0,0,0,0.0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, S, S);

    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearMipMapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  },
  _applyPerforationTextures: function (rootObj) {
  const W = 1024, H = 512;
  const cA = document.createElement('canvas');
  cA.width = W; cA.height = H;
  const gA = cA.getContext('2d');

  // Alpha: opaque shell.
  gA.fillStyle = '#ffffff';
  gA.fillRect(0, 0, W, H);

  // Hole radius in pixels (kept stable so every hole is truly "open").
  const holePx = Math.max(1.2, this.data.holeSize * H * 1.9);

  const drawAt = (x, y) => {
    gA.fillStyle = '#000000';
    gA.beginPath();
    gA.arc(x, y, holePx, 0, Math.PI * 2);
    gA.fill();
  };

  // Punch holes ONLY where we spawn beams (1:1 correlation, no glow texture artifacts).
  for (let i = 0; i < this._dirs.length; i++) {
    const d = this._dirs[i];
    const u = 0.5 + Math.atan2(d.z, d.x) / (2 * Math.PI);
    const v = 0.5 - Math.asin(d.y) / Math.PI;
    const x = Math.floor(u * W);
    const y = Math.floor(v * H);

    drawAt(x, y);

    // Seam wrap (avoid clipped hole near U=0/1)
    if (x < holePx) drawAt(x + W, y);
    if (x > W - holePx) drawAt(x - W, y);
  }

  const alphaTex = new THREE.CanvasTexture(cA);
  alphaTex.wrapS = THREE.RepeatWrapping;
  alphaTex.wrapT = THREE.ClampToEdgeWrapping;
  alphaTex.generateMipmaps = false;
  alphaTex.minFilter = THREE.NearestFilter;
  alphaTex.magFilter = THREE.NearestFilter;
  alphaTex.anisotropy = 2;

  this._shellMats = [];

  rootObj.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = false;
    o.receiveShadow = false;

    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach((m) => {
      if (!m) return;

      const hm = this.data.holeMode;
      if (hm === 'cutout') {
        m.transparent = false;
        m.alphaMap = alphaTex;
        m.alphaTest = 0.62;
        m.alphaToCoverage = false;
      } else if (hm === 'blend') {
        m.transparent = true;
        m.alphaMap = alphaTex;
        m.alphaTest = 0.0;
        m.alphaToCoverage = true;
        m.depthWrite = true;
      } else {
        m.transparent = false;
        m.alphaMap = null;
        m.alphaTest = 0.0;
        m.alphaToCoverage = false;
      }
      m.side = THREE.FrontSide;

      // Remove emissive-map glow entirely; rim glow is now per-beam sprites so we never have "dots without beams".
      if (m.isMeshStandardMaterial) {
        m.emissiveMap = null;
        m.emissive = new THREE.Color('#000000');
        m.emissiveIntensity = 0.0;
      }

      m.needsUpdate = true;
      this._shellMats.push(m);
    });
  });

  this._alphaTex = alphaTex;
},

  _makeTaperPlane: function (wStart, wEnd) {
  // Plane centered at origin, height = 1 (Y).
  // Width tapers from bottom(-0.5) to top(+0.5).
  const g = new THREE.BufferGeometry();

  const hs = 0.5;
  const x0 = wStart * 0.5;
  const x1 = wEnd * 0.5;

  const positions = new Float32Array([
    -x0, -hs, 0,
     x0, -hs, 0,
    -x1,  hs, 0,
     x1,  hs, 0
  ]);

  const uvs = new Float32Array([
    0, 0,
    1, 0,
    0, 1,
    1, 1
  ]);

  const indices = [0, 2, 1, 2, 3, 1];

  g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
},

_buildBeams: function () {
  // Each beam (and its room light) is anchored at a tiny perforation on the shell.
  // Outer shaft spills *out* from the hole; inner spill runs *inward* to imply an internal flame feeding it.
  const br = this.data.beamRadius;

  // Make the beam truly feel like it is *collimated by a tiny hole*:
  // very tight at the emitter, then blooming outward.
  const geoOuter = this._makeTaperPlane(br * 1.25,  br * 12.0); // tiny at hole → wider
  const geoInner = this._makeTaperPlane(br * 22.0,  br * 1.25); // wider in core → tiny at hole
  const geoThroat = this._makeTaperPlane(br * 1.6,  br * 5.5); // bright short throat right at the perforation

  this._beams.length = 0;

  // Anchor exactly on (and just a hair outside) the shell so the first visible pixels sit on the perforation.
  const rHole = this.data.radius * 1.0006;
  for (let i = 0; i < this._dirs.length; i++) {
    const dir = this._dirs[i];
    const phase = Math.random() * Math.PI * 2;
    const rand = 0.65 + Math.random() * 0.55;

    const outerMat = new THREE.MeshBasicMaterial({
      color: this._cBlue.clone(),
      map: this._beamTex,
      alphaMap: this._beamTex,
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      fog: true,
      side: THREE.DoubleSide,
      dithering: true
    });

    const innerMat = new THREE.MeshBasicMaterial({
      color: this._cWhite.clone(),
      map: this._beamTex,
      alphaMap: this._beamTex,
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      fog: true,
      side: THREE.DoubleSide,
      dithering: true
    });

    // Anchor at the hole position on the shell.
    const holePos = dir.clone().multiplyScalar(rHole);

    const g = new THREE.Group();
    g.position.copy(holePos);

    // Local +Y points outward along the beam direction.
    const baseQuat = new THREE.Quaternion().setFromUnitVectors(this._up, dir);
    g.quaternion.copy(baseQuat);

    // Inner segment (inside sphere): spill from flame toward the hole (negative Y).
    const innerG = new THREE.Group();
    const in1 = new THREE.Mesh(geoInner, innerMat);
    const in2 = new THREE.Mesh(geoInner, innerMat);
    in2.rotation.y = Math.PI / 2;
    innerG.add(in1); innerG.add(in2);

    // Outer segment (outside sphere): the visible shaft (positive Y).
    const outerG = new THREE.Group();
    const out1 = new THREE.Mesh(geoOuter, outerMat);
    const out2 = new THREE.Mesh(geoOuter, outerMat);
    out2.rotation.y = Math.PI / 2;
    outerG.add(out1); outerG.add(out2);

    // Short bright "throat" segment right at the hole so the beam visually starts from the perforation.
    const throatMat = new THREE.MeshBasicMaterial({
      color: this._cWhite.clone(),
      map: this._beamTex,
      alphaMap: this._beamTex,
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      fog: true,
      side: THREE.DoubleSide,
      dithering: true
    });
    const throatG = new THREE.Group();
    const th1 = new THREE.Mesh(geoThroat, throatMat);
    const th2 = new THREE.Mesh(geoThroat, throatMat);
    th2.rotation.y = Math.PI / 2;
    throatG.add(th1); throatG.add(th2);

    // Exit sparkle lives exactly at the hole (the emitter).
    const sprMat = new THREE.SpriteMaterial({
      map: this._exitTex,
      color: this._cWhite.clone(),
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true
    });
    const exit = new THREE.Sprite(sprMat);
    // Keep the vent sparkle very small so it reads as a *pin-hole* emitter.
    exit.scale.set(0.016, 0.016, 0.016);
    exit.position.set(0, 0.002, 0); // tiny nudge outward to avoid z-fighting

    // Rim ring glow is a per-beam sprite so it is guaranteed to match a beam (no texture-only dots).
    const ringMat = new THREE.SpriteMaterial({
      map: this._ringTex,
      color: this._cWhite.clone(),
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true
    });
    const ring = new THREE.Sprite(ringMat);
    ring.scale.set(0.050, 0.050, 0.050);
    ring.position.set(0, 0.0016, 0);

    const cards = new THREE.Group();
    cards.add(innerG);
    cards.add(outerG);
    cards.add(throatG);

    g.add(cards);
    g.add(ring);
    g.add(exit);

    this._group.add(g);

    this._beams.push({ obj: g, holePos,
      cards: cards,
      innerObj: innerG,
      outerObj: outerG,
      throatObj: throatG,
      innerMat,
      outerMat,
      throatMat,
      exit,
      exitMat: sprMat,
      ring,
      ringMat,
      dir: dir.clone(),
      baseQuat,
      phase,
      rand,
      spot: null,
      spotTarget: null
    });
  }
},

_buildSpots: function () {
  // Create a small number of real spotlights that are physically attached to selected holes,
  // so the cave lighting is *literally* emitted from the same places as the beams.
  const n = this._beams.length;
  if (!n) return;

  const count = Math.min(this.data.lightCount, Math.max(6, Math.floor(n / 14)));
  this._spots.length = 0;

  for (let i = 0; i < count; i++) {
    const idx = Math.floor(((i + 0.25) / count) * n);
    const b = this._beams[idx];
    if (!b) continue;

    const spot = new THREE.SpotLight(this._cBlue.clone(), 0.0, this.data.lightReach, this.data.lightAngle, 0.78, 2);
    spot.castShadow = false;
    spot.map = this._spotCookie; // cookie (ignored safely if unsupported)

    // Position just outside the hole, pointing outward.
    spot.position.set(0, 0.06, 0);

    const target = new THREE.Object3D();
    target.position.set(0, Math.min(this.data.lightReach * 0.82, 48), 0);

    // Attach to the same anchor as the beam.
    b.obj.add(spot);
    b.obj.add(target);
    spot.target = target;

    b.spot = spot;
    b.spotTarget = target;
    this._spots.push({ idx, spot, target });
  }
},

  tick: function (time) {
  if (!this._built) return;
  const t = (time || 0) / 1000;

  // Slow “breath” for the internal flame.
  const core =
    0.86 +
    0.10 * Math.sin(t * 0.18) +
    0.07 * Math.sin(t * 0.43 + 1.7) +
    0.04 * Math.sin(t * 0.11 + 0.4);

  const coreN = THREE.MathUtils.clamp(core, 0.55, 1.10);

  // Camera position (used to billboard the beam cards so shafts don't disappear edge-on).
  const cam = (this.el.sceneEl && this.el.sceneEl.camera) ? this.el.sceneEl.camera : null;
  if (cam) {
    if (!this._camPos) this._camPos = new THREE.Vector3();
    cam.getWorldPosition(this._camPos);

    // Reusable temporaries (avoid per-frame allocations).
    if (!this._tmpV1) {
      this._tmpV1 = new THREE.Vector3();
      this._tmpV2 = new THREE.Vector3();
      this._tmpV3 = new THREE.Vector3();
      this._tmpQ1 = new THREE.Quaternion();
      this._tmpQ2 = new THREE.Quaternion();
    }
  }

    // Cache viewport height for projected-size gating (avoid subpixel '+' sparkles).
    if (this.el.sceneEl && this.el.sceneEl.renderer) {
      if (!this._vp) this._vp = new THREE.Vector2();
      this.el.sceneEl.renderer.getSize(this._vp);
      this._vpH = this._vp.y || 1;
    } else {
      this._vpH = 1;
    }
    this._tanHalfFov = (cam.isPerspectiveCamera && cam.fov) ? Math.tan(THREE.MathUtils.degToRad(cam.fov * 0.5)) : 1.0;


  // Core point light stays subtle (hole-attached spots do most of the room response).
  if (this._coreLightEl) {
    const lightObj = this._coreLightEl.getObject3D('light');
    if (lightObj) {
      // Let the core contribute to the room (subtle baseline + breathing), while the hole-attached spots remain the main read.
      lightObj.intensity = 7.0 + 4.0 * coreN;
    }
  }

  // Flame breath (gentle).
  if (this._coreFlameEl && this._coreFlameEl.object3D) {
    const s = 1.0 + 0.035 * Math.sin(t * 0.95) + 0.018 * Math.sin(t * 2.1 + 0.9);
    this._coreFlameEl.object3D.scale.set(s, s, s);
  }

  // Core haze makes the whole system feel like a contained source.
  if (this._coreGlowMat) {
    this._coreGlowMat.opacity = (0.15 + 0.16 * coreN) * this.data.glowBoost;
    this._coreGlowMat.color.copy(this._cWhite).lerp(this._cBlue, 0.24);
  }

  // Hole lip glow (the emitters).
  if (this._shellMats && this._shellMats.length) {
    const ei = (0.30 + 1.05 * coreN) * this.data.glowBoost;
    for (let k = 0; k < this._shellMats.length; k++) {
      const m = this._shellMats[k];
      if (m && m.isMeshStandardMaterial && m.emissiveMap) m.emissiveIntensity = ei;
    }
  }

  const wob = this.data.wobble;
  const flick = this.data.flicker;

  for (let i = 0; i < this._beams.length; i++) {
    const b = this._beams[i];

    // Gentle per-hole variation (no strobe).
    const local = 0.82 + 0.18 * Math.sin((t * (0.16 + 0.07 * b.rand) * flick) + b.phase);
    const intensity = THREE.MathUtils.clamp(coreN * local, 0.0, 1.20);
    // Visual floor: ensures every visible perforation has a readable shaft.
    const intensityV = Math.max(intensity, 0.55);
    b._lastI = intensityV;

    const wRaw = THREE.MathUtils.smoothstep(intensityV, 0.28, 1.05);
    // Hard gate the very lowest values so we never get tiny bright "+" throats without a readable shaft.
    const w = (wRaw < 0.07) ? 0.0 : wRaw;
    b._lastW = w;
    if (b.cards) b.cards.visible = (w > 0.0);

    // View-alignment gate: when we look almost exactly along a beam axis, card-based shafts collapse
    // into a tiny '+'/sparkle at the emitter due to minification. In that narrow case, fade the *entire* emitter.
    let viewGate = 1.0;
    if (cam) {
      b.obj.getWorldPosition(this._tmpV1);
      this._tmpV2.copy(this._camPos).sub(this._tmpV1);
      if (this._tmpV2.lengthSq() > 1e-6) {
        this._tmpV2.normalize();
        b.obj.getWorldQuaternion(this._tmpQ1);
        const beamDirW = this._tmpV3.set(0, 1, 0).applyQuaternion(this._tmpQ1).normalize();
        const along = Math.abs(beamDirW.dot(this._tmpV2));
        // 1 when not aligned, 0 when almost perfectly aligned.
        viewGate = 1.0 - THREE.MathUtils.smoothstep(along, 0.970, 0.995);
      }
    }


    const outerLen = THREE.MathUtils.lerp(this.data.beamMin, this.data.beamMax, w) * (0.92 + 0.22 * b.rand);

    // Inner spill length: longer when stronger, always inside.
    const innerLen = Math.max(0.35, this.data.radius * this.data.innerFrac * (0.85 + 0.95 * w));

    // Opacity
    const opOuter = (this.data.baseOpacity * intensityV * 1.75 * w * viewGate) * 2.00;
    const opInner = (this.data.baseOpacity * intensityV * this.data.spillBoost * 0.70 * w * viewGate) * 2.00;

    b.outerMat.opacity = opOuter;
    b.innerMat.opacity = opInner;

    // Color: inner is whiter (flame), outer drifts to blue.
    b.innerMat.color.copy(this._cWhite).lerp(this._cBlue, 0.14);
    b.outerMat.color.copy(this._cBlue).lerp(this._cWhite, 0.35 * w);

    // Thickness scale (geometry is already tapered).
    const thickOuter = 0.90 + 0.24 * w;
    const thickInner = 1.05 + 0.45 * w;

    // IMPORTANT CONCEPT:
    // The emitter is the HOLE (local origin). Outer starts at y=0 and goes outward.
    b.outerObj.scale.set(thickOuter, outerLen, thickOuter);
    b.outerObj.position.set(0, outerLen * 0.5, 0);

    // Throat: a short, brighter segment right at the perforation so the beam reads as starting at the hole.
    if (b.throatObj) {
      const throatLen = 0.22 + 0.55 * w; // meters-ish
      const thickThroat = thickOuter * 1.9;
      b.throatObj.scale.set(thickThroat, throatLen, thickThroat);
      b.throatObj.position.set(0, throatLen * 0.5 + 0.004, 0); // tiny push outward to avoid depth clipping
      if (b.throatMat) {
        b.throatMat.opacity = THREE.MathUtils.clamp(opOuter * 3.2, 0.0, 0.88);
        b.throatMat.color.copy(this._cWhite).lerp(this._cBlue, 0.20);
      }
    }

    // Inner runs inward from the same hole (negative y).
    b.innerObj.scale.set(thickInner, innerLen, thickInner);
    b.innerObj.position.set(0, -innerLen * 0.5, 0);

    // Exit sparkle: tiny bright vent.
    const spark = THREE.MathUtils.smoothstep(w, 0.12, 0.30);
    // Keep the exit sparkle matched to the hole scale.
    const ex = 0.020 + 0.055 * w;

    // Projected-size gate: if the sprite is sub-pixel, it will shimmer/popup as a '+' when additive.
    // Hide it entirely below a small screen threshold.
    let exGate = 1.0;
    if (cam && this._tanHalfFov && this._vpH) {
      // Distance from camera to beam origin (close enough for the emitter).
      b.obj.getWorldPosition(this._tmpV1);
      const dist = this._camPos.distanceTo(this._tmpV1);
      const pix = (dist > 1e-3) ? (ex / dist) * (this._vpH / (2.0 * this._tanHalfFov)) : 999.0;
      exGate = THREE.MathUtils.smoothstep(pix, 1.2, 2.2); // 0 below ~1.2px, 1 above ~2.2px
    }

    b.exitMat.opacity = THREE.MathUtils.clamp(1.25 * w * w * w, 0.0, 1.0) * (0.35 + 0.65 * intensityV) * spark * viewGate * exGate;
    b.exit.visible = (b.exitMat.opacity > 0.002);
    b.exit.scale.set(ex, ex, ex);

    // Rim ring glow: tied to the same beam intensity (so no ring without a beam).
    if (b.ringMat && b.ring) {
      b.ringMat.opacity = THREE.MathUtils.clamp(1.05 * w * w * w, 0.0, 1.0) * (0.30 + 0.70 * intensityV) * spark * viewGate;
      b.ringMat.opacity *= exGate;
      b.ring.visible = (b.ringMat.opacity > 0.002);
      const rs = 0.040 + 0.090 * w;
      b.ring.scale.set(rs, rs, rs);
    }

    // Poetic drift: rotate around a perpendicular axis, but keep anchored at the hole.
    if (wob > 0.0001) {
      let perp = new THREE.Vector3().crossVectors(b.dir, this._up);
      if (perp.lengthSq() < 1e-4) perp = new THREE.Vector3(1, 0, 0);
      perp.normalize();
      const ang = wob * Math.sin(t * 0.10 + b.phase);
      const q = new THREE.Quaternion().setFromAxisAngle(perp, ang);
      b.obj.quaternion.copy(b.baseQuat).multiply(q);
    } else {
      b.obj.quaternion.copy(b.baseQuat);
    }

    // Billboard the beam cards around the beam axis (local Y) so a shaft is always visible
    // even when the beam points toward/away from the camera (prevents "hole dots" without beams).
    if (cam && b.cards) {
      b.obj.getWorldPosition(this._tmpV1);
      this._tmpV2.copy(this._camPos).sub(this._tmpV1);
      if (this._tmpV2.lengthSq() > 1e-6) {
        this._tmpV2.normalize();
        b.obj.getWorldQuaternion(this._tmpQ1);
        this._tmpQ2.copy(this._tmpQ1).invert();
        this._tmpV3.copy(this._tmpV2).applyQuaternion(this._tmpQ2);
        this._tmpV3.y = 0;
        if (this._tmpV3.lengthSq() > 1e-6) {
          this._tmpV3.normalize();
          const ang = Math.atan2(this._tmpV3.x, this._tmpV3.z);
          b.cards.rotation.y = ang;

      // If we're looking almost exactly along the beam direction, cards can collapse into a '+' at the emitter.
      // Fade them out in that narrow case (the volumetric feel is preserved by other beams).
      const beamDirW = new THREE.Vector3(0, 1, 0).applyQuaternion(this._tmpQ1).normalize();
      const viewDirW = this._tmpV2; // already normalized (camPos - beamPos)
      const along = Math.abs(beamDirW.dot(viewDirW));
      if (along > 0.985) b.cards.visible = false;
      else if (w > 0.0) b.cards.visible = true;
        }
      }
    }

    // If this beam owns a real spotlight, drive it from the same intensity.
    if (b.spot) {
      const roomI = intensity * intensity;
      // Stronger, more realistic spill in the room, still driven by the same hole intensity.
      b.spot.intensity = (0.80 + 14.0 * roomI) * 2.00;
      b.spot.color.copy(this._cBlue).lerp(this._cWhite, 0.35 * w);
    }
  }
}
});

/* -------------------------------------------------------------------------
   sphere-hole-beams
   - Fake "volumetric" shafts using additive cone/cylinder meshes.
   - Beams originate on the sphere surface (as if through perforations),
     biased slightly downward to read like a "forest of light".
   - Animated with smooth noise (no loop snaps).
--------------------------------------------------------------------------- */
AFRAME.registerComponent('sphere-hole-beams', {
  schema: {
    count:       {type: 'int',    default: 60},
    radius:      {type: 'number', default: 1.5},
    minLen:      {type: 'number', default: 2.5},
    maxLen:      {type: 'number', default: 10.0},
    baseOpacity: {type: 'number', default: 0.25},
    blue:        {type: 'color',  default: '#7cc9ff'},
    white:       {type: 'color',  default: '#ffffff'},
    jitter:      {type: 'number', default: 0.06},  // radians
    downBias:    {type: 'number', default: 0.65},  // 0..1 (more = more downward)
    flicker:     {type: 'number', default: 1.35}   // speed multiplier
  },

  init: function () {
    this._group = new THREE.Group();
    this.el.object3D.add(this._group);

    this._up = new THREE.Vector3(0, 1, 0);
    this._down = new THREE.Vector3(0, -1, 0);

    this._cBlue  = new THREE.Color(this.data.blue);
    this._cWhite = new THREE.Color(this.data.white);

    // A unit-height cylinder that we'll scale on Y to set the beam length.
    // Open-ended so it reads like a light volume, not a solid rod.
    this._beamGeo = new THREE.CylinderGeometry(0.035, 0.22, 1.0, 12, 1, true);
    this._dotGeo  = new THREE.SphereGeometry(0.045, 10, 10);

    this._beams = [];

    // Build a soft radial texture for impact dots.
    (function buildImpactTexture(self){
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(128,128,0, 128,128,128);
      g.addColorStop(0.0, 'rgba(255,255,255,1.0)');
      g.addColorStop(0.18,'rgba(255,255,255,0.65)');
      g.addColorStop(0.45,'rgba(140,200,255,0.22)');
      g.addColorStop(1.0, 'rgba(0,0,0,0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,256,256);
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      self._impactTex = tex;
      self._impactMat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        depthWrite: false,
        depthTest: true,
        blending: THREE.AdditiveBlending
      });
      self._impactGeo = new THREE.PlaneGeometry(1,1,1,1);
      // Root that holds all impact planes (world space).
      self._impactRoot = new THREE.Group();
      self._impactRoot.renderOrder = 999;
      if (self.el.sceneEl && self.el.sceneEl.object3D) self.el.sceneEl.object3D.add(self._impactRoot);
    })(this);

    this._spots = [];

    const N = Math.max(6, this.data.count|0);
    for (let i = 0; i < N; i++) {
      const seed = this._hash(i + 13.37);

      // Fibonacci-ish distribution on a sphere, then bias to keep more points on lower hemisphere.
      const u = (i + 0.5) / N;
      const v = this._fract(seed * 1.618);
      const theta = 2.0 * Math.PI * v;
      // y in [-1..1] with a bias toward -1 (lower hemisphere)
      let y = 1.0 - 2.0 * u;
      y = (y * 0.65) - 0.35; // push downward
      y = THREE.MathUtils.clamp(y, -0.98, 0.65);
      const r = Math.sqrt(Math.max(0.0001, 1.0 - y*y));
      const normal = new THREE.Vector3(Math.cos(theta) * r, y, Math.sin(theta) * r).normalize();

      // Beam direction: blend between outward normal and downward vector.
      const dir = normal.clone().multiplyScalar(1.0 - this.data.downBias)
        .add(this._down.clone().multiplyScalar(this.data.downBias))
        .normalize();

      const len = THREE.MathUtils.lerp(this.data.minLen, this.data.maxLen, this._fract(seed * 7.31));
      const basePos = normal.clone().multiplyScalar(this.data.radius * 0.985); // slightly inside the shell
      const midPos  = basePos.clone().add(dir.clone().multiplyScalar(len * 0.5));

      const mat = new THREE.MeshBasicMaterial({
        color: this._cBlue.clone(),
        transparent: true,
        opacity: this.data.baseOpacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: true,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(this._beamGeo, mat);
      mesh.renderOrder = 30;

      // Align cylinder Y axis with dir
      mesh.quaternion.setFromUnitVectors(this._up, dir);
      mesh.position.copy(midPos);
      mesh.scale.set(1, len, 1);

      // A small "hole glow" dot at the exit point.
      const dotMat = new THREE.MeshBasicMaterial({
        color: this._cWhite.clone(),
        transparent: true,
        opacity: 0.55,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: true
      });
      const dot = new THREE.Mesh(this._dotGeo, dotMat);
      dot.renderOrder = 31;
      dot.position.copy(basePos);

      this._group.add(mesh);
      this._group.add(dot);

      this._beams.push({
        seed,
        normal,
        dir,
        basePos,
        lenBase: len,
        mesh,
        dot
      });
    }
  },

  remove: function () {
    if (this._group && this.el.object3D) this.el.object3D.remove(this._group);
    this._beams = [];

    // Build a soft radial texture for impact dots.
    (function buildImpactTexture(self){
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(128,128,0, 128,128,128);
      g.addColorStop(0.0, 'rgba(255,255,255,1.0)');
      g.addColorStop(0.18,'rgba(255,255,255,0.65)');
      g.addColorStop(0.45,'rgba(140,200,255,0.22)');
      g.addColorStop(1.0, 'rgba(0,0,0,0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,256,256);
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      self._impactTex = tex;
      self._impactMat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        depthWrite: false,
        depthTest: true,
        blending: THREE.AdditiveBlending
      });
      self._impactGeo = new THREE.PlaneGeometry(1,1,1,1);
      // Root that holds all impact planes (world space).
      self._impactRoot = new THREE.Group();
      self._impactRoot.renderOrder = 999;
      if (self.el.sceneEl && self.el.sceneEl.object3D) self.el.sceneEl.object3D.add(self._impactRoot);
    })(this);

    this._spots = [];
    this._group = null;
  },

  tick: function (time, timeDelta) {
    if (!this._beams || !this._beams.length) return;

    const t = (time || 0) * 0.001;
    const sp = this.data.flicker;

    for (let i = 0; i < this._beams.length; i++) {
      const b = this._beams[i];

      // Smooth pseudo-noise
      const n1 = 0.5 + 0.5 * Math.sin((t * (0.9 * sp)) + b.seed * 12.7);
      const n2 = 0.5 + 0.5 * Math.sin((t * (1.4 * sp)) + b.seed * 31.3);

      const intensity = THREE.MathUtils.clamp(0.55 * n1 + 0.45 * n2, 0, 1);

      // Opacity + color shift blue <-> white
      const op = this.data.baseOpacity * THREE.MathUtils.lerp(0.55, 1.35, intensity);
      b.mesh.material.opacity = op;
      b.dot.material.opacity  = THREE.MathUtils.lerp(0.25, 0.75, intensity);

      b.mesh.material.color.copy(this._cBlue).lerp(this._cWhite, intensity * 0.55);
      b.dot.material.color.copy(this._cWhite).lerp(this._cBlue, 0.10);

      // Length breathe
      const len = b.lenBase * THREE.MathUtils.lerp(0.82, 1.18, intensity);
      b.mesh.scale.y = len;

      // Direction micro-jitter (rotate slightly around an axis perpendicular to dir)
      const j = this.data.jitter * (intensity - 0.5);
      const axis = new THREE.Vector3(-b.dir.z, 0.0, b.dir.x).normalize();
      const q = new THREE.Quaternion().setFromAxisAngle(axis, j);
      const dirJ = b.dir.clone().applyQuaternion(q).normalize();

      b.mesh.quaternion.setFromUnitVectors(this._up, dirJ);

      // Recompute positions so the base stays pinned to the sphere surface
      const midPos = b.basePos.clone().add(dirJ.multiplyScalar(len * 0.5));
      b.mesh.position.copy(midPos);
      b.dot.position.copy(b.basePos);
    }
  },

  _fract: function (x) {
    return x - Math.floor(x);
  },

  _hash: function (x) {
    // deterministic pseudo-random in [0..1)
    const s = Math.sin(x * 127.1) * 43758.5453123;
    return this._fract(s);
  }
});


AFRAME.registerComponent('equator-gap-clip', {
  schema: {
    thetaStart: {type: 'number', default: 80},  // degrees from +Y down
    thetaEnd:   {type: 'number', default: 100}  // degrees from +Y down
  },

  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    this._apply();
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._apply);
  },

  update: function () {
    this._updateUniforms();
  },

  _apply: function (e) {
    if (e && e.detail && e.detail.type !== 'mesh') return;

    const root = this.el.getObject3D('mesh');
    if (!root) return;

    const self = this;

    const applyToMat = (mat) => {
      if (!mat || !mat.isMeshStandardMaterial || mat.userData.__equatorGapApplied) return;
      mat.userData.__equatorGapApplied = true;
      mat.userData.__equatorGapUniforms = null;

      const prevOnBeforeCompile = mat.onBeforeCompile;
      mat.onBeforeCompile = (shader) => {
        if (prevOnBeforeCompile) prevOnBeforeCompile(shader);
        shader.uniforms.uGapTheta = { value: new THREE.Vector2(
          self.data.thetaStart * Math.PI / 180,
          self.data.thetaEnd   * Math.PI / 180
        ) };
        mat.userData.__equatorGapUniforms = shader.uniforms;

        // Vertex: pass (displaced) local position.
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vGapLocalPos;')
          .replace('#include <begin_vertex>', '#include <begin_vertex>\nvGapLocalPos = transformed;')
          .replace('#include <displacementmap_vertex>', '#include <displacementmap_vertex>\nvGapLocalPos = transformed;');

        // Fragment: discard pixels inside the equatorial band.
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vGapLocalPos;\nuniform vec2 uGapTheta;')
          .replace(
            '#include <dithering_fragment>',
            `
            // --- equator gap clip ---
            vec3 pn = normalize(vGapLocalPos);
            float th = acos(clamp(pn.y, -1.0, 1.0)); // 0..PI
            if (th > uGapTheta.x && th < uGapTheta.y) discard;

            #include <dithering_fragment>
            `
          );
      };

      mat.needsUpdate = true;
    };

    root.traverse((o) => {
      if (!o.isMesh) return;
      const m = o.material;
      if (Array.isArray(m)) m.forEach(applyToMat);
      else applyToMat(m);
    });
  },

  _updateUniforms: function () {
    const root = this.el.getObject3D('mesh');
    if (!root) return;

    const a = this.data.thetaStart * Math.PI / 180;
    const b = this.data.thetaEnd   * Math.PI / 180;

    root.traverse((o) => {
      if (!o.isMesh) return;
      const mat = o.material;
      const mats = Array.isArray(mat) ? mat : [mat];
      mats.forEach((m) => {
        const u = m && m.userData && m.userData.__equatorGapUniforms;
        if (!u || !u.uGapTheta) return;
        u.uGapTheta.value.set(a, b);
      });
    });
  }
});


/* -------------------------------------------------------------------------
   pool-sheen-fresnel
   - Elegant "fake" pool contribution on the sphere underside WITHOUT extra
     transparent meshes (prevents sort flicker while walking around).
   - Injects a fresnel + vertical mask into the existing MeshStandardMaterial.
--------------------------------------------------------------------------- */
AFRAME.registerComponent('pool-sheen-fresnel', {
  schema: {
    color:        {type: 'color',  default: '#a8e5ff'},
    intensity:    {type: 'number', default: 0.55},
    fresnelPower: {type: 'number', default: 3.4},
    radius:       {type: 'number', default: 1.52}
  },

  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    this._apply();
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._apply);
  },

  update: function () {
    this._updateUniforms();
  },

  _apply: function (e) {
    if (e && e.detail && e.detail.type !== 'mesh') return;

    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;

    const applyToMat = (mat) => {
      if (!mat || mat.userData.__poolSheenApplied) return;
      mat.userData.__poolSheenApplied = true;
      mat.userData.__poolSheenUniforms = null;

      const self = this;
      const prevOnBeforeCompile = mat.onBeforeCompile;
      mat.onBeforeCompile = (shader) => {
        if (prevOnBeforeCompile) prevOnBeforeCompile(shader);
        shader.uniforms.uPoolSheenColor     = { value: new THREE.Color(self.data.color) };
        shader.uniforms.uPoolSheenIntensity = { value: self.data.intensity };
        shader.uniforms.uPoolSheenPower     = { value: self.data.fresnelPower };
        shader.uniforms.uPoolSheenRadius    = { value: self.data.radius };
        mat.userData.__poolSheenUniforms = shader.uniforms;

        // Vertex: pass local Y for underside mask.
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying float vPoolPosY;')
          .replace('#include <begin_vertex>', '#include <begin_vertex>\nvPoolPosY = position.y;');

        // Fragment: declare uniforms/varying.
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <common>',
          '#include <common>\n' +
          'varying float vPoolPosY;\n' +
          'uniform vec3 uPoolSheenColor;\n' +
          'uniform float uPoolSheenIntensity;\n' +
          'uniform float uPoolSheenPower;\n' +
          'uniform float uPoolSheenRadius;'
        );

        // Inject just before final output.
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <output_fragment>',
          `
          // --- pool sheen cheat (opaque; stable) ---
          float ndv_pool = clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0);
          float fres_pool = pow(1.0 - ndv_pool, uPoolSheenPower);

          float down_pool = clamp((-vPoolPosY) / max(uPoolSheenRadius, 0.0001), 0.0, 1.0);
          float vertical_pool = down_pool * down_pool * (3.0 - 2.0 * down_pool);

          // subtle breakup so it doesn't read as a perfect gradient
          float b = 0.92 + 0.08 * sin((vPoolPosY * 13.0) + (gl_FragCoord.x + gl_FragCoord.y) * 0.02);

          totalEmissiveRadiance += uPoolSheenColor * (uPoolSheenIntensity * fres_pool * vertical_pool * b);
          #include <output_fragment>
          `
        );
      };

      mat.needsUpdate = true;
    };

    mesh.traverse((o) => {
      if (!o.isMesh) return;
      const m = o.material;
      if (Array.isArray(m)) m.forEach(applyToMat);
      else applyToMat(m);
    });
  },

  _updateUniforms: function () {
    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;

    mesh.traverse((o) => {
      if (!o.isMesh) return;
      const mat = o.material;
      const mats = Array.isArray(mat) ? mat : [mat];
      mats.forEach((m) => {
        const u = m && m.userData && m.userData.__poolSheenUniforms;
        if (!u) return;
        u.uPoolSheenColor.value.set(this.data.color);
        u.uPoolSheenIntensity.value = this.data.intensity;
        u.uPoolSheenPower.value = this.data.fresnelPower;
        u.uPoolSheenRadius.value = this.data.radius;
      });
    });
  }
});


/* -------------------------------------------------------------------------
   rock-surface: apply the same PBR "rock" look used by rubble clusters
   to simple primitives (e.g., the pool rim / shoreline ring).
   - no external textures (works on file://)
   ------------------------------------------------------------------------- */
(function () {
  const CACHE = (window.__ROCK_SURFACE_CACHE = window.__ROCK_SURFACE_CACHE || {});

  function makeRockNormalTexture(seed, size) {
    size = size || 256;
    const key = `n_${seed}_${size}`;
    if (CACHE[key]) return CACHE[key];

    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const img = ctx.createImageData(size, size);
    const data = img.data;

    function hash(x, y) {
      let n = (x * 374761393 + y * 668265263 + (seed | 0) * 1447) | 0;
      n = (n ^ (n >> 13)) | 0;
      n = (n * 1274126177) | 0;
      return ((n ^ (n >> 16)) >>> 0) / 4294967296;
    }
    function fbm(x, y) {
      let v = 0, a = 0.55, f = 1.0;
      for (let i = 0; i < 4; i++) {
        v += a * (hash((x * f) | 0, (y * f) | 0) * 2 - 1);
        f *= 2.0; a *= 0.55;
      }
      return v;
    }

    // Height field
    const h = new Float32Array(size * size);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const nx = x / size, ny = y / size;
        h[y * size + x] = fbm(nx * 64, ny * 64);
      }
    }

    // Convert to normals (simple Sobel)
    function sample(ix, iy) {
      ix = (ix + size) % size;
      iy = (iy + size) % size;
      return h[iy * size + ix];
    }

    const strength = 2.2;
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const sx =
          (sample(x + 1, y - 1) + 2 * sample(x + 1, y) + sample(x + 1, y + 1)) -
          (sample(x - 1, y - 1) + 2 * sample(x - 1, y) + sample(x - 1, y + 1));
        const sy =
          (sample(x - 1, y + 1) + 2 * sample(x, y + 1) + sample(x + 1, y + 1)) -
          (sample(x - 1, y - 1) + 2 * sample(x, y - 1) + sample(x + 1, y - 1));

        let nx = -sx * strength;
        let ny = -sy * strength;
        let nz = 1.0;

        const invLen = 1.0 / Math.sqrt(nx * nx + ny * ny + nz * nz);
        nx *= invLen; ny *= invLen; nz *= invLen;

        const i = (y * size + x) * 4;
        data[i + 0] = Math.round((nx * 0.5 + 0.5) * 255);
        data[i + 1] = Math.round((ny * 0.5 + 0.5) * 255);
        data[i + 2] = Math.round((nz * 0.5 + 0.5) * 255);
        data[i + 3] = 255;
      }
    }

    ctx.putImageData(img, 0, 0);

    const tex = new AFRAME.THREE.CanvasTexture(canvas);
    tex.anisotropy = 4;
    tex.needsUpdate = true;
    CACHE[key] = tex;
    return tex;
  }

  AFRAME.registerComponent('rock-surface', {
    schema: {
      color: { type: 'color', default: '#2a2a2a' },
      roughness: { type: 'number', default: 0.92 },
      metalness: { type: 'number', default: 0.0 },
      normalScale: { type: 'vec2', default: { x: 0.9, y: 0.9 } },
      repeat: { type: 'vec2', default: { x: 6, y: 2 } },
      seed: { type: 'int', default: 77 }
    },

    init: function () {
      this.apply = this.apply.bind(this);
      this.el.addEventListener('object3dset', this.apply);
      this.el.addEventListener('model-loaded', this.apply);
      this.apply();
    },

    update: function () {
      this.apply();
    },

    apply: function () {
      const THREE = AFRAME.THREE;
      const d = this.data;
      const root = this.el.getObject3D('mesh');
      if (!root) return;

      const key = `m_${d.seed}_${d.color}_${d.roughness}_${d.metalness}_${d.repeat.x}_${d.repeat.y}_${d.normalScale.x}_${d.normalScale.y}`;
      let mat = CACHE[key];
      if (!mat) {
        const ntex = makeRockNormalTexture(d.seed, 256);
        ntex.wrapS = ntex.wrapT = THREE.RepeatWrapping;
        ntex.repeat.set(d.repeat.x, d.repeat.y);

        mat = new THREE.MeshStandardMaterial({
          color: new THREE.Color(d.color),
          roughness: d.roughness,
          metalness: d.metalness,
          normalMap: ntex,
          normalScale: new THREE.Vector2(d.normalScale.x, d.normalScale.y),
          side: THREE.DoubleSide
        });
        CACHE[key] = mat;
      }

      root.traverse((o) => {
        if (!o.isMesh) return;
        o.material = mat;
        o.material.needsUpdate = true;
      });
    }
  });
})();



/* --- Force double-sided material on a mesh (for interior wall visibility) --- */
AFRAME.registerComponent('force-double-side', {
