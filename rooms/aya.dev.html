    this.guide.setAttribute('data-owner', this.state.owner);
    this.guideBody.innerHTML = html;
    this.guide.style.opacity = 1;
  },

  _syncAboveGroundState: function () {
    const p = this.data.platform;
    const inner = this.data.inner;
    const outer = this.data.outer;
    if (!p) return;

    // Mirror the ascent-time 'swapY' calculation so the same above-ground rules apply at start.
    const oculusRef = document.querySelector('#end_chamber_06_oculus_cutref');
    const tmp = new THREE.Vector3();
    let oculusY = 5.55;
    if (oculusRef && oculusRef.object3D) {
      oculusRef.object3D.getWorldPosition(tmp);
      oculusY = tmp.y;
    }
    const swapY = oculusY + 1.10;

    // Compare in WORLD space (end_chamber_06 may be positioned in the world).
    const pWorld = new THREE.Vector3();
    let y = 0;
    if (p.object3D) { p.object3D.getWorldPosition(pWorld); y = pWorld.y; }
    const isAbove = (y >= (swapY - 0.0001));

    this._aboveGround = isAbove;
    // Above ground: disable the end chamber shaft lights to prevent a visible highlight on the platform.
    this._setShaftLightsEnabled(true);

    // Outside lunar lights must never lift underground lighting.
    // Fade in the outside lights *before* the swap to make the ascent feel like light gradually filtering in.
    const fadeStartY = (this._ascentStartYWorld != null ? this._ascentStartYWorld : (swapY - this._lunarFadeStart));
    const fadeEndY = swapY + this._lunarFadeEnd;
    let f = (y - fadeStartY) / (fadeEndY - fadeStartY);
    if (f < 0) f = 0; else if (f > 1) f = 1;
    // Smoothstep for a softer ramp.
    f = f * f * (3 - 2 * f);
    this._setOutsideLunarFactor(f);

    // Fade platform reflections in the *same* band as the lunar light fade (no snap, no material swap).
    this._applyPlatformReflectionFade(1);

    if (isAbove) {
      if (outer) outer.setAttribute('visible', true);
      if (inner) inner.setAttribute('visible', false);
      this._setPlatformMatteAboveGround(true);
    } else {
      if (outer) outer.setAttribute('visible', false);
      if (inner) inner.setAttribute('visible', true);
      this._setPlatformMatteAboveGround(false);
    }
  },




  // --- Outside lunar lights gating ---
  _setOutsideLunarFactor: function (target) {
    // target: 0..1 factor applied to the *original* outside lunar intensities.
    target = (target == null) ? 0 : target;
    if (target < 0) target = 0;
    if (target > 1) target = 1;

    // Small temporal smoothing so the ramp feels like light filtering, not a snap.
    if (this._lunarFactor == null) this._lunarFactor = target;
    const k = (this._lunarFadeK != null) ? this._lunarFadeK : 0.12;

    // Exponential smoothing toward target.
    const next = this._lunarFactor + (target - this._lunarFactor) * k;
    this._lunarFactor = (Math.abs(next - target) < 0.0005) ? target : next;

    const dirEl = this._lunarDirEl;
    const hemiEl = this._lunarHemiEl;
    if (!dirEl && !hemiEl) return;

    const dirVal = this._lunarDirI * this._lunarFactor;
    const hemiVal = this._lunarHemiI * this._lunarFactor;

    if (dirEl) dirEl.setAttribute('light', 'intensity', dirVal);
    if (hemiEl) hemiEl.setAttribute('light', 'intensity', hemiVal);

// --- Shaft light capture/toggle (used to kill platform highlights when above ground) ---
_captureShaftLights: function () {
  if (this._shaftLights) return;
  const out = [];
  const add = (el) => {
    if (!el) return;
    const l = el.getAttribute && el.getAttribute('light');
    if (!l) return;
    const inten = (typeof l.intensity === 'number') ? l.intensity : 1.0;
    out.push({ el, intensity: inten });
  };

  // Main oculus spot
  add(this._oculusSpotEl);

  // Any point lights under the moonlight group
  if (this._moonlightEl && this._moonlightEl.querySelectorAll) {
    this._moonlightEl.querySelectorAll('[light]').forEach(add);
  }

  this._shaftLights = out;

_setShaftLightsEnabled: function (enabled) {
  this._captureShaftLights();
  if (!this._shaftLights || !this._shaftLights.length) return;

  const wantOff = !enabled;
  if (this._shaftLightsOff === wantOff) return;

  this._shaftLights.forEach((s) => {
    try {
      s.el.setAttribute('light', 'intensity', enabled ? s.intensity : 0.0);
    } catch (e) {}
  });

  this._shaftLightsOff = wantOff;
},


// --- Platform reflection fade (no material swaps) ---
_capturePlatformPbrSnapshot: function () {
  const p = this.data.platform;
  if (!p) return;

  const mesh = p.getObject3D && p.getObject3D('mesh');
  if (!mesh) return;

  const snap = [];
  mesh.traverse((o) => {
    if (!o.isMesh || !o.material) return;

    const captureMat = (mat) => {
      if (!mat || (typeof mat !== 'object')) return;
      // Capture only if the property exists on this material type.
      const hasEnv = ('envMapIntensity' in mat) && (typeof mat.envMapIntensity === 'number');
      const hasRough = ('roughness' in mat) && (typeof mat.roughness === 'number');
      const hasMetal = ('metalness' in mat) && (typeof mat.metalness === 'number');

      // If it's not a PBR-ish material, there's nothing to fade.
      if (!hasEnv && !hasRough && !hasMetal) return;

      snap.push({
        mat,
        hasEnv, hasRough, hasMetal,
        env0: hasEnv ? mat.envMapIntensity : null,
        rough0: hasRough ? mat.roughness : null,
        metal0: hasMetal ? mat.metalness : null
      });
    };

    if (Array.isArray(o.material)) o.material.forEach(captureMat);
    else captureMat(o.material);
  });

  this._platformPbrSnapshot = snap.length ? snap : null;
},

_applyPlatformReflectionFade: function (factor) {
  // factor: 0..1 (0 = original PBR response; 1 = maximum suppression)
  if (factor == null) factor = 0;
  if (factor < 0) factor = 0;
  if (factor > 1) factor = 1;

  this._platformFadeFactor = factor;

  if (!this._platformPbrSnapshot) this._capturePlatformPbrSnapshot();
  const snap = this._platformPbrSnapshot;
  if (!snap) return;

  const lerp = (a, b, t) => a + (b - a) * t;

  const roughBoost = (this._platformRoughBoost != null) ? this._platformRoughBoost : 0.28;
  const metalCut = (this._platformMetalCut != null) ? this._platformMetalCut : 0.18;

  snap.forEach((s) => {
    const m = s.mat;
    if (!m) return;

    if (s.hasEnv) {
      m.envMapIntensity = lerp(s.env0, 0.0, factor);
    }
    if (s.hasRough) {
      const r1 = Math.min(1.0, s.rough0 + roughBoost);
      m.roughness = lerp(s.rough0, r1, factor);
    }
    if (s.hasMetal) {
      const mm1 = Math.max(0.0, s.metal0 - metalCut);
      m.metalness = lerp(s.metal0, mm1, factor);
    }
  });
},


  _capturePlatformMaterials: function () {
    const p = this.data.platform;
    if (!p) return;

    // NOTE: platform is a primitive entity (a-cylinder). We intentionally only touch its own mesh,
    // not child entities (handrail/panel), so we call getObject3D('mesh') on THIS entity.
    const mesh = p.getObject3D && p.getObject3D('mesh');
    if (!mesh) return;

    const snap = [];
    mesh.traverse((o) => {
      if (!o.isMesh || !o.material) return;

      if (Array.isArray(o.material)) {
        o.material.forEach((m, idx) => {
          if (!m || (typeof m !== 'object')) return;
          snap.push({
            obj: o,
            idx,
            origMat: m,
            // basicMat will be created lazily on first toggle.
            basicMat: null
          });
        });
      } else {
        const m = o.material;
        if (!m || (typeof m !== 'object')) return;
        snap.push({
          obj: o,
          idx: null,
          origMat: m,
          basicMat: null
        });
      }
    });

    this._platformMatSnapshot = snap.length ? snap : null;
  },

  _setPlatformMatteAboveGround: function (on) {

    if (!this._platformMatSnapshot) this._capturePlatformMaterials();
    const snap = this._platformMatSnapshot;
    if (!snap) return;

            map: orig.map || null,
            color: (orig.color && orig.color.isColor) ? orig.color.clone() : new THREE.Color(0x111111),
            transparent: !!orig.transparent,
            opacity: (typeof orig.opacity === 'number') ? orig.opacity : 1.0,
            side: (typeof orig.side === 'number') ? orig.side : THREE.FrontSide,
            alphaTest: (typeof orig.alphaTest === 'number') ? orig.alphaTest : 0

        } else {

        }

      });

      this._platformMatte = true;
      return;
    }

    if (!on && this._platformMatte) {

      snap.forEach((s) => {
        if (s.idx !== null) {
          s.obj.material[s.idx] = s.origMat;
        } else {
          s.obj.material = s.origMat;
        }
        s.obj.material.needsUpdate = true;
      });

      this._platformMatte = false;
    }
  },

  _boardPlatform: function () {
    const p = this.data.platform;
    if (!p || !this.rig || !this.cam) return;

    // Put feet slightly above platform top so we don't clip.
    const platformTopY = wp.y + 0.08;

    this.rig.object3D.position.set(wp.x, platformTopY, wp.z);

    this.state.step = 2;
    this._showGuide('On platform.<br><b>F</b> — Ascend (test)');
  },

  _activateAscent: function () {
    const p = this.data.platform;
    const inner = this.data.inner;
    const outer = this.data.outer;

    if (!p || !this.rig) return;
    if (this.state.running) return;

    this.state.running = true;
    // Record ascent start height so the outside lunar ramp can begin immediately when ascent starts.
    try {
      const _pW = new THREE.Vector3();
      if (p.object3D) { p.object3D.getWorldPosition(_pW); this._ascentStartYWorld = _pW.y; }
    } catch (e) {}
    this._showGuide('Ascending…');

    try {
      const _panelLight = document.querySelector('#endchamber_panel_light');

    } catch (e) {}

    // During ascent: allow mouse look but prevent looking down (and keep view within a forward arc).
    this._enableAscentLookLock();

    // Disable walking while riding.
    const rw = this.rig.components && this.rig.components['rig-walk'];
    if (rw) {
      this.state.originalSpeed = rw.data && typeof rw.data.speed === 'number' ? rw.data.speed : null;
      try { this.rig.setAttribute('rig-walk', 'speed', 0.0); } catch (e) {}
      if (rw.keys) Object.keys(rw.keys).forEach(k => rw.keys[k] = false);

    if (this._oculusSpotEl) {

      try { this._oculusSpotEl.setAttribute('light', 'intensity', baseI); } catch (e) {}

    if (outer) outer.setAttribute('visible', false);
    if (inner) inner.setAttribute('visible', true);

    const sceneObj = this.el.sceneEl.object3D;
    const platformObj = p.object3D;

    // Attach rig to platform so it rides cleanly.
    platformObj.attach(this.rig.object3D);

    const y0 = platformObj.position.y;
    const y1 = this.data.targetPlatformY;
    const t0 = performance.now();
    const dur = Math.max(600, this.data.durationMs);

    const ease = (u) => (u < 0.5) ? (4 * u * u * u) : (1 - Math.pow(-2 * u + 2, 3) / 2);

    const step = (t) => {

      platformObj.position.y = y;

      // While riding: constrain view (front/up only).
      this._applyAscentLookLock();

      // Swap shells ONLY after we are actually outside the dome.
      // Important: end_chamber_06_outer is front-sided (meant to be seen from outside),

      const oculusRef = document.querySelector('#end_chamber_06_oculus_cutref');
      const oculusY = oculusRef ? oculusRef.object3D.getWorldPosition(new THREE.Vector3()).y : 5.55;
      const swapY = oculusY + 1.10; // a bit above the ceiling plane

      const isAbove = (yWorld >= swapY);
      this._aboveGround = isAbove;

      // Outside lunar lights must never lift underground lighting.
      const fadeStartY = (this._ascentStartYWorld != null ? this._ascentStartYWorld : (swapY - this._lunarFadeStart));
      const fadeEndY = swapY + this._lunarFadeEnd;
      let f = (yWorld - fadeStartY) / (fadeEndY - fadeStartY);
      if (f < 0) f = 0; else if (f > 1) f = 1;
      f = f * f * (3 - 2 * f);
      this._setOutsideLunarFactor(f);

      // Fade platform reflections in the *same* band as the lunar light fade (no snap, no material swap).
      this._applyPlatformReflectionFade(1);

      // Above ground: disable the end chamber shaft lights to prevent a visible highlight on the platform.
      this._setShaftLightsEnabled(true);
      if (isAbove) {
        if (outer) outer.setAttribute('visible', true);
        if (inner) inner.setAttribute('visible', false);
        // Above ground: platform should not show glossy/IBL reflections.
        this._setPlatformMatteAboveGround(true);
      } else {
        if (outer) outer.setAttribute('visible', false);
        if (inner) inner.setAttribute('visible', true);

        const spotEl = this._oculusSpotEl;
        const baseI = (typeof this._oculusSpotBaseI === 'number') ? this._oculusSpotBaseI : 0;

        const finishArrival = () => {
          // Unlock view limits only once travel is complete (and arrival lighting has settled).
          this._disableAscentLookLock();

          if (this.state.originalSpeed !== null) {

          }

          try {

            if (_panelLight) {

            }
          } catch (e) {}

          this._hideGuideIfOwner();
          this.state.step = 0;
          this.state.running = false;
        };

        if (spotEl && baseI > 0) {
          let startI = baseI;
          try {
            const l = spotEl.getAttribute('light');
            if (l && typeof l.intensity === 'number') startI = l.intensity;

      this._torches.length = 0;

      nodes.forEach(n => {
        // Prefer the futuristic flame child as the anchor point.
        let flame = n.querySelector('[futuristic-flame]');
        if (!flame) {
          // Fallback: an entity with id ending in _flame or containing flame_core.
          flame = n.querySelector('[id$="_flame"], #torch_flame_core');
        }
        this._torches.push({ el: n, flame: flame || n });

    const step = 1000 / hz;
    if (time < this._next) return;
    this._next = time + step;

    const rig = this.data.rig;
    const camEl = this.data.camera;
    const lightEl = this.data.light;
    if (!rig || !camEl || !lightEl) return;

    const lightObj = lightEl.getObject3D('light');
    if (!lightObj) return;

    // World positions
    rig.object3D.getWorldPosition(this._rigPos);
    const camObj = camEl.getObject3D('camera') || camEl.object3D;
    camObj.getWorldPosition(this._camPos);
    camObj.getWorldDirection(this._camDir);

    let best = null;
    let bestD2 = Infinity;

    for (let i = 0; i < this._torches.length; i++) {
      const t = this._torches[i];
      if (!t || !t.flame) continue;
      t.flame.object3D.getWorldPosition(this._flamePos);

    lightEl.object3D.position.copy(this._flamePos);

    const d = Math.sqrt(bestD2);

AFRAME.registerComponent('torch-gobo', {
  schema: {
    speed: { default: 0.85 },
    strength: { default: 1.0 },
    intensityJitter: { default: 0.08 }
  },
  init: function () {
    this._seed = Math.random() * 1000;
    this._last = 0;

    // Canvas gobo texture
    const size = 256;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');

    this._canvas = c;
    this._ctx = ctx;
    this._tex = new THREE.CanvasTexture(c);
    this._tex.wrapS = this._tex.wrapT = THREE.RepeatWrapping;
    this._tex.repeat.set(1.25, 1.25);
    this._tex.needsUpdate = true;

    this._draw(0);
  },
  _draw: function (t) {
    const ctx = this._ctx;
    const c = this._canvas;
    const w = c.width, h = c.height;

    // Background (mostly dark)
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, w, h);

    // Soft, blobby “energy” shapes
    const nBlobs = 10;
    for (let i = 0; i < nBlobs; i++) {
      const a = (i / nBlobs) * Math.PI * 2 + 0.6 * Math.sin(t * 0.9 + i * 1.7);
      const r = 0.22 + 0.10 * Math.sin(t * 0.7 + i * 2.3);
      const cx = 0.5 + 0.32 * Math.cos(a);
      const cy = 0.5 + 0.32 * Math.sin(a);

      const gx = cx * w;
      const gy = cy * h;
      const gr = r * w;

      const g = ctx.createRadialGradient(gx, gy, gr * 0.08, gx, gy, gr);
      g.addColorStop(0.0, 'rgba(255,255,255,0.90)');
      g.addColorStop(0.55, 'rgba(255,255,255,0.24)');
      g.addColorStop(1.0, 'rgba(255,255,255,0.00)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(gx, gy, gr, 0, Math.PI * 2);
      ctx.fill();
    }

    // Subtle streaks (adds readable motion in shadows)
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const y = (h * (i + 0.5)) / 6 + 18 * Math.sin(t * 1.2 + i * 0.9);
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.bezierCurveTo(w * 0.35, y - 18, w * 0.65, y + 18, w, y);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';

    this._tex.needsUpdate = true;
  },
  tick: function (ms) {
    const light = this.el.getObject3D('light');
    if (!light || !light.isSpotLight) return;

    const t = ms * 0.001 + this._seed;

    // Update the drawn pattern at a modest rate (stability + perf)
    if (ms - this._last > 45) {
      this._draw(t);
      this._last = ms;
    }

    // Apply as gobo
    light.map = this._tex;

    // Gentle, irregular modulation (mostly from gobo transform, not intensity)
    const wob = (Math.sin(t * 2.7) + Math.sin(t * 4.9 + 1.7) * 0.6) / 1.6;
    this._tex.offset.x = (0.10 * Math.sin(t * this.data.speed * 0.9) + 0.06 * wob) % 1;
    this._tex.offset.y = (0.12 * Math.cos(t * this.data.speed * 1.1) - 0.05 * wob) % 1;
    this._tex.rotation = 0.12 * Math.sin(t * this.data.speed * 0.7);

    if (this._baseIntensity == null) this._baseIntensity = light.intensity;
    const base = this._baseIntensity;
    const j = this.data.intensityJitter * wob;
    light.intensity = Math.max(0.0, base * (1.0 + j));
  },
  remove: function () {
    try { if (this._tex) this._tex.dispose(); } catch (e) {}
  }
});

// Simple volumetric-ish dust motes as subtle particles inside a cone.
AFRAME.registerComponent('beam-dust', {
  schema: {
    count: { default: 360 },
    coneAngle: { default: 28 },   // degrees
    length: { default: 6.0 },
    radius: { default: 1.2 },     // max radius at length
    speed: { default: 0.18 },
    size: { default: 0.012 },
    opacity: { default: 0.04 }
  },
  init: function () {
    const d = this.data;
    const geom = new THREE.BufferGeometry();
    const positions = new Float32Array(d.count * 3);

    this._vel = new Float32Array(d.count * 3);
    const ang = THREE.MathUtils.degToRad(d.coneAngle);

    for (let i = 0; i < d.count; i++) {
      // Place inside a cone pointing down -Z
      const z = -Math.random() * d.length;
      const rMax = (Math.abs(z) / d.length) * d.radius;
      const r = Math.sqrt(Math.random()) * rMax;
      const th = Math.random() * Math.PI * 2;

      const x = r * Math.cos(th);
      const y = r * Math.sin(th);

      positions[i * 3 + 0] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      // Slow drift, mostly upward + slight forward/back
      this._vel[i * 3 + 0] = (Math.random() - 0.5) * 0.02;
      this._vel[i * 3 + 1] = (Math.random() * 0.06 + 0.01);
      this._vel[i * 3 + 2] = (Math.random() - 0.5) * 0.03;
    }

    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const mat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: d.size,
      transparent: true,
      opacity: d.opacity,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    this._geom = geom;
    this._mat = mat;
    this._pts = new THREE.Points(geom, mat);
    this._pts.frustumCulled = false;

    this.el.object3D.add(this._pts);
  },
  tick: function (ms, dt) {
    const d = this.data;
    const t = ms * 0.001;
    const pos = this._geom.attributes.position.array;
    const v = this._vel;

    const len = d.length;

    for (let i = 0; i < d.count; i++) {
      const ix = i * 3;

      pos[ix + 0] += v[ix + 0] * dt * 0.001;
      pos[ix + 1] += v[ix + 1] * d.speed * dt * 0.001;
      pos[ix + 2] += v[ix + 2] * dt * 0.001;

      // slight swirling
      pos[ix + 0] += 0.002 * Math.sin(t * 0.9 + i);
      pos[ix + 1] += 0.0015 * Math.cos(t * 1.1 + i * 0.7);

      // wrap within cone volume
      if (pos[ix + 2] > -0.15) pos[ix + 2] = -len;
      if (pos[ix + 2] < -len) pos[ix + 2] = -0.15;

      // keep inside radius envelope
      const z = pos[ix + 2];
      const rMax = (Math.abs(z) / len) * d.radius;
      const r2 = pos[ix + 0] * pos[ix + 0] + pos[ix + 1] * pos[ix + 1];
      if (r2 > rMax * rMax) {
        const r = Math.sqrt(r2) + 1e-6;
        const k = (rMax / r) * 0.98;
        pos[ix + 0] *= k;
        pos[ix + 1] *= k;
      }
    }

    this._geom.attributes.position.needsUpdate = true;
  },
  remove: function () {
    try { if (this._pts) this.el.object3D.remove(this._pts); } catch (e) {}
    try { if (this._geom) this._geom.dispose(); } catch (e) {}
    try { if (this._mat) this._mat.dispose(); } catch (e) {}
  }
});

AFRAME.registerComponent('realism-postfx', {

      if (this._ready) return;
      const renderer = sceneEl.renderer;
      const scene = sceneEl.object3D;

      renderer.toneMappingExposure = 1.9;

      const size = renderer.getSize(new THREE.Vector2());
      const w = size.x, h = size.y;

      const composer = new THREE.EffectComposer(renderer);
      composer.setSize(w, h);

      const renderPass = new THREE.RenderPass(scene, camera);
      composer.addPass(renderPass);

      // Bloom: high threshold so it mostly affects torch/emissives.
      const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(Math.floor(w*0.6), Math.floor(h*0.6)), 0.45, 0.20, 1.10);

      const rs = sceneEl.systems && sceneEl.systems.renderer;

      window.addEventListener('resize', () => {
        if (!this.composer) return;

      this._ready = true;
    };

    sceneEl.addEventListener('render-target-loaded', setup);
    sceneEl.addEventListener('loaded', setup);
    setTimeout(setup, 0);
  },
  remove: function () {
    const sceneEl = this.el;
    const rs = sceneEl.systems && sceneEl.systems.renderer;
    if (rs && this._origRender) rs.render = this._origRender;

});

AFRAME.registerComponent('cave-displace', {
  schema: {
    amp:   { type: 'number', default: 0.22 },  // displacement amplitude (meters)
    freq:  { type: 'number', default: 1.15 },  // base noise frequency
    seed:  { type: 'number', default: 13 },    // per-mesh seed
    oct:   { type: 'number', default: 4 },     // octaves
    lac:   { type: 'number', default: 2.0 },   // lacunarity
    gain:  { type: 'number', default: 0.52 },  // amplitude falloff per octave
    // optional extra "macro" shaping so the cave reads as large, soft bulges + small chisel detail
    macroFreq: { type: 'number', default: 0.42 },
    macroAmp:  { type: 'number', default: 0.65 }
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },

  // ---- Smooth value noise (trilinear interpolation) ----
  _hash11: function (n) {
    // deterministic pseudo-random in [0,1)
    const s = Math.sin(n) * 43758.5453123;
    return s - Math.floor(s);
  },
  _randLattice: function (ix, iy, iz, seed) {
    // lattice random in [-1,1]
    const n = ix * 127.1 + iy * 311.7 + iz * 74.7 + seed * 19.19;
    return this._hash11(n) * 2.0 - 1.0;
  },
  _fade: function (t) { return t * t * (3.0 - 2.0 * t); },
  _lerp: function (a, b, t) { return a + (b - a) * t; },
  _noise3: function (x, y, z, seed) {
    // value noise in [-1,1]
    const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
    const fx = x - ix, fy = y - iy, fz = z - iz;

    const u = this._fade(fx), v = this._fade(fy), w = this._fade(fz);

    const n000 = this._randLattice(ix,     iy,     iz,     seed);
    const n100 = this._randLattice(ix + 1, iy,     iz,     seed);
    const n010 = this._randLattice(ix,     iy + 1, iz,     seed);
    const n110 = this._randLattice(ix + 1, iy + 1, iz,     seed);

    const n001 = this._randLattice(ix,     iy,     iz + 1, seed);
    const n101 = this._randLattice(ix + 1, iy,     iz + 1, seed);
    const n011 = this._randLattice(ix,     iy + 1, iz + 1, seed);
    const n111 = this._randLattice(ix + 1, iy + 1, iz + 1, seed);

    const nx00 = this._lerp(n000, n100, u);
    const nx10 = this._lerp(n010, n110, u);
    const nx01 = this._lerp(n001, n101, u);
    const nx11 = this._lerp(n011, n111, u);

    const nxy0 = this._lerp(nx00, nx10, v);
    const nxy1 = this._lerp(nx01, nx11, v);

    return this._lerp(nxy0, nxy1, w);
  },
  _fbm: function (x, y, z, seed, oct, freq, lac, gain) {
    let a = 1.0, f = freq, sum = 0.0, norm = 0.0;
    for (let i = 0; i < oct; i++) {
      sum += a * this._noise3(x * f, y * f, z * f, seed + i * 101.7);
      norm += a;
      a *= gain;
      f *= lac;
    }
    return (norm > 0) ? (sum / norm) : 0;
  },

  _apply: function () {
    const obj = this.el.getObject3D('mesh');
    if (!obj) return;

    const meshes = [];
    obj.traverse(o => { if (o && o.isMesh && o.geometry) meshes.push(o); });
    if (!meshes.length) return;

    const d = this.data;

    for (let m = 0; m < meshes.length; m++) {
      const mesh = meshes[m];
      const geom = mesh.geometry;
      if (!geom || !geom.attributes || !geom.attributes.position) continue;

      // Avoid double-applying.
      if (geom.userData && geom.userData._caveDisplaced) continue;

      const g = geom.clone();
      const pos = g.attributes.position;

      if (!g.attributes.normal) g.computeVertexNormals();
      const normals = g.attributes.normal;

      const v = new THREE.Vector3();
      const nrm = new THREE.Vector3();

      // Two-layer noise: broad bulges (macro) + surface chiseling (micro)
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        nrm.fromBufferAttribute(normals, i);

        const macro = this._fbm(v.x, v.y, v.z, d.seed + 17.0, d.oct, d.macroFreq, d.lac, d.gain);
        const micro = this._fbm(v.x, v.y, v.z, d.seed,        d.oct, d.freq,      d.lac, d.gain);

        const w = (macro * d.macroAmp) + (micro * (1.0 - d.macroAmp));

        v.addScaledVector(nrm, w * d.amp);
        pos.setXYZ(i, v.x, v.y, v.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      g.userData = g.userData || {};
      g.userData._caveDisplaced = true;

      mesh.geometry = g;
    }
  }
});


// Pulls the lowest edge of the cave shell down to meet the floor (world Y), with a smooth falloff upward.
// This alters the *main dome mesh* (no extra skirt meshes) and keeps the upper coverage essentially unchanged.
AFRAME.registerComponent('cave-floor-seal', {
  schema: {
    floorY:       { type: 'number', default: 0 },     // world-space floor Y to touch
    anchorHeight: { type: 'number', default: 0.75 },  // in meters above the shell's current lowest point where deformation fades to 0
    retries:      { type: 'int',    default: 6 }      // wait for cave-displace to finish
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },

  _smoothstep: function (t) { return t * t * (3.0 - 2.0 * t); },

  _apply: function () {
    const obj = this.el.getObject3D('mesh');
    if (!obj) return;

    const meshes = [];
    obj.traverse(o => { if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) meshes.push(o); });
    if (!meshes.length) return;

    const d = this.data;

    // If cave-displace is present, wait until it has tagged geometry as displaced.
    // This prevents double-cloning and avoids racing the displacement step.
    const needsDisplace = this.el.hasAttribute('cave-displace');
    if (needsDisplace) {
      let allDisplaced = true;
      for (const m of meshes) {
        if (!(m.geometry.userData && m.geometry.userData._caveDisplaced)) { allDisplaced = false; break; }
      }
      if (!allDisplaced) {
        if (d.retries > 0) {
          this.el.setAttribute('cave-floor-seal', { retries: d.retries - 1 });
          setTimeout(this._apply, 25);
        }
        return;
      }
    }

    // Find the current lowest vertex in WORLD space.
    let minY = Infinity;
    const _v = new THREE.Vector3();

    obj.updateMatrixWorld(true);
    obj.traverse(m => { if (m && m.isMesh) m.updateMatrixWorld(true); });

    for (const mesh of meshes) {
      const pos = mesh.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        _v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
        if (_v.y < minY) minY = _v.y;
      }
    }

    const delta = d.floorY - minY; // negative means we need to pull DOWN
    if (delta >= 0) return; // already touching or below

    const anchorY = minY + Math.max(0.05, d.anchorHeight);
    const _w = new THREE.Vector3();
    const _local = new THREE.Vector3();
    const _inv = new THREE.Matrix4();

    for (const mesh of meshes) {
      // Avoid double-applying.
      if (mesh.geometry.userData && mesh.geometry.userData._floorSealed) continue;

      // Clone so we don't mutate shared geometry.
      const g = mesh.geometry.clone();
      const pos = g.attributes.position;

      _inv.copy(mesh.matrixWorld).invert();

      for (let i = 0; i < pos.count; i++) {
        _local.fromBufferAttribute(pos, i);
        _w.copy(_local).applyMatrix4(mesh.matrixWorld);

        if (_w.y >= anchorY) continue;

        const t = (_w.y - minY) / (anchorY - minY); // 0..1
        const s = this._smoothstep(Math.min(1, Math.max(0, t)));
        const wgt = 1.0 - s;

        _w.y += delta * wgt;

        _local.copy(_w).applyMatrix4(_inv);
        pos.setXYZ(i, _local.x, _local.y, _local.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      g.userData = g.userData || {};
      g.userData._floorSealed = true;

      mesh.geometry = g;
    }
  }
});

    obj.traverse(o => {
      if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) {
        meshes.push(o);
        const g = o.geometry;
        const ud = g.userData || {};
        if (!(ud._caveDisplaced && ud._floorSealed)) allReady = false;
      }
    });

    if (!meshes.length) return;

    if (!allReady) {
      if (this.data.retries > 0) {
        this.data.retries -= 1;
        setTimeout(this._apply, 60);
      }
      return;
    }

    for (const mesh of meshes) {
      const g0 = mesh.geometry;
      g0.userData = g0.userData || {};
      if (g0.userData._domeNaturalized) continue;

      // Clone to avoid mutating shared geometry.
      const g = g0.clone();
      const pos = g.attributes.position;
      if (!pos) continue;

      // Bounding box for bottom-weighting: helps soften the floor+wall+dome tri-junction.
      g.computeBoundingBox();
      const minY = g.boundingBox ? g.boundingBox.min.y : -1.0;
      const maxY = g.boundingBox ? g.boundingBox.max.y :  1.0;
      const bottomBandY = Math.max(1e-6, (maxY - minY) * 0.18);

      // Cache the current (post-displace + post-floor-seal) positions as a baseline to prevent stacking.
      if (!g.userData._basePos) {
        g.userData._basePos = new Float32Array(pos.array);
      }
      const base = g.userData._basePos;

      const d = this.data;
      const seedA = d.seed * 1.0;
      const seedB = d.seed * 3.7;

      const v = new THREE.Vector3();
      const n = new THREE.Vector3();
      const up = new THREE.Vector3(0, 1, 0);
      const t1 = new THREE.Vector3();
      const t2 = new THREE.Vector3();

      for (let i = 0; i < pos.count; i++) {
        v.set(base[i*3+0], base[i*3+1], base[i*3+2]);

        // Approximate normal from position (works well for sphere-like shells).
        n.copy(v).normalize();

        // --- Global irregularity (breaks perfect ellipsoid symmetry) ---
        const gx = v.x * d.globalFreq;
        const gy = v.y * d.globalFreq;
        const gz = v.z * d.globalFreq;

        const ng = this._noise3(gx, gy, gz, seedA);
        v.addScaledVector(n, ng * d.globalAmp);

        // Tangential warp (prevents "inflated balloon" look)
        // Build a stable tangent basis.
        t1.crossVectors(n, up);
        if (t1.lengthSq() < 1e-6) t1.set(1, 0, 0);
        t1.normalize();
        t2.crossVectors(n, t1).normalize();

        const nt1 = this._noise3(gx + 7.1, gy + 3.3, gz + 1.9, seedB);
        const nt2 = this._noise3(gx + 2.4, gy + 9.7, gz + 5.2, seedB + 11.0);
        v.addScaledVector(t1, nt1 * d.tangentialAmp);
        v.addScaledVector(t2, nt2 * d.tangentialAmp);

        // --- Seam softening at the flat wall plane (local z ~= seamZ) ---
        const dz = Math.abs(v.z - d.seamZ);
        const t = 1.0 - Math.min(1.0, dz / Math.max(1e-6, d.seamBand));
        const w = this._smoothstep(t); // 0..1

        if (w > 0.0) {
          // Noise evaluated in seam plane so it's irregular around the ring.
          const sx = v.x * d.seamNoiseFreq;
          const sy = v.y * d.seamNoiseFreq;
          const sn = this._noise3(sx, sy, 0.0, seedA + 27.0); // [-1,1]

          // Push seam slightly behind wall (negative Z) with jitter so it's not a perfect circle line.
          // Extra weighting near the bottom of the dome so the seam doesn't read as a perfect hard circle.
          const bottomT = 1.0 - Math.min(1.0, Math.max(0.0, (v.y - (minY + bottomBandY)) / bottomBandY));
          const wBottom = this._smoothstep(bottomT) * w;
          const inset = d.seamInset * (w + 0.75 * wBottom) * (0.65 + 0.35 * (sn * 0.5 + 0.5));
          v.z -= inset;

          // Radial chip (in/out along normal) to break the circular precision.
          const chip = d.seamRadAmp * (w + 0.85 * wBottom) * sn;
          v.addScaledVector(n, chip);
        }

        pos.setXYZ(i, v.x, v.y, v.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      g.userData = g.userData || {};
      g.userData._domeNaturalized = true;

      mesh.geometry = g;

      // Re-seat the bottom edge to the floor after the irregularity pass.
      const seal = this.el.components['cave-floor-seal'];
      if (seal && typeof seal._apply === 'function') {
        // Clear the flag so the seal will run again.
        g.userData._floorSealed = false;
        setTimeout(() => seal._apply(), 0);
      }
    }
  }
});

AFRAME.registerComponent('floor-seam-sculpt', {
  schema: {
    // Back wall seam Z in WORLD space
    wallZ: {type: 'number', default: 0.49},

    // Elliptical footprint of the dome on the floor in WORLD space:
    // (x - cx)^2 / a^2 + (z - cz)^2 / b^2 = 1
    domeCenter: {type: 'vec3', default: {x: 0, y: 1.92, z: 0.49}},
    domeA: {type: 'number', default: 3.34},
    domeB: {type: 'number', default: 4.58},

    // Blend band widths in METERS (how far from the seam we start ramping up)
    domeBand: {type: 'number', default: 0.85},
    wallBand: {type: 'number', default: 0.95},

    // Max vertical rise (meters)
    maxRise: {type: 'number', default: 0.12},

    // Noise controls
    noiseScale: {type: 'number', default: 0.70},   // meters per noise feature (bigger = smoother)
    noiseAmp:   {type: 'number', default: 0.85},   // 0..1-ish
    edgeJitter: {type: 'number', default: 0.14},   // meters of seam wobble
    seed: {type: 'int', default: 11},

    // Keep the elevator cab + doorway area flat (meters)
    elevatorClearX: {type: 'number', default: 1.45},
    elevatorClearZ: {type: 'number', default: 1.10},

    // Whether to recompute normals (slightly costlier once, but improves realism)
    recomputeNormals: {type: 'boolean', default: true}
  },

  init: function () {
    this._applied = false;
    this._inv = new THREE.Matrix4();
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._apply);
  },

  _smoothstep: function (e0, e1, x) {
    const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  },

  _hash2: function (x, y, seed) {
    // integer hash -> [0,1)
    let n = (x * 374761393 + y * 668265263 + seed * 1442695041) | 0;
    n = (n ^ (n >> 13)) | 0;
    n = (n * 1274126177) | 0;
    return ((n ^ (n >> 16)) >>> 0) / 4294967296;
  },

  _noise2: function (x, y, seed) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;

    const a = this._hash2(xi, yi, seed);
    const b = this._hash2(xi + 1, yi, seed);
    const c = this._hash2(xi, yi + 1, seed);
    const d = this._hash2(xi + 1, yi + 1, seed);

    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const ab = a + (b - a) * u;
    const cd = c + (d - c) * u;
    return ab + (cd - ab) * v; // ~[0,1]
  },

  _fbm: function (x, y, seed) {
    let amp = 0.58;
    let sum = 0.0;
    let freq = 1.0;
    for (let i = 0; i < 4; i++) {
      sum += amp * this._noise2(x * freq, y * freq, seed + i * 13);
      freq *= 2.03;
      amp *= 0.52;
    }
    return sum; // ~[0,1]
  },

  _apply: function () {
    if (this._applied) return;

    const mesh = this.el.getObject3D('mesh');
    if (!mesh || !mesh.geometry || !mesh.geometry.attributes || !mesh.geometry.attributes.position) return;

    // Clone once so we don't mutate shared geometry.
    const geom = mesh.geometry.clone();
    mesh.geometry = geom;

    const pos = geom.attributes.position;

    // Compute LOCAL up (for displacing along the floor normal even if the plane rotates).
    const qWorld = new THREE.Quaternion();
    mesh.getWorldQuaternion(qWorld);
    const invQ = qWorld.clone().invert();
    const upLocal = new THREE.Vector3(0, 1, 0).applyQuaternion(invQ).normalize();

    const tmpLocal = new THREE.Vector3();
    const tmpWorld = new THREE.Vector3();

    const d = this.data;
    const cx = d.domeCenter.x, cz = d.domeCenter.z;
    const a = Math.max(1e-6, d.domeA), b = Math.max(1e-6, d.domeB);

    const wallBand = Math.max(0.05, d.wallBand);
    const domeBand = Math.max(0.05, d.domeBand);
    const noiseScale = Math.max(0.05, d.noiseScale);

    // Convert ellipse seam distance to meters (approx, good enough visually)
    const avgR = 0.5 * (a + b);

    for (let i = 0; i < pos.count; i++) {
      tmpLocal.fromBufferAttribute(pos, i);
      tmpWorld.copy(tmpLocal);
      mesh.localToWorld(tmpWorld);

      // Keep elevator interior / doorway region flat.
      const inElevatorClear =
        (Math.abs(tmpWorld.x) <= d.elevatorClearX) &&
        (tmpWorld.z <= (d.wallZ + d.elevatorClearZ));

      if (inElevatorClear) continue;

      // Seam wobble (breaks the "perfect line" read)
      const seamJ = (this._noise2(tmpWorld.x * 0.55, 0.0, d.seed + 31) * 2.0 - 1.0);
      const wallZJ = d.wallZ + d.edgeJitter * 0.55 * seamJ;

      // --- Influence 1: back wall seam (distance in meters) ---
      const dWall = Math.abs(tmpWorld.z - wallZJ);
      let wWall = 1.0 - this._smoothstep(0.0, wallBand, dWall);
      wWall = Math.pow(Math.max(0, wWall), 0.65);

      // --- Influence 2: dome footprint seam (distance in meters, approx) ---
      const dx = (tmpWorld.x - cx) / a;
      const dz = (tmpWorld.z - cz) / b;
      const r = Math.sqrt(dx * dx + dz * dz);

      // jitter the ellipse "radius" slightly so it doesn't read like math
      const rJ = 1.0 + (d.edgeJitter / Math.max(1e-6, avgR)) * 0.75 *
        (this._noise2(tmpWorld.x * 0.40, tmpWorld.z * 0.40, d.seed + 13) * 2.0 - 1.0);

      const dDomeMeters = Math.abs(r - rJ) * avgR;
      let wDome = 1.0 - this._smoothstep(0.0, domeBand, dDomeMeters);
      wDome = Math.pow(Math.max(0, wDome), 0.65);

      // Tri-junction boost: where both seam influences exist (use min)
      let wTri = Math.min(wWall, wDome);
      wTri = Math.pow(wTri, 0.55);

      // Combine: broad berm from max + extra lumpy lift at tri-junction
      let w = Math.max(wWall, wDome);
      if (w < 1e-5) continue;

      // Multi-scale noise in WORLD meters (fast, non-repeating enough for this use)
      const n = this._fbm(tmpWorld.x / noiseScale, tmpWorld.z / noiseScale, d.seed); // 0..1
      const nSigned = (n * 2.0 - 1.0); // -1..1
      const ridge = 1.0 - Math.abs(nSigned); // 0..1 (chunkier clumps)

      const amp = 1.0 + d.noiseAmp * (0.55 * nSigned + 0.25 * (ridge - 0.5));
      const micro = 0.010 * d.noiseAmp * (this._noise2(tmpWorld.x * 7.5, tmpWorld.z * 7.5, d.seed + 19) * 2.0 - 1.0);

      const rise = (d.maxRise * w * amp) + (d.maxRise * 0.55 * wTri * (1.0 + 0.60 * d.noiseAmp * nSigned)) + micro * w;

      tmpLocal.addScaledVector(upLocal, rise);
      pos.setXYZ(i, tmpLocal.x, tmpLocal.y, tmpLocal.z);
    }

    pos.needsUpdate = true;
    if (d.recomputeNormals) geom.computeVertexNormals();

    this._applied = true;
  }
});


AFRAME.registerComponent('dust-decal-alpha', {
  schema: {
    width: {type: 'number', default: 14},
    height: {type: 'number', default: 14},
    centerZ: {type: 'number', default: 3.50},

    wallZ: {type: 'number', default: 0.49},
    domeCenter: {type: 'vec3', default: {x: 0, y: 1.92, z: 0.49}},
    domeA: {type: 'number', default: 3.34},
    domeB: {type: 'number', default: 4.58},

    wallBand: {type: 'number', default: 1.15},
    domeBand: {type: 'number', default: 1.05},

    strength: {type: 'number', default: 0.85},

    // Noise controls (meters)
    noiseScale: {type: 'number', default: 0.55},
    noiseAmount: {type: 'number', default: 0.55},

    // Keep elevator interior clean (in WORLD space around the doorway plane)
    elevatorClearX: {type: 'number', default: 1.45},
    elevatorClearZ: {type: 'number', default: 1.10}
  },

  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    this.el.addEventListener('materialtextureloaded', this._apply);
    this._apply();
  },

  // Smoothstep
  _smooth: function (edge0, edge1, x) {
    const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
    return t * t * (3 - 2 * t);
  },

  // Hash + value noise (fast, deterministic, no external assets)
  _hash2: function (x, y) {
    // 2D integer hash -> [0,1)
    let n = (x * 374761393 + y * 668265263) | 0;
    n = (n ^ (n >> 13)) | 0;
    n = (n * 1274126177) | 0;
    return ((n ^ (n >> 16)) >>> 0) / 4294967296;
  },

  _noise2: function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;

    const a = this._hash2(xi, yi);
    const b = this._hash2(xi + 1, yi);
    const c = this._hash2(xi, yi + 1);
    const d = this._hash2(xi + 1, yi + 1);

    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);

    const ab = a + (b - a) * u;
    const cd = c + (d - c) * u;
    return ab + (cd - ab) * v;
  },

  _fbm: function (x, y) {
    let amp = 0.55;
    let sum = 0.0;
    let freq = 1.0;
    for (let i = 0; i < 4; i++) {
      sum += amp * this._noise2(x * freq, y * freq);
      freq *= 2.02;
      amp *= 0.52;
    }
    return sum; // ~[0,1]
  },

  _apply: function () {
    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;

    const mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
    if (!mat) return;

    // Build a non-repeating alpha mask in UV space that matches the floor plane mapping.
    const N = 1024; // good balance: crisp seams without long startup
    const canvas = document.createElement('canvas');
    canvas.width = N;
    canvas.height = N;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(N, N);
    const data = img.data;

    const d = this.data;
    const w = d.width, h = d.height, cz = d.centerZ;
    const wallZ = d.wallZ;
    const cx = d.domeCenter.x, czD = d.domeCenter.z;
    const a = Math.max(0.001, d.domeA), b = Math.max(0.001, d.domeB);
    const avgR = 0.5 * (a + b);

    // Convert band widths (meters) to ellipse-normalized thickness
    const bandWall = Math.max(0.02, d.wallBand);
    const bandDomeN = Math.max(0.02, d.domeBand / avgR);

    const baseStrength = Math.max(0, d.strength);
    const noiseScale = Math.max(0.05, d.noiseScale);

    for (let j = 0; j < N; j++) {
      const v = j / (N - 1);
      const worldZ = (v - 0.5) * h + cz;

      for (let i = 0; i < N; i++) {
        const u = i / (N - 1);
        const worldX = (u - 0.5) * w;

        // Keep elevator interior clean (no dust overlay intruding inside the cab view)
        if (Math.abs(worldX) < d.elevatorClearX && Math.abs(worldZ - wallZ) < d.elevatorClearZ) {
          const idx = (j * N + i) * 4;
          data[idx + 0] = 255;
          data[idx + 1] = 255;
          data[idx + 2] = 255;
          data[idx + 3] = 0;
          continue;
        }

        // Wall seam weight (strong near wall, fades outward)
        const dW = Math.abs(worldZ - wallZ);
        let wWall = 1.0 - this._smooth(0.0, bandWall, dW);
        wWall = Math.pow(Math.max(0, wWall), 0.75);

        // Dome footprint seam weight (ellipse in world space)
        const dx = (worldX - cx) / a;
        const dz = (worldZ - czD) / b;
        const r = Math.sqrt(dx * dx + dz * dz);
        const dDN = Math.abs(r - 1.0);
        let wDome = 1.0 - this._smooth(0.0, bandDomeN, dDN);
        wDome = Math.pow(Math.max(0, wDome), 0.75);

        // Tri-junction: where both seam influences exist (use min)
        let wTri = Math.min(wWall, wDome);
        wTri = Math.pow(wTri, 0.55);

        // Global light dust everywhere (very subtle, no footprints)
        let wBase = 0.08;

        // Combine (edge deposits dominate, tri junction gets a bit more)
        let wComb = Math.max(wWall, wDome);
        wComb = Math.pow(wComb, 0.70);
        wComb = Math.max(wComb, wTri * 1.05);

        // Non-repeating clumpy noise in WORLD meters (helps hide perfect math edges)
        const n = this._fbm(worldX / noiseScale, worldZ / noiseScale); // 0..1
        const n2 = (n * 2.0 - 1.0); // -1..1

        // Break up into deposits (clumps) without making it look like dots
        const clump = Math.pow(Math.max(0, n), 1.55); // bias toward sparse clumps
        const breakup = Math.max(0.0, 1.0 + n2 * d.noiseAmount);

        let alpha = baseStrength * (wBase + wComb * 0.92) * breakup;

        // Extra "powder" pockets near seams (not footprints)
        alpha *= (0.78 + 0.22 * clump);

        // Clamp + soft ceiling so it never looks painted on
        alpha = Math.min(0.78, Math.max(0.0, alpha));

        const idx = (j * N + i) * 4;
        data[idx + 0] = 255;
        data[idx + 1] = 255;
        data[idx + 2] = 255;
        data[idx + 3] = Math.floor(alpha * 255);
      }
    }

    ctx.putImageData(img, 0, 0);

    const alphaTex = new THREE.CanvasTexture(canvas);
    alphaTex.wrapS = THREE.ClampToEdgeWrapping;
    alphaTex.wrapT = THREE.ClampToEdgeWrapping;
    alphaTex.needsUpdate = true;

    // Assign to material
    mat.transparent = true;
    mat.depthWrite = false;         // crucial: makes it feel like deposited dust, not a second floor
    mat.alphaMap = alphaTex;

  AFRAME.registerComponent('seam-wetness-alpha', {
  schema: {
    width: {type: 'number', default: 14},
    height: {type: 'number', default: 14},
    centerZ: {type: 'number', default: 3.50},

    wallZ: {type: 'number', default: 0.49},
    domeCenter: {type: 'vec3', default: {x: 0, y: 1.92, z: 0.49}},
    domeA: {type: 'number', default: 3.34},
    domeB: {type: 'number', default: 4.58},

    wallBand: {type: 'number', default: 1.25},
    domeBand: {type: 'number', default: 1.10},

    // Overall strength (0..1-ish). Keep subtle for realism.
    strength: {type: 'number', default: 0.55},

    // Noise controls (meters)
    noiseScale: {type: 'number', default: 0.70},
    noiseAmount: {type: 'number', default: 0.65},

    // Keep elevator interior clean (in WORLD space around the doorway plane)
    elevatorClearX: {type: 'number', default: 1.45},
    elevatorClearZ: {type: 'number', default: 1.10}
  },

  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    this._apply();
  },

  _smooth: function (edge0, edge1, x) {
    const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
    return t * t * (3 - 2 * t);
  },

  _hash2: function (x, y) {
    let n = (x * 374761393 + y * 668265263) | 0;
    n = (n ^ (n >> 13)) | 0;
    n = (n * 1274126177) | 0;
    return ((n ^ (n >> 16)) >>> 0) / 4294967296;
  },

  _noise2: function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;

    const a = this._hash2(xi, yi);
    const b = this._hash2(xi + 1, yi);
    const c = this._hash2(xi, yi + 1);
    const d = this._hash2(xi + 1, yi + 1);

    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const ab = a + (b - a) * u;

    let sum = 0.0;

  },

  _apply: function () {
    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;

    const mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
    if (!mat) return;

    const N = 768; // subtle band; slightly lower than dust for perf
    const canvas = document.createElement('canvas');

    canvas.height = N;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(N, N);
    const data = img.data;

    const d = this.data;
    const w = d.width, h = d.height, cz = d.centerZ;
    const wallZ = d.wallZ;
    const cx = d.domeCenter.x, czD = d.domeCenter.z;
    const a = Math.max(0.001, d.domeA), b = Math.max(0.001, d.domeB);
    const avgR = 0.5 * (a + b);

    const bandWall = Math.max(0.05, d.wallBand);
    const bandDomeN = Math.max(0.05, d.domeBand / avgR);
    const noiseScale = Math.max(0.05, d.noiseScale);
    const strength = Math.max(0, d.strength);

    for (let j = 0; j < N; j++) {
      const v = j / (N - 1);

      for (let i = 0; i < N; i++) {

          data[idx + 1] = 255;
          data[idx + 2] = 255;
          data[idx + 3] = 0;

        let wWall = 1.0 - this._smooth(0.0, bandWall, dW);
        wWall = Math.pow(Math.max(0, wWall), 0.80);

        const dx = (worldX - cx) / a;
        const dz = (worldZ - czD) / b;
        const r = Math.sqrt(dx * dx + dz * dz);
        const dDN = Math.abs(r - 1.0);

        let wDome = 1.0 - this._smooth(0.0, bandDomeN, dDN);
        wDome = Math.pow(Math.max(0, wDome), 0.80);

        let wComb = Math.max(wWall, wDome);
        // Slightly favor the tri-junction area
        const wTri = Math.pow(Math.min(wWall, wDome), 0.65);
        wComb = Math.max(wComb, wTri * 1.08);

        let alpha = strength * Math.pow(wComb, 1.15) * breakup;

        const idx = (j * N + i) * 4;
        data[idx + 0] = 255;
        data[idx + 1] = 255;
        data[idx + 2] = 255;
        data[idx + 3] = Math.floor(alpha * 255);

    const alphaTex = new THREE.CanvasTexture(canvas);
    alphaTex.wrapS = THREE.ClampToEdgeWrapping;
    alphaTex.wrapT = THREE.ClampToEdgeWrapping;
    alphaTex.needsUpdate = true;

    mat.transparent = true;
    mat.depthWrite = false;
    mat.alphaMap = alphaTex;
    mat.polygonOffset = true;
    mat.polygonOffsetFactor = -2;
    mat.polygonOffsetUnits = -2;
    mesh.renderOrder = 8;
    mat.needsUpdate = true;
  }
});

    const d = this.data;


    // Procedural micro normal map to give the black rocks readable surface under light (no external textures).

      size = size || 128;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const img = ctx.createImageData(size, size);
      const data = img.data;

      function hash(x, y) {
        let n = (x * 374761393 + y * 668265263 + (seed | 0) * 1447) | 0;
        n = (n ^ (n >> 13)) | 0;
        n = (n * 1274126177) | 0;
        return ((n ^ (n >> 16)) >>> 0) / 4294967296;
      }

      function smoothstep(t) { return t * t * (3 - 2 * t); }

      function noise(x, y) {
        const xi = Math.floor(x), yi = Math.floor(y);
        const xf = x - xi, yf = y - yi;
        const a = hash(xi, yi);
        const b = hash(xi + 1, yi);
        const c = hash(xi, yi + 1);

        const v = smoothstep(yf);

          freq *= 2.03;
          amp *= 0.52;
        }

      }

        for (let i = 0; i < size; i++) {

          const v = j / size;

      const r2 = rand01(960 + i);

      const ez = cz + b * Math.sin(theta);

      const nx = dir.x, nz = dir.y;

      mesh.position.addScaledVector(tan, tJ);

      mesh.material.color = colA.clone().lerp(colB, r0);
      heroes.add(mesh);
    }

    this.el.object3D.add(heroes);
  }

    function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

    let x0 = Math.min(d.xStart, d.xEnd);
    let x1 = Math.max(d.xStart, d.xEnd);

    // Tighten X bounds to the actual tunnel mouths if the rims exist in the scene.
    // This prevents any tunnel rock from ever leaking outside the tunnel even if xStart/xEnd are slightly off.
    (function tightenXBoundsFromRims () {
      const nearEl = document.querySelector('#tunnel_01_rim_near');
      const farEl  = document.querySelector('#tunnel_01_rim_far');
      if (!nearEl || !farEl) return;
      try {
        const a = new THREE.Vector3();
        const b = new THREE.Vector3();
        nearEl.object3D.updateWorldMatrix(true, false);
        farEl.object3D.updateWorldMatrix(true, false);
        nearEl.object3D.getWorldPosition(a);
        farEl.object3D.getWorldPosition(b);
        const rMin = Math.min(a.x, b.x);
        const rMax = Math.max(a.x, b.x);
        const eps = 0.001;
        x0 = Math.max(x0, rMin + eps);
        x1 = Math.min(x1, rMax - eps);
      } catch (e) {}
    })();

    const L = Math.max(0.001, x1 - x0);

    const zMin = d.zCenter - Math.abs(d.zHalfWidth);
    const zMax = d.zCenter + Math.abs(d.zHalfWidth);

    // Longitudinal clumps (patches). By default we distribute evenly; optionally override with CSV patchCenters.
    let patchCenters;
    let patchCount;

    if (d.patchCenters && String(d.patchCenters).trim().length) {
      const parts = String(d.patchCenters)
        .split(/[,;\s]+/)
        .map(parseFloat)
        .filter((v) => Number.isFinite(v));
      patchCenters = parts.map((v) => clamp(v, x0, x1));
      patchCount = Math.max(1, patchCenters.length);
    } else {
      patchCount = Math.max(1, d.patchCount | 0);
      patchCenters = new Array(patchCount);
      for (let k = 0; k < patchCount; k++){
        const rk = rand01(2000 + k);
        const base = x0 + L * ((k + 0.5) / patchCount);
        patchCenters[k] = base + (rk - 0.5) * 0.90;
      }
    }

    // Per-patch cluster descriptors.
    // Goal: organic "masses" that sit on the floor (not climbing the walls), avoid mirrored staging,
    // and have some vertical relief so they don't read as flat decals.
    const patchSide = new Array(patchCount);
    const patchXSpread = new Array(patchCount);
    const patchZSpread = new Array(patchCount);
    const patchZCenter = new Array(patchCount);
    const patchMound = new Array(patchCount);

    // Safe floor band (keeps rocks on the floor material, away from the wall intersection).
    const zFloorMin = zMin + d.edgeInset + 0.14;
    const zFloorMax = zMax - d.edgeInset - 0.14;

    let lastSide = (rand01(8100) < 0.5) ? 0 : 1;
    for (let k = 0; k < patchCount; k++) {
      // Correlated side choice (reduces left-right alternation rhythm), with occasional flips.
      let side = (rand01(8100 + k) < 0.62) ? lastSide : (1 - lastSide);
      if (rand01(8200 + k) < 0.18) side = 1 - side;
      patchSide[k] = side;
      lastSide = side;

      // Cluster extents (compact, but each patch differs).
      patchXSpread[k] = d.patchSpread * (0.36 + 0.46 * rand01(8600 + k));
      patchZSpread[k] = (0.07 + 0.11 * rand01(8700 + k)) * (0.85 + 0.35 * rand01(8720 + k));

      // Place each cluster near an "edge" of the floor, but pulled inward so it stays on the floor material.
      // Then offset each cluster differently so nothing reads as a parallel staged lineup.
      const dir = (side === 0) ? 1 : -1; // 0 -> push toward +z, 1 -> push toward -z
      const edgePos = (side === 0) ? zFloorMin : zFloorMax;
      let inward = (0.05 + 0.18 * Math.pow(rand01(8300 + k), 1.55));
      if (rand01(8500 + k) < 0.28) inward += (0.14 + 0.18 * rand01(8510 + k)); // occasional cluster sits more inward
      const drift = (rand01(8400 + k) - 0.5) * 0.22;
      patchZCenter[k] = clamp(edgePos + dir * inward + drift, zFloorMin + 0.05, zFloorMax - 0.05);

      // Subtle mound height at the heart of each cluster (prevents "flat" reading).
      patchMound[k] = 0.010 + 0.018 * rand01(8800 + k);

      // Keep the first two clusters untouched; refine later tunnel clusters:
      // smaller rocks + slightly tighter patches + pushed a bit closer to the side edges.
      if (k >= 2) {
        // Later tunnel clumps: sit slightly on the floor sides, spread along depth, never pile up.
        patchXSpread[k] *= 1.45;   // more longitudinal spread (X)
        patchZSpread[k] *= 0.68;   // tighter side band (Z)
        patchMound[k]  *= 0.48;    // flatter, less "blob"

        const edgeTarget = (side === 0) ? zFloorMin : zFloorMax;
        patchZCenter[k] = clamp(
          patchZCenter[k] + (edgeTarget - patchZCenter[k]) * 0.62,
          zFloorMin + 0.04,
          zFloorMax - 0.04
        );
      }

      // Make the last two clusters (from the dome: clusters 4+) less cluttered and more naturally distributed.
      // IMPORTANT: first two clusters remain untouched.
      if (k >= 3) {
        // Very late clumps: looser along depth, still tucked to the side, minimal mound.
        patchXSpread[k] *= 1.18;
        patchZSpread[k] *= 0.85;
        patchMound[k]  *= 0.70;

        const edgeTarget2 = (side === 0) ? zFloorMin : zFloorMax;
        patchZCenter[k] = clamp(
          patchZCenter[k] + (edgeTarget2 - patchZCenter[k]) * 0.22,
          zFloorMin + 0.04,
          zFloorMax - 0.04
        );
      }
    }

    // Track placements per patch so rocks get tight but never touch.
    const placed = new Array(patchCount);
    for (let k = 0; k < patchCount; k++) placed[k] = [];
    const up = new THREE.Vector3(0, 1, 0);

    for (let i = 0; i < count; i++) {
      const r0 = rand01(i);

      // Lock each rock to one longitudinal clump.
      const k0 = Math.floor(r0 * patchCount);
      const k = clamp(k0, 0, patchCount - 1);

      // Match later tunnel clumps to the first two: keep clump #3 similar, but make clumps #4-#5 looser.
      const latePatch = (k >= 2);
      const veryLatePatch = (k >= 3);

      // Thin later patches (keeps first two identical). Stronger thinning for later clumps to avoid clutter.
      if (latePatch) {
        // Patch #3: light thinning. Patch #4+: stronger thinning.
        const drop = veryLatePatch ? 0.80 : 0.68;
        if (rand01(5000 + i) < drop) continue;
      }

      // Footprint: late clumps should read elegant (elongated in depth, tucked to the side).
      const xSpread = patchXSpread[k] * (latePatch ? (veryLatePatch ? 1.15 : 1.08) : 1.0);
      const zSpread = patchZSpread[k] * (latePatch ? (veryLatePatch ? 0.95 : 0.92) : 1.0);

      // Stronger dimension variety (still dome-like).
      const sR0 = rand01(i + 19);
      const sR1 = rand01(i + 41);
      const sR2 = rand01(i + 73);
      const sR3 = rand01(i + 97);

      let sc = d.scaleMin + (d.scaleMax - d.scaleMin) * Math.pow(sR0, 1.35);

      // Late patches: stronger size tiering (tiny → big) for nicer variety, without clutter.
      if (latePatch) {
        sc *= (veryLatePatch ? 0.66 : 0.70);

        const tierR = rand01(i + 707);
        if (tierR < 0.18) sc *= 0.55;        // very tiny
        else if (tierR < 0.55) sc *= 0.85;   // small
        else if (tierR < 0.85) sc *= 1.15;   // medium
        else sc *= 1.45;                     // bigger accent
      }

      let sx = (0.58 + 0.92 * sR1);
      let sy = (0.78 + 0.98 * sR2);
      let sz = (0.58 + 0.92 * sR3);
      if (latePatch) {
        // Wider non-uniformity to break "samey" silhouettes.
        sx = (0.40 + 1.28 * sR1);
        sy = (0.50 + 1.40 * sR2);
        sz = (0.38 + 1.30 * sR3);
      }
      s.set(sc * sx, sc * sy, sc * sz);

      // Approx radius for separation checks.
      const rad = Math.max(s.x, s.y, s.z) * 0.58;

      // Hard containment: clamp using the rock radius so the *entire* rock stays inside the tunnel bounds.
      // This prevents any rock (especially large ones) from sticking outside the tunnel or clipping nearby geometry.
      const xBoundMin = x0 + rad;
      const xBoundMax = x1 - rad;
      const zBoundMin = (zFloorMin + 0.03) + rad;
      const zBoundMax = (zFloorMax - 0.03) - rad;

      // Guard against degenerate bands (extreme scales). Fall back to midpoints.
      const xMinR = (xBoundMin <= xBoundMax) ? xBoundMin : (x0 + x1) * 0.5;
      const xMaxR = (xBoundMin <= xBoundMax) ? xBoundMax : (x0 + x1) * 0.5;
      const zMinR = (zBoundMin <= zBoundMax) ? zBoundMin : (zFloorMin + zFloorMax) * 0.5;
      const zMaxR = (zBoundMin <= zBoundMax) ? zBoundMax : (zFloorMin + zFloorMax) * 0.5;

      let x = 0, z = 0, y = 0;
      let placedOk = false;

      // Rejection sampling inside a clump so rocks sit close, but never touch.
      for (let a = 0; a < 16; a++) {
        const rr1 = rand01(i + 101 + a * 97);
        const rr2 = rand01(i + 131 + a * 113);
        const rr3 = rand01(i + 163 + a * 139);
        const rr4 = rand01(i + 197 + a * 151);
        const rr5 = rand01(i + 233 + a * 173);
        const rr6 = rand01(i + 271 + a * 191);
        const rr7 = rand01(i + 311 + a * 211);
        const rr8 = rand01(i + 347 + a * 223);

        // Compact, organic cluster footprint: centered distribution (not "scatter").
        x = patchCenters[k]
          + (rr1 - rr2) * xSpread
          + (rr3 - rr4) * (xSpread * 0.35);
        x = clamp(x, xMinR, xMaxR);

        z = patchZCenter[k]
          + (rr5 - rr6) * zSpread
          + (rr7 - rr8) * (zSpread * 0.22);
        z = clamp(z, zMinR, zMaxR);

        // Pull late-patch rocks slightly closer to the side edge (keeps clusters off-center).
        if (latePatch) {
          const edgeZ = (patchSide[k] === 0) ? zFloorMin : zFloorMax;
          z = z + (edgeZ - z) * (veryLatePatch ? 0.22 : 0.16);
        }

        // Vertical relief: slight "mound" at the heart of each cluster + size-dependent embed.
        const dxn = (x - patchCenters[k]) / (xSpread + 0.0001);
        const dzn = (z - patchZCenter[k]) / (zSpread + 0.0001);
        const dn = Math.sqrt(dxn * dxn + dzn * dzn);
        const mound = Math.pow(Math.max(0.0, 1.0 - dn), 2.0) * patchMound[k];
        const sink = rad * (0.18 + 0.18 * rr2);
        y = d.y + (rr2 - 0.5) * d.yJitter + mound - sink;


        const list = placed[k];
        let ok = true;
        for (let j = 0; j < list.length; j++) {
          const dx = x - list[j].x;
          const dz = z - list[j].z;
          const extraGap = latePatch ? (veryLatePatch ? 0.060 : 0.040) : 0.0;
          const minD = rad + list[j].r + d.gap + extraGap;
          if (dx * dx + dz * dz < minD * minD) { ok = false; break; }
        }

        if (ok) {
          list.push({x: x, z: z, r: rad});
          placedOk = true;
          break;
        }
      }

      if (!placedOk) {
        placed[k].push({x: x, z: z, r: rad});
      }

      p.set(x, y, z);

      // Orientation (mostly upright, small tilts)
      q.setFromAxisAngle(up, rand01(i + 17) * Math.PI * 2.0);
      const tiltX = (rand01(i + 311) - 0.5) * 0.55;
      const tiltZ = (rand01(i + 347) - 0.5) * 0.55;
      q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), tiltX));
      q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), tiltZ));

      m.compose(p, q, s);
      inst.setMatrixAt(i, m);

      const c = colA.clone().lerp(colB, rand01(i + 401));
      inst.setColorAt(i, c);
    }

    inst.instanceMatrix.needsUpdate = true;
    if (inst.instanceColor) inst.instanceColor.needsUpdate = true;

    // Larger hero rocks (break rhythm, still natural)
    const heroes = new THREE.Group();
    const heroCount = Math.max(0, d.heroCount | 0);

    for (let i = 0; i < heroCount; i++) {
      const r0 = rand01(900 + i);
      const r1 = rand01(930 + i);
      const r2 = rand01(960 + i);
      const r3 = rand01(990 + i);

      const k = Math.floor(r0 * patchCount);

      // Keep hero rocks only in the first two clumps (later clumps read too heavy)
      if (k >= 2) continue;
      let x = patchCenters[k] + (r1 - 0.5) * (d.patchSpread * 1.15);
      x = clamp(x, x0, x1);

      // Heroes live inside the same cluster footprint (keeps the read as small "masses", not single props).
      let z = patchZCenter[k]
        + (r2 - r1) * (patchZSpread[k] * 0.85)
        + (r3 - 0.5) * 0.04;
      z = clamp(z, zFloorMin + 0.03, zFloorMax - 0.03);

      // Compute hero scale early so we can clamp by radius and guarantee full containment.
      const sc = d.heroScaleMin + (d.heroScaleMax - d.heroScaleMin) * Math.pow(r2, 1.3);
      const hSx = sc * (0.80 + 0.40 * r1);
      const hSy = sc * (0.60 + 0.50 * r2);
      const hSz = sc * (0.80 + 0.40 * r3);
      const radH = Math.max(hSx, hSy, hSz) * 0.58;

      const xBoundMinH = x0 + radH;
      const xBoundMaxH = x1 - radH;
      const zBoundMinH = (zFloorMin + 0.03) + radH;
      const zBoundMaxH = (zFloorMax - 0.03) - radH;

      const xMinH = (xBoundMinH <= xBoundMaxH) ? xBoundMinH : (x0 + x1) * 0.5;
      const xMaxH = (xBoundMinH <= xBoundMaxH) ? xBoundMaxH : (x0 + x1) * 0.5;
      const zMinH = (zBoundMinH <= zBoundMaxH) ? zBoundMinH : (zFloorMin + zFloorMax) * 0.5;
      const zMaxH = (zBoundMinH <= zBoundMaxH) ? zBoundMaxH : (zFloorMin + zFloorMax) * 0.5;

      x = clamp(x, xMinH, xMaxH);
      z = clamp(z, zMinH, zMaxH);

      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      {
      const dxn = (x - patchCenters[k]) / (patchXSpread[k] + 0.0001);
      const dzn = (z - patchZCenter[k]) / (patchZSpread[k] + 0.0001);
      const dn = Math.sqrt(dxn * dxn + dzn * dzn);
      const mound = Math.pow(Math.max(0.0, 1.0 - dn), 2.0) * patchMound[k];

      // Size-dependent embed so heroes feel weighty (not floating), plus a touch of mound lift.
      const sink = sc * (0.20 + 0.16 * r1);

      const yHero = d.y + (r3 - 0.5) * d.yJitter + mound - sink;
      mesh.position.set(x, yHero, z);
      }
      mesh.rotation.set((r1 - 0.5) * 0.45, r0 * Math.PI * 2.0, (r2 - 0.5) * 0.45);

            mesh.scale.set(hSx, hSy, hSz);

      mesh.material = mat.clone();
      mesh.material.color = colA.clone().lerp(colB, r0);
      heroes.add(mesh);
    }

    this.el.object3D.add(inst);
    this.el.object3D.add(heroes);
  }
});

AFRAME.registerComponent('procedural-pebble-decal', {
  schema: {
    seed: {type: 'int', default: 1},
    density: {type: 'number', default: 1.0},
    edgeFade: {type: 'number', default: 0.85}
  },

  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    this._apply();
  },

  _rand: function (n) {
    const s = Math.sin(n) * 43758.5453123;
    return s - Math.floor(s);
  },

  _apply: function () {
    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;

    const mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
    if (!mat) return;

    const N = 256;
    const canvas = document.createElement('canvas');
    canvas.width = N; canvas.height = N;
    const ctx = canvas.getContext('2d');

    // Base: transparent
    ctx.clearRect(0, 0, N, N);

    // Soft edge fade (kills hard decal rectangle)
    const grd = ctx.createRadialGradient(N*0.5, N*0.5, N*0.05, N*0.5, N*0.5, N*0.55);
    grd.addColorStop(0.0, 'rgba(255,255,255,1)');
    grd.addColorStop(this.data.edgeFade, 'rgba(255,255,255,0.85)');
    grd.addColorStop(1.0, 'rgba(255,255,255,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, N, N);

    // Pebbles (small dark specs)
    const baseCount = Math.floor(120 * Math.max(0.2, this.data.density));
    for (let i = 0; i < baseCount; i++) {
      const r0 = this._rand((i + 1) * 17.17 + this.data.seed * 31.3);
      const r1 = this._rand((i + 2) * 91.73 + this.data.seed * 7.7);
      const r2 = this._rand((i + 3) * 53.11 + this.data.seed * 19.9);

      const x = r0 * N;
      const y = r1 * N;
      const rad = 0.8 + r2 * 2.4;

      // draw pebble as soft circle in ALPHA only (white RGB)
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      const a = 0.10 + 0.22 * r2;
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fill();
    }

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.needsUpdate = true;

    mat.transparent = true;
    mat.depthWrite = false;
    mat.alphaMap = tex;
    mat.map = tex;                 // keep RGB white so material color dominates, but reuse alpha
    mat.polygonOffset = true;
    mat.polygonOffsetFactor = -3;
    mat.polygonOffsetUnits = -3;
    mesh.renderOrder = 12;
    mat.needsUpdate = true;
  }
});

// Physical glass for the torch cube faces.
  // Guarded so it never throws "already registered" even if scripts are merged/reordered.

        transmission: {type: 'number', default: 1.0},
        envIntensity: {type: 'number', default: 2.2},
        attenuationColor: {type: 'color', default: '#ffffff'},

      },
      init: function () {
        this._applied = false;
        this._apply = this._apply.bind(this);

      },
      update: function () {
        this._applied = false;
        this._apply();
      },
      remove: function () {
        this.el.removeEventListener('object3dset', this._apply);
      },
      _apply: function () {
        const mesh = this.el.getObject3D('mesh');
        if (!mesh || this._applied) return;

        const d = this.data;
        const makeGlass = () => new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(d.tint),
          metalness: 0.0,
          roughness: d.roughness,
          transmission: d.transmission,
          ior: d.ior,
          thickness: d.thickness,
          transparent: true,
          opacity: 1.0,
          attenuationColor: new THREE.Color(d.attenuationColor),
          attenuationDistance: d.attenuationDistance,

        });

        mesh.traverse((o) => {
          if (!o.isMesh) return;

          const newMat = makeGlass();

          newMat.depthTest = true;
